function body(dy,cc,cc2){ctx.save();ctx.translate(0,dy);ctx.scale(1,K);ctx.rotate(c.hd);var w=r*1.25*sc,h=r*0.95*sc;var g=ctx.createLinearGradient(0,-h,0,h);g.addColorStop(0,cc);g.addColorStop(1,cc2);ctx.fillStyle=g;rr(-w,-h,w*2,h*2,r*0.4*sc);ctx.fill();ctx.restore()}
body(-hgt*0.0,shade(col,-0.45),shade(col,-0.6));ctx.fillStyle=shade(col,-0.45);
for(var i=1;i<=3;i++){body(-hgt*i/3,shade(col,-0.2+i*0.04),shade(col,-0.35+i*0.04))}
body(-hgt,col,shade(col,-0.2));
ctx.save();ctx.translate(0,-hgt-1);ctx.scale(1,K);ctx.rotate(c.hd);ctx.fillStyle='rgba(255,255,255,0.35)';rr(-r*0.35*sc,-r*0.45*sc,r*0.75*sc,r*0.9*sc,r*0.25*sc);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(r*0.95*sc,-r*0.6*sc,r*0.3*sc,r*0.3*sc);ctx.fillRect(r*0.95*sc,r*0.3*sc,r*0.3*sc,r*0.3*sc);
if(c.ty==='boss'){ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(r*1.2*sc,-r*0.3*sc);ctx.lineTo(r*1.8*sc,0);ctx.lineTo(r*1.2*sc,r*0.3*sc);ctx.fill()}
ctx.restore();
if(c.isP){if(effMega>0){ctx.strokeStyle='rgba(255,176,64,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-hgt*0.4,r*1.5,r*1.5*K,0,0,6.283);ctx.stroke()}if(effTurbo>0){ctx.strokeStyle='rgba(122,240,255,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-hgt*0.4,r*1.9,r*1.9*K,0,0,6.283);ctx.stroke()}if(effSave>0){ctx.strokeStyle='rgba(154,255,192,0.8)';ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-hgt*0.4,r*1.5,r*1.5*K,0,0,6.283);ctx.stroke();ctx.setLineDash([])}}
if(c.dashT>0){ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-Math.cos(c.hd)*r*1.4,-Math.sin(c.hd)*r*1.4*K);ctx.lineTo(-Math.cos(c.hd)*r*3,-Math.sin(c.hd)*r*3*K);ctx.stroke()}
ctx.restore()}
function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;function m(v){return Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)))}return 'rgb('+m(r)+','+m(g)+','+m(b)+')'}
function drawPup(p){var x=SX(p.x),y=SY(p.y)+Math.sin(clock*4+p.ph)*3,cols=['#ffb040','#7af0ff','#9affc0'],lb=['M','T','S'],r=12*u,bl=p.l<3&&Math.floor(clock*8)%2;if(bl)return;
var gl=ctx.createRadialGradient(x,y,2,x,y,r*2.2);gl.addColorStop(0,cols[p.ty]+'aa');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,r*2.2,0,6.283);ctx.fill();ctx.fillStyle=cols[p.ty];ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();txt(lb[p.ty],x,y+1,r*1.2,'#1a1030')}
function hud(){var pad=Math.max(10,W*0.03),top=safeTop+pad,fs=Math.min(26,W/13);
ctx.fillStyle='rgba(10,6,28,0.6)';rr(pad,top,Math.min(170,W*0.44),fs*2.1,12);ctx.fill();
txt('SCORE',pad+10,top+fs*0.6,fs*0.4,'#c8c0ff','left','700');txt(String(Math.floor(score)),pad+10,top+fs*1.4,fs,'#fff','left');
var hw=Math.min(120,W*0.32);ctx.fillStyle='rgba(10,6,28,0.6)';rr(W-pad-hw,top,hw,fs*2.1,12);ctx.fill();
for(var i=0;i<3;i++)txt('\u2665',W-pad-hw+hw*(0.2+i*0.3),top+fs*0.8,fs*0.95,i<lives?'#ff5a7a':'rgba(255,255,255,0.2)');
txt('WAVE '+wave,W-pad-hw/2,top+fs*1.65,fs*0.5,'#c8c0ff','center','700');
if(combo>=2)txt('KO COMBO x'+mult(),W/2,top+fs*2.9,Math.min(20,W/17),'#ffe066');
var bw=Math.min(200,W*0.5),bx=W/2-bw/2,by=H-Math.max(30,H*0.06);ctx.fillStyle='rgba(10,6,28,0.6)';rr(bx-3,by-3,bw+6,14,7);ctx.fill();var rd=1-Math.max(0,pl.dashCd)/(effTurbo>0?0.35:1.2);ctx.fillStyle=rd>=1?'#7af0ff':'#4a78a8';rr(bx,by,Math.max(6,bw*Math.min(1,rd)),8,4);ctx.fill();txt(rd>=1?'DASH READY':'DASH',W/2,by-14,Math.min(13,W/28),'#c8c0ff','center','700');
var ty=top+fs*3.8;if(effMega>0){txt('MEGA '+effMega.toFixed(0)+'s',W/2,ty,Math.min(14,W/26),'#ffb040');ty+=18}if(effTurbo>0){txt('TURBO '+effTurbo.toFixed(0)+'s',W/2,ty,Math.min(14,W/26),'#7af0ff')}
if(waveBanner>0){ctx.globalAlpha=Math.min(1,waveBanner);txt('WAVE '+wave,W/2,H*0.3,Math.min(48,W/8),'#fff');ctx.globalAlpha=1}}
function draw(){ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bgDraw();drawArena();
for(var i=0;i<pups.length;i++)drawPup(pups[i]);
if(state!==ST.START){var all=[pl].concat(cars).sort(function(a,b){return a.y-b.y});for(i=0;i<all.length;i++){var c=all[i];drawCar(c,c.col)}}
else{var a=clock*0.8;var dm=mkCar(Math.cos(a)*A0*0.35,Math.sin(a)*A0*0.35,15*u,1,'#4aa8ff','p',true);dm.hd=a+1.57;drawCar(dm,dm.col);var d2=mkCar(-Math.cos(a)*A0*0.35,-Math.sin(a)*A0*0.35,15*u,1,'#ff5a6e','norm',false);d2.hd=a-1.57;drawCar(d2,d2.col)}
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(SX(q.x),SY(q.y)-6,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(90,Math.min(W-90,SX(o.x))),SY(o.y)-30,Math.min(18,W/18),o.c)}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.3)+')';ctx.fillRect(-20,-20,W+40,H+40)}
ctx.restore();
if(state===ST.PLAY){hud();if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(10,6,28,0.78)';var hw=Math.min(W-24,340),hy=H-Math.max(30,H*0.06)-110;rr(W/2-hw/2,hy,hw,56,14);ctx.fill();txt('DRAG to drive \u2022 TAP to dash',W/2,hy+19,Math.min(17,W/20),'#fff');txt('Knock rivals off the edge!',W/2,hy+40,Math.min(12,W/28),'#c8c0ff','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(10,6,28,0.45)';ctx.fillRect(0,0,W,H);var y=H*0.15+safeTop*0.5;
txt('BUMP',W/2,y,Math.min(70,W/5.2),'#4aa8ff');txt('ARENA',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#ff5a6e');
txt('Shove rivals into the lava. Stay on the island.',W/2,y+Math.min(128,W/3),Math.min(14,W/24),'#e0dcff','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.86,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   WAVE '+best.wave,W/2,H*0.86+30,Math.min(15,W/24),'#c8c0ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(10,6,28,0.72)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#231a4a';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#4aa8ff';ctx.lineWidth=3;ctx.stroke();
var uu=ph/430,cy=py+34*uu;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9a8a');
txt(String(Math.floor(score)),W/2,cy+48*uu,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*uu,Math.min(20,pw/16),'#ffd84a');
txt('Wave '+wave+' \u2022 '+kos+' KOs \u2022 best combo '+bestCombo,W/2,cy+114*uu,Math.min(13,pw/24),'#c8c0ff','center','700');
txt('TOP 5',W/2,cy+142*uu,Math.min(14,pw/24),'#e0dcff','center','700');
for(var i=0;i<5;i++){var ry=cy+168*uu+i*26*uu,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*uu,pw-32,24*uu,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(74,168,255,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*uu,200,44*uu,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*uu,Math.min(20,pw/16),'#10102a')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
function toWorld(e){return{x:e.clientX-cx0,y:(e.clientY-cy0)/K}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();
if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>0.8)startGame();return}
ptrs[e.pointerId]={x:e.clientX,y:e.clientY,t0:performance.now(),moved:false}});
cv.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p||state!==ST.PLAY)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;if(!p.moved&&dx*dx+dy*dy>14*14)p.moved=true;
if(p.moved&&(steerId===null||steerId===e.pointerId)){steerId=e.pointerId;tgt=toWorld(e)}});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}var p=ptrs[e.pointerId];if(p){if(!p.moved&&performance.now()-p.t0<260)playerDash();delete ptrs[e.pointerId]}if(steerId===e.pointerId){steerId=null;tgt=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>-1)e.preventDefault();keys[k]=true;if(e.repeat)return;
if(k===' '||k==='Enter'){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else playerDash()}});
window.addEventListener('keyup',function(e){keys[e.key]=false});
function relAll(){keys={};ptrs={};steerId=null;tgt=null}
window.addEventListener('blur',function(){relAll();stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){relAll();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
</body>
