<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock Gate</title>
<style>
:root{--bg:#0d2137;--fg:#f4f9fc;--accent:#ffb703;--jade:#06d6a0;--danger:#ef476f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2137;--fg:#f4f9fc}}
:root[data-theme="dark"]{--bg:#0d2137;--fg:#f4f9fc}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);

/* ---------- storage ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => {
  try {
    const a = JSON.parse(store.get('lockgate.top5') || '[]');
    return Array.isArray(a) ? a.filter(n => typeof n === 'number' && isFinite(n)).slice(0, 5) : [];
  } catch (e) { return []; }
};
let top5 = loadTop();
let bestShips = parseInt(store.get('lockgate.ships') || '0', 10) || 0;
let bestStreak = parseInt(store.get('lockgate.streak') || '0', 10) || 0;
function saveScore(sc, sh, st) {
  const s = Math.floor(sc);
  const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5);
  store.set('lockgate.top5', JSON.stringify(top5));
  if (sh > bestShips) { bestShips = sh; store.set('lockgate.ships', String(bestShips)); }
  if (st > bestStreak) { bestStreak = st; store.set('lockgate.streak', String(bestStreak)); }
  return s > 0 ? top5.indexOf(s) : -1;
}

/* ---------- canvas & responsive 2.5D lock chamber layout ---------- */
let W = 360, H = 640, dpr = 1, safeTop = 0, S = 1, OX = 180, OY = 330;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0;
  const topPad = safeTop + Math.min(60, H * 0.12);
  const botPad = Math.min(76, H * 0.15);
  const availW = W - 20;
  const availH = Math.max(140, H - topPad - botPad);
  S = Math.min(availW / 380, availH / 320);
  OX = W * 0.5;
  OY = topPad + availH * 0.54;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const SX = wx => OX + wx * S;
const SY = wy => OY + wy * S;
// Convert water level [0..1] to logical Y coordinate inside chamber (0 = low canal +68, 1 = high canal -62)
const levelToY = lv => lerp(68, -62, lv);

/* ---------- audio engine ---------- */
let AC = null, noiseBuf = null, valveNode = null;
function audio() {
  if (!AC) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        AC = new C();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function startValveAudio() {
  const a = audio(); if (!a || valveNode || !noiseBuf) return;
  try {
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 2.0;
    g.gain.value = 0.0001;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
    valveNode = { src, f, g };
  } catch (e) {}
}
function setValveAudio(mode, level) {
  if (!valveNode || !AC) return;
  const now = AC.currentTime;
  const active = mode !== 0 && state === STATES.PLAYING;
  valveNode.g.gain.setTargetAtTime(active ? 0.055 : 0.0001, now, 0.05);
  valveNode.f.frequency.setTargetAtTime(320 + clamp(level, 0, 1) * 580, now, 0.06);
}
function stopValveAudio() {
  if (valveNode) {
    try { valveNode.src.stop(); } catch (e) {}
    valveNode = null;
  }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, freq, type = 'lowpass') {
  const a = audio(); if (!a || !noiseBuf) return;
  try {
    const s = a.createBufferSource(), f = AC.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  lockSeal(streak, isPerf) {
    const base = (isPerf ? 587.33 : 440) * Math.pow(1.0595, Math.min(streak, 15));
    tone('square', 135, 65, 0.1, 0.18);
    tone('triangle', base, base * 1.5, 0.22, 0.17);
    if (isPerf) tone('sine', base * 2, base * 2.5, 0.28, 0.13, 0.05);
  },
  horn(high) {
    const f = high ? 165 : 125;
    tone('sawtooth', f, f * 0.98, 0.45, 0.16);
    tone('triangle', f * 1.5, f * 1.48, 0.45, 0.12);
  },
  crate() {
    tone('sine', 987.77, 1975.5, 0.22, 0.15);
  },
  surge() {
    noise(0.45, 0.35, 650, 'lowpass');
    tone('sawtooth', 190, 38, 0.42, 0.24);
    tone('square', 105, 28, 0.38, 0.16);
  },
  start() { tone('triangle', 330, 660, 0.15, 0.12); },
  over() { tone('sawtooth', 310, 40, 0.85, 0.16); }
};

/* ---------- vessel definitions ---------- */
const VESSELS = [
  { name: 'HARBOR TUG',     col: '#e63946', w: 68, h: 24, pts: 120, fragile: false },
  { name: 'CARGO BARGE',    col: '#2a9d8f', w: 86, h: 22, pts: 160, fragile: false },
  { name: 'ROYAL YACHT',    col: '#4cc9f0', w: 78, h: 25, pts: 240, fragile: false },
  { name: 'NITRO TANKER',   col: '#ff0055', w: 84, h: 24, pts: 340, fragile: true },
  { name: 'GOLDEN GALLEON', col: '#ffb703', w: 82, h: 28, pts: 450, fragile: false }
];

/* ---------- game state ---------- */
let state = STATES.START, G = null, raf = 0, last = 0, overAt = 0;
const hold = { fill: false, drain: false, ptrMode: 0, ptrId: null };
const clouds = Array.from({ length: 5 }, (_, i) => ({ x: (i / 5) * 380 - 190, y: -135 - (i % 2) * 18, s: 0.75 + (i % 3) * 0.2 }));

function nextShipSpec(idx) {
  const g = G;
  // Alternate or pick direction: even ships climb from LOW (0.15) to HIGH (0.85), odd ships descend from HIGH (0.85) to LOW (0.15)
  const goingUp = idx % 2 === 0;
  const entryLv = goingUp ? rr(0.12, 0.24) : rr(0.76, 0.88);
  const exitLv  = goingUp ? rr(0.78, 0.88) : rr(0.12, 0.22);

  let spec = VESSELS[idx % 3];
  if (idx >= 2 && Math.random() < 0.28) spec = VESSELS[3]; // Nitro Tanker
  else if (idx >= 1 && Math.random() < 0.22) spec = VESSELS[4]; // Golden Galleon

  // Spawn an optional Floating Salvage Crate inside the chamber at an intermediate depth!
  const crateLv = clamp((entryLv + exitLv) * 0.5 + (goingUp ? 0.14 : -0.14), 0.08, 0.92);

  return {
    idx,
    spec,
    goingUp,
    entryLv,
    exitLv,
    tol: Math.max(0.055, 0.095 - Math.min(idx, 12) * 0.003),
    perfTol: 0.028,
    phase: 'wait_entry', // 'wait_entry' | 'entering' | 'in_lock' | 'exiting'
    x: goingUp ? -145 : -145,
    lv: entryLv,
    tilt: 0,
    crate: { lv: crateLv, x: rr(-35, 35), got: false }
  };
}

function setupNextVessel() {
  const g = G;
  g.vessel = nextShipSpec(g.shipsCleared);
  g.gateL = 0; // 0 = closed, 1 = open
  g.gateR = 0;
}

function resetGame() {
  G = {
    t: 0, score: 0, lives: 3, streak: 0, maxStreak: 0, shipsCleared: 0,
    water: 0.5, vWater: 0,
    gateL: 0, gateR: 0,
    vessel: null,
    bubbles: [], parts: [], pops: [],
    shake: 0, slowmo: 1, flash: 0, hint: 1,
    rank: -1, hiNew: false, reason: '', saved: false
  };
  setupNextVessel();
}

/* ---------- loop control ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const rawDt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
  last = now;
  update(rawDt * (G ? G.slowmo : 1), rawDt);
  draw(now);
}
document.addEventListener('visibilitychange', () => {
  hold.fill = false; hold.drain = false; hold.ptrMode = 0; hold.ptrId = null;
  if (document.hidden) { stopLoop(); stopValveAudio(); }
  else { startLoop(); if (state === STATES.PLAYING) startValveAudio(); }
});
window.addEventListener('blur', () => {
  hold.fill = false; hold.drain = false; hold.ptrMode = 0; hold.ptrId = null;
  setValveAudio(0, 0.5);
});

function startGame() {
  stopLoop(); stopValveAudio();
  hold.fill = false; hold.drain = false; hold.ptrMode = 0; hold.ptrId = null;
  resetGame();
  state = STATES.PLAYING;
  sfx.start();
  startValveAudio();
  startLoop();
}

/* ---------- helpers & juice ---------- */
const mult = () => 1 + Math.min(G.streak, 15) * 0.25;
function pop(t, col, wx, wy, sz = 19) {
  G.pops.push({ t, col, x: SX(wx), y: SY(wy), sz, l: 1.15 });
}
function burst(wx, wy, n, cols, sp = 180) {
  const x = SX(wx), y = SY(wy);
  for (let i = 0; i < n && G.parts.length < 240; i++) {
    const a = Math.random() * TAU, v = sp * rr(0.35, 1.15);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 45, l: rr(0.35, 0.8), m: 0.8, c: cols[i % cols.length], r: rr(2, 4.5) });
  }
}

function hurtLock(why, wx, wy) {
  const g = G;
  g.lives--;
  g.streak = 0;
  g.shake = 16;
  g.flash = 0.65;
  sfx.surge();
  burst(wx, wy, 28, ['#ef476f', '#ffb703', '#ffffff'], 230);
  pop(why, '#ef476f', wx, wy - 22, 21);
  if (g.lives <= 0) {
    g.reason = why;
    endGame();
  }
}

function endGame() {
  if (G.saved) return;
  G.saved = true;
  setValveAudio(0, 0.5);
  stopValveAudio();
  state = STATES.GAMEOVER;
  overAt = performance.now();
  const prior = top5[0] || 0;
  G.rank = saveScore(G.score, G.shipsCleared, G.maxStreak);
  G.hiNew = G.score > prior && G.score > 0;
  sfx.over();
}

// Release valves when player stops holding FILL or DRAIN: check if water level matches current target!
function checkLevelSeal() {
  const g = G, v = g.vessel;
  if (state !== STATES.PLAYING || !v) return;
  if (v.phase !== 'wait_entry' && v.phase !== 'in_lock') return;

  const targetLv = v.phase === 'wait_entry' ? v.entryLv : v.exitLv;
  const err = Math.abs(g.water - targetLv);

  if (err <= v.tol) {
    // Perfect or Clean Hydrostatic Seal! Open the corresponding lock gate!
    const isPerf = err <= v.perfTol;
    g.streak++;
    g.maxStreak = Math.max(g.maxStreak, g.streak);
    g.hint = 0;

    const base = isPerf ? 160 : 85;
    const pts = Math.round(base * mult());
    g.score += pts;

    sfx.lockSeal(g.streak, isPerf);
    g.shake = isPerf ? 9 : 4;
    if (isPerf) g.slowmo = 0.45;

    const wy = levelToY(g.water);
    burst(v.phase === 'wait_entry' ? -82 : 82, wy, isPerf ? 22 : 12, isPerf ? ['#ffb703', '#06d6a0', '#ffffff'] : ['#06d6a0', '#ffffff'], 180);
    pop((isPerf ? 'HYDRO-SEAL! +' : 'GATE OPEN! +') + pts, isPerf ? '#ffb703' : '#06d6a0', 0, wy - 28, isPerf ? 21 : 18);

    if (v.phase === 'wait_entry') {
      v.phase = 'entering';
      sfx.horn(false);
    } else {
      v.phase = 'exiting';
      sfx.horn(true);
    }
  }
}

/* ---------- update ---------- */
function update(dt, rawDt) {
  const g = G, v = g.vessel;
  g.t += dt;
  g.shake *= Math.exp(-8 * rawDt);
  g.flash = Math.max(0, g.flash - rawDt * 2.5);
  g.slowmo += (1 - g.slowmo) * Math.min(1, rawDt * 5);

  for (const c of clouds) {
    c.x += 6 * rawDt;
    if (c.x > 210) c.x = -210;
  }
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i]; p.l -= rawDt;
    if (p.l <= 0) { g.parts.splice(i, 1); continue; }
    p.vy += 400 * rawDt; p.x += p.vx * rawDt; p.y += p.vy * rawDt;
  }
  for (let i = g.pops.length - 1; i >= 0; i--) {
    const p = g.pops[i]; p.l -= rawDt;
    if (p.l <= 0) g.pops.splice(i, 1); else p.y -= 28 * rawDt;
  }
  for (let i = g.bubbles.length - 1; i >= 0; i--) {
    const b = g.bubbles[i]; b.l -= rawDt;
    b.y -= 45 * rawDt;
    if (b.l <= 0 || b.y < levelToY(g.water)) g.bubbles.splice(i, 1);
  }

  if (state !== STATES.PLAYING || !v) return;

  // Active Valve Mode: +1 = FILL (raise water), -1 = DRAIN (lower water), 0 = HOLD
  let mode = hold.ptrMode;
  if (hold.fill) mode = 1;
  else if (hold.drain) mode = -1;

  // Only allow pumping when both lock gates are closed
  if (v.phase === 'entering' || v.phase === 'exiting') mode = 0;
  setValveAudio(mode, g.water);

  // Smooth hydraulic inertia
  const pumpAccel = 1.65;
  g.vWater += (mode * 0.58 - g.vWater) * Math.min(1, dt * 7.5);
  g.water += g.vWater * dt;

  // Spawn bubbles from bottom culvert pipes when filling or draining
  if (Math.abs(g.vWater) > 0.08 && Math.random() < 0.55) {
    g.bubbles.push({
      x: rr(-68, 68),
      y: 78,
      r: rr(2, 4.5),
      l: 0.9
    });
  }

  // Check overflow / dry-dock bottom-out!
  if (g.water >= 0.98) {
    g.water = 0.86; g.vWater = 0;
    hold.ptrMode = 0; hold.fill = false;
    hurtLock('CHAMBER OVERFLOW!', 0, levelToY(0.95));
    return;
  }
  if (g.water <= 0.02) {
    g.water = 0.14; g.vWater = 0;
    hold.ptrMode = 0; hold.drain = false;
    hurtLock('GROUNDED ON LOCK FLOOR!', 0, levelToY(0.05));
    return;
  }

  // Fragile Nitro Tanker Turbulence Check: if pumping at max speed while tanker is inside chamber
  if (v.phase === 'in_lock' && v.spec.fragile) {
    v.tilt = g.vWater * 0.42 * Math.sin(g.t * 18);
  } else {
    v.tilt = Math.sin(g.t * 2.5) * 0.03;
  }

  // Check Floating Salvage Crate inside the chamber!
  if (v.phase === 'in_lock' && v.crate && !v.crate.got) {
    if (Math.abs(g.water - v.crate.lv) < 0.045) {
      v.crate.got = true;
      const cPts = Math.round(180 * mult());
      g.score += cPts;
      sfx.crate();
      const cy = levelToY(v.crate.lv);
      burst(v.crate.x, cy, 16, ['#ffb703', '#ffffff'], 170);
      pop('SALVAGE CRATE! +' + cPts, '#ffb703', v.crate.x, cy - 20, 19);
    }
  }

  // Vessel State Machine
  if (v.phase === 'entering') {
    g.gateL = lerp(g.gateL, 1, dt * 8);
    g.water = lerp(g.water, v.entryLv, dt * 6);
    v.lv = g.water;
    v.x = lerp(v.x, 0, dt * 4.2);
    if (Math.abs(v.x) < 2.5) {
      v.x = 0;
      v.phase = 'in_lock';
    }
  } else if (v.phase === 'in_lock') {
    g.gateL = lerp(g.gateL, 0, dt * 9);
    v.lv = g.water;
  } else if (v.phase === 'exiting') {
    g.gateR = lerp(g.gateR, 1, dt * 8);
    g.water = lerp(g.water, v.exitLv, dt * 6);
    v.lv = g.water;
    v.x += 155 * dt;
    if (v.x > 148) {
      g.shipsCleared++;
      const shipPts = Math.round(v.spec.pts * mult());
      g.score += shipPts;
      pop(v.spec.name + ' CLEARED! +' + shipPts, '#ffb703', 85, levelToY(v.exitLv) - 28, 20);
      setupNextVessel();
    }
  } else {
    // wait_entry
    g.gateL = lerp(g.gateL, 0, dt * 8);
    g.gateR = lerp(g.gateR, 0, dt * 8);
  }
}

/* ---------- UI buttons & input ---------- */
function valveBtnsGeo() {
  const bw = Math.min(155, W * 0.43), bh = Math.min(50, Math.max(40, H * 0.085));
  const y = H - bh - 10;
  return {
    drain: { x: OX - bw - 8, y, w: bw, h: bh },
    fill:  { x: OX + 8,      y, w: bw, h: bh }
  };
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 800) startGame(); return; }
  if (state !== STATES.PLAYING) return;

  hold.ptrId = e.pointerId;
  // Left half of screen = DRAIN (lower water), Right half = FILL (raise water)
  hold.ptrMode = e.clientX < W * 0.5 ? -1 : 1;
});

function onUp(e) {
  if (e.pointerId === hold.ptrId) {
    hold.ptrId = null;
    hold.ptrMode = 0;
    checkLevelSeal();
  }
}
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', () => { hold.ptrId = null; hold.ptrMode = 0; });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowUp' || c === 'KeyW' || c === 'ArrowRight' || c === 'KeyD') {
    e.preventDefault(); audio();
    if (state === STATES.PLAYING) hold.fill = true;
  } else if (c === 'ArrowDown' || c === 'KeyS' || c === 'ArrowLeft' || c === 'KeyA') {
    e.preventDefault(); audio();
    if (state === STATES.PLAYING) hold.drain = true;
  } else if ((c === 'Space' || c === 'Enter') && !e.repeat) {
    e.preventDefault(); audio();
    if (state === STATES.START) startGame();
    else if (state === STATES.GAMEOVER && performance.now() - overAt > 800) startGame();
    else if (state === STATES.PLAYING) checkLevelSeal();
  }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowUp' || c === 'KeyW' || c === 'ArrowRight' || c === 'KeyD') {
    hold.fill = false;
    checkLevelSeal();
  } else if (c === 'ArrowDown' || c === 'KeyS' || c === 'ArrowLeft' || c === 'KeyA') {
    hold.drain = false;
    checkLevelSeal();
  }
});

/* ---------- rendering ---------- */
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, sz, col, align = 'center', maxW = 0, weight = 800) {
  let f = Math.max(8, sz);
  ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  if (maxW > 0) {
    while (f > 9 && ctx.measureText(s).width > maxW) {
      f--;
      ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    }
  }
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function drawVessel(x, waterY, spec, tilt, now) {
  const sx = SX(x), sy = SY(waterY);
  const w = spec.w * S, h = spec.h * S;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(tilt);

  // Cabin superstructure
  ctx.fillStyle = '#f8f9fa';
  rrect(-w * 0.28, -h * 1.05, w * 0.46, h * 0.65, 3 * S);
  ctx.fill();
  ctx.fillStyle = '#1d3557';
  ctx.fillRect(-w * 0.2, -h * 0.92, w * 0.3, h * 0.22);

  // Smokestack
  ctx.fillStyle = spec.col;
  ctx.fillRect(-w * 0.12, -h * 1.38, w * 0.14, h * 0.35);

  // Steel Hull
  ctx.fillStyle = spec.col;
  ctx.beginPath();
  ctx.moveTo(-w * 0.5, -h * 0.45);
  ctx.lineTo(w * 0.54, -h * 0.45);
  ctx.lineTo(w * 0.42, h * 0.28);
  ctx.lineTo(-w * 0.44, h * 0.28);
  ctx.closePath();
  ctx.fill();

  // Dark red keel stripe
  ctx.fillStyle = '#1b263b';
  ctx.fillRect(-w * 0.45, 0, w * 0.9, h * 0.24);
  ctx.restore();
}

function drawCanalWorld(now) {
  // Sky & Distant Hills
  const sky = ctx.createLinearGradient(0, 0, 0, SY(-40));
  sky.addColorStop(0, '#0f2942');
  sky.addColorStop(0.6, '#1e4d78');
  sky.addColorStop(1, '#48cae4');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  for (const c of clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.ellipse(SX(c.x), SY(c.y), 38 * c.s * S, 11 * c.s * S, 0, 0, TAU);
    ctx.fill();
  }

  const g = G, v = g.vessel;
  const floorY = SY(84);
  const wallTopY = SY(-86);
  const leftGateX = SX(-82);
  const rightGateX = SX(82);

  // Back Concrete Chamber Wall
  ctx.fillStyle = '#2b3a4a';
  ctx.fillRect(leftGateX, wallTopY, rightGateX - leftGateX, floorY - wallTopY);

  // Depth Gauge Ruler Lines inside Chamber Wall
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 9; i++) {
    const ly = SY(levelToY(i / 10));
    ctx.beginPath();
    ctx.moveTo(leftGateX + 6 * S, ly);
    ctx.lineTo(rightGateX - 6 * S, ly);
    ctx.stroke();
  }

  // Target Water-Level Band inside Chamber!
  if (v && (v.phase === 'wait_entry' || v.phase === 'in_lock')) {
    const tgtLv = v.phase === 'wait_entry' ? v.entryLv : v.exitLv;
    const tyTop = SY(levelToY(tgtLv + v.tol));
    const tyBot = SY(levelToY(tgtLv - v.tol));
    const pyMid = SY(levelToY(tgtLv));
    const inZone = Math.abs(g.water - tgtLv) <= v.tol;

    ctx.fillStyle = inZone ? 'rgba(6, 214, 160, 0.34)' : 'rgba(255, 183, 3, 0.24)';
    ctx.fillRect(leftGateX, tyTop, rightGateX - leftGateX, tyBot - tyTop);

    ctx.strokeStyle = inZone ? '#06d6a0' : '#ffb703';
    ctx.lineWidth = 2.5 * S;
    ctx.setLineDash([6 * S, 4 * S]);
    ctx.beginPath();
    ctx.moveTo(leftGateX, pyMid);
    ctx.lineTo(rightGateX, pyMid);
    ctx.stroke();
    ctx.setLineDash([]);

    txt(inZone ? 'RELEASE TO OPEN GATE!' : (v.phase === 'wait_entry' ? 'MATCH ENTRY CANAL' : 'MATCH EXIT CANAL'), OX, pyMid - 10 * S, Math.max(9, 10 * S), inZone ? '#06d6a0' : '#ffb703', 'center', 150 * S, 900);
  }

  // Floating Salvage Crate inside Chamber
  if (v && v.phase === 'in_lock' && v.crate && !v.crate.got) {
    const cx = SX(v.crate.x), cy = SY(levelToY(v.crate.lv));
    const r = 10 * S;
    ctx.fillStyle = '#ffb703';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * S;
    rrect(cx - r, cy - r, r * 2, r * 2, 3 * S);
    ctx.fill(); ctx.stroke();
    txt('★', cx, cy + 1, Math.max(8, 10 * S), '#0d2137', 'center', 0, 900);
  }

  // Draw Vessel
  if (v) {
    const shipWaterY = v.phase === 'wait_entry' ? levelToY(v.entryLv) : v.phase === 'exiting' ? levelToY(v.exitLv) : levelToY(g.water);
    drawVessel(v.x, shipWaterY, v.spec, v.tilt, now);
  }

  // Left Canal Water, Lock Chamber Water, Right Canal Water
  const leftWaterY = SY(levelToY(v ? v.entryLv : 0.2));
  const lockWaterY = SY(levelToY(g.water));
  const rightWaterY = SY(levelToY(v ? v.exitLv : 0.8));

  function fillWaterRect(x0, y0, x1, y1, waveAmp) {
    const wg = ctx.createLinearGradient(0, y0, 0, y1);
    wg.addColorStop(0, 'rgba(0, 180, 216, 0.78)');
    wg.addColorStop(0.5, 'rgba(0, 119, 182, 0.88)');
    wg.addColorStop(1, 'rgba(3, 4, 94, 0.95)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(x0, y1);
    for (let x = x0; x <= x1; x += 12) {
      const wv = Math.sin(x * 0.04 + now * 0.006) * waveAmp;
      ctx.lineTo(x, y0 + wv);
    }
    ctx.lineTo(x1, y0);
    ctx.lineTo(x1, y1);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(202, 240, 248, 0.85)';
    ctx.lineWidth = 2.5 * S;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 12) {
      const wv = Math.sin(x * 0.04 + now * 0.006) * waveAmp;
      x === x0 ? ctx.moveTo(x, y0 + wv) : ctx.lineTo(x, y0 + wv);
    }
    ctx.stroke();
  }

  fillWaterRect(0, leftWaterY, leftGateX, floorY, 2 * S);
  fillWaterRect(leftGateX, lockWaterY, rightGateX, floorY, (2 + Math.abs(g.vWater) * 7) * S);
  fillWaterRect(rightGateX, rightWaterY, W, floorY, 2 * S);

  // Rising Culvert Bubbles inside Chamber
  for (const b of g.bubbles) {
    ctx.fillStyle = 'rgba(202, 240, 248, 0.55)';
    ctx.beginPath();
    ctx.arc(SX(b.x), SY(b.y), b.r * S, 0, TAU);
    ctx.fill();
  }

  // Masonry Lock Floor & Culvert Pipes
  ctx.fillStyle = '#1b263b';
  ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = '#415a77';
  ctx.fillRect(0, floorY, W, 8 * S);

  // Left & Right Heavy Steel Mitre Lock Gates + Concrete Towers
  for (const [gx, openFrac] of [[leftGateX, g.gateL], [rightGateX, g.gateR]]) {
    const pw = 16 * S;
    // Concrete Pillar
    ctx.fillStyle = '#6c757d';
    rrect(gx - pw * 0.5, wallTopY - 12 * S, pw, floorY - wallTopY + 14 * S, 3 * S);
    ctx.fill();

    // Steel Hydraulic Gate Leaf (retracts upward/sideways when openFrac -> 1)
    const gateH = (floorY - wallTopY) * (1 - openFrac * 0.82);
    ctx.fillStyle = openFrac > 0.5 ? '#06d6a0' : '#ffb703';
    ctx.fillRect(gx - 5 * S, wallTopY, 10 * S, gateH);
  }
}

function panel(x, y, w, h) {
  rrect(x, y, w, h, 12);
  ctx.fillStyle = 'rgba(9, 22, 36, 0.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255, 183, 3, 0.32)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawHUD(now) {
  const g = G, pad = 10, topY = safeTop + 6, ph = Math.min(48, H * 0.11);
  const w1 = Math.min(135, W * 0.3), w2 = Math.min(125, W * 0.27), w3 = Math.min(130, W * 0.28);

  panel(pad, topY, w1, ph);
  txt('TOLLS', pad + w1 * 0.5, topY + ph * 0.28, 10, '#94a3b8', 'center', w1 - 10, 700);
  txt(String(Math.floor(g.score)), pad + w1 * 0.5, topY + ph * 0.68, Math.min(20, ph * 0.44), '#fff', 'center', w1 - 12, 900);

  const x2 = W * 0.5 - w2 * 0.5;
  panel(x2, topY, w2, ph);
  txt('x' + mult().toFixed(2).replace(/\.00$/, '.0'), W * 0.5, topY + ph * 0.35, Math.min(16, ph * 0.38), '#ffb703', 'center', w2 - 8, 900);
  txt('SHIPS ' + g.shipsCleared, W * 0.5, topY + ph * 0.74, 10, '#cbd5e1', 'center', w2 - 8, 700);

  const x3 = W - pad - w3;
  panel(x3, topY, w3, ph);
  for (let i = 0; i < 3; i++) {
    const hx = x3 + w3 * (0.22 + i * 0.28), hy = topY + ph * 0.5, r = Math.min(7, w3 / 12);
    ctx.fillStyle = i < g.lives ? '#06d6a0' : 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.arc(hx, hy, r, 0, TAU); ctx.fill();
  }

  // Bottom Valve Controls: DRAIN (Left) & FILL (Right)
  if (state === STATES.PLAYING) {
    const btns = valveBtnsGeo();
    const isDraining = hold.ptrMode === -1 || hold.drain;
    const isFilling  = hold.ptrMode === 1  || hold.fill;

    rrect(btns.drain.x, btns.drain.y, btns.drain.w, btns.drain.h, 11);
    ctx.fillStyle = isDraining ? '#48cae4' : '#1b3a57';
    ctx.fill();
    ctx.strokeStyle = '#48cae4'; ctx.lineWidth = 2; ctx.stroke();
    txt('▼ DRAIN LOCK', btns.drain.x + btns.drain.w * 0.5, btns.drain.y + btns.drain.h * 0.38, Math.min(13, btns.drain.h * 0.32), isDraining ? '#0d2137' : '#fff', 'center', btns.drain.w - 12, 900);
    txt('HOLD LEFT SIDE', btns.drain.x + btns.drain.w * 0.5, btns.drain.y + btns.drain.h * 0.74, 9.5, isDraining ? '#0d2137' : '#90e0ef', 'center', btns.drain.w - 12, 700);

    rrect(btns.fill.x, btns.fill.y, btns.fill.w, btns.fill.h, 11);
    ctx.fillStyle = isFilling ? '#ffb703' : '#1b3a57';
    ctx.fill();
    ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 2; ctx.stroke();
    txt('▲ FILL LOCK', btns.fill.x + btns.fill.w * 0.5, btns.fill.y + btns.fill.h * 0.38, Math.min(13, btns.fill.h * 0.32), isFilling ? '#0d2137' : '#fff', 'center', btns.fill.w - 12, 900);
    txt('HOLD RIGHT SIDE', btns.fill.x + btns.fill.w * 0.5, btns.fill.y + btns.fill.h * 0.74, 9.5, isFilling ? '#0d2137' : '#ffd166', 'center', btns.fill.w - 12, 700);

    if (g.hint > 0) {
      const hw = Math.min(330, W * 0.92), hy = btns.drain.y - 22;
      panel(W * 0.5 - hw * 0.5, hy - 16, hw, 32);
      txt('HOLD Left/Right to match water level • RELEASE in green band!', W * 0.5, hy, 11, '#fff', 'center', hw - 14, 800);
    }
  }
}

function drawStart(now) {
  ctx.fillStyle = 'rgba(8, 20, 34, 0.74)'; ctx.fillRect(0, 0, W, H);
  const titleSz = Math.min(48, W / 7, H * 0.13);
  txt('LOCK GATE', W * 0.5, H * 0.25, titleSz, '#ffb703', 'center', W - 28, 900);
  txt('Pump the canal chamber • Equalize water levels • Pass the fleet', W * 0.5, H * 0.41, Math.min(14, W / 24, H * 0.045), '#f4f9fc', 'center', W - 28, 600);
  txt('Release inside the green band to open the lock gates!', W * 0.5, H * 0.49, Math.min(13, W / 26, H * 0.04), '#06d6a0', 'center', W - 28, 700);
  ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.006);
  txt('TAP / CLICK TO OPERATE', W * 0.5, H * 0.66, Math.min(24, W / 13, H * 0.07), '#06d6a0', 'center', W - 28, 900);
  ctx.globalAlpha = 1;
  if (top5[0]) txt('BEST ' + top5[0] + '  •  SHIPS ' + bestShips + '  •  STREAK ' + bestStreak, W * 0.5, H * 0.78, Math.min(14, H * 0.04), '#ffb703', 'center', W - 28, 700);
}

function drawOver(now) {
  ctx.fillStyle = 'rgba(8, 20, 34, 0.84)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 24, 350), ph = Math.min(H - safeTop - 20, 330);
  const x = W * 0.5 - pw * 0.5, y = Math.max(safeTop + 8, (H - ph) * 0.5), k = ph / 330;
  panel(x, y, pw, ph);
  txt(G.reason || 'CANAL FLOODED', W * 0.5, y + 28 * k, Math.min(20, pw / 13), '#ef476f', 'center', pw - 24, 900);
  txt(String(Math.floor(G.score)), W * 0.5, y + 68 * k, Math.min(40, pw / 6.5), '#fff', 'center', pw - 24, 900);
  txt(G.hiNew ? 'NEW HIGH SCORE!' : 'Ships Passed: ' + G.shipsCleared + '  •  Best Streak: ' + G.maxStreak, W * 0.5, y + 102 * k, Math.min(13, pw / 20), G.hiNew ? '#ffb703' : '#cbd5e1', 'center', pw - 24, 800);
  txt('TOP 5 LOCKMASTERS', W * 0.5, y + 128 * k, 11, '#94a3b8', 'center', pw - 24, 700);

  for (let i = 0; i < 5; i++) {
    const yy = y + (150 + i * 22) * k, sc = top5[i], me = i === G.rank;
    if (me) { rrect(x + 16, yy - 10 * k, pw - 32, 20 * k, 6); ctx.fillStyle = 'rgba(255,183,3,0.22)'; ctx.fill(); }
    txt((i + 1) + '.', x + 28, yy, 13, me ? '#ffb703' : '#94a3b8', 'left', 30, 800);
    txt(sc === undefined ? '-' : String(sc), x + pw - 28, yy, 13, me ? '#ffb703' : '#f4f9fc', 'right', pw - 80, 800);
  }
  if (performance.now() - overAt > 800) {
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.007);
    txt('TAP TO OPERATE AGAIN', W * 0.5, y + ph - 24 * k, Math.min(19, pw / 15), '#06d6a0', 'center', pw - 24, 900);
    ctx.globalAlpha = 1;
  }
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rr(-1, 1) * G.shake, rr(-1, 1) * G.shake);

  drawCanalWorld(now);

  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.l / p.m, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of G.pops) {
    ctx.globalAlpha = clamp(p.l * 1.4, 0, 1);
    txt(p.t, clamp(p.x, 75, W - 75), p.y, p.sz, p.col, 'center', W - 20, 900);
  }
  ctx.globalAlpha = 1;
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (state === STATES.START) drawStart(now);
  else {
    drawHUD(now);
    if (state === STATES.GAMEOVER) drawOver(now);
  }
}

resize();
resetGame();
startLoop();
})();
</script>
