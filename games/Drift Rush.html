<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift Rush</title>
<style>
:root{--bg:#1a1030}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1030}}
:root[data-theme="dark"]{--bg:#1a1030}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, RESULT: 2, GAMEOVER: 3 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, SEG = 200, RW = 650, CAMH = 1000, DRAW = 140, CD = 0.839, MAXS = SEG * 60, LANES = [-0.62, 0, 0.62];
const THEMES = [
  { n: 'SUNSET COAST', top: '#2b1055', hor: '#ff8a4a', g1: '#12806a', g2: '#0f7060', r1: '#4a4658', r2: '#46424f', mt: '#5a2a6a', sun: '#ffd36a' },
  { n: 'NEON NIGHT', top: '#05061a', hor: '#c22ea0', g1: '#2a1650', g2: '#241244', r1: '#2c2e4a', r2: '#282a44', mt: '#1a1048', sun: '#6ae6ff' },
  { n: 'DESERT DUSK', top: '#3a2a6a', hor: '#ffb056', g1: '#c88a4a', g2: '#bc7e40', r1: '#5a5058', r2: '#564c54', mt: '#8a4a4a', sun: '#fff0a0' }
];
const NAMES = ['VIPER', 'NOVA', 'BLAZE'], RCOL = ['#2fd0ff', '#ffd02f', '#a56bff'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let best = parseInt(store.get('driftrush.best') || '0', 10) || 0;

/* ---------- canvas ---------- */
let W, H, dpr, K, hz, PZ, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0;
  K = Math.min(W, H * 0.62) / 2; hz = H * 0.4; PZ = K * CAMH * CD / (H * 0.8 - hz);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null, eng = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function engOn() {
  const a = audio(); if (!a || eng) return;
  try { const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(); o.type = 'sawtooth'; o.frequency.value = 60; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.035; o.connect(f); f.connect(g); g.connect(a.destination); o.start(); eng = { o, g, f }; } catch (e) {}
}
function engOff() { if (eng) { try { eng.o.stop(); } catch (e) {} eng = null; } }
const sfx = {
  beep(go) { tone('square', go ? 880 : 440, go ? 880 : 440, go ? 0.4 : 0.15, 0.1); },
  coin() { tone('triangle', 1100, 1650, 0.1, 0.1); },
  squeal() { tone('square', 1400 + Math.random() * 300, 900, 0.06, 0.025); },
  boost(t) { tone('sawtooth', 200, 200 + t * 350, 0.5, 0.1); },
  crash() { tone('sawtooth', 160, 40, 0.4, 0.16); tone('square', 80, 25, 0.5, 0.1); },
  pad() { tone('triangle', 500, 1200, 0.3, 0.1); },
  pass() { tone('triangle', 700, 1000, 0.12, 0.08); },
  fin() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.2, 0.12, i * 0.09)); },
  over() { tone('sawtooth', 380, 35, 0.9, 0.14); }
};

/* ---------- track ---------- */
let segs = [], FINI = 0, lastY = 0, theme = THEMES[0];
const ease = { i: (a, b, p) => a + (b - a) * p * p, o: (a, b, p) => a + (b - a) * (1 - (1 - p) * (1 - p)), io: (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5) };
function addSeg(curve, y) { segs.push({ i: segs.length, y1: lastY, y2: y, curve, sp: [], coins: [], pad: null }); lastY = y; }
function addRoad(en, ho, le, curve, dy) {
  const sy = lastY, ey = sy + dy * SEG, tot = en + ho + le;
  for (let n = 0; n < en; n++) addSeg(ease.i(0, curve, n / en), ease.io(sy, ey, n / tot));
  for (let n = 0; n < ho; n++) addSeg(curve, ease.io(sy, ey, (en + n) / tot));
  for (let n = 0; n < le; n++) addSeg(ease.io(curve, 0, n / le), ease.io(sy, ey, (en + ho + n) / tot));
}
const rr = (a, b) => a + Math.random() * (b - a);
function buildTrack(race) {
  segs = []; lastY = 0; theme = THEMES[race % 3]; const total = Math.min(3400, 1900 + 140 * race), cm = Math.min(3.4, 1.6 + 0.2 * race);
  addRoad(10, 30, 10, 0, 0);
  while (segs.length < total) {
    const r = Math.random(), s = Math.random() < 0.5 ? -1 : 1;
    if (r < 0.2) addRoad(10, rr(15, 35), 10, 0, 0);
    else if (r < 0.6) addRoad(rr(14, 26), rr(20, 45), rr(14, 26), s * rr(cm * 0.5, cm), 0);
    else if (r < 0.8) addRoad(25, rr(20, 45), 25, 0, (lastY > SEG * 20 ? -1 : lastY < -SEG * 5 ? 1 : s) * rr(15, 35));
    else addRoad(18, rr(20, 40), 18, s * rr(cm * 0.5, cm), (lastY > SEG * 15 ? -1 : 1) * rr(10, 30));
  }
  FINI = segs.length; addRoad(10, 280, 10, 0, 0);
  for (let i = 8; i < segs.length - 50; i++) {
    const sg = segs[i];
    if (i % 5 === 0) { sg.sp.push({ k: Math.random() < 0.75 ? 'palm' : 'bush', off: -rr(1.5, 3.2), s: rr(0.8, 1.2) }); sg.sp.push({ k: Math.random() < 0.75 ? 'palm' : 'bush', off: rr(1.5, 3.2), s: rr(0.8, 1.2) }); }
    if (i % 70 === 25) sg.sp.push({ k: 'sign', off: Math.random() < 0.5 ? -2 : 2, s: 1, c: Math.floor(Math.random() * 3) });
    if (i % 47 === 12 && i < FINI - 20) { const x = LANES[Math.floor(Math.random() * 3)]; for (let k = 0; k < 6; k++) segs[i + k].coins.push({ x, got: false }); }
    if (i % 95 === 60 && i < FINI - 20) sg.pad = { x: LANES[Math.floor(Math.random() * 3)] };
  }
}
const segAt = z => segs[clamp(Math.floor(z / SEG), 0, segs.length - 1)];

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0;
const inp = { l: new Set(), r: new Set(), kl: 0, kr: 0 };
let bgOff = 0;

function newRace() {
  const g = G, race = g.race; buildTrack(race);
  const rs = 0.84 + 0.03 * race;
  g.p = { z: 0, x: 0, v: 0, drift: 0, hold: 0, holdT: 0, charge: 0, boost: 0, tier: 0, crash: 0, fin: null, ang: 0, name: 'YOU', k: 'p', col: '#ff3b4a' };
  g.rivals = [0, 1, 2].map(i => ({ z: 300 + i * 380, x: LANES[i], tx: LANES[i], v: 0, skill: rs * rr(0.97, 1.03), fin: null, name: NAMES[i], col: RCOL[i], k: 'r', lt: 0 }));
  g.traffic = []; const n = 38 + 6 * race; for (let i = 0; i < n; i++) g.traffic.push({ z: rr(2500, FINI * SEG - 3000), x: LANES[Math.floor(Math.random() * 3)], v: MAXS * rr(0.32, 0.52), col: ['#e8e8f0', '#59d27a', '#f2a03a', '#7a8cff', '#d8d84a'][Math.floor(Math.random() * 5)], k: 't' });
  g.cd = 3.4; g.t = 0; g.over = 0; g.parts = []; g.popups = []; g.shake = 0; g.lastPos = 4; g.driftScore = 0; g.coins = 0; g.finished = false; g.hint = race === 0 ? 7 : 0; g.go = 0; g.lastBeep = 4;
}
function resetGame() { G = { race: 0, score: 0, total: 0 }; newRace(); }
resetGame();
const finZ = () => FINI * SEG;
function standings() {
  const all = [G.p, ...G.rivals];
  return all.slice().sort((a, b) => (a.fin != null && b.fin != null) ? a.fin - b.fin : a.fin != null ? -1 : b.fin != null ? 1 : b.z - a.z);
}

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(now);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopLoop(); engOff(); } else { startLoop(); if (state === STATES.PLAYING) engOn(); } });
function startGame() { stopLoop(); engOff(); inp.l.clear(); inp.r.clear(); resetGame(); state = STATES.PLAYING; engOn(); startLoop(); }
function nextRace() { stopLoop(); G.race++; newRace(); state = STATES.PLAYING; engOn(); startLoop(); }

/* ---------- logic ---------- */
const pop = (t, col) => G.popups.push({ t, col, life: 1.4, y: 0 });
function part(x, y, vx, vy, life, col, sz) { if (G.parts.length < 260) G.parts.push({ x, y, vx, vy, life, max: life, col, sz }); }
function crashP(c) {
  const g = G, P = g.p; if (P.crash > 0) return;
  P.crash = 0.9; P.v *= 0.4; P.drift = 0; P.charge = 0; P.boost = 0; P.x += (c.x > P.x ? -1 : 1) * 0.18; g.shake = 1; sfx.crash(); pop('CRASH!', '#ff6a6a');
  c.v = Math.max(c.v, P.v + 600);
  for (let i = 0; i < 18; i++) part(W / 2, H * 0.78, (Math.random() - .5) * 400, -Math.random() * 300, 0.6, '#ffd24a', 3);
}
function finishRace() {
  const g = G; g.finished = true; sfx.fin(); engOff();
}
function resultsDone() {
  const g = G, st = standings(), pos = st.indexOf(g.p) + 1, pts = [100, 60, 30, 0][pos - 1];
  g.pos = pos; g.pts = pts; g.score += pts + g.driftScore + g.coins * 10; g.total++;
  const s = Math.floor(g.score); if (s > best) { best = s; store.set('driftrush.best', String(best)); }
  g.final = st.map((r, i) => ({ name: r.name, col: r.col, you: r === g.p, t: r.fin, gap: r.fin == null ? Math.max(0, finZ() - r.z) : 0, pos: i + 1 }));
  overAt = performance.now();
  if (pos <= 3) state = STATES.RESULT; else { state = STATES.GAMEOVER; sfx.over(); }
}
function update(dt) {
  const g = G; g.shake = Math.max(0, g.shake - dt * 2.5);
  for (let i = g.parts.length - 1; i >= 0; i--) { const p = g.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; if (p.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.popups.length - 1; i >= 0; i--) { const p = g.popups[i]; p.life -= dt; p.y -= dt * 20; if (p.life <= 0) g.popups.splice(i, 1); }
  const P = g.p, pct = P.v / MAXS;
  if (state === STATES.START) { P.v = MAXS * 0.55; P.z += P.v * dt; P.x = Math.sin(g.t) * 0.3; g.t += dt; bgOff += dt * 0.0; if (P.z > FINI * SEG - 20000) P.z = 0; return; }
  if (state !== STATES.PLAYING) return;
  /* countdown */
  if (g.cd > 0) { g.cd -= dt; const n = Math.ceil(g.cd - 0.4); if (n !== g.lastBeep && n >= 0 && g.cd > 0.4) { g.lastBeep = n; sfx.beep(false); } if (g.cd <= 0.4 && g.go === 0) { g.go = 1; sfx.beep(true); } if (g.cd > 0.4) return; }
  g.t += dt; g.hint = Math.max(0, g.hint - dt);
  const seg = segAt(P.z), steerIn = P.fin == null ? ((inp.r.size || inp.kr ? 1 : 0) - (inp.l.size || inp.kl ? 1 : 0)) : 0;
  /* drift state machine */
  P.crash = Math.max(0, P.crash - dt);
  if (steerIn !== 0 && steerIn === P.hold) P.holdT += dt; else { P.hold = steerIn; P.holdT = 0; }
  if (!P.drift && steerIn !== 0 && P.holdT > 0.4 && pct > 0.5 && P.crash <= 0) { P.drift = steerIn; P.charge = 0; }
  if (P.drift) {
    P.charge += dt * (1 + 0.5 * Math.max(0, P.drift * seg.curve));
    if (steerIn !== P.drift || pct < 0.35) {
      const tier = P.charge >= 2.4 ? 3 : P.charge >= 1.5 ? 2 : P.charge >= 0.7 ? 1 : 0;
      if (tier) { P.boost = [0, 0.7, 1.3, 2][tier]; P.tier = tier; g.driftScore += 50 * tier; sfx.boost(tier); pop('BOOST x' + tier + '  +' + 50 * tier, ['', '#59c6ff', '#ffa43a', '#ff5ad2'][tier]); }
      P.drift = 0; P.charge = 0;
    }
  }
  /* speed + steering */
  P.boost = Math.max(0, P.boost - dt);
  const off = Math.abs(P.x) > 1.02, cap = P.fin != null ? MAXS * 0.5 : off ? MAXS * 0.33 : P.boost > 0 ? MAXS * (1.12 + 0.05 * P.tier) : MAXS * 0.88;
  P.v += (cap - P.v) * clamp(dt * (P.v > cap ? 1.6 : 0.7), 0, 1);
  const dx = dt * 2 * pct;
  P.x += steerIn * dx * (P.drift ? 1.45 : 1);
  P.x -= dx * pct * seg.curve * 0.3 * (P.drift ? 0.42 : 1);
  P.x = clamp(P.x, -2.4, 2.4);
  P.ang += ((P.drift ? P.drift * 0.38 : steerIn * 0.1) - P.ang) * Math.min(1, dt * 9);
  P.z += P.v * dt; bgOff += seg.curve * pct * dt * 0.06;
  const psi = Math.floor(P.z / SEG);
  /* pads + coins */
  const cs = segs[psi]; if (cs) {
    if (cs.pad && Math.abs(P.x - cs.pad.x) < 0.4 && !cs.pad.used) { cs.pad.used = true; P.boost = Math.max(P.boost, 1.3); P.tier = Math.max(P.tier, 1); sfx.pad(); pop('SPEED PAD', '#ffe24a'); }
    for (const c of cs.coins) if (!c.got && Math.abs(P.x - c.x) < 0.34) { c.got = true; g.coins++; sfx.coin(); }
  }
  /* cars */
  for (const c of g.traffic) { c.z += c.v * dt; const dz = c.z - P.z; if (dz > -120 && dz < 190 && Math.abs(c.x - P.x) < 0.36) crashP(c); }
  const st0 = standings();
  for (const r of g.rivals) {
    const lead = P.z - r.z, rub = 1 + clamp(lead / 22000, -0.14, 0.2), tv = MAXS * r.skill * rub * (r.fin != null ? 0.7 : 1);
    r.v += (Math.min(tv, MAXS * 0.98) - r.v) * Math.min(1, dt * 1.2); r.z += r.v * dt;
    r.lt -= dt;
    if (r.lt <= 0) { r.lt = 0.35; const blocked = x => g.traffic.some(c => Math.abs(c.x - x) < 0.3 && c.z - r.z > 0 && c.z - r.z < 1700 && c.v < r.v); if (blocked(r.tx)) { const opts = LANES.filter(x => !blocked(x)); if (opts.length) r.tx = opts[Math.floor(Math.random() * opts.length)]; else r.v *= 0.9; } }
    r.x += (r.tx - r.x) * Math.min(1, dt * 3);
    if (Math.abs(r.x - P.x) < 0.34 && r.z - P.z > -120 && r.z - P.z < 190) crashP(r);
    if (r.fin == null && r.z >= finZ()) r.fin = g.t - (r.z - finZ()) / Math.max(r.v, 1);
  }
  if (P.fin == null && P.z >= finZ()) { P.fin = g.t - (P.z - finZ()) / Math.max(P.v, 1); P.drift = 0; finishRace(); g.over = 0; }
  if (P.fin != null) { g.over += dt; if (g.over > 3.2) resultsDone(); }
  const st = standings(), pos = st.indexOf(P) + 1; if (pos < g.lastPos && P.fin == null) { sfx.pass(); pop('OVERTAKE!  ' + ['', '1ST', '2ND', '3RD', '4TH'][pos], '#fff'); g.score += 25; } g.lastPos = pos;
  /* particles */
  if (P.drift && Math.random() < dt * 40) { const c = ['#59c6ff', '#ffa43a', '#ff5ad2'][P.charge >= 2.4 ? 2 : P.charge >= 1.5 ? 1 : 0]; part(W / 2 + (Math.random() < .5 ? -1 : 1) * K * 0.3, H * 0.8, -P.drift * rr(60, 220), -rr(40, 160), 0.4, c, 3); }
  if (P.drift && Math.random() < dt * 14) sfx.squeal();
  if (P.boost > 0 && Math.random() < dt * 60) part(W / 2 + rr(-20, 20), H * 0.8 - 6, rr(-30, 30), rr(60, 180), 0.35, '#ffb23a', 4);
  if (eng) { eng.o.frequency.value = 55 + (P.v / MAXS) * 150 + (P.boost > 0 ? 40 : 0); eng.f.frequency.value = 400 + pct * 900; }
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 800) startGame(); return; }
  if (state === STATES.RESULT) { if (performance.now() - overAt > 800) nextRace(); return; }
  G.hint = 0; (e.clientX < W / 2 ? inp.l : inp.r).add(e.pointerId);
});
const rel = e => { inp.l.delete(e.pointerId); inp.r.delete(e.pointerId); };
cv.addEventListener('pointerup', rel); cv.addEventListener('pointercancel', rel); addEventListener('blur', () => { inp.l.clear(); inp.r.clear(); inp.kl = inp.kr = 0; });
addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') inp.kl = 1; else if (c === 'ArrowRight' || c === 'KeyD') inp.kr = 1;
  else if ((c === 'Space' || c === 'Enter') && !e.repeat) { audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 800) startGame(); else if (state === STATES.RESULT && performance.now() - overAt > 800) nextRace(); }
  else return;
  if (G) G.hint = 0; e.preventDefault();
});
addEventListener('keyup', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') inp.kl = 0; else if (c === 'ArrowRight' || c === 'KeyD') inp.kr = 0; });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) {
  ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col;
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; }
function poly(x1, y1, w1, x2, y2, w2, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x1 - w1, y1); ctx.lineTo(x2 - w2, y2); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x1 + w1, y1); ctx.closePath(); ctx.fill(); }
function car(x, y, w, col, rot, flame, brake) {
  const h = w * 0.62; ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(0, 2, w * 0.62, w * 0.13, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#14141a'; ctx.fillRect(-w * 0.5, -h * 0.3, w * 0.15, h * 0.32); ctx.fillRect(w * 0.35, -h * 0.3, w * 0.15, h * 0.32);
  const bg = ctx.createLinearGradient(0, -h * 0.65, 0, -h * 0.12); bg.addColorStop(0, shade(col, 1.2)); bg.addColorStop(1, shade(col, 0.7)); ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w * 0.5, -h * 0.64, w, h * 0.5, w * 0.09); ctx.fill();
  ctx.fillStyle = shade(col, 0.82); ctx.beginPath(); ctx.moveTo(-w * 0.38, -h * 0.6); ctx.lineTo(-w * 0.27, -h * 1.0); ctx.lineTo(w * 0.27, -h * 1.0); ctx.lineTo(w * 0.38, -h * 0.6); ctx.fill();
  ctx.fillStyle = '#0f1f30'; ctx.beginPath(); ctx.moveTo(-w * 0.31, -h * 0.64); ctx.lineTo(-w * 0.23, -h * 0.94); ctx.lineTo(w * 0.23, -h * 0.94); ctx.lineTo(w * 0.31, -h * 0.64); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(-w * 0.28, -h * 0.66); ctx.lineTo(-w * 0.2, -h * 0.92); ctx.lineTo(-w * 0.08, -h * 0.92); ctx.lineTo(-w * 0.16, -h * 0.66); ctx.fill();
