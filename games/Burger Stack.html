<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burger Stack</title>
<style>
:root{--bg:#3a1e12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a1e12}}
:root[data-theme="dark"]{--bg:#3a1e12}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2;
const ING = {
  bunB: { n: 'BOTTOM BUN', h: 0.24, c: '#e8a850' }, patty: { n: 'PATTY', h: 0.17, c: '#6a3418' }, cheese: { n: 'CHEESE', h: 0.06, c: '#ffc82a' }, lettuce: { n: 'LETTUCE', h: 0.07, c: '#5ad04a' },
  tomato: { n: 'TOMATO', h: 0.08, c: '#e8402a' }, onion: { n: 'ONION', h: 0.07, c: '#d8a8e8' }, pickle: { n: 'PICKLE', h: 0.07, c: '#6aa83a' }, bacon: { n: 'BACON', h: 0.06, c: '#d85a4a' }, bunT: { n: 'TOP BUN', h: 0.44, c: '#f0b45a' }
};
const MID = ['patty', 'cheese', 'lettuce', 'tomato', 'onion', 'pickle', 'bacon'], BAD = ['rotten', 'boot'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('burgerstack.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop(), bestServed = parseInt(store.get('burgerstack.served') || '0', 10) || 0;
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('burgerstack.top5', JSON.stringify(top5)); return top5.indexOf(s); }

/* ---------- canvas ---------- */
let W, H, dpr, safeTop = 0, IW = 80, PY = 0;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0; IW = Math.min(W * 0.2, H * 0.12, 120); PY = H * 0.86; }
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null, snd = {};
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(type, f0, f1, dur, vol, delay) { const a = audio(); if (!a) return; try { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03); } catch (e) {} }
const th = (k, ms) => { const n = performance.now(); if (n - (snd[k] || 0) < ms) return false; snd[k] = n; return true; };
const sfx = {
  catch(n) { const b = 400 * Math.pow(1.0595, Math.min(n, 12) * 2); tone('triangle', b, b * 1.5, 0.1, 0.12); }, wrong() { tone('square', 220, 160, 0.12, 0.08); }, bad() { tone('sawtooth', 160, 60, 0.3, 0.14); },
  serve() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.14, 0.12, i * 0.07)); }, bell() { tone('sine', 1500, 1500, 0.4, 0.1); tone('sine', 2250, 2250, 0.4, 0.05); }, crash() { tone('sawtooth', 200, 40, 0.5, 0.15); },
  miss() { if (th('m', 120)) tone('sine', 300, 200, 0.08, 0.04); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }, warn() { if (th('w', 400)) tone('square', 700, 700, 0.08, 0.05); }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, drag = null;
const keys = { l: 0, r: 0 };
function newOrder() { const g = G, n = 2 + Math.min(g.level, 5) + Math.floor(Math.random() * 2), mid = []; mid.push('patty'); for (let i = 1; i < n; i++) mid.push(MID[Math.floor(Math.random() * MID.length)]); g.order = ['bunB', ...mid, 'bunT']; g.pos = 0; g.stack = []; g.T = 12 + 2.4 * g.order.length - Math.min(g.level, 8) * 0.6; g.timer = g.T; g.mess = 0; g.collapse = null; }
function newGame() { G = { score: 0, lives: 3, combo: 0, maxCombo: 0, served: 0, level: 0, px: W / 2, tx: W / 2, pv: 0, pa: 0, sway: 0, swayV: 0, items: [], parts: [], pops: [], spawnT: 1, t: 0, shake: 0, rank: -1, over: false, hint: true, order: [], stack: [], pos: 0, timer: 20, T: 20, mess: 0, collapse: null, flash: 0, serveT: 0, fall: [] }; newOrder(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) { raf = requestAnimationFrame(frame); const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(now); }
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); drag = null; keys.l = keys.r = 0; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */
const pop = (t, col, x, y, big) => G.pops.push({ t, col, x, y, life: big ? 1.4 : 0.9, big: !!big });
function burst(x, y, n, cols) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = 80 + Math.random() * 220; if (G.parts.length < 200) G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.5 + Math.random() * 0.5, max: 1, col: cols[i % cols.length], sz: 3 + Math.random() * 3 }); } }
const ih = t => (ING[t] ? ING[t].h : 0.2) * IW;
function stackGeom() { const g = G, out = []; let y = PY - IW * 0.08, off = 0; for (let i = 0; i < g.stack.length; i++) { const s = g.stack[i]; off += s.off; const shear = g.sway * (PY - y); const x = g.px + off + shear; y -= ih(s.t); out.push({ t: s.t, x, y: y + ih(s.t) * 0.5, h: ih(s.t) }); } return { layers: out, topX: out.length ? out[out.length - 1].x : g.px, topY: y, off, shear: out.length ? g.sway * (PY - y) : 0 }; }
function spawnItem() {
  const g = G, lv = g.level, r = Math.random(), need = g.order[g.pos]; let type, bad = false;
  const badP = Math.min(0.3, 0.12 + 0.02 * lv); if (r < badP) { type = BAD[Math.floor(Math.random() * BAD.length)]; bad = true; } else if (r < badP + 0.42) type = need; else if (r < badP + 0.74) { const c = g.order.filter(t => t !== need); type = c.length ? c[Math.floor(Math.random() * c.length)] : need; } else type = MID[Math.floor(Math.random() * MID.length)];
  const topX = stackGeom().topX; const x = Math.random() < 0.35 ? clamp(topX + (Math.random() - .5) * IW * 2.2, IW * 0.6, W - IW * 0.6) : IW * 0.6 + Math.random() * (W - IW * 1.2);
  g.items.push({ t: type, x, y: safeTop + 120, vy: 150 + lv * 12 + Math.random() * 30, rot: (Math.random() - .5) * 0.5, vr: (Math.random() - .5) * 2, bad, ph: Math.random() * 6, dead: false });
}
function collapseStack(why) {
  const g = G; if (g.collapse) return; const geo = stackGeom(); g.collapse = { t: 0, layers: geo.layers.map(l => ({ t: l.t, x: l.x, y: l.y, vx: (Math.random() - .5) * 260 + g.sway * 400, vy: -100 - Math.random() * 160, rot: 0, vr: (Math.random() - .5) * 8 })) }; g.stack = []; g.lives--; g.combo = 0; g.shake = 1; sfx.crash(); pop(why, '#ff8a6a', g.px, PY - IW * 1.4, true);
  if (g.lives <= 0) { g.over = true; g.rank = saveTop(Math.floor(g.score)); g.overDelay = 1.3; sfx.over(); } else { g.flash = 0; g.pos = 0; g.timer = Math.max(g.timer, g.T * 0.6); g.mess = 1; }
}
function land(it) {
  const g = G, geo = stackGeom(), need = g.order[g.pos];
  if (it.bad) { g.score = Math.max(0, g.score - 40); g.combo = 0; g.mess++; g.swayV += (it.x > geo.topX ? 1 : -1) * 0.6; it.dead = true; burst(it.x, geo.topY, 12, ['#6aaa3a', '#8a6a2a']); sfx.bad(); pop('YUCK! -40', '#9ae86a', it.x, geo.topY - 20, false); return; }
  if (it.t !== need) { it.dead = true; g.score = Math.max(0, g.score - 10); g.combo = 0; g.mess++; sfx.wrong(); pop('WRONG! -10', '#ffb08a', it.x, geo.topY - 20, false); g.fall.push({ t: it.t, x: it.x, y: geo.topY, vx: (it.x > geo.topX ? 1 : -1) * 140, vy: -180, rot: 0, vr: 5, life: 1.2 }); return; }
  it.dead = true; const off = clamp(it.x - geo.topX, -IW * 0.35, IW * 0.35) * 0.75; g.stack.push({ t: it.t, off: g.stack.length ? off : 0 }); g.pos++; g.score += 20; sfx.catch(g.pos); g.swayV += (it.x - geo.topX) * 0.0016; burst(it.x, geo.topY, 6, [ING[it.t].c, '#fff']);
  if (Math.abs(off) > IW * 0.2 && g.stack.length > 1) { pop('SLOPPY', '#ffd08a', it.x, geo.topY - 30, false); g.mess++; }
  if (g.pos >= g.order.length) serve();
}
function serve() {
  const g = G, perfect = g.mess === 0, len = g.order.length, spd = clamp(g.timer / g.T, 0, 1); if (perfect) { g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo); } else g.combo = 0;
  const cm = 1 + 0.15 * Math.min(g.combo - (perfect ? 1 : 0), 8), pts = Math.round((50 * len + 120 * spd) * (perfect ? 1.5 : 1) * cm); g.score += pts; g.served++; g.level = Math.floor(g.served / 2); if (g.served > bestServed) { bestServed = g.served; store.set('burgerstack.served', String(g.served)); }
  sfx.serve(); sfx.bell(); burst(g.px, PY - IW * 2, 40, ['#ffd24a', '#ff7a4a', '#fff', '#5ad04a']); pop((perfect ? 'PERFECT BURGER! ' : 'SERVED! ') + '+' + pts, perfect ? '#fff3a0' : '#ffe0a0', W / 2, PY - IW * 2.4, true); if (g.combo > 1) pop('COMBO x' + cm.toFixed(2), '#ff9a4a', W / 2, PY - IW * 3, false);
  g.serveT = 0.9; g.stack = []; g.collapse = null; newOrder(); g.spawnT = 0.5;
}
function update(dt) {
  const g = G; g.t += dt; g.shake = Math.max(0, g.shake - dt * 2.5); g.serveT = Math.max(0, g.serveT - dt);
  for (let i = g.parts.length - 1; i >= 0; i--) { const q = g.parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 560 * dt; if (q.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.pops.length - 1; i >= 0; i--) { g.pops[i].life -= dt; g.pops[i].y -= dt * 34; if (g.pops[i].life <= 0) g.pops.splice(i, 1); }
  for (let i = g.fall.length - 1; i >= 0; i--) { const f = g.fall[i]; f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * dt; f.rot += f.vr * dt; if (f.life <= 0) g.fall.splice(i, 1); }
  if (g.collapse) { const c = g.collapse; c.t += dt; for (const l of c.layers) { l.x += l.vx * dt; l.y += l.vy * dt; l.vy += 1000 * dt; l.rot += l.vr * dt; } if (c.t > 1.4) g.collapse = null; }
  if (state === STATES.START) { g.tx = W / 2 + Math.sin(g.t * 1.2) * W * 0.18; }
  if (g.over && g.collapse === null && g.overDelay !== undefined) { g.overDelay -= dt; } if (g.over) { g.overDelay -= dt; if (g.overDelay <= 0 && state === STATES.PLAYING) { state = STATES.GAMEOVER; overAt = performance.now(); } }
  const kx = keys.r - keys.l; if (kx && state === STATES.PLAYING) g.tx = clamp(g.tx + kx * dt * W * 1.1, IW, W - IW);
  const old = g.pv; const acc = ((g.tx - g.px) * 70 - g.pv * 16); g.pv += acc * dt; g.px += g.pv * dt; g.pa = (g.pv - old) / Math.max(dt, 0.001);
  g.swayV += (-26 * g.sway - 4 * g.swayV - g.pa * 0.0003) * dt; g.sway += g.swayV * dt; const geo = stackGeom();
  if (state === STATES.START) { for (let i = g.items.length - 1; i >= 0; i--) g.items.splice(i, 1); return; }
  if (g.over) return;
  g.timer -= dt; if (g.timer < 5 && g.timer > 0) sfx.warn(); if (g.timer <= 0) { g.lives--; g.combo = 0; g.shake = 0.8; sfx.crash(); pop('ORDER EXPIRED!', '#ff8a6a', W / 2, PY - IW * 2, true); if (g.lives <= 0) { g.over = true; g.rank = saveTop(Math.floor(g.score)); g.overDelay = 1.1; sfx.over(); } else { const lay = stackGeom().layers; if (lay.length) g.collapse = { t: 0, layers: lay.map(l => ({ t: l.t, x: l.x, y: l.y, vx: (Math.random() - .5) * 200, vy: -120, rot: 0, vr: (Math.random() - .5) * 6 })) }; newOrder(); } return; }
  if (g.stack.length >= 3 && (Math.abs(geo.shear) > IW * 0.62 || Math.abs(geo.off) > IW * 0.85)) { collapseStack(Math.abs(geo.shear) > IW * 0.62 ? 'TOO WOBBLY!' : 'TOO LOPSIDED!'); return; }
  g.spawnT -= dt; if (g.spawnT <= 0) { g.spawnT = Math.max(0.42, 0.95 - g.level * 0.04) * (0.8 + Math.random() * 0.4); spawnItem(); }
  for (const it of g.items) { it.y += it.vy * dt; it.rot += it.vr * dt * 0.4; it.ph += dt * 4; const gm = stackGeom(), top = gm.topY, hw = IW * 0.5 + IW * 0.32, half = ih(it.t) * 0.5; if (!it.dead && it.y + half >= top && it.y - half <= top + IW * 0.3 && Math.abs(it.x - gm.topX) < hw) { land(it); if (state !== STATES.PLAYING || g.over) break; } else if (!it.dead && it.y > H + 40) { it.dead = true; if (g.order[g.pos] === it.t && !it.bad) sfx.miss(); } }

}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); G.tx = clamp(e.clientX, IW, W - IW); drag = e.pointerId; G.hint = false; return; } if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 900) startGame(); return; }
  drag = e.pointerId; G.tx = clamp(e.clientX, IW, W - IW); G.hint = false;
});
cv.addEventListener('pointermove', e => { if (state === STATES.PLAYING && (drag === e.pointerId || e.pointerType === 'mouse')) G.tx = clamp(e.clientX, IW, W - IW); });
const rel = e => { if (drag === e.pointerId) drag = null; };
cv.addEventListener('pointerup', rel); cv.addEventListener('pointercancel', rel); addEventListener('blur', () => { drag = null; keys.l = keys.r = 0; });
addEventListener('keydown', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 1; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 1; else if ((c === 'Space' || c === 'Enter') && !e.repeat) { audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); } else return; e.preventDefault(); });
addEventListener('keyup', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 0; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 0; });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) { ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col; ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }
function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; };
function item(t, x, y, w, rot, now) {
  const rx = w * 0.5, ry = rx * 0.32, h = (ING[t] ? ING[t].h : 0.2) * w; ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);

  else if (t === 'patty') { ell(0, h * 0.2, rx * 0.97, ry, '#3a1a08'); ctx.fillStyle = '#5a2c12'; ctx.fillRect(-rx * 0.97, -h * 0.3, rx * 1.94, h * 0.5); ell(0, -h * 0.3, rx * 0.97, ry, '#7a3e1c'); ctx.strokeStyle = 'rgba(30,10,0,0.55)'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * rx * 0.4 - rx * 0.2, -h * 0.3 - ry * 0.6); ctx.lineTo(i * rx * 0.4 + rx * 0.2, -h * 0.3 + ry * 0.6); ctx.stroke(); } }
  else if (t === 'cheese') { ctx.fillStyle = '#e8a800'; ctx.beginPath(); ctx.moveTo(-rx * 1.1, 0); ctx.lineTo(0, ry * 1.1); ctx.lineTo(rx * 1.1, 0); ctx.lineTo(0, -ry * 1.1 + h); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.moveTo(-rx * 1.1, -h * 0.3); ctx.lineTo(0, ry * 1.0 - h * 0.3); ctx.lineTo(rx * 1.1, -h * 0.3); ctx.lineTo(0, -ry * 1.1 - h * 0.3); ctx.closePath(); ctx.fill(); }
  else if (t === 'lettuce') { ctx.fillStyle = '#3a9a30'; ctx.beginPath(); for (let i = 0; i <= 16; i++) { const a = i / 16 * TAU, r = 1.1 + 0.08 * Math.sin(i * 3); ctx.lineTo(Math.cos(a) * rx * r, Math.sin(a) * ry * r + h * 0.3); } ctx.fill(); ctx.fillStyle = '#6ae85a'; ctx.beginPath(); for (let i = 0; i <= 16; i++) { const a = i / 16 * TAU, r = 1.1 + 0.08 * Math.sin(i * 3); ctx.lineTo(Math.cos(a) * rx * r, Math.sin(a) * ry * r - h * 0.2); } ctx.fill(); }
  else if (t === 'tomato') { ell(0, h * 0.2, rx * 0.95, ry, '#a82a1a'); ctx.fillStyle = '#d83a22'; ctx.fillRect(-rx * 0.95, -h * 0.3, rx * 1.9, h * 0.5); ell(0, -h * 0.3, rx * 0.95, ry, '#f4553a'); ell(-rx * 0.3, -h * 0.3, rx * 0.12, ry * 0.3, '#ffd0a0'); ell(rx * 0.25, -h * 0.3, rx * 0.12, ry * 0.3, '#ffd0a0'); }
  else if (t === 'onion') { ell(0, 0, rx * 0.9, ry, '#b878d0'); ctx.strokeStyle = '#f4e0fa'; ctx.lineWidth = 2; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.ellipse(0, -h * 0.2, rx * 0.9 * i / 4, ry * i / 4, 0, 0, TAU); ctx.stroke(); } }
