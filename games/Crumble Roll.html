<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crumble Roll</title>
<style>
:root{--bg:#1c1840}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1840}}
:root[data-theme="dark"]{--bg:#1c1840}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, COLS = 7, BR = 0.3, DEPTH = 0.5, CAMY = 9, CAMZ = -7, CA = Math.cos(Math.atan2(9, 7)), SA = Math.sin(Math.atan2(9, 7)), MAXTILT = 0.22;
const THEMES = [
  { sky: ['#2a1b6e', '#ff9ec7'], a: '#ff7eb3', b: '#ff9dc8', side: '#c2487f', ice: '#bff0ff', name: 'CANDY' },
  { sky: ['#06223d', '#34d1c4'], a: '#2fbfa6', b: '#43d6bb', side: '#17806f', ice: '#d8fbff', name: 'LAGOON' },
  { sky: ['#2b0d2e', '#ff8a3a'], a: '#ff9a4a', b: '#ffb36a', side: '#b8531a', ice: '#ffe9c4', name: 'SUNSET' },
  { sky: ['#0a0f2e', '#7a5cff'], a: '#8a6cff', b: '#a28aff', side: '#4a35b8', ice: '#d4ccff', name: 'COSMOS' }
];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('crumbleroll.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop(), bestLv = parseInt(store.get('crumbleroll.lv') || '0', 10) || 0;
function saveTop(s, lv) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('crumbleroll.top5', JSON.stringify(top5)); if (lv > bestLv) { bestLv = lv; store.set('crumbleroll.lv', String(lv)); } return top5.indexOf(s); }
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- canvas ---------- */
let W, H, dpr, F, CY, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0; F = Math.min(W, H * 0.62) * 1.62; CY = H * 0.57;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  coin(c) { const b = 780 * Math.pow(1.0595, Math.min(c, 10) * 2); tone('triangle', b, b * 1.5, 0.1, 0.12); },
  crumble() { tone('square', 220, 120, 0.05, 0.03); }, pad() { tone('sawtooth', 200, 700, 0.25, 0.1); },
  fall() { tone('sine', 800, 90, 0.7, 0.12); }, zap() { tone('sawtooth', 700, 80, 0.3, 0.14); },
  clear() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.16, 0.12, i * 0.08)); },
  over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- level generation ---------- */
function genLevel(level) {
  const rnd = mulberry(1000 + level * 7919), rows = Math.min(34, 12 + 2 * level), tiles = Array.from({ length: rows }, () => Array(COLS).fill(null));
  const baseW = level < 2 ? 3 : level < 5 ? 2 : (level % 2 ? 2 : 1); let c = 3;
  for (let r = 0; r < rows; r++) {
    let nc = c; if (r > 0 && r < rows - 1 && rnd() < 0.45) nc = clamp(c + (rnd() < 0.5 ? -1 : 1), 1, COLS - 2);
    const w = r === 0 ? 3 : Math.max(1, baseW + (rnd() < 0.25 ? 1 : 0) - (rnd() < 0.15 ? 1 : 0)), lo = Math.min(c, nc) - Math.floor((w - 1) / 2), hi = Math.max(c, nc) + Math.ceil((w - 1) / 2), row = [];
    for (let x = Math.max(0, lo); x <= Math.min(COLS - 1, hi); x++) {
      let k = 'n';
      if (r === 0) k = 'start'; else if (r === rows - 1 && x === nc) k = 'goal';
      else if (r > 2 && r < rows - 1) { const q = rnd(); if (level >= 2 && q < 0.04 + 0.015 * level) k = 'spike'; else if (q < 0.1 + 0.025 * level) k = level >= 1 ? 'ice' : 'n'; else if (q < 0.13 + 0.025 * level) k = 'pad'; }
      tiles[r][x] = { k, st: 0, t: 0, fall: 0, coin: k !== 'spike' && k !== 'start' && k !== 'goal' && rnd() < 0.27, off: rnd() * 2, got: false, sh: 0 }; row.push(tiles[r][x]);
    }
    if (r > 0 && row.length && row.every(t => t.k === 'spike')) row[0].k = 'n';
    c = nc;

}

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, joy = null;
const keys = { l: 0, r: 0, u: 0, d: 0 };
const clouds = Array.from({ length: 8 }, () => ({ x: Math.random(), y: Math.random() * 0.5, s: 0.6 + Math.random(), v: 0.004 + Math.random() * 0.01 }));
function loadLevel() {
  const g = G, L = genLevel(g.level); g.rows = L.rows; g.tiles = L.tiles; g.ct = L.ct;
  g.bx = 3.5; g.bz = 0.5; g.by = BR; g.vx = 0; g.vz = 0; g.vy = 0; g.fx = g.bx; g.fz = g.bz; g.falling = false; g.tx = 0; g.tz = 0; g.lt = 0; g.moved = false; g.combo = 0; g.comboT = 0; g.coins = 0; g.phase = 'play'; g.pt = 0; g.trail = []; g.parts = []; g.popups = []; g.shake = 0; g.padCd = 0;
}
function newGame() { G = { level: 0, score: 0, lvScore: 0, lives: 3, tiltX: 0, tiltZ: 0, t: 0, hint: 6, rank: -1, over: false }; loadLevel(); }
newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(now);
}
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); joy = null; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */

  const g = G; if (g.phase !== 'play') return; g.lives--; g.phase = 'dead'; g.pt = 1.1; g.why = why; g.shake = 0.7; g.combo = 0; sfx.fall();
  if (g.lives <= 0) { g.over = true; state = STATES.GAMEOVER; g.rank = saveTop(Math.floor(g.score), g.level + 1); overAt = performance.now(); sfx.over(); }
}
function solidAt(x, z) { const t = tileAt(Math.floor(x), Math.floor(z)); return !!t; }
function physics(dt) {
  const g = G, A = 11;
  const t = tileAt(Math.floor(g.bx), Math.floor(g.bz)), fric = t && t.k === 'ice' ? 0.35 : 1.8;

    g.vx += g.tiltX * A * dt; g.vz += g.tiltZ * A * dt; const k = Math.exp(-fric * dt); g.vx *= k; g.vz *= k;
    const sp = Math.hypot(g.vx, g.vz); if (sp > 6.5) { g.vx *= 6.5 / sp; g.vz *= 6.5 / sp; }
    g.bx += g.vx * dt; g.bz += g.vz * dt;
    const c = solidAt(g.bx, g.bz), r = 0.26; let n = 0; for (const [ox, oz] of [[r, 0], [-r, 0], [0, r], [0, -r]]) if (solidAt(g.bx + ox, g.bz + oz)) n++;
    if (!(c || n >= 2)) { g.falling = true; g.vy = 0; }
  } else { g.vy -= 22 * dt; g.by += g.vy * dt; g.bx += g.vx * dt * 0.6; g.bz += g.vz * dt * 0.6; if (g.by < -5) loseLife('FELL!'); }
}
function update(dt) {
  const g = G; g.t += dt;
  for (const c of clouds) { c.x -= c.v * dt; if (c.x < -0.2) c.x = 1.2; }
  for (let i = g.parts.length - 1; i >= 0; i--) { const p = g.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 9 * dt; if (p.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.popups.length - 1; i >= 0; i--) { const p = g.popups[i]; p.life -= dt; p.y += dt * 0.8; if (p.life <= 0) g.popups.splice(i, 1); }
  g.shake = Math.max(0, g.shake - dt * 2.5);
  if (state === STATES.START) { g.fx = 3.5 + Math.sin(g.t * 0.5) * 0.4; g.fz = 3 + g.t * 0.35 % 6; g.tiltX = Math.sin(g.t * 0.7) * 0.4; g.tiltZ = Math.cos(g.t * 0.5) * 0.3; return; }
  if (g.phase === 'clear') { g.pt -= dt; g.tiltX *= 0.9; g.tiltZ *= 0.9; if (g.pt <= 0) { g.level++; loadLevel(); g.lvScore = g.score; } return; }
  if (g.phase === 'dead') { g.pt -= dt; g.tiltX *= 0.9; g.tiltZ *= 0.9; if (g.falling && g.by > -5.5) physics(dt); if (g.pt <= 0 && state === STATES.PLAYING) { g.score = g.lvScore; loadLevel(); } return; }

  if (ct && !g.falling) {
    if (ct.st === 0 && ct.k !== 'start' && ct.k !== 'goal') { ct.st = 1; ct.t = g.ct; sfx.crumble(); }
    if (ct.coin && !ct.got) { ct.got = true; g.coins++; g.combo++; g.comboT = 1.6; const p = 10 * Math.min(5, g.combo); g.score += p; sfx.coin(g.combo); pop('+' + p, '#ffe24a', g.bx, g.bz); burst(g.bx, 0.5, g.bz, 8, ['#ffe24a', '#fff'], 2); }
    if (ct.k === 'pad' && g.padCd <= 0) { g.padCd = 0.6; g.vz += 5.5; sfx.pad(); pop('BOOST', '#ffd84a', g.bx, g.bz); }
    if (ct.k === 'spike') { const ph = (g.t + ct.off) % 2; if (ph < 0.9) { burst(g.bx, 0.3, g.bz, 14, ['#ff6a6a', '#fff'], 3); sfx.zap(); loseLife('SPIKED!'); return; } }
    if (ct.k === 'goal' && Math.abs(g.bx - Math.floor(g.bx) - 0.5) < 0.45) {
      const bonus = 100 * (g.level + 1) + Math.max(0, Math.round((g.rows * 1.1 - g.lt) * 10)); g.score += bonus; g.phase = 'clear'; g.pt = 2; g.bonus = bonus; sfx.clear(); burst(g.bx, 0.5, g.bz, 40, ['#ffe24a', '#ff7eb3', '#7ae3ff', '#fff'], 4); const s = Math.floor(g.score); if (g.level + 1 > bestLv) { bestLv = g.level + 1; store.set('crumbleroll.lv', String(bestLv)); } return;

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 900) startGame(); return; }
  if (!joy) joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', e => { if (joy && joy.id === e.pointerId) { joy.x = e.clientX; joy.y = e.clientY; } });
const rel = e => { if (joy && joy.id === e.pointerId) joy = null; };
cv.addEventListener('pointerup', rel); cv.addEventListener('pointercancel', rel); addEventListener('blur', () => { joy = null; keys.l = keys.r = keys.u = keys.d = 0; });
addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 1; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 1; else if (c === 'ArrowUp' || c === 'KeyW') keys.u = 1; else if (c === 'ArrowDown' || c === 'KeyS') keys.d = 1;
  else if ((c === 'Space' || c === 'Enter') && !e.repeat) { audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); }
  else return;
  e.preventDefault();
});
addEventListener('keyup', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 0; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 0; else if (c === 'ArrowUp' || c === 'KeyW') keys.u = 0; else if (c === 'ArrowDown' || c === 'KeyS') keys.d = 0; });

/* ---------- 3D projection ---------- */
let cPhi = 1, sPhi = 0, cTh = 1, sTh = 0, FX = 0, FZ = 0;

  const X = x - FX, Z = z - FZ, x1 = X * cPhi - y * sPhi, y1 = X * sPhi + y * cPhi, y2 = y1 * cTh - Z * sTh, z2 = y1 * sTh + Z * cTh;

function quad(a, b, c, d, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill(); }
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; };

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) {

  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
