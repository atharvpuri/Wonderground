<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wizard Swarm</title>
<style>
:root{--bg:#10241a}

#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, ARENA = 720, BOSS_T = 150, YT = 0.82;

/* ---------- canvas ---------- */
let W, H, dpr, S, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0; S = Math.min(W, H) / 480;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
const X = x => W / 2 + (x - G.cx) * S, Y = y => H * 0.54 + (y - G.cy) * S * YT;

/* ---------- audio ---------- */

  shoot() { if (th('s', 90)) tone('triangle', 700, 400, 0.07, 0.05); }, hit() { if (th('h', 50)) tone('square', 200, 120, 0.05, 0.04); }, die() { if (th('d', 40)) tone('sine', 300, 90, 0.1, 0.07); },
  gem() { if (th('g', 40)) tone('triangle', 900 + Math.random() * 300, 1500, 0.07, 0.06); }, zap() { if (th('z', 80)) tone('sawtooth', 900, 120, 0.15, 0.07); }, nova() { tone('sawtooth', 200, 50, 0.4, 0.12); },
  axe() { if (th('a', 150)) tone('sine', 300, 500, 0.12, 0.06); }, hurt() { if (th('u', 100)) { tone('sawtooth', 160, 60, 0.2, 0.14); } }, lvl() { [523, 659, 784, 1046].forEach((n, i) => tone('triangle', n, n, 0.14, 0.12, i * 0.07)); },
  boss() { tone('sawtooth', 100, 60, 1.0, 0.16); tone('square', 80, 50, 1.0, 0.1, 0.1); }, win() { [523, 659, 784, 1046, 1318, 1568].forEach((n, i) => tone('triangle', n, n, 0.18, 0.12, i * 0.09)); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, pick() { tone('triangle', 500, 900, 0.12, 0.1); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- definitions ---------- */
const WEAPONS = {
  missile: { n: 'Magic Missile', c: '#7ad8ff', d: l => ['Fires bolts at the nearest foe', '+25% damage', '+1 bolt, faster', 'Bolts pierce 2 foes', 'Triple volley'][l - 1] || '' },
  orbit: { n: 'Rune Guard', c: '#ffd24a', d: l => ['Runes orbit and burn foes', '+1 rune', '+1 rune, more damage', '+1 rune, wider orbit', '+1 rune, max power'][l - 1] || '' },
  bolt: { n: 'Chain Lightning', c: '#c9a8ff', d: l => ['Strikes random nearby foes', '+1 strike', '+30% damage', '+1 strike', 'Storm: fast strikes'][l - 1] || '' },
  nova: { n: 'Fire Nova', c: '#ff7a3a', d: l => ['Blast around you every few sec', 'Bigger blast', 'Faster, stronger', 'Bigger blast', 'Inferno'][l - 1] || '' },
  axe: { n: 'Spirit Axe', c: '#9aff9a', d: l => ['Boomerang axe pierces all', '+30% damage', '+1 axe', 'Faster throws', '+1 axe, max power'][l - 1] || '' }

const PASSIVES = {
  might: { n: 'Power Ring', c: '#ff6a8a', d: '+20% damage' }, haste: { n: 'Swift Charm', c: '#ffe28a', d: '-10% cooldowns' }, speed: { n: 'Wind Boots', c: '#8affd8', d: '+10% move speed' },
  magnet: { n: 'Gem Magnet', c: '#7aa8ff', d: '+40% pickup range' }, hp: { n: 'Vital Heart', c: '#ff5a5a', d: '+25 max HP, heal' }, regen: { n: 'Life Spring', c: '#7aff7a', d: '+1 HP per second' }

const ENEMY = {
  slime: { hp: 4, spd: 42, r: 10, dmg: 8, xp: 1, col: '#5adf6a' }, bat: { hp: 3, spd: 92, r: 8, dmg: 6, xp: 1, col: '#9a6aff' }, skel: { hp: 11, spd: 58, r: 11, dmg: 10, xp: 2, col: '#e8e4d0' },
  golem: { hp: 46, spd: 30, r: 18, dmg: 16, xp: 6, col: '#a08a70' }, boss: { hp: 1100, spd: 44, r: 36, dmg: 22, xp: 0, col: '#ff4a8a' }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, ui = [], joy = null;
const keys = { l: 0, r: 0, u: 0, d: 0 };
const mx = () => G.pl.might, nowT = () => G.t;
function newGame() {
  G = { t: 0, cx: 0, cy: 0, pl: { x: 0, y: 0, hp: 100, max: 100, speed: 125, face: 1, inv: 0, lv: 1, xp: 0, might: 1, haste: 1, speedM: 1, magR: 62, regen: 0, hurt: 0, aim: 0 }, wp: [{ id: 'missile', lv: 1, t: 0.3, n: 0 }], pa: {}, en: [], pj: [], gems: [], parts: [], pops: [], fx: [], novas: [], axes: [], bolts: [], spawnT: 1, kills: 0, shake: 0, paused: false, cards: [], boss: null, bossSpawned: false, victory: false, over: false, hint: 8, rank: -1, ang: 0, score: 0, flash: 0, warn: 0 };

newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); joy = null; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */
const wlv = id => { const w = G.wp.find(w => w.id === id); return w ? w.lv : 0; };
const dmgM = () => G.pl.might;
function burst(x, y, n, col, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = (sp || 120) * (0.3 + Math.random()); if (G.parts.length < 260) G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.4, max: 0.75, col, sz: 2 + Math.random() * 2.5 }); } }
function pop(t, col, x, y, big) { if (G.pops.length < 26) G.pops.push({ t, col, x, y, life: big ? 1.2 : 0.55, big: !!big }); }
function spawnEnemy(type, x, y) { const d = ENEMY[type], sc = type === 'boss' ? 1 : 1 + G.t / 85; G.en.push({ k: type, x, y, hp: d.hp * sc * (type === 'boss' ? 1 : 1), max: d.hp * sc, r: d.r, spd: d.spd * (1 + Math.min(G.t / 400, 0.45)), dmg: d.dmg * (1 + G.t / 300), xp: d.xp, col: d.col, flash: 0, ph: Math.random() * 6, orbCd: 0, kx: 0, ky: 0, st: 0 }); return G.en[G.en.length - 1]; }
function spawnRing(type) { const R = Math.hypot(W / 2 / S, H / 2 / (S * YT)) + 50, a = Math.random() * TAU; return spawnEnemy(type, G.pl.x + Math.cos(a) * R, G.pl.y + Math.sin(a) * R); }
function hurtEnemy(e, d, kb, kx, ky) { if (e.hp <= 0) return; e.hp -= d; e.flash = 0.1; pop(String(Math.round(d)), '#fff', e.x, e.y - e.r, false); sfx.hit(); if (kb) { e.kx += kx * kb; e.ky += ky * kb; } if (e.hp <= 0) killEnemy(e); }
function killEnemy(e) {
  G.kills++; G.score += 10; sfx.die(); burst(e.x, e.y, e.k === 'boss' ? 60 : 10, e.col, e.k === 'boss' ? 300 : 130);
  if (e.k === 'boss') { G.victory = true; for (let i = 0; i < 24; i++) G.gems.push({ x: e.x + rr(-60, 60), y: e.y + rr(-60, 60), v: 8, t: 0 }); G.flash = 1; endGame(true); return; }
  G.gems.push({ x: e.x, y: e.y, v: e.xp, t: 0 }); if (e.k === 'skel' && Math.random() < 0.05) G.gems.push({ x: e.x + 8, y: e.y, v: -1, t: 0 });
}
function nearest(x, y, maxD) { let b = null, bd = maxD || 1e9; for (const e of G.en) { if (e.hp <= 0) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; b = e; } } return b; }
function cardPool() {
  const pool = []; for (const id in WEAPONS) { const l = wlv(id); if (l === 0 && G.wp.length < 4) pool.push({ k: 'w', id, lv: 1, new: true }); else if (l > 0 && l < 5) pool.push({ k: 'w', id, lv: l + 1 }); }
  for (const id in PASSIVES) { const l = G.pa[id] || 0; if (l < 5) pool.push({ k: 'p', id, lv: l + 1 }); } return pool;
}
function levelUp() {
  const g = G, p = g.pl, need = 4 + (p.lv - 1) * 3; p.lv++; p.xp -= need; sfx.lvl(); const pool = cardPool(), cards = []; while (cards.length < 3 && pool.length) cards.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  if (!cards.length) { p.hp = Math.min(p.max, p.hp + 30); return; } g.cards = cards; g.paused = true; joy = null; keys.l = keys.r = keys.u = keys.d = 0;
}
function pick(c) {
  const g = G, p = g.pl; sfx.pick();
  if (c.k === 'w') { const w = g.wp.find(w => w.id === c.id); if (w) w.lv++; else g.wp.push({ id: c.id, lv: 1, t: 0.2, n: 0 }); }
  else { g.pa[c.id] = c.lv; if (c.id === 'might') p.might = 1 + 0.2 * c.lv; else if (c.id === 'haste') p.haste = Math.pow(0.9, c.lv); else if (c.id === 'speed') p.speedM = 1 + 0.1 * c.lv; else if (c.id === 'magnet') p.magR = 62 * (1 + 0.4 * c.lv); else if (c.id === 'hp') { p.max += 25; p.hp = Math.min(p.max, p.hp + 25); } else if (c.id === 'regen') p.regen = c.lv; }

  if (tsec > bestTime) { bestTime = tsec; store.set('wizardswarm.time', String(tsec)); } if (victory) { wins++; store.set('wizardswarm.wins', String(wins)); } victory ? sfx.win() : sfx.over(); g.overDelay = 0.9; g.shake = 1;
}
function fireWeapons(dt) {

    w.t -= dt; const L = w.lv;
    if (w.id === 'missile') {
      if (w.t <= 0) { w.t = 0.95 * hs * (L >= 3 ? 0.85 : 1); const tgt = nearest(p.x, p.y, 420), a0 = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : (p.face > 0 ? 0 : Math.PI), n = L >= 5 ? 3 : L >= 3 ? 2 : 1; for (let i = 0; i < n; i++) { const a = a0 + (i - (n - 1) / 2) * 0.16; g.pj.push({ x: p.x, y: p.y, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, d: 6 * (1 + 0.25 * (L - 1)) * dmgM(), pierce: L >= 4 ? 2 : 1, life: 1.3 }); } sfx.shoot(); }
    } else if (w.id === 'orbit') { w.n = L + 1; }

    } else if (w.id === 'nova') {
      if (w.t <= 0) { w.t = Math.max(1.6, 4.2 - 0.4 * L) * hs; g.novas.push({ x: p.x, y: p.y, r: 8, max: 95 + 15 * L, d: 14 * (1 + 0.3 * (L - 1)) * dmgM(), hit: new Set() }); sfx.nova(); g.shake = Math.max(g.shake, 0.25); }
    } else if (w.id === 'axe') {

    }
  }
}
function update(dt) {
  const g = G; g.t += state === STATES.PLAYING && !g.paused && !g.over ? dt : 0;
  for (let i = g.parts.length - 1; i >= 0; i--) { const q = g.parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; if (q.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.pops.length - 1; i >= 0; i--) { g.pops[i].life -= dt; g.pops[i].y -= dt * 24; if (g.pops[i].life <= 0) g.pops.splice(i, 1); }
  for (let i = g.bolts.length - 1; i >= 0; i--) { g.bolts[i].life -= dt; if (g.bolts[i].life <= 0) g.bolts.splice(i, 1); }
  g.shake = Math.max(0, g.shake - dt * 2.5); g.flash = Math.max(0, g.flash - dt); g.warn = Math.max(0, g.warn - dt);
  if (state === STATES.START) { g.cx += (Math.sin(g.t) * 0 + 0) * dt; return; }
  if (g.over) { g.overDelay -= dt; if (g.overDelay <= 0 && state === STATES.PLAYING) { state = STATES.GAMEOVER; overAt = performance.now(); } for (const e of g.en) { e.flash = Math.max(0, e.flash - dt); } return; }

  p.x = clamp(p.x + ix * p.speed * p.speedM * dt, -ARENA + 14, ARENA - 14); p.y = clamp(p.y + iy * p.speed * p.speedM * dt, -ARENA + 14, ARENA - 14); if (Math.abs(ix) > 0.1) p.face = ix > 0 ? 1 : -1; p.moving = m > 0.12;
  g.cx += (p.x - g.cx) * Math.min(1, dt * 8); g.cy += (p.y - g.cy) * Math.min(1, dt * 8); if (p.regen) p.hp = Math.min(p.max, p.hp + p.regen * dt);

    for (let i = 0; i < n && g.en.length < cap; i++) { const r = Math.random(); let k = 'slime'; if (t > 150 && r < 0.12) k = 'golem'; else if (t > 90 && r < 0.12) k = 'golem'; else if (t > 50 && r < 0.38) k = 'skel'; else if (t > 20 && r < 0.45) k = 'bat'; spawnRing(k); }
  }

  const grid = new Map(); for (const e of g.en) { const key = Math.floor(e.x / 30) * 1000 + Math.floor(e.y / 30); (grid.get(key) || grid.set(key, []).get(key)).push(e); }
  for (const e of g.en) {
    e.flash = Math.max(0, e.flash - dt); e.orbCd = Math.max(0, e.orbCd - dt); e.ph += dt * 6; const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1; let sx = dx / d, sy = dy / d;
    if (e.k === 'bat') { const w = Math.sin(e.ph * 0.6) * 0.8; const nx = sx * Math.cos(w) - sy * Math.sin(w), ny = sx * Math.sin(w) + sy * Math.cos(w); sx = nx; sy = ny; }
    e.x += (sx * e.spd + e.kx) * dt; e.y += (sy * e.spd + e.ky) * dt; e.kx *= 0.88; e.ky *= 0.88;
    const cx = Math.floor(e.x / 30), cy = Math.floor(e.y / 30); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const arr = grid.get((cx + a) * 1000 + (cy + b)); if (!arr) continue; for (const o of arr) { if (o === e) continue; const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), mn = (e.r + o.r) * 0.8; if (od < mn && od > 0.01) { const push = (mn - od) * 0.5; e.x += ox / od * push * 0.5; e.y += oy / od * push * 0.5; } } }
    if (d < e.r + 11 && p.inv <= 0 && e.hp > 0) { p.hp -= e.dmg; p.inv = 0.55; p.hurt = 0.3; g.shake = Math.max(g.shake, 0.5); sfx.hurt(); burst(p.x, p.y, 8, '#ff5a5a', 150); e.kx -= sx * 180; e.ky -= sy * 180; if (p.hp <= 0) { p.hp = 0; endGame(false); return; } }
    if (e.k === 'boss') { e.st += dt; if (e.st > 4) { e.st = 0; for (let i = 0; i < 5; i++) { const en = spawnEnemy('slime', e.x + rr(-40, 40), e.y + rr(-40, 40)); } } }
  }

    if (joy && state === STATES.PLAYING && !g.paused) { ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.x0, joy.y0, 55, 0, TAU); ctx.stroke(); let dx = joy.x - joy.x0, dy = joy.y - joy.y0; const m = Math.hypot(dx, dy); if (m > 55) { dx *= 55 / m; dy *= 55 / m; } ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(joy.x0 + dx, joy.y0 + dy, 22, 0, TAU); ctx.fill(); }
    if (g.hint > 0.05 && !g.paused) { const a = clamp(g.hint, 0, 1), hw2 = Math.min(W * 0.9, 380), hy = H * 0.74; ctx.fillStyle = 'rgba(8,22,16,' + 0.75 * a + ')'; ctx.beginPath(); ctx.roundRect(W / 2 - hw2 / 2, hy - 46, hw2, 92, 14); ctx.fill(); txt('Drag to move. You attack automatically!', W / 2, hy - 22, Math.min(16, W / 23), '#fff', 'bold', a); txt('Collect blue gems to level up and pick upgrades', W / 2, hy + 2, Math.min(13, W / 28), '#9affc4', 'bold', a); txt('Survive until the Slime King, then defeat him!', W / 2, hy + 26, Math.min(13, W / 28), '#ffe28a', 'bold', a); }
    if (g.warn > 0) txt('THE SLIME KING APPROACHES!', W / 2, H * 0.3, Math.min(30, W / 12), '#ff7a9a', 'bold', clamp(g.warn, 0, 1));
    if (g.paused) { ctx.fillStyle = 'rgba(4,14,10,0.78)'; ctx.fillRect(0, 0, W, H); const cw = Math.min(W * 0.92, 430), ch = 92, gap = 12, tot = 3 * ch + 2 * gap, y0 = (H - tot) / 2 + 20; txt('LEVEL UP!', W / 2, y0 - 44, Math.min(40, W / 10), '#ffe28a'); txt('Choose an upgrade', W / 2, y0 - 16, 14, '#cfeedd', 'bold', 0.9);
      g.cards.forEach((c, i) => { const y = y0 + i * (ch + gap), x = (W - cw) / 2, def = c.k === 'w' ? WEAPONS[c.id] : PASSIVES[c.id], desc = c.k === 'w' ? def.d(c.lv) : def.d; ui.push({ x, y, w: cw, h: ch, fn: () => pick(c) }); ctx.fillStyle = 'rgba(24,52,40,0.97)'; ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 14); ctx.fill(); ctx.strokeStyle = def.c; ctx.lineWidth = 2.5; ctx.stroke(); ctx.fillStyle = def.c; ctx.beginPath(); ctx.arc(x + 44, y + ch / 2, 26, 0, TAU); ctx.fill(); txt(c.k === 'w' ? '\u2694' : '\u2605', x + 44, y + ch / 2 + 1, 24, '#102010', 'bold'); txt(def.n + (c.new ? '  (NEW)' : ''), x + 86, y + 26, Math.min(18, cw / 18), '#fff', 'bold', 1, 'left'); txt(desc, x + 86, y + 52, Math.min(13, cw / 28), '#cfeedd', 'bold', 0.95, 'left'); for (let k = 0; k < 5; k++) { ctx.fillStyle = k < c.lv ? def.c : 'rgba(255,255,255,0.2)'; ctx.fillRect(x + 86 + k * 14, y + 70, 10, 5); } txt(String(i + 1), x + cw - 20, y + 20, 11, '#9acbb0', 'bold'); }); }
