<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Popcorn Panic</title>
<style>
:root{--bg:#2a1410;--fg:#fff0b8}
@media(prefers-color-scheme:dark){:root{--bg:#210f0c}}
[data-theme=cinema]{--bg:#1a0a14}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body>
<div id="probe"></div><canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
let W=360,H=640,dpr=1,safe=0,state=ST.START,raf=0,last=0,time=0,paused=false;
let SC=1,PANY=480,FLOORY=520,POTY=130,PW=96,TUBW=90,CAP=14;
const KEY='popcornPanic.v1',save={scores:[],bestCombo:0,bestBank:0};
const cn=n=>typeof n==='number'&&isFinite(n)?Math.max(0,Math.min(1e8,n|0)):0;
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.scores)){save.scores=j.scores.map(cn).filter(n=>n>0).sort((a,b)=>b-a).slice(0,5);save.bestCombo=cn(j.bestCombo);save.bestBank=cn(j.bestBank)}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const F=(px,w)=>(w||'700')+' '+Math.round(px)+'px system-ui,-apple-system,sans-serif';
function txt(s,x,y,px,c,al,w){ctx.font=F(px,w);ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* audio */
let AC=null,mg=null,nb=null,lastPop=0,lastCatch=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}}
function tone(f,d,ty,v,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc){if(!AC)return;try{if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d)}catch(e){}}
const sfx={pop(){const n=performance.now();if(n-lastPop<45)return;lastPop=n;noise(.05,.12,3000);tone(rnd(500,800),.05,'square',.04)},catch(c){const n=performance.now();if(n-lastCatch<40)return;lastCatch=n;tone(500*Math.pow(1.05,Math.min(c,16)),.1,'triangle',.18)},bank(h){tone(392,.15,'triangle',.22);setTimeout(()=>tone(523,.15,'triangle',.22),80);setTimeout(()=>tone(659+h*10,.3,'triangle',.22),160)},burn(){noise(.6,.5,500);tone(130,.45,'sawtooth',.2,40)},miss(){tone(200,.12,'sine',.08,120)},crack(){noise(.15,.4,1800);tone(300,.1,'square',.1,100)},start(){tone(392,.1,'triangle',.2);setTimeout(()=>tone(587,.2,'triangle',.2),90)},over(){tone(300,.5,'sawtooth',.18,70)},storm(){tone(220,.4,'sawtooth',.1,440)}};

let ks,pan,parts,pops,score,combo,bestCombo,lives,mess,t,spawnT,storm,stormCd,stormLeft,shake,slow,overT,rank,savedF,cause,hintA,hintDone,banked,bestBank,pot,tubFill,tx;
function reset(){
 ks=[];pan={x:W/2,held:0,dump:0,sq:0,tilt:0};parts=[];pops=[];score=0;combo=0;bestCombo=0;lives=3;mess=0;t=0;spawnT=.8;storm=0;stormCd=32;stormLeft=0;shake=0;slow=1;overT=0;rank=-1;savedF=false;cause='';hintA=1;hintDone=false;banked=0;bestBank=0;pot={x:W/2,v:1,shake:0};tubFill=0;tx=W/2;
}
reset();
const dd=()=>1-Math.exp(-t/55);
function burst(x,y,n,c,sp){for(let i=0;i<n&&parts.length<260;i++){const a=rnd(0,6.28),v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:rnd(.35,.8),ml:.8,c,s:rnd(2,4)})}}
function pop(x,y,s,c){if(pops.length<14)pops.push({x,y,s,c,l:1})}
function lifeLoss(why,x,y){lives--;combo=0;cause=why;shake=14;slow=.3;sfx.burn();burst(x,y,24,'#3a2a22',180);burst(x,y,10,'#ff7b3a',150);pop(x,y-20,'-1 LIFE','#ff8a8a');if(lives<=0)endGame()}
function endGame(){state=ST.OVER;overT=0;sfx.over();
 if(!savedF){savedF=true;if(score>0){const a=save.scores.slice();a.push(score);a.sort((x,y)=>y-x);rank=a.indexOf(score);save.scores=a.slice(0,5);if(rank>4)rank=-1}
  save.bestCombo=Math.max(save.bestCombo,bestCombo);save.bestBank=Math.max(save.bestBank,bestBank);persist()}}
function spawnK(){
 if(ks.length>16)return;const d=dd(),r=Math.random();let ty='w';
 if(t>8&&r<.12+.2*d)ty='b';else if(t>15&&r<.22+.2*d)ty='h';else if(t>10&&r<.3+.15*d)ty='g';
 const g=900*SC*(1+.35*d),x0=pot.x,y0=POTY;
 const vy0=-rnd(260,520)*SC,tt=(-vy0+Math.sqrt(vy0*vy0+2*g*(PANY-y0)))/g;
 const target=rnd(PW*.7,W-PW*.7),vx=(target-x0)/tt;
 ks.push({x:x0,y:y0,vx,vy:vy0,g,ty,rot:rnd(0,6),vr:rnd(-6,6),age:0,land:target});
 pot.shake=.25;sfx.pop();
}
function update(dt){
 if(state===ST.START){pot.x=W/2+Math.sin(time*.8)*W*.25;return}
 slow=Math.min(1,slow+dt*.9);const sd=dt*(state===ST.OVER?Math.max(.3,slow):slow);
 shake=Math.max(0,shake-sd*30);pot.shake=Math.max(0,pot.shake-sd);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=sd;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*sd;q.y+=q.vy*sd;q.vy+=600*sd}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=sd;q.y-=34*sd;if(q.l<=0)pops.splice(i,1)}
 if(state===ST.OVER){overT+=dt;return}
 if(hintDone)hintA=Math.max(0,hintA-dt*1.5);
 t+=sd;const d=dd();
 /* pan */
 const lim=PW/2;pan.x+=(clamp(tx,lim,W-lim)-pan.x)*Math.min(1,dt*18);pan.sq=Math.max(0,pan.sq-sd*3);
 if(pan.dump>0){pan.dump-=sd;if(pan.dump<=0){pan.dump=0}}
 else if(pan.held>0&&pan.x<TUBW*.75){
  const h=pan.held,pts=Math.round(8*h*(h+1)/2*(1+.1*Math.min(combo,20)));score+=pts;banked++;bestBank=Math.max(bestBank,pts);tubFill=Math.min(30,tubFill+h);
  pan.dump=.5;pan.held=0;sfx.bank(h);burst(TUBW/2,PANY-8,10+h*2,'#fff3c0',170);pop(TUBW/2+30,PANY-60,'BANK +'+pts,'#ffe45c');shake=Math.max(shake,3+h*.4);
 }
 /* pot */
 if(t>18){pot.x+=pot.v*(40+60*d)*sd;if(pot.x>W-60){pot.x=W-60;pot.v=-1}if(pot.x<60){pot.x=60;pot.v=1}}else pot.x=W/2;
 /* spawn */
 spawnT-=sd;
 if(spawnT<=0){spawnK();spawnT=Math.max(.28,1.15-.8*d)*rnd(.75,1.2)}
 if(t>30){stormCd-=sd;if(stormCd<=0&&stormLeft<=0){stormLeft=6+Math.floor(d*5);stormCd=rnd(22,32);sfx.storm();pop(W/2,POTY+60,'POP STORM!','#ffb42e');shake=6}}
 if(stormLeft>0){storm-=sd;if(storm<=0){spawnK();stormLeft--;storm=.16}}
 /* kernels */
 for(let i=ks.length-1;i>=0;i--){
  const k=ks[i];k.age+=sd;const py=k.y;k.vy+=k.g*sd;k.x+=k.vx*sd;k.y+=k.vy*sd;k.rot+=k.vr*sd;
  if(k.ty==='b'&&parts.length<250&&Math.random()<.5)parts.push({x:k.x,y:k.y,vx:rnd(-15,15),vy:rnd(-40,-10),l:.4,ml:.4,c:'rgba(70,60,60,.7)',s:3});
  if(k.vy>0&&pan.dump<=0&&py<=PANY+6&&k.y>=PANY-10&&Math.abs(k.x-pan.x)<PW/2+6){
   ks.splice(i,1);pan.sq=1;
   if(k.ty==='b'){const lost=pan.held;pan.held=0;lifeLoss('Burnt popcorn ruined the batch',pan.x,PANY);if(lost>0)pop(pan.x,PANY-70,'-'+lost+' LOST','#ff8a8a');if(state!==ST.PLAY)return;continue}
   if(k.ty==='h'){const lost=Math.ceil(pan.held/2);pan.held-=lost;combo=0;sfx.crack();shake=5;burst(pan.x,PANY,10,'#aaa',120);pop(pan.x,PANY-50,'HARD KERNEL -'+lost,'#c8c8d8');continue}
   const add=k.ty==='g'?2:1;if(pan.held+add>CAP){ks.push(k);k.vy=-Math.abs(k.vy)*.6;k.y=PANY-12;pop(pan.x,PANY-60,'FULL! Bank it','#ffb42e');continue}
   pan.held+=add;combo++;bestCombo=Math.max(bestCombo,combo);hintDone=true;sfx.catch(combo);burst(k.x,PANY-6,4,k.ty==='g'?'#ffd23f':'#fff3c0',90);continue;
  }
  if(k.y>FLOORY+10){
   ks.splice(i,1);
   if(k.ty==='w'||k.ty==='g'){combo=0;mess++;sfx.miss();burst(k.x,FLOORY,5,'#fff3c0',70);if(mess>=5){mess=0;lifeLoss('Too much popcorn on the floor',k.x,FLOORY);if(state!==ST.PLAY)return}}
   else if(k.ty==='b'){burst(k.x,FLOORY,6,'#3a2a22',80)}
  }
 }
}
/* drawing */
function drawBG(){
 const g=ctx.createLinearGradient(0,0,0,FLOORY);g.addColorStop(0,'#5a2a2a');g.addColorStop(1,'#8c4a3a');ctx.fillStyle=g;ctx.fillRect(0,0,W,FLOORY);
 ctx.strokeStyle='rgba(255,230,200,.07)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,FLOORY);ctx.stroke()}for(let y=0;y<FLOORY;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle='rgba(255,220,150,.12)';ctx.beginPath();ctx.ellipse(W/2,POTY+30,W*.5,H*.28,0,0,6.28);ctx.fill();
 const f=ctx.createLinearGradient(0,FLOORY,0,H);f.addColorStop(0,'#c9a06a');f.addColorStop(1,'#6a4a2e');ctx.fillStyle=f;ctx.fillRect(0,FLOORY,W,H-FLOORY);
 ctx.fillStyle='#e8c690';ctx.fillRect(0,FLOORY,W,4);
 ctx.strokeStyle='rgba(60,30,10,.25)';ctx.lineWidth=1.5;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(W/2+i*18,FLOORY+4);ctx.lineTo(W/2+i*W*.22,H);ctx.stroke()}for(let k=1;k<5;k++){const y=FLOORY+4+(H-FLOORY)*Math.pow(k/5,1.6);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawPot(){
 const sh=pot.shake>0?Math.sin(time*60)*3:Math.sin(time*20)*(1+dd()*1.5),x=pot.x+sh,y=POTY,w=Math.min(120,W*.3);
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+4,y+54,w*.55,10,0,0,6.28);ctx.fill();
 const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#3a3f52');g.addColorStop(.4,'#8c94b0');g.addColorStop(1,'#2a2e3e');ctx.fillStyle=g;rr(x-w/2,y-4,w,56,14);ctx.fill();
 ctx.fillStyle='#e04a3a';rr(x-w/2-8,y+12,16,10,4);ctx.fill();rr(x+w/2-8,y+12,16,10,4);ctx.fill();
 const lid=Math.abs(Math.sin(time*18))*3*(pot.shake>0?3:1);ctx.fillStyle='#b9bfd6';ctx.beginPath();ctx.ellipse(x,y-6-lid,w*.52,10,0,0,6.28);ctx.fill();ctx.fillStyle='#e04a3a';ctx.beginPath();ctx.arc(x,y-16-lid,5,0,6.28);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.2)';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x-12+i*12+Math.sin(time*3+i)*4,y-30-((time*30+i*14)%26),5,0,6.28);ctx.fill()}
}
function drawKernel(k){
 const s=11*SC*Math.max(.8,Math.min(1.3,SC)),hs=clamp((FLOORY-k.y)/(FLOORY-POTY),0,1.2);
 ctx.fillStyle='rgba(0,0,0,'+(.3*(1-hs*.5)).toFixed(2)+')';ctx.beginPath();ctx.ellipse(clamp(k.x,0,W),FLOORY+10+(H-FLOORY)*.12,s*(1-hs*.3),s*.3*(1-hs*.3),0,0,6.28);ctx.fill();
 ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.rot);
 if(k.ty==='h'){ctx.fillStyle='#a8a4b8';ctx.beginPath();ctx.ellipse(0,0,s*.45,s*.6,0,0,6.28);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(-s*.15,-s*.2,s*.12,0,6.28);ctx.fill()}
 else{const c1=k.ty==='b'?'#4a3a34':k.ty==='g'?'#ffcc33':'#fffaf0',c2=k.ty==='b'?'#1c1412':k.ty==='g'?'#e09a10':'#f0dca8';
  const pts=[[-.5,.1,.55],[.45,0,.5],[0,-.5,.55],[-.1,.45,.5],[.1,0,.6]];
  for(const p of pts){const g=ctx.createRadialGradient(p[0]*s-s*.1,p[1]*s-s*.15,1,p[0]*s,p[1]*s,p[2]*s);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,p[2]*s,0,6.28);ctx.fill()}
  if(k.ty!=='b'){ctx.fillStyle='#f2c34a';ctx.beginPath();ctx.arc(s*.05,s*.1,s*.14,0,6.28);ctx.fill()}else{ctx.fillStyle='#ff6a3a';ctx.beginPath();ctx.arc(-s*.2,0,s*.08,0,6.28);ctx.arc(s*.2,-s*.1,s*.07,0,6.28);ctx.fill()}}
 ctx.restore();
}
function drawPan(){
 const x=pan.x,y=PANY,w=PW,sq=pan.sq*.15,dmp=pan.dump>0;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+3,FLOORY+16,w*.55,8,0,0,6.28);ctx.fill();
 ctx.save();ctx.translate(x,y);ctx.rotate(dmp?-.8*Math.sin(clamp(pan.dump/.5,0,1)*3.14):0);ctx.scale(1+sq,1-sq);
 ctx.fillStyle='#a8321f';ctx.beginPath();ctx.ellipse(0,0,w/2,12,0,Math.PI,0,true);ctx.fill();
 /* back rim + heap */
 ctx.fillStyle='#7a2216';ctx.beginPath();ctx.ellipse(0,0,w/2,12,0,0,6.28);ctx.fill();
 const n=pan.held;for(let i=0;i<n;i++){const row=Math.floor(i/5),col=i%5,px=(col-2)*w*.17+(row%2)*w*.08,py=-4-row*10;ctx.fillStyle=i%3?'#fffaf0':'#ffe9a0';ctx.beginPath();ctx.arc(px,py,8,0,6.28);ctx.fill();ctx.strokeStyle='rgba(180,140,60,.4)';ctx.lineWidth=1;ctx.stroke()}
 const g=ctx.createLinearGradient(0,0,0,26);g.addColorStop(0,'#e04a3a');g.addColorStop(1,'#8c2a1c');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-w/2,0);ctx.lineTo(w/2,0);ctx.quadraticCurveTo(w/2-6,26,w/2-16,28);ctx.lineTo(-w/2+16,28);ctx.quadraticCurveTo(-w/2+6,26,-w/2,0);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-w*.25,6,w*.12,3,0,0,6.28);ctx.fill();
 ctx.strokeStyle='#ffd2c0';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,w/2,12,0,0,Math.PI);ctx.stroke();
 ctx.restore();
 if(pan.held>0&&!dmp){const fr=pan.held/CAP;txt(pan.held+(pan.held>=CAP?' FULL':''),x,y-Math.min(60,24+Math.ceil(pan.held/5)*10)-14,Math.min(16,W/22),fr>.7?'#ff9f43':'#fff0b8')}
}
function drawTub(){
 const w=TUBW,x=0,y=PANY+4;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(w*.5,FLOORY+20,w*.6,9,0,0,6.28);ctx.fill();
 const g=ctx.createLinearGradient(0,y,0,y+60);g.addColorStop(0,'#4d8cff');g.addColorStop(1,'#2a4a99');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(w,y);ctx.lineTo(w-10,y+54);ctx.lineTo(x,y+54);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fffaf0';for(let i=0;i<Math.min(tubFill,24);i++){ctx.beginPath();ctx.arc(8+(i%6)*13+((i/6|0)%2)*5,y-2-((i/6|0)*5)+(i%2)*2,8,0,6.28);ctx.fill()}
 ctx.fillStyle='#7fb0ff';ctx.fillRect(x,y,w,6);
 stripe:{ctx.fillStyle='#fff';for(let i=0;i<4;i++)ctx.fillRect(6+i*21,y+14,10,38)}
 txt('BANK',w/2,y+68,12,'#ffe9a0');
 if(pan.held>0){const a=.5+.5*Math.sin(time*6);ctx.fillStyle='rgba(255,236,160,'+a.toFixed(2)+')';ctx.beginPath();ctx.moveTo(w+8,y-20);ctx.lineTo(w-6,y-10);ctx.lineTo(w+8,y);ctx.fill()}
}
function drawHUD(){
 const y=safe+8,pw=Math.min(W*.36,150),ph=46;
 ctx.fillStyle='rgba(30,10,8,.8)';rr(10,y,pw,ph,12);ctx.fill();txt('SCORE',20,y+13,Math.min(11,W/32),'#d6a890','left');txt(String(score),20,y+31,Math.min(22,W/16),'#fff0b8','left');
 ctx.fillStyle='rgba(30,10,8,.8)';rr(W-10-pw,y,pw,ph,12);ctx.fill();txt('LIVES',W-10-pw+10,y+13,Math.min(11,W/32),'#d6a890','left');
 for(let i=0;i<3;i++){const x=W-10-pw+22+i*Math.min(30,pw/3.4);ctx.fillStyle=i<lives?'#ff7b3a':'#4a2a22';ctx.beginPath();ctx.arc(x,y+31,8,0,6.28);ctx.fill()}
 if(combo>1){const sc=1+.06*Math.sin(time*8);ctx.save();ctx.translate(W/2,y+ph/2);ctx.scale(sc,sc);txt('x'+combo,0,0,Math.min(26,W/12),'#ffb42e');ctx.restore()}else txt('BEST '+(save.scores[0]||0),W/2,y+ph/2,Math.min(13,W/28),'#d6a890');
 const my=y+ph+14;txt('MESS',W-10-pw+10,my,Math.min(11,W/32),'#d6a890','left');for(let i=0;i<5;i++){ctx.fillStyle=i<mess?'#ffcc33':'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(W-10-pw+52+i*12,my,4,0,6.28);ctx.fill()}
}
function drawStart(){
 ctx.fillStyle='rgba(30,10,8,.62)';ctx.fillRect(0,0,W,H);const ty=safe+H*.35,u=Math.min(50,W/7);
 txt('POPCORN',W/2,ty,u,'#fff0b8','center','800');txt('PANIC',W/2,ty+u*.95,u,'#ff7b3a','center','800');
 txt('Drag to catch popcorn. Dash left to bank it.',W/2,ty+u*2,Math.min(15,W/25),'#fff3dc','center','500');
 txt('The bigger the stack, the bigger the bank. Dodge burnt!',W/2,ty+u*2+22,Math.min(13,W/29),'#d6a890','center','500');
 ctx.globalAlpha=.55+.45*Math.sin(time*4);txt('TAP TO PLAY',W/2,H-Math.max(70,H*.12),Math.min(26,W/13),'#fff0b8');ctx.globalAlpha=1;
 txt('Best '+(save.scores[0]||0)+'   Best bank '+save.bestBank,W/2,H-Math.max(40,H*.07),Math.min(13,W/27),'#d6a890','center','500');
}
function drawOver(){
 const pw=Math.min(W-28,350),ph=Math.min(H-20,350),x=W/2-pw/2,y=Math.max(safe+6,H/2-ph/2);
 ctx.fillStyle='rgba(30,10,8,.93)';rr(x,y,pw,ph,18);ctx.fill();ctx.strokeStyle='rgba(255,180,46,.4)';ctx.lineWidth=2;ctx.stroke();
 txt('KITCHEN CLOSED',W/2,y+26,Math.min(22,pw/13),'#fff0b8');
 ctx.font=F(Math.min(13,pw/26),'500');let cs=cause;while(cs.length>8&&ctx.measureText(cs).width>pw-30)cs=cs.slice(0,-2);txt(cs,W/2,y+50,Math.min(13,pw/26),'#ff9a9a','center','500');
 txt(String(score),W/2,y+92,Math.min(44,pw/7),'#fff');
 if(rank===0)txt('NEW HIGH SCORE!',W/2,y+126,Math.min(17,pw/18),'#ff9f43');else txt(banked+' banks  -  best bank '+bestBank,W/2,y+126,Math.min(13,pw/26),'#d6a890','center','500');
 for(let i=0;i<5;i++){const yy=y+160+i*24,s=save.scores[i],hl=i===rank;if(hl){ctx.fillStyle='rgba(255,159,67,.2)';rr(x+16,yy-11,pw-32,22,6);ctx.fill()}
  txt((i+1)+'.',x+28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#9a7060','left');txt(s!=null?String(s):'-',x+pw-28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#fff3dc','right')}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(time*5);txt('TAP TO POP AGAIN',W/2,y+ph-24,Math.min(18,pw/17),'#fff0b8');ctx.globalAlpha=1}
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
 const sx=shake>0?rnd(-shake,shake)*.5:0,sy=shake>0?rnd(-shake,shake)*.5:0;
 ctx.save();ctx.translate(sx,sy);drawBG();drawPot();drawTub();
 for(const k of ks)drawKernel(k);
 drawPan();
 for(const q of parts){ctx.globalAlpha=clamp(q.l/q.ml,0,1);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 for(const q of pops){ctx.globalAlpha=clamp(q.l,0,1);txt(q.s,q.x,q.y,Math.min(16,W/22),q.c)}ctx.globalAlpha=1;
 ctx.restore();
 if(state!==ST.START)drawHUD();
 if(hintA>.01&&state===ST.PLAY){ctx.globalAlpha=hintA;const bw=Math.min(W-30,330),by=H-Math.max(50,H*.07);ctx.fillStyle='rgba(30,10,8,.88)';rr(W/2-bw/2,by-26,bw,52,14);ctx.fill();txt('DRAG to move the pan and catch popcorn',W/2,by-8,Math.min(14,W/25),'#fff0b8');txt('Slide LEFT over the bowl to bank. Avoid black ones!',W/2,by+13,Math.min(12,W/29),'#d6a890','center','400');ctx.globalAlpha=1}
 if(state===ST.START)drawStart();if(state===ST.OVER)drawOver();
 if(paused&&state===ST.PLAY){ctx.fillStyle='rgba(30,10,8,.78)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2-12,Math.min(36,W/9),'#fff0b8');txt('Tap to resume',W/2,H/2+22,16,'#d6a890','center','500')}
}
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:0;last=ts;if(!(dt>0))dt=0;dt=Math.min(.04,dt);time+=dt;try{if(!paused)update(dt);draw()}catch(e){console.error(e)}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}last=0}
function startLoop(){stopLoop();raf=requestAnimationFrame(frame)}
function startGame(){reset();state=ST.PLAY;paused=false;sfx.start();startLoop()}
function press(){au();if(state===ST.START){startGame();return false}if(state===ST.OVER){if(overT>.8)startGame();return false}if(paused){paused=false;last=0;return false}return true}
let dragId=null,dragX0=0,panX0=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(press()){dragId=e.pointerId;dragX0=e.clientX;panX0=pan.x;tx=pan.x}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===dragId&&state===ST.PLAY&&!paused){tx=panX0+(e.clientX-dragX0)*1.15;hintDone=true}});
const up=e=>{if(e.pointerId===dragId)dragId=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
addEventListener('keydown',e=>{const k=e.key;
 if(k===' '||k==='Enter'){e.preventDefault();if(!e.repeat)press()}
 else if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(k)){e.preventDefault();keys[k.toLowerCase()]=1;hintDone=true}
 else if((k==='p'||k==='P'||k==='Escape')&&!e.repeat){if(state===ST.PLAY){paused=!paused;last=0}}});
addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
setInterval(()=>{if(state!==ST.PLAY||paused)return;const s=11*SC;if(keys.arrowleft||keys.a)tx-=s;if(keys.arrowright||keys.d)tx+=s;tx=clamp(tx,PW/2,W-PW/2)},16);
function relAll(){dragId=null;for(const k in keys)delete keys[k]}
addEventListener('blur',()=>{relAll();if(state===ST.PLAY)paused=true});
document.addEventListener('visibilitychange',()=>{relAll();if(document.hidden){if(state===ST.PLAY)paused=true;stopLoop()}else{last=0;startLoop()}});
function resize(){W=innerWidth||360;H=innerHeight||640;dpr=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.getBoundingClientRect().height||0;
 SC=clamp(H/640,.7,1.4);PANY=H-Math.max(120,H*.2);FLOORY=PANY+34;POTY=safe+130;if(POTY>PANY-200)POTY=PANY-200;PW=clamp(W*.26,84,130);TUBW=clamp(W*.24,76,100);pan.x=clamp(pan.x,PW/2,W-PW/2);tx=clamp(tx,PW/2,W-PW/2)}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,100));
resize();startLoop();
})();
</script></body></html>
