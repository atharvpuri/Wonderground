<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pond Pulse</title>
<style>
:root{--bg:#0a2a30;--fg:#fff2a8}
@media(prefers-color-scheme:dark){:root{--bg:#06222a}}
[data-theme=dusk]{--bg:#12202e}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body>
<div id="probe"></div><canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
let W=360,H=640,dpr=1,safe=0,state=ST.START,raf=0,last=0,time=0,paused=false;
let CX=180,CY=340,RX=160,RY=250,NX=180,NY=500,RS=140;
const KEY='pondPulse.v1',save={scores:[],bestCombo:0,bestSaved:0};
const cn=n=>typeof n==='number'&&isFinite(n)?Math.max(0,Math.min(1e8,n|0)):0;
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.scores)){save.scores=j.scores.map(cn).filter(n=>n>0).sort((a,b)=>b-a).slice(0,5);save.bestCombo=cn(j.bestCombo);save.bestSaved=cn(j.bestSaved)}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const F=(px,w)=>(w||'700')+' '+Math.round(px)+'px system-ui,-apple-system,sans-serif';
function txt(s,x,y,px,c,al,w){ctx.font=F(px,w);ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* audio */
let AC=null,mg=null,nb=null,lastP=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}}
function tone(f,d,ty,v,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc){if(!AC)return;try{if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d)}catch(e){}}
const sfx={drop(){tone(520,.18,'sine',.2,180);noise(.08,.15,1800)},dry(){tone(120,.1,'square',.08)},home(c){const f=520*Math.pow(1.06,Math.min(c,14)*2);tone(f,.12,'triangle',.22);tone(f*1.5,.2,'sine',.12);setTimeout(()=>tone(f*2,.12,'triangle',.1),70)},bad(){noise(.5,.5,600);tone(170,.4,'sawtooth',.2,45)},start(){tone(392,.1,'triangle',.2);setTimeout(()=>tone(587,.2,'triangle',.2),90)},over(){tone(300,.5,'sawtooth',.18,70)},scare(){tone(900,.1,'square',.06,300)}};

let ducks,pikes,pads,ripples,parts,pops,whirl,score,combo,bestCombo,lives,saved,t,spawnT,stones,shake,slow,overT,rank,savedF,cause,hintA,hintDone,comboT,cur;
function reset(){
 ducks=[];pikes=[];ripples=[];parts=[];pops=[];whirl=null;score=0;combo=0;bestCombo=0;lives=3;saved=0;t=0;spawnT=.6;stones=5;shake=0;slow=1;overT=0;rank=-1;savedF=false;cause='';hintA=1;hintDone=false;comboT=0;
 cur={x:CX,y:CY};
 pads=[];let tr=0;while(pads.length<3&&tr++<80){const a=rnd(0,6.28),r=rnd(.2,.65),x=CX+Math.cos(a)*RX*r,y=CY+Math.sin(a)*RY*r*.9;if(Math.hypot(x-NX,y-NY)<90)continue;if(pads.some(p=>Math.hypot(p.x-x,p.y-y)<110))continue;pads.push({x,y,r:rnd(22,32)*Math.min(1,W/380+.3),ph:rnd(0,6)})}
}
const dd=()=>1-Math.exp(-t/55);
function burst(x,y,n,c,sp){for(let i=0;i<n&&parts.length<240;i++){const a=rnd(0,6.28),v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,l:rnd(.4,.8),ml:.8,c,s:rnd(2,3.5)})}}
function pop(x,y,s,c){if(pops.length<14)pops.push({x,y,s,c,l:1})}
function lose(why,x,y){lives--;combo=0;cause=why;shake=14;slow=.3;sfx.bad();burst(x,y,22,'#cfeaff',170);pop(x,y-16,'-1 DUCKLING','#ff7b7b');if(lives<=0)endGame()}
function endGame(){state=ST.OVER;overT=0;sfx.over();
 if(!savedF){savedF=true;if(score>0){const a=save.scores.slice();a.push(score);a.sort((x,y)=>y-x);rank=a.indexOf(score);save.scores=a.slice(0,5);if(rank>4)rank=-1}
  save.bestCombo=Math.max(save.bestCombo,bestCombo);save.bestSaved=Math.max(save.bestSaved,saved);persist()}}
function drop(x,y){
 if(state!==ST.PLAY||paused)return;hintDone=true;
 if(stones<1){sfx.dry();pop(x,y,'no stones','#9fc4cc');return}
 stones-=1;ripples.push({x,y,u:0,hit:false});sfx.drop();burst(x,y,8,'#e8f8ff',90);
}
function spawnDuck(){ducks.push({x:CX+rnd(-RX*.45,RX*.45),y:CY-RY*.8,vx:rnd(-20,20),vy:rnd(10,40),ph:rnd(0,6),sq:0,face:0,age:0})}
function spawnPike(){const a=rnd(0,6.28);pikes.push({x:CX+Math.cos(a)*RX*.7,y:CY+Math.sin(a)*RY*.7,vx:0,vy:0,stun:0,ph:rnd(0,6),ang:0,wx:CX,wy:CY,hunt:false})}
function update(dt){
 if(state===ST.START)return;
 slow=Math.min(1,slow+dt*.9);const sd=dt*(state===ST.OVER?Math.max(.3,slow):slow);
 shake=Math.max(0,shake-sd*30);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=sd;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*sd;q.y+=q.vy*sd;q.vy+=420*sd}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=sd;q.y-=34*sd;if(q.l<=0)pops.splice(i,1)}
 for(let i=ripples.length-1;i>=0;i--){ripples[i].u+=sd/.8;if(ripples[i].u>=1)ripples.splice(i,1)}
 if(state===ST.OVER){overT+=dt;return}
 if(hintDone)hintA=Math.max(0,hintA-dt*1.5);
 t+=sd;const d=dd();
 stones=Math.min(5,stones+sd/(1.2-.3*d));
 comboT=Math.max(0,comboT-sd);if(comboT===0&&combo>0&&false)combo=0;
 spawnT-=sd;if(spawnT<=0){if(ducks.length<3+Math.floor(4*d))spawnDuck();spawnT=Math.max(1.1,3.2-1.9*d)*rnd(.8,1.2)}
 const wantP=t>9?(t>30?(t>60?3:2):1):0;if(pikes.length<wantP)spawnPike();
 if(t>26&&!whirl)whirl={a:rnd(0,6.28),r:.45,x:0,y:0};
 if(whirl){whirl.a+=sd*.35;whirl.x=CX+Math.cos(whirl.a)*RX*whirl.r;whirl.y=CY+Math.sin(whirl.a*1.3)*RY*.5}
 /* ducks */
 for(let i=ducks.length-1;i>=0;i--){
  const k=ducks[i];k.age+=sd;
  k.vx+=Math.sin(time*1.3+k.ph)*26*sd;k.vy+=Math.cos(time*1.1+k.ph*2)*26*sd+12*sd;
  for(const r of ripples){const rad=RS*(1-Math.pow(1-r.u,2)),dx=k.x-r.x,dy=k.y-r.y,dist=Math.hypot(dx,dy)||1,band=34;
   if(Math.abs(dist-rad)<band){const f=1-Math.abs(dist-rad)/band,a=1500*f*(1-r.u*.7);k.vx+=dx/dist*a*sd;k.vy+=dy/dist*a*sd;k.sq=.25}}
  if(whirl){const dx=whirl.x-k.x,dy=whirl.y-k.y,dist=Math.hypot(dx,dy)||1;if(dist<100){const a=(1-dist/100)*220;k.vx+=dx/dist*a*sd;k.vy+=dy/dist*a*sd}
   if(dist<18){ducks.splice(i,1);lose('A duckling got sucked into a whirlpool',whirl.x,whirl.y);if(state!==ST.PLAY)return;continue}}
  const dmp=Math.exp(-1.8*sd);k.vx*=dmp;k.vy*=dmp;const sp=Math.hypot(k.vx,k.vy);if(sp>380){k.vx*=380/sp;k.vy*=380/sp}
  k.x+=k.vx*sd;k.y+=k.vy*sd;k.sq=Math.max(0,k.sq-sd*1.2);
  if(sp>8)k.face=Math.atan2(k.vy,k.vx);
  for(const p of pads){const dx=k.x-p.x,dy=k.y-p.y,dist=Math.hypot(dx,dy)||1,mn=p.r+9;if(dist<mn){const nx=dx/dist,ny=dy/dist;k.x=p.x+nx*mn;k.y=p.y+ny*mn;const vn=k.vx*nx+k.vy*ny;if(vn<0){k.vx-=1.5*vn*nx;k.vy-=1.5*vn*ny}}}
  const nx=(k.x-CX)/(RX-12),ny=(k.y-CY)/(RY-12),e=nx*nx+ny*ny;
  if(e>1){const s=1/Math.sqrt(e);k.x=CX+(k.x-CX)*s;k.y=CY+(k.y-CY)*s;const gx=nx/(RX-12),gy=ny/(RY-12),gl=Math.hypot(gx,gy)||1,ux=gx/gl,uy=gy/gl,vn=k.vx*ux+k.vy*uy;if(vn>0){k.vx-=1.6*vn*ux;k.vy-=1.6*vn*uy}}
  if(Math.hypot(k.x-NX,k.y-NY)<34){
   ducks.splice(i,1);combo=comboT>0?combo+1:1;comboT=5;bestCombo=Math.max(bestCombo,combo);saved++;
   const pts=Math.round(100*(1+.5*Math.min(combo-1,12)));score+=pts;sfx.home(combo);burst(NX,NY,18,'#ffe45c',150);pop(NX,NY-26,'+'+pts+(combo>1?'  x'+combo:''),'#fff2a8');
  }
 }
 /* pikes */
 for(const p of pikes){
  p.stun=Math.max(0,p.stun-sd);
  for(const r of ripples){const rad=RS*(1-Math.pow(1-r.u,2)),dx=p.x-r.x,dy=p.y-r.y,dist=Math.hypot(dx,dy)||1;
   if(Math.abs(dist-rad)<34&&p.stun<.6){p.stun=1.3;p.vx+=dx/dist*320;p.vy+=dy/dist*320;sfx.scare();burst(p.x,p.y,6,'#ff9a9a',80)}}
  let tg=null,bd=290;for(const k of ducks){const dist=Math.hypot(k.x-p.x,k.y-p.y);if(dist<bd){bd=dist;tg=k}}
  p.hunt=!!tg;let sp=(60+95*d);
  if(p.stun>0)sp=0;
  let tx,ty;if(tg){tx=tg.x;ty=tg.y}else{if(Math.hypot(p.wx-p.x,p.wy-p.y)<25){const a=rnd(0,6.28),r=rnd(.2,.8);p.wx=CX+Math.cos(a)*RX*r;p.wy=CY+Math.sin(a)*RY*r;sp*=.5}tx=p.wx;ty=p.wy;sp*=.55}
  const dx=tx-p.x,dy=ty-p.y,dl=Math.hypot(dx,dy)||1;
  p.vx+=(dx/dl*sp-p.vx)*Math.min(1,sd*3);p.vy+=(dy/dl*sp-p.vy)*Math.min(1,sd*3);
  p.x+=p.vx*sd;p.y+=p.vy*sd;if(Math.hypot(p.vx,p.vy)>12)p.ang=Math.atan2(p.vy,p.vx);
  const nx=(p.x-CX)/(RX-10),ny=(p.y-CY)/(RY-10),e=nx*nx+ny*ny;if(e>1){const s=1/Math.sqrt(e);p.x=CX+(p.x-CX)*s;p.y=CY+(p.y-CY)*s}
  if(tg&&p.stun<=0&&Math.hypot(tg.x-p.x,tg.y-p.y)<24){const ix=ducks.indexOf(tg);if(ix>=0){ducks.splice(ix,1);lose('A pike ate a duckling',tg.x,tg.y);if(state!==ST.PLAY)return}}
 }
}
/* drawing */
function drawBG(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#13433c');g.addColorStop(1,'#0a2a2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#3d6b3a';ctx.beginPath();ctx.ellipse(CX,CY,RX+22,RY+22,0,0,6.28);ctx.fill();
 ctx.fillStyle='#5a4a30';ctx.beginPath();ctx.ellipse(CX,CY,RX+8,RY+8,0,0,6.28);ctx.fill();
 const w=ctx.createRadialGradient(CX,CY-RY*.2,10,CX,CY,RY);w.addColorStop(0,'#3aa6b8');w.addColorStop(.7,'#1b7a90');w.addColorStop(1,'#0f4f66');ctx.fillStyle=w;ctx.beginPath();ctx.ellipse(CX,CY,RX,RY,0,0,6.28);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;
 for(let i=0;i<14;i++){const a=i*2.4,r=.25+(i%5)*.15,x=CX+Math.cos(a+time*.05)*RX*r,y=CY+Math.sin(a)*RY*r;ctx.beginPath();ctx.ellipse(x,y,10+(i%3)*5,3,0,0,6.28);ctx.stroke()}
 /* reeds */
 ctx.strokeStyle='#6fae45';ctx.lineWidth=2.5;
 for(let i=0;i<40;i++){const a=i/40*6.283,x=CX+Math.cos(a)*(RX+14),y=CY+Math.sin(a)*(RY+14),sw=Math.sin(time*2+i)*3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sw,y-16-(i%3)*4);ctx.stroke()}
}
function drawNest(){
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(NX,NY+6,44,22,0,0,6.28);ctx.fill();
 const g=ctx.createRadialGradient(NX,NY-4,4,NX,NY,44);g.addColorStop(0,'#e8c870');g.addColorStop(1,'#8a6a2e');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(NX,NY,42,22,0,0,6.28);ctx.fill();
 ctx.strokeStyle='#b99645';ctx.lineWidth=2;for(let i=0;i<10;i++){const a=i/10*6.283;ctx.beginPath();ctx.moveTo(NX+Math.cos(a)*18,NY+Math.sin(a)*9);ctx.lineTo(NX+Math.cos(a)*40,NY+Math.sin(a)*21);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(NX-8,NY,5,6,0,0,6.28);ctx.ellipse(NX+8,NY+2,5,6,0,0,6.28);ctx.fill();
 const pul=1+.1*Math.sin(time*4);ctx.strokeStyle='rgba(255,242,168,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(NX,NY,50*pul,27*pul,0,0,6.28);ctx.stroke();
}
function drawPad(p){
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+3,p.y+5,p.r,p.r*.75,0,0,6.28);ctx.fill();
 const g=ctx.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,2,p.x,p.y,p.r);g.addColorStop(0,'#7fd15a');g.addColorStop(1,'#2f7a2a');ctx.fillStyle=g;
 ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.arc(p.x,p.y,p.r,.3,6.0);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ff9ec4';ctx.beginPath();ctx.arc(p.x+p.r*.35,p.y-p.r*.2,4,0,6.28);ctx.fill();
}
function drawWhirl(){
 if(!whirl)return;ctx.save();ctx.translate(whirl.x,whirl.y);
 const g=ctx.createRadialGradient(0,0,2,0,0,48);g.addColorStop(0,'rgba(2,20,30,.95)');g.addColorStop(1,'rgba(2,20,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,48,0,6.28);ctx.fill();
 ctx.strokeStyle='rgba(200,240,255,.5)';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();for(let a=0;a<12;a+=.3){const r=a*3.6,an=a+time*4+k*2.1;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r*.8)}ctx.stroke()}ctx.restore();
}
function drawPike(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);const w=Math.sin(time*(p.stun>0?2:9)+p.ph)*5,L=44;
 ctx.fillStyle=p.stun>0?'rgba(120,150,170,.75)':'rgba(10,30,40,.72)';ctx.beginPath();ctx.moveTo(L,0);ctx.quadraticCurveTo(L*.3,-12,-L*.5,-5+w*.4);ctx.lineTo(-L*.9,-11+w);ctx.lineTo(-L*.8,0+w*.5);ctx.lineTo(-L*.9,11+w);ctx.lineTo(-L*.5,5+w*.4);ctx.quadraticCurveTo(L*.3,12,L,0);ctx.fill();
 ctx.fillStyle=p.hunt&&p.stun<=0?'#ff4d4d':'#cfe';ctx.beginPath();ctx.arc(L*.6,-3,2.5,0,6.28);ctx.fill();ctx.restore();
 if(p.stun>0)txt('*',p.x,p.y-20,18,'#fff2a8');
}
function drawDuck(k){
 const sq=k.sq,bob=Math.sin(time*4+k.ph)*1.2;
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(k.x+2,k.y+8,12,5,0,0,6.28);ctx.fill();
 ctx.save();ctx.translate(k.x,k.y+bob);ctx.scale(1+sq,1-sq);
 const g=ctx.createRadialGradient(-3,-5,2,0,0,13);g.addColorStop(0,'#fff59a');g.addColorStop(1,'#f2b829');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,11,9,0,0,6.28);ctx.fill();
 const dir=Math.cos(k.face)>=0?1:-1;
 ctx.beginPath();ctx.arc(dir*7,-8,6.5,0,6.28);ctx.fill();
 ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.moveTo(dir*12,-8);ctx.lineTo(dir*18,-6);ctx.lineTo(dir*12,-4);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(dir*8,-10,1.6,0,6.28);ctx.fill();
 ctx.fillStyle='#e0a020';ctx.beginPath();ctx.ellipse(-dir*3,1,6,3.5,.3*dir,0,6.28);ctx.fill();
 ctx.restore();
}
function drawHUD(){
 const y=safe+10,pw=Math.min(W*.36,150),ph=46;
 ctx.fillStyle='rgba(6,28,34,.75)';rr(10,y,pw,ph,12);ctx.fill();txt('SCORE',20,y+13,Math.min(11,W/32),'#8fc4cc','left');txt(String(score),20,y+31,Math.min(22,W/16),'#fff2a8','left');
 ctx.fillStyle='rgba(6,28,34,.75)';rr(W-10-pw,y,pw,ph,12);ctx.fill();txt('DUCKLINGS',W-10-pw+10,y+13,Math.min(11,W/32),'#8fc4cc','left');
 for(let i=0;i<3;i++){const x=W-10-pw+22+i*Math.min(30,pw/3.4);ctx.fillStyle=i<lives?'#ffd84a':'#2a4048';ctx.beginPath();ctx.arc(x,y+31,8,0,6.28);ctx.fill()}
 if(combo>1){const sc=1+.08*Math.sin(time*8);ctx.save();ctx.translate(W/2,y+ph/2);ctx.scale(sc,sc);txt('x'+combo,0,0,Math.min(26,W/12),'#ff9f43');ctx.restore()}else txt('BEST '+(save.scores[0]||0),W/2,y+ph/2,Math.min(13,W/28),'#8fc4cc');
 const bw=Math.min(W-40,220),by=H-Math.max(26,safe*0+26);
 ctx.fillStyle='rgba(6,28,34,.75)';rr(W/2-bw/2-8,by-14,bw+16,28,14);ctx.fill();
 for(let i=0;i<5;i++){const f=clamp(stones-i,0,1),x=W/2-bw/2+10+i*(bw-20)/4;ctx.fillStyle='#2a4048';ctx.beginPath();ctx.arc(x,by,9,0,6.28);ctx.fill();if(f>0){ctx.fillStyle=f>=1?'#e8f8ff':'rgba(232,248,255,.5)';ctx.beginPath();ctx.arc(x,by,9*f,0,6.28);ctx.fill()}}
}
function drawStart(){
 ctx.fillStyle='rgba(4,20,24,.6)';ctx.fillRect(0,0,W,H);const ty=safe+H*.13,u=Math.min(52,W/6.5);
 txt('POND',W/2,ty,u,'#fff2a8','center','800');txt('PULSE',W/2,ty+u*.95,u,'#6fd7ea','center','800');
 txt('Tap to make ripples. Push ducklings home.',W/2,ty+u*2,Math.min(15,W/24),'#e6f6f8','center','500');
 txt('Ripples also scare off hungry pikes.',W/2,ty+u*2+22,Math.min(13,W/27),'#8fc4cc','center','500');
 ctx.globalAlpha=.55+.45*Math.sin(time*4);txt('TAP TO PLAY',W/2,H-Math.max(70,H*.12),Math.min(26,W/13),'#fff2a8');ctx.globalAlpha=1;
 txt('Best '+(save.scores[0]||0)+'   Best combo x'+save.bestCombo,W/2,H-Math.max(40,H*.07),Math.min(13,W/27),'#8fc4cc','center','500');
}
function drawOver(){
 const pw=Math.min(W-28,350),ph=Math.min(H-20,350),x=W/2-pw/2,y=Math.max(safe+6,H/2-ph/2);
 ctx.fillStyle='rgba(4,20,24,.92)';rr(x,y,pw,ph,18);ctx.fill();ctx.strokeStyle='rgba(255,242,168,.35)';ctx.lineWidth=2;ctx.stroke();
 txt('POND EMPTIED',W/2,y+26,Math.min(22,pw/13),'#fff2a8');
 ctx.font=F(Math.min(13,pw/26),'500');let cs=cause;while(cs.length>8&&ctx.measureText(cs).width>pw-30)cs=cs.slice(0,-2);txt(cs,W/2,y+50,Math.min(13,pw/26),'#ff9a9a','center','500');
 txt(String(score),W/2,y+92,Math.min(44,pw/7),'#fff');
 if(rank===0)txt('NEW HIGH SCORE!',W/2,y+126,Math.min(17,pw/18),'#ff9f43');else txt(saved+' ducklings home  -  best combo x'+bestCombo,W/2,y+126,Math.min(13,pw/26),'#8fc4cc','center','500');
 for(let i=0;i<5;i++){const yy=y+160+i*24,s=save.scores[i],hl=i===rank;if(hl){ctx.fillStyle='rgba(255,159,67,.2)';rr(x+16,yy-11,pw-32,22,6);ctx.fill()}
  txt((i+1)+'.',x+28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#5f8c96','left');txt(s!=null?String(s):'-',x+pw-28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#e6f6f8','right')}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(time*5);txt('TAP TO TRY AGAIN',W/2,y+ph-24,Math.min(18,pw/17),'#fff2a8');ctx.globalAlpha=1}
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
 const sx=shake>0?rnd(-shake,shake)*.5:0,sy=shake>0?rnd(-shake,shake)*.5:0;
 ctx.save();ctx.translate(sx,sy);drawBG();drawNest();drawWhirl();
 for(const r of ripples){const rad=RS*(1-Math.pow(1-r.u,2));ctx.strokeStyle='rgba(235,250,255,'+(.8*(1-r.u)).toFixed(2)+')';ctx.lineWidth=4*(1-r.u)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,6.28);ctx.stroke();ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(r.x,r.y,Math.max(0,rad-14),0,6.28);ctx.stroke()}
 for(const p of pikes)drawPike(p);
 for(const p of pads)drawPad(p);
 const ds=ducks.slice().sort((a,b)=>a.y-b.y);for(const k of ds)drawDuck(k);
 for(const q of parts){ctx.globalAlpha=clamp(q.l/q.ml,0,1);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 for(const q of pops){ctx.globalAlpha=clamp(q.l,0,1);txt(q.s,q.x,q.y,Math.min(17,W/22),q.c)}ctx.globalAlpha=1;
 ctx.restore();
 if(state!==ST.START)drawHUD();
 if(state===ST.PLAY&&!paused&&kbd){ctx.strokeStyle='#fff2a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cur.x,cur.y,12,0,6.28);ctx.moveTo(cur.x-18,cur.y);ctx.lineTo(cur.x+18,cur.y);ctx.moveTo(cur.x,cur.y-18);ctx.lineTo(cur.x,cur.y+18);ctx.stroke()}
 if(hintA>.01&&state===ST.PLAY){ctx.globalAlpha=hintA;const bw=Math.min(W-30,330),by=H-Math.max(78,H*.12);ctx.fillStyle='rgba(6,28,34,.85)';rr(W/2-bw/2,by-26,bw,52,14);ctx.fill();txt('TAP the water: ripples push ducklings',W/2,by-8,Math.min(15,W/23),'#fff2a8');txt('Guide them into the nest',W/2,by+13,Math.min(12,W/29),'#8fc4cc','center','400');ctx.globalAlpha=1}
 if(state===ST.START)drawStart();if(state===ST.OVER)drawOver();
 if(paused&&state===ST.PLAY){ctx.fillStyle='rgba(4,20,24,.75)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2-12,Math.min(36,W/9),'#fff2a8');txt('Tap to resume',W/2,H/2+22,16,'#8fc4cc','center','500')}
}
let kbd=false;
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:0;last=ts;if(!(dt>0))dt=0;dt=Math.min(.04,dt);time+=dt;try{if(!paused)update(dt);draw()}catch(e){console.error(e)}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}last=0}
function startLoop(){stopLoop();raf=requestAnimationFrame(frame)}
function startGame(){reset();state=ST.PLAY;paused=false;sfx.start();startLoop()}
function press(){au();if(state===ST.START){startGame();return false}if(state===ST.OVER){if(overT>.8)startGame();return false}if(paused){paused=false;last=0;return false}return true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}kbd=false;if(press()){const y=e.clientY<safe+60?safe+60:e.clientY;cur.x=e.clientX;cur.y=y;drop(e.clientX,y)}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
addEventListener('keydown',e=>{const k=e.key;
 if(k===' '||k==='Enter'){e.preventDefault();if(e.repeat)return;if(press()){kbd=true;drop(cur.x,cur.y)}}
 else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','A','d','D','w','W','s','S'].includes(k)){e.preventDefault();keys[k.toLowerCase()]=1;kbd=true}
 else if((k==='p'||k==='P'||k==='Escape')&&!e.repeat){if(state===ST.PLAY){paused=!paused;last=0}}});
addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
setInterval(()=>{if(state!==ST.PLAY||paused)return;const s=7;if(keys.arrowleft||keys.a)cur.x-=s;if(keys.arrowright||keys.d)cur.x+=s;if(keys.arrowup||keys.w)cur.y-=s;if(keys.arrowdown||keys.s)cur.y+=s;cur.x=clamp(cur.x,CX-RX,CX+RX);cur.y=clamp(cur.y,CY-RY,CY+RY)},16);
addEventListener('blur',()=>{for(const k in keys)delete keys[k];if(state===ST.PLAY)paused=true});
document.addEventListener('visibilitychange',()=>{for(const k in keys)delete keys[k];if(document.hidden){if(state===ST.PLAY)paused=true;stopLoop()}else{last=0;startLoop()}});
function resize(){W=innerWidth||360;H=innerHeight||640;dpr=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.getBoundingClientRect().height||0;
 const top=safe+66,bot=H-52;RX=Math.max(110,Math.min(W*.46-22,(bot-top)/2*1.0));RY=Math.max(150,(bot-top)/2-22);if(RX>RY*1.3)RX=RY*1.3;
 CX=W/2;CY=top+(bot-top)/2;NX=CX;NY=CY+RY-34;RS=clamp(Math.min(W,H)*.28,95,170);
 if(cur){cur.x=clamp(cur.x,CX-RX,CX+RX);cur.y=clamp(cur.y,CY-RY,CY+RY)}}
addEventListener('resize',()=>{resize();if(state!==ST.PLAY)reset()});addEventListener('orientationchange',()=>setTimeout(resize,100));
resize();reset();startLoop();
})();
</script></body></html>
