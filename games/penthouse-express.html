<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Penthouse Express</title>
<style>
:root{--bg:#0d1224;--fg:#ffe8b0}
@media(prefers-color-scheme:dark){:root{--bg:#090d1c}}
[data-theme=night]{--bg:#0b1020}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body>
<div id="probe"></div><canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
let W=360,H=640,dpr=1,safe=0,state=ST.START,raf=0,last=0,time=0,paused=false;
const N=6;let TOPY=100,BOTY=500,FH=66,CX=180,SW=84,BTN=80;
const KEY='penthouseExpress.v1',save={scores:[],bestCombo:0,bestRides:0};
const cn=n=>typeof n==='number'&&isFinite(n)?Math.max(0,Math.min(1e8,n|0)):0;
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.scores)){save.scores=j.scores.map(cn).filter(n=>n>0).sort((a,b)=>b-a).slice(0,5);save.bestCombo=cn(j.bestCombo);save.bestRides=cn(j.bestRides)}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const F=(px,w)=>(w||'700')+' '+Math.round(px)+'px system-ui,-apple-system,sans-serif';
function txt(s,x,y,px,c,al,w){ctx.font=F(px,w);ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* audio */
let AC=null,mg=null,nb=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}}
function tone(f,d,ty,v,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc){if(!AC)return;try{if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d)}catch(e){}}
const sfx={ding(c){const f=660*Math.pow(1.05,Math.min(c,14)*2);tone(f,.25,'sine',.25);tone(f*1.5,.35,'sine',.12)},board(){tone(440,.08,'triangle',.12,520)},jam(){noise(.3,.4,400);tone(110,.25,'square',.15,70)},rev(){tone(300,.08,'square',.08,220)},bad(){noise(.5,.5,600);tone(170,.4,'sawtooth',.2,45)},perf(){tone(988,.15,'triangle',.15);setTimeout(()=>tone(1319,.2,'triangle',.15),80)},start(){tone(392,.1,'triangle',.2);setTimeout(()=>tone(587,.2,'triangle',.2),90)},over(){tone(300,.5,'sawtooth',.18,70)}};

const PC=['#ff6b81','#4dabff','#58d68d','#ffd23f','#c58bff','#ff9f43'];
let cab,queue,parts,pops,score,combo,bestCombo,lives,rides,t,spawnT,shake,slow,overT,rank,savedF,cause,hintA,hintDone,flashO,flashR;
function reset(){
 cab={fl:0,dir:1,door:0,jam:0,riders:[],open:0};queue=[];for(let i=0;i<N;i++)queue.push([]);
 parts=[];pops=[];score=0;combo=0;bestCombo=0;lives=3;rides=0;t=0;spawnT=.8;shake=0;slow=1;overT=0;rank=-1;savedF=false;cause='';hintA=1;hintDone=false;flashO=0;flashR=0;
}
reset();
const dd=()=>1-Math.exp(-t/60);
const yF=f=>BOTY-(f+.5)*FH;
function burst(x,y,n,c,sp){for(let i=0;i<n&&parts.length<240;i++){const a=rnd(0,6.28),v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:rnd(.4,.9),ml:.9,c:typeof c==='string'?c:PC[(Math.random()*PC.length)|0],s:rnd(2,4)})}}
function pop(x,y,s,c){if(pops.length<14)pops.push({x,y,s,c,l:1})}
function lose(why,x,y){lives--;combo=0;cause=why;shake=12;slow=.35;sfx.bad();burst(x,y,16,'#ff6b6b',140);pop(x,y-20,'-1 LIFE','#ff8a8a');if(lives<=0)endGame()}
function endGame(){state=ST.OVER;overT=0;sfx.over();
 if(!savedF){savedF=true;if(score>0){const a=save.scores.slice();a.push(score);a.sort((x,y)=>y-x);rank=a.indexOf(score);save.scores=a.slice(0,5);if(rank>4)rank=-1}
  save.bestCombo=Math.max(save.bestCombo,bestCombo);save.bestRides=Math.max(save.bestRides,rides);persist()}}
function spawnPax(){
 const d=dd();let tot=0;for(const q of queue)tot+=q.length;if(tot>=Math.min(12,6+Math.floor(d*5)))return;
 const opts=[];for(let f=0;f<N;f++)if(queue[f].length<3)opts.push(f);if(!opts.length)return;
 const f=opts[(Math.random()*opts.length)|0];let dest=f;while(dest===f)dest=(Math.random()*N)|0;
 const vip=t>20&&Math.random()<.08+.12*d,max=vip?9:lerp(24,12,d);
 queue[f].push({dest,orig:f,vip,pat:max,max,ph:rnd(0,6),col:PC[(Math.random()*PC.length)|0]});
}
function tol(){return lerp(.3,.16,dd())}
function doOpen(){
 if(state!==ST.PLAY||paused)return;hintDone=true;flashO=.2;
 if(cab.door>0||cab.jam>0)return;
 const f=Math.round(cab.fl),err=Math.abs(cab.fl-f);
 if(err>tol()){cab.jam=.6;combo=0;sfx.jam();shake=6;pop(CX,yF(cab.fl)-FH*.6,'MISALIGNED','#ffb36b');return}
 cab.fl=f;cab.door=.85;sfx.ding(combo);
 const perfect=err<.07;let any=false;
 const ys=yF(f);
 for(let i=cab.riders.length-1;i>=0;i--){const r=cab.riders[i];if(r.dest!==f)continue;cab.riders.splice(i,1);any=true;rides++;
  const dist=Math.abs(r.dest-r.orig);combo++;bestCombo=Math.max(bestCombo,combo);
  const pts=Math.round((40+25*dist)*(1+.25*Math.min(combo-1,16))*(r.vip?2:1));score+=pts;
  burst(CX,ys,r.vip?18:10,r.vip?'#ffd23f':r.col,150);pop(CX+rnd(-20,20),ys-FH*.7,'+'+pts+(combo>1?' x'+combo:''),r.vip?'#ffd23f':'#ffe8b0')}
 const q=queue[f];while(q.length&&cab.riders.length<3){const p=q.shift();cab.riders.push(p);sfx.board();any=true}
 if(perfect&&any){score+=25;sfx.perf();pop(CX,ys-FH*.3,'PERFECT +25','#8fffa0')}
 if(!any){pop(CX,ys-FH*.6,'empty stop','#9fb0d0')}
}
function doRev(){if(state!==ST.PLAY||paused)return;hintDone=true;flashR=.2;if(cab.door>0)return;cab.dir=-cab.dir;sfx.rev()}
function update(dt){
 if(state===ST.START){cab.fl=(Math.sin(time*.9)*.5+.5)*(N-1);return}
 slow=Math.min(1,slow+dt*.9);const sd=dt*(state===ST.OVER?Math.max(.3,slow):slow);
 shake=Math.max(0,shake-sd*30);flashO=Math.max(0,flashO-dt);flashR=Math.max(0,flashR-dt);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=sd;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*sd;q.y+=q.vy*sd;q.vy+=500*sd}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=sd;q.y-=32*sd;if(q.l<=0)pops.splice(i,1)}
 if(state===ST.OVER){overT+=dt;return}
 if(hintDone)hintA=Math.max(0,hintA-dt*1.5);
 t+=sd;const d=dd();
 spawnT-=sd;if(spawnT<=0){spawnPax();spawnT=Math.max(.7,2.3-1.6*d)*rnd(.8,1.2)}
 if(cab.door>0){cab.door-=sd;cab.open=clamp(Math.min(cab.door/.15,(.85-cab.door)/.15),0,1);if(cab.door<=0){cab.door=0;cab.open=0}}
 else if(cab.jam>0){cab.jam-=sd}
 else{const sp=1.5+1.9*d;cab.fl+=cab.dir*sp*sd;if(cab.fl>=N-1){cab.fl=N-1;cab.dir=-1}if(cab.fl<=0){cab.fl=0;cab.dir=1}}
 for(let f=0;f<N;f++){const q=queue[f];for(let i=q.length-1;i>=0;i--){const p=q[i];p.pat-=sd;if(p.pat<=0){q.splice(i,1);const sx=f%2?CX+SW/2+30:CX-SW/2-30;lose('A passenger gave up waiting',sx,yF(f));if(state!==ST.PLAY)return}}}
 for(let i=cab.riders.length-1;i>=0;i--){const p=cab.riders[i];p.pat-=sd*.5;if(p.pat<=0){cab.riders.splice(i,1);lose('A passenger got stuck in the lift',CX,yF(cab.fl));if(state!==ST.PLAY)return}}
}
/* drawing */
function drawBuilding(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2350');g.addColorStop(.5,'#3a2f63');g.addColorStop(1,'#10142c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<30;i++)ctx.fillRect((i*83)%W,safe+((i*47)%60),1.5,1.5);
 ctx.fillStyle='#14183a';for(let i=0;i<7;i++){const bw=W/7,bh=30+((i*37)%50);ctx.fillRect(i*bw,TOPY-bh-6,bw-4,bh+6)}
 /* building body */
 const bx=4,bw=W-8;const wg=ctx.createLinearGradient(0,TOPY,0,BOTY);wg.addColorStop(0,'#3a3358');wg.addColorStop(1,'#281f44');ctx.fillStyle=wg;ctx.fillRect(bx,TOPY,bw,BOTY-TOPY);
 for(let f=0;f<N;f++){
  const yTop=BOTY-(f+1)*FH,yBot=BOTY-f*FH;
  ctx.fillStyle=f%2?'rgba(255,214,140,.07)':'rgba(140,170,255,.06)';ctx.fillRect(bx,yTop,bw,FH);
  ctx.fillStyle='#5b4f86';ctx.fillRect(bx,yBot-6,bw,6);ctx.fillStyle='#8a7cc0';ctx.fillRect(bx,yBot-6,bw,2);
  const side=f%2?1:-1;ctx.fillStyle='rgba(255,230,160,.25)';const wx=side>0?CX+SW/2+8+(W-CX-SW/2-16)*.5:bx+10;ctx.fillRect(wx,yTop+10,Math.min(40,(W-SW)/2-24),FH*.35);
  txt(f===0?'L':String(f),side>0?W-18:18,yTop+14,12,'rgba(255,232,176,.45)');
 }
 ctx.fillStyle='#0a0d1e';ctx.fillRect(CX-SW/2-4,TOPY,SW+8,BOTY-TOPY);
 ctx.fillStyle='#161c3a';ctx.fillRect(CX-SW/2,TOPY,SW,BOTY-TOPY);
 ctx.strokeStyle='rgba(180,190,230,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(CX-SW/2+8,TOPY);ctx.lineTo(CX-SW/2+8,BOTY);ctx.moveTo(CX+SW/2-8,TOPY);ctx.lineTo(CX+SW/2-8,BOTY);ctx.stroke();
}
function drawPax(x,y,p,s,showPat){
 const bob=Math.sin(time*3+p.ph)*1;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y+s*.9,s*.6,s*.2,0,0,6.28);ctx.fill();
 ctx.fillStyle=p.vip?'#ffd23f':p.col;rr(x-s*.45,y-s*.3+bob,s*.9,s*1.15,s*.3);ctx.fill();
 ctx.fillStyle='#f5d3b0';ctx.beginPath();ctx.arc(x,y-s*.6+bob,s*.38,0,6.28);ctx.fill();
 if(p.vip){ctx.fillStyle='#222';ctx.fillRect(x-s*.4,y-s*.95+bob,s*.8,s*.18)}
 const bc=PC[p.dest%PC.length];ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-s*1.25+bob,s*.38,0,6.28);ctx.fill();txt(p.dest===0?'L':String(p.dest),x,y-s*1.25+bob,s*.55,'#222','center','800');
 if(showPat){const fr=clamp(p.pat/p.max,0,1);ctx.strokeStyle=fr>.4?'rgba(130,255,150,.9)':'rgba(255,90,90,'+(.6+.4*Math.sin(time*12))+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y-s*1.25+bob,s*.5,-1.57,-1.57+6.283*fr);ctx.stroke()}
}
function drawCab(){
 const y=yF(cab.fl),w=SW-14,h=FH-14,x=CX-w/2;
 ctx.strokeStyle='rgba(200,210,240,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(CX,TOPY);ctx.lineTo(CX,y-h/2);ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,.35)';rr(x+3,y-h/2+5,w,h,6);ctx.fill();
 const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#d9b868');g.addColorStop(1,'#8a6a2a');ctx.fillStyle=g;rr(x,y-h/2,w,h,6);ctx.fill();
 ctx.fillStyle='#2b2145';rr(x+4,y-h/2+4,w-8,h-8,4);ctx.fill();
 for(let i=0;i<cab.riders.length;i++){drawPax(CX-w/2+16+i*(w-24)/2,y+h*.2,cab.riders[i],Math.min(11,w*.14),true)}
 const dw=(w-8)/2,op=cab.open*dw*.9;ctx.fillStyle='#c9c4d8';ctx.fillRect(x+4,y-h/2+4,dw-op,h-8);ctx.fillRect(x+4+dw+op,y-h/2+4,dw-op,h-8);
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+4,y-h/2+4,3,h-8);
 const f=Math.round(cab.fl),err=Math.abs(cab.fl-f),ok=err<=tol();
 ctx.fillStyle=cab.jam>0?'#ff4d4d':ok?'#6dff9a':'#ffb347';ctx.beginPath();ctx.arc(CX,y-h/2-6,4,0,6.28);ctx.fill();
 /* tolerance guide on floor */
 const yy=yF(f);ctx.strokeStyle=ok?'rgba(110,255,150,.6)':'rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(CX-SW/2-6,yy);ctx.lineTo(CX-SW/2+4,yy);ctx.moveTo(CX+SW/2-4,yy);ctx.lineTo(CX+SW/2+6,yy);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle=cab.dir>0?'#8fd0ff':'#ffb0d0';ctx.beginPath();if(cab.dir>0){ctx.moveTo(CX,y-h/2-20);ctx.lineTo(CX-6,y-h/2-12);ctx.lineTo(CX+6,y-h/2-12)}else{ctx.moveTo(CX,y+h/2+20);ctx.lineTo(CX-6,y+h/2+12);ctx.lineTo(CX+6,y+h/2+12)}ctx.fill();
}
function drawButtons(){
 const bw=(W-30)/2,y=H-BTN-8;
 for(let i=0;i<2;i++){const x=10+i*(bw+10),fl=i?flashR:flashO,lab=i?'REVERSE':'OPEN DOORS',sub=i?'tap right':'tap left',c=i?'#4d9bff':'#ffb42e';
  ctx.fillStyle=fl>0?c:'rgba(14,18,44,.9)';rr(x,y+(fl>0?3:0),bw,BTN-(fl>0?3:0),16);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.stroke();
  txt(lab,x+bw/2,y+BTN*.42,Math.min(20,bw/7),fl>0?'#12162e':c,'center','800');txt(sub,x+bw/2,y+BTN*.74,Math.min(12,bw/12),fl>0?'#12162e':'#8f9acc','center','500')}
}
function drawHUD(){
 const y=safe+8,pw=Math.min(W*.36,150),ph=46;
 ctx.fillStyle='rgba(10,12,32,.82)';rr(10,y,pw,ph,12);ctx.fill();txt('SCORE',20,y+13,Math.min(11,W/32),'#9aa6d8','left');txt(String(score),20,y+31,Math.min(22,W/16),'#ffe8b0','left');
 ctx.fillStyle='rgba(10,12,32,.82)';rr(W-10-pw,y,pw,ph,12);ctx.fill();txt('LIVES',W-10-pw+10,y+13,Math.min(11,W/32),'#9aa6d8','left');
 for(let i=0;i<3;i++){const x=W-10-pw+22+i*Math.min(30,pw/3.4);ctx.fillStyle=i<lives?'#ff6b81':'#2e3358';ctx.beginPath();ctx.arc(x,y+31,8,0,6.28);ctx.fill()}
 if(combo>1){const sc=1+.08*Math.sin(time*8);ctx.save();ctx.translate(W/2,y+ph/2);ctx.scale(sc,sc);txt('x'+combo,0,0,Math.min(26,W/12),'#ff9f43');ctx.restore()}else txt('BEST '+(save.scores[0]||0),W/2,y+ph/2,Math.min(13,W/28),'#9aa6d8');
}
function drawStart(){
 ctx.fillStyle='rgba(8,10,28,.62)';ctx.fillRect(0,0,W,H);const ty=safe+H*.13,u=Math.min(46,W/7.5);
 txt('PENTHOUSE',W/2,ty,u,'#ffe8b0','center','800');txt('EXPRESS',W/2,ty+u*.95,u,'#ffb42e','center','800');
 txt('Stop the lift on the floor. Open the doors.',W/2,ty+u*2,Math.min(15,W/25),'#eceeff','center','500');
 txt('Match riders to their floor. Never keep anyone waiting.',W/2,ty+u*2+22,Math.min(13,W/29),'#9aa6d8','center','500');
 ctx.globalAlpha=.55+.45*Math.sin(time*4);txt('TAP TO PLAY',W/2,H-BTN-60,Math.min(26,W/13),'#ffe8b0');ctx.globalAlpha=1;
 txt('Best '+(save.scores[0]||0)+'   Best combo x'+save.bestCombo,W/2,H-BTN-28,Math.min(13,W/27),'#9aa6d8','center','500');
}
function drawOver(){
 const pw=Math.min(W-28,350),ph=Math.min(H-20,350),x=W/2-pw/2,y=Math.max(safe+6,H/2-ph/2);
 ctx.fillStyle='rgba(8,10,28,.93)';rr(x,y,pw,ph,18);ctx.fill();ctx.strokeStyle='rgba(255,180,46,.4)';ctx.lineWidth=2;ctx.stroke();
 txt('OUT OF SERVICE',W/2,y+26,Math.min(22,pw/13),'#ffe8b0');
 ctx.font=F(Math.min(13,pw/26),'500');let cs=cause;while(cs.length>8&&ctx.measureText(cs).width>pw-30)cs=cs.slice(0,-2);txt(cs,W/2,y+50,Math.min(13,pw/26),'#ff9a9a','center','500');
 txt(String(score),W/2,y+92,Math.min(44,pw/7),'#fff');
 if(rank===0)txt('NEW HIGH SCORE!',W/2,y+126,Math.min(17,pw/18),'#ff9f43');else txt(rides+' delivered  -  best combo x'+bestCombo,W/2,y+126,Math.min(13,pw/26),'#9aa6d8','center','500');
 for(let i=0;i<5;i++){const yy=y+160+i*24,s=save.scores[i],hl=i===rank;if(hl){ctx.fillStyle='rgba(255,159,67,.2)';rr(x+16,yy-11,pw-32,22,6);ctx.fill()}
  txt((i+1)+'.',x+28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#6f7aa8','left');txt(s!=null?String(s):'-',x+pw-28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#eceeff','right')}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(time*5);txt('TAP TO RESTART SHIFT',W/2,y+ph-24,Math.min(18,pw/17),'#ffe8b0');ctx.globalAlpha=1}
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
 const sx=shake>0?rnd(-shake,shake)*.5:0,sy=shake>0?rnd(-shake,shake)*.5:0;
 ctx.save();ctx.translate(sx,sy);drawBuilding();
 for(let f=0;f<N;f++){const side=f%2?1:-1,q=queue[f],sz=Math.min(13,FH*.2);for(let i=0;i<q.length;i++){const x=CX+side*(SW/2+22+i*sz*2.1);drawPax(x,yF(f)+FH*.12,q[i],sz,true)}}
 drawCab();
 for(const q of parts){ctx.globalAlpha=clamp(q.l/q.ml,0,1);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 for(const q of pops){ctx.globalAlpha=clamp(q.l,0,1);txt(q.s,q.x,q.y,Math.min(16,W/22),q.c)}ctx.globalAlpha=1;
 ctx.restore();
 if(state!==ST.START)drawHUD();
 drawButtons();
 if(hintA>.01&&state===ST.PLAY){ctx.globalAlpha=hintA;const bw=Math.min(W-30,330),by=TOPY+30;ctx.fillStyle='rgba(8,10,28,.9)';rr(W/2-bw/2,by-26,bw,52,14);ctx.fill();txt('OPEN DOORS when the light is green',W/2,by-8,Math.min(15,W/23),'#ffe8b0');txt('Deliver riders to the floor on their badge',W/2,by+13,Math.min(12,W/29),'#9aa6d8','center','400');ctx.globalAlpha=1}
 if(state===ST.START)drawStart();if(state===ST.OVER)drawOver();
 if(paused&&state===ST.PLAY){ctx.fillStyle='rgba(8,10,28,.78)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2-12,Math.min(36,W/9),'#ffe8b0');txt('Tap to resume',W/2,H/2+22,16,'#9aa6d8','center','500')}
}
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:0;last=ts;if(!(dt>0))dt=0;dt=Math.min(.04,dt);time+=dt;try{if(!paused)update(dt);draw()}catch(e){console.error(e)}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}last=0}
function startLoop(){stopLoop();raf=requestAnimationFrame(frame)}
function startGame(){reset();state=ST.PLAY;paused=false;sfx.start();startLoop()}
function press(){au();if(state===ST.START){startGame();return false}if(state===ST.OVER){if(overT>.8)startGame();return false}if(paused){paused=false;last=0;return false}return true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(press()){if(e.clientX<W/2)doOpen();else doRev()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;
 if(k===' '||k==='Enter'||k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();if(press())doOpen()}
 else if(k==='ArrowRight'||k==='d'||k==='D'||k==='ArrowUp'||k==='ArrowDown'||k==='Shift'){e.preventDefault();if(press())doRev()}
 else if(k==='p'||k==='P'||k==='Escape'){if(state===ST.PLAY){paused=!paused;last=0}}});
addEventListener('blur',()=>{if(state===ST.PLAY)paused=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state===ST.PLAY)paused=true;stopLoop()}else{last=0;startLoop()}});
function resize(){W=innerWidth||360;H=innerHeight||640;dpr=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.getBoundingClientRect().height||0;
 BTN=clamp(H*.11,64,86);TOPY=safe+66;BOTY=H-BTN-22;FH=(BOTY-TOPY)/N;CX=W/2;SW=clamp(W*.24,74,110)}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,100));
resize();startLoop();
})();
