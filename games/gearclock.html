<!-- FILE: gear-clock.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear Clock</title>
<style>
:root{--bg:#130c07;--fg:#fff6e8;--accent:#ffbe0b;--jade:#06d6a0;--danger:#ef476f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130c07;--fg:#fff6e8}}
:root[data-theme="dark"]{--bg:#130c07;--fg:#fff6e8}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, DEP = 9;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);
const normAng = a => ((a % TAU) + TAU) % TAU;
const angDiff = (a, b) => {
  const d = Math.abs(normAng(a) - normAng(b));
  return Math.min(d, TAU - d);
};

/* ---------- storage ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => {
  try {
    const a = JSON.parse(store.get('gearclock.top5') || '[]');
    return Array.isArray(a) ? a.filter(n => typeof n === 'number' && isFinite(n)).slice(0, 5) : [];
  } catch (e) { return []; }
};
let top5 = loadTop();
let bestCogs = parseInt(store.get('gearclock.cogs') || '0', 10) || 0;
let bestStreak = parseInt(store.get('gearclock.streak') || '0', 10) || 0;
function saveScore(sc, cg, st) {
  const s = Math.floor(sc);
  const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5);
  store.set('gearclock.top5', JSON.stringify(top5));
  if (cg > bestCogs) { bestCogs = cg; store.set('gearclock.cogs', String(bestCogs)); }
  if (st > bestStreak) { bestStreak = st; store.set('gearclock.streak', String(bestStreak)); }
  return s > 0 ? top5.indexOf(s) : -1;
}

/* ---------- canvas & safe iframe layout ---------- */
let W = 360, H = 640, dpr = 1, safeTop = 0, S = 1, cx = 180, cy = 360;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const rect = cv.getBoundingClientRect();
  W = Math.max(300, Math.round(rect.width || window.innerWidth || 360));
  H = Math.max(420, Math.round(rect.height || window.innerHeight || 640));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  safeTop = probe ? (probe.offsetHeight || 0) : 0;
  S = Math.max(0.55, Math.min(W / 380, (H - safeTop) / 680));
  cx = W * 0.5;
  cy = safeTop + 86 * S + (H - safeTop - 130 * S) * 0.56;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (typeof ResizeObserver !== 'undefined') {
  try { new ResizeObserver(resize).observe(document.body); } catch (e) {}
}

/* ---------- audio engine ---------- */
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        AC = new C();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, freq, type = 'bandpass') {
  const a = audio(); if (!a || !noiseBuf) return;
  try {
    const s = a.createBufferSource(), f = AC.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
let lastTick = 0;
const sfx = {
  tick() {
    const n = performance.now();
    if (n - lastTick < 95) return;
    lastTick = n;
    tone('triangle', 840, 420, 0.025, 0.035);
  },
  mesh(streak, isPerf, isSpring) {
    const base = (isPerf ? 587.33 : 440) * Math.pow(1.0595, Math.min(streak, 15));
    tone('square', 165, 82, 0.08, 0.16);
    tone('triangle', base, base * 1.5, 0.22, 0.17);
    if (isPerf || isSpring) tone('sine', base * 2, base * 2.5, 0.3, 0.13, 0.04);
  },
  clash() {
    noise(0.35, 0.32, 950, 'bandpass');
    tone('sawtooth', 210, 42, 0.38, 0.24);
    tone('square', 115, 32, 0.35, 0.16);
  },
  wind() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, f * 1.15, 0.2, 0.11, i * 0.05));
  },
  start() { tone('triangle', 330, 660, 0.15, 0.12); },
  over() { tone('sawtooth', 330, 38, 0.85, 0.16); }
};

/* ---------- game state ---------- */
let state = STATES.START, G = null, raf = 0, last = 0, overAt = 0;
const bgCogs = [
  { x: -125, y: -150, r: 68, teeth: 16, spd: 0.22, a: 0 },
  { x:  130, y: -120, r: 54, teeth: 12, spd: -0.3, a: 0.4 },
  { x: -135, y:  140, r: 60, teeth: 14, spd: -0.25, a: 1.1 },
  { x:  125, y:  155, r: 74, teeth: 18, spd: 0.18, a: 2.0 }
];
const ptr = { id: null, down: false, startX: 0, startY: 0, moved: false };
const keys = { l: 0, r: 0 };

function makeNextGear(idx, prevGear, diff) {
  const teethOpts = [8, 10, 12, 14];
  const teeth = teethOpts[Math.floor(Math.random() * teethOpts.length)];
  const r = teeth * 3.8; // world units
  const dist = prevGear.r + r - 2;

  // Pick an upward-ish angle in the clock tower so the gear train climbs & weaves
  let placeAng = -Math.PI * 0.5 + rr(-0.92, 0.92);
  const candX = prevGear.x + Math.cos(placeAng) * dist;
  if (candX < -105) placeAng = -Math.PI * 0.5 + rr(0.15, 0.85);
  else if (candX > 105) placeAng = -Math.PI * 0.5 - rr(0.15, 0.85);

  const gx = prevGear.x + Math.cos(placeAng) * dist;
  const gy = prevGear.y + Math.sin(placeAng) * dist;

  // Pick 1 or 2 Red Rust Teeth on the driving gear that must NOT be touched!
  const rust = [];
  const nRust = idx === 1 ? 1 : (Math.random() < 0.35 + diff * 0.45 ? 2 : 1);
  for (let k = 0; k < nRust; k++) {
    rust.push(Math.floor((k / nRust + rr(0.1, 0.35)) * prevGear.teeth) % prevGear.teeth);
  }
  prevGear.rust = rust;
  // Pick a Golden Mainspring Tooth on the driving gear (opposite the rust)
  prevGear.goldTooth = (rust[0] + Math.floor(prevGear.teeth * 0.5)) % prevGear.teeth;

  return {
    idx,
    x: gx, y: gy, r, teeth,
    ang: rr(0, TAU),
    dir: -prevGear.dir,
    ratio: prevGear.teeth / teeth,
    col: idx % 3 === 0 ? '#06d6a0' : idx % 2 === 0 ? '#f4a261' : '#e9c46a',
    rust: [],
    goldTooth: -1,
    locked: false
  };
}

function resetGame() {
  const rootGear = {
    idx: 0, x: 0, y: 80, r: 46, teeth: 12,
    ang: 0, dir: 1, ratio: 1,
    col: '#ffbe0b', rust: [0], goldTooth: 6, locked: true
  };
  G = {
    t: 0, diff: 0, score: 0, lives: 3, streak: 0, maxStreak: 0, cogsMeshed: 0,
    windTime: 18, maxWind: 18, baseSpd: 1.45,
    camX: 0, camY: 20,
    gears: [rootGear],
    cand: null,
    orbitAng: -Math.PI * 0.5, wantAng: -Math.PI * 0.5,
    lunge: 0,
    parts: [], pops: [],
    shake: 0, slowmo: 1, flash: 0, hint: 1,
    rank: -1, hiNew: false, reason: '', saved: false
  };
  G.cand = makeNextGear(1, rootGear, 0);
  G.orbitAng = Math.atan2(G.cand.y - rootGear.y, G.cand.x - rootGear.x);
  G.wantAng = G.orbitAng;
}

/* ---------- loop control ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const rawDt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
  last = now;
  try {
    update(rawDt * (G ? G.slowmo : 1), rawDt);
    draw(now);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  ptr.down = false; ptr.id = null; keys.l = keys.r = 0;
  document.hidden ? stopLoop() : startLoop();
});
window.addEventListener('blur', () => { ptr.down = false; ptr.id = null; keys.l = keys.r = 0; });

function startGame() {
  stopLoop();
  ptr.down = false; ptr.id = null; keys.l = keys.r = 0;
  resetGame();
  state = STATES.PLAYING;
  sfx.start();
  startLoop();
}

/* ---------- coordinate helpers & juice ---------- */
const WX = x => cx + (x - G.camX) * S;
const WY = y => cy + (y - G.camY) * S;
const mult = () => 1 + Math.min(G.streak, 16) * 0.25;

function pop(t, col, wx, wy, sz = 20) {
  G.pops.push({ t, col, x: WX(wx), y: WY(wy), sz, l: 1.1 });
}
function burst(wx, wy, n, cols, sp = 210) {
  const x = WX(wx), y = WY(wy);
  for (let i = 0; i < n && G.parts.length < 260; i++) {
    const a = Math.random() * TAU, v = sp * rr(0.35, 1.15);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, l: rr(0.35, 0.8), m: 0.8, c: cols[i % cols.length], r: rr(2, 4.5) });
  }
}

function hurtClock(why, wx, wy) {
  const g = G;
  g.lives--;
  g.streak = 0;
  g.shake = 16;
  g.flash = 0.7;
  sfx.clash();
  burst(wx, wy, 28, ['#ef476f', '#ffbe0b', '#ffffff'], 250);
  pop(why, '#ef476f', wx, wy - 22, 22);
  if (g.lives <= 0) {
    g.reason = why;
    endGame();
  }
}

function endGame() {
  if (G.saved) return;
  G.saved = true;
  state = STATES.GAMEOVER;
  overAt = performance.now();
  const prior = top5[0] || 0;
  G.rank = saveScore(G.score, G.cogsMeshed, G.maxStreak);
  G.hiNew = G.score > prior && G.score > 0;
  sfx.over();
}

function attemptMeshGear() {
  const g = G;
  if (state !== STATES.PLAYING || !g.cand) return;
  const active = g.gears[g.gears.length - 1];
  const cand = g.cand;
  const dist = active.r + cand.r - 2;
  const mx = active.x + Math.cos(g.orbitAng) * dist;
  const my = active.y + Math.sin(g.orbitAng) * dist;
  const contactX = active.x + Math.cos(g.orbitAng) * active.r;
  const contactY = active.y + Math.sin(g.orbitAng) * active.r;

  // Which tooth of the active driving gear is currently at g.orbitAng?
  const localContact = normAng(g.orbitAng - active.ang);
  const toothPitch = TAU / active.teeth;
  const nearestTooth = Math.round(localContact / toothPitch) % active.teeth;
  const toothCenterAng = normAng(active.ang + nearestTooth * toothPitch);
  const toothErr = angDiff(g.orbitAng, toothCenterAng) / (toothPitch * 0.5); // 0 = dead on tooth tip, 1 = dead in gap!

  // 1. Check if player meshed onto a Red Rust Tooth!
  for (const rt of active.rust) {
    const rAng = normAng(active.ang + rt * toothPitch);
    if (angDiff(g.orbitAng, rAng) < toothPitch * 0.62) {
      hurtClock('RUST TOOTH GRIND!', contactX, contactY);
      return;
    }
  }

  // 2. Check if player hit the Golden Mainspring Socket OR a clean Blueprint Target Alignment!
  const goldAng = normAng(active.ang + active.goldTooth * toothPitch);
  const hitGold = angDiff(g.orbitAng, goldAng) < toothPitch * 0.68;

  const targetAng = Math.atan2(cand.y - active.y, cand.x - active.x);
  const alignErr = angDiff(g.orbitAng, targetAng);
  const inBlueprint = alignErr < 0.34;
  const isPerfAlign = alignErr < 0.11;

  if (!inBlueprint && !hitGold) {
    hurtClock('MISSED BLUEPRINT ARBOR!', mx, my);
    return;
  }

  // Successful Gear Mesh!
  cand.x = mx;
  cand.y = my;
  cand.locked = true;
  // Phase-lock the new gear's teeth so they interleave cleanly with the driving gear
  cand.ang = normAng(g.orbitAng + Math.PI - (localContact * (active.teeth / cand.teeth)) + Math.PI / cand.teeth);
  g.gears.push(cand);
  g.cogsMeshed++;
  if (g.cogsMeshed >= 1) g.hint = Math.min(g.hint, 0.99);

  g.streak++;
  g.maxStreak = Math.max(g.maxStreak, g.streak);

  const isPerf = isPerfAlign || hitGold;
  const basePts = 120 + (hitGold ? 180 : 0) + (isPerfAlign ? 90 : 0);
  const pts = Math.round(basePts * mult());
  g.score += pts;

  // Refill Clock Mainspring Wind!
  const windGain = hitGold ? 6.5 : isPerfAlign ? 4.2 : 2.8;
  g.windTime = Math.min(g.maxWind, g.windTime + windGain);

  if (hitGold) sfx.wind();
  sfx.mesh(g.streak, isPerf, hitGold);
  g.shake = isPerf ? 11 : 6;
  if (hitGold || isPerfAlign) g.slowmo = 0.38;

  burst(contactX, contactY, isPerf ? 26 : 14, hitGold ? ['#ffbe0b', '#06d6a0', '#ffffff'] : ['#ffbe0b', '#ffffff'], 220);
  const tag = (hitGold ? 'MAINSPRING WIND! +' : isPerfAlign ? 'PERFECT MESH! +' : 'LOCKED! +') + pts;
  pop(tag, hitGold ? '#06d6a0' : (isPerfAlign ? '#ffbe0b' : '#fff6e8'), contactX, contactY - 18, isPerf ? 22 : 18);

  // Prune old gears far below camera so array stays small & fast
  if (g.gears.length > 9) g.gears.shift();

  const newActive = g.gears[g.gears.length - 1];
  g.cand = makeNextGear(g.cogsMeshed + 1, newActive, g.diff);
  g.wantAng = Math.atan2(g.cand.y - newActive.y, g.cand.x - newActive.x);
}

/* ---------- update ---------- */
function update(dt, rawDt) {
  const g = G;
  g.t += dt;
  g.shake *= Math.exp(-8 * rawDt);
  g.flash = Math.max(0, g.flash - rawDt * 2.5);
  g.slowmo += (1 - g.slowmo) * Math.min(1, rawDt * 5);

  for (const bc of bgCogs) bc.a = normAng(bc.a + bc.spd * rawDt);
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i]; p.l -= rawDt;
    if (p.l <= 0) { g.parts.splice(i, 1); continue; }
    p.vy += 420 * rawDt; p.x += p.vx * rawDt; p.y += p.vy * rawDt;
  }
  for (let i = g.pops.length - 1; i >= 0; i--) {
    const p = g.pops[i]; p.l -= rawDt;
    if (p.l <= 0) g.pops.splice(i, 1); else p.y -= 30 * rawDt;
  }

  // Rotate all locked gears in the train!
  let spd = g.baseSpd * (1 + g.diff * 0.85);
  for (let i = 0; i < g.gears.length; i++) {
    const gr = g.gears[i];
    if (i > 0) {
      const prev = g.gears[i - 1];
      spd = spd * (prev.teeth / gr.teeth);
      spd = clamp(spd, 0.85, 3.6);
    }
    gr.ang = normAng(gr.ang + gr.dir * spd * dt);
  }

  if (state !== STATES.PLAYING) return;

  g.diff = 1 - Math.exp(-(g.cogsMeshed * 220 + g.score * 0.18) / 3200);
  if (g.hint < 1) g.hint = Math.max(0, g.hint - rawDt * 1.4);
  sfx.tick();

  // Smooth camera follow on active top gear
  const active = g.gears[g.gears.length - 1];
  const targetCamX = (active.x + (g.cand ? g.cand.x : active.x)) * 0.5;
  const targetCamY = (active.y + (g.cand ? g.cand.y : active.y)) * 0.5;
  g.camX = lerp(g.camX, targetCamX, rawDt * 6);
  g.camY = lerp(g.camY, targetCamY, rawDt * 6);

  // Orbit control for candidate gear
  const kTurn = keys.r - keys.l;
  if (kTurn !== 0) g.wantAng = normAng(g.wantAng + kTurn * 2.8 * dt);
  let dAng = g.wantAng - g.orbitAng;
  dAng = Math.atan2(Math.sin(dAng), Math.cos(dAng));
  g.orbitAng = normAng(g.orbitAng + dAng * Math.min(1, rawDt * 16));

  // Rotate candidate gear preview in sync
  if (g.cand) {
    g.cand.ang = normAng(g.cand.ang + g.cand.dir * spd * dt);
  }

  // Mainspring wind countdown
  g.windTime -= dt;
  if (g.windTime <= 0) {
    g.windTime = g.maxWind * 0.65;
    hurtClock('MAINSPRING RUNDOWN!', active.x, active.y);
  }
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 800) startGame(); return; }
  if (state !== STATES.PLAYING || ptr.id !== null) return;

  ptr.id = e.pointerId;
  ptr.down = true;
  const active = G.gears[G.gears.length - 1];
  G.wantAng = Math.atan2(e.clientY - WY(active.y), e.clientX - WX(active.x));
});

cv.addEventListener('pointermove', e => {
  if (state !== STATES.PLAYING) return;
  if (e.pointerId === ptr.id || e.pointerType === 'mouse') {
    const active = G.gears[G.gears.length - 1];
    G.wantAng = Math.atan2(e.clientY - WY(active.y), e.clientX - WX(active.x));
  }
});

function onUp(e) {
  if (e.pointerId !== ptr.id) return;
  ptr.id = null;
  ptr.down = false;
  if (state === STATES.PLAYING) attemptMeshGear();
}
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', e => { if (e.pointerId === ptr.id) { ptr.id = null; ptr.down = false; } });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') { keys.l = 1; e.preventDefault(); }
  else if (c === 'ArrowRight' || c === 'KeyD') { keys.r = 1; e.preventDefault(); }
  else if ((c === 'Space' || c === 'Enter' || c === 'ArrowUp' || c === 'KeyW') && !e.repeat) {
    e.preventDefault(); audio();
    if (state === STATES.START) startGame();
    else if (state === STATES.GAMEOVER && performance.now() - overAt > 800) startGame();
    else if (state === STATES.PLAYING) attemptMeshGear();
  }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 0;
  else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 0;
});

/* ---------- rendering ---------- */
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, sz, col, align = 'center', maxW = 0, weight = 800) {
  let f = Math.max(8, sz);
  ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  if (maxW > 0) {
    while (f > 9 && ctx.measureText(s).width > maxW) {
      f--;
      ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    }
  }
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v * k), 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}

function drawGearShape(x, y, r, teeth, ang, col, rustList, goldTooth, alpha = 1) {
  if (r < 4) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(ang);

  const rInner = r * 0.84;
  const rOuter = r * 1.08;
  const step = TAU / teeth;

  // Draw Gear Rim & Involute Teeth
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = i * step;
    const a1 = a0 + step * 0.22;
    const a2 = a0 + step * 0.52;
    const a3 = a0 + step * 0.74;
    ctx.lineTo(Math.cos(a0) * rInner, Math.sin(a0) * rInner);
    ctx.lineTo(Math.cos(a1) * rOuter, Math.sin(a1) * rOuter);
    ctx.lineTo(Math.cos(a2) * rOuter, Math.sin(a2) * rOuter);
    ctx.lineTo(Math.cos(a3) * rInner, Math.sin(a3) * rInner);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 246, 232, 0.38)';
  ctx.lineWidth = Math.max(1, 1.5 * S);
  ctx.stroke();

  // Inner cutout ring & 4 brass spokes
  ctx.fillStyle = '#18100a';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.56, 0, TAU); ctx.fill();

  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(2, r * 0.16);
  for (let s = 0; s < 4; s++) {
    const sa = s * Math.PI * 0.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(sa) * r * 0.62, Math.sin(sa) * r * 0.62);
    ctx.stroke();
  }

  // Center Steel Arbor Pin
  ctx.fillStyle = '#dee2e6';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(3, r * 0.2), 0, TAU); ctx.fill();

  // Highlight Golden Mainspring Tooth
  if (goldTooth >= 0) {
    const ga = goldTooth * step + step * 0.37;
    const gx = Math.cos(ga) * (r * 0.96), gy = Math.sin(ga) * (r * 0.96);
    ctx.fillStyle = '#06d6a0';
    ctx.beginPath(); ctx.arc(gx, gy, Math.max(3.5, r * 0.18), 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Highlight Red Rust Teeth Hazards
  if (rustList && rustList.length) {
    for (const rt of rustList) {
      const ra = rt * step + step * 0.37;
      const rx = Math.cos(ra) * (r * 0.96), ry = Math.sin(ra) * (r * 0.96);
      ctx.fillStyle = '#ef476f';
      ctx.beginPath(); ctx.arc(rx, ry, Math.max(4, r * 0.2), 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2b0912'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  ctx.restore();
}

function drawClockworkWorld(now) {
  const bg = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#2b190e');
  bg.addColorStop(0.55, '#170d07');
  bg.addColorStop(1, '#0b0603');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Parallax Background Clockwork Cogs
  for (const bc of bgCogs) {
    drawGearShape(cx + bc.x * S, cy + bc.y * S, bc.r * S, bc.teeth, bc.a, '#26170d', null, -1, 0.55);
  }

  const g = G;
  const active = g.gears[g.gears.length - 1];

  // Blueprint Target Arbor Ghost for next gear
  if (state === STATES.PLAYING && g.cand) {
    const bx = WX(g.cand.x), by = WY(g.cand.y), br = g.cand.r * S;
    const targetAng = Math.atan2(g.cand.y - active.y, g.cand.x - active.x);
    const aligned = angDiff(g.orbitAng, targetAng) < 0.34;

    ctx.save();
    ctx.setLineDash([5 * S, 5 * S]);
    ctx.strokeStyle = aligned ? '#06d6a0' : 'rgba(255, 190, 11, 0.65)';
    ctx.lineWidth = (aligned ? 3 : 2) * S;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = aligned ? '#06d6a0' : '#ffbe0b';
    ctx.beginPath(); ctx.arc(bx, by, 4.5 * S, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Draw all locked 3D Brass Gears in the train
  for (let i = 0; i < g.gears.length; i++) {
    const gr = g.gears[i];
    const isAct = i === g.gears.length - 1;
    const sx = WX(gr.x), sy = WY(gr.y), sr = gr.r * S;
    // 3D Extruded Shadow Layer
    drawGearShape(sx + 4 * S, sy + 6 * S, sr, gr.teeth, gr.ang, shade(gr.col, 0.45), null, -1, 1);
    // Main Gear Face
    drawGearShape(sx, sy, sr, gr.teeth, gr.ang, gr.col, isAct ? gr.rust : null, isAct ? gr.goldTooth : -1, 1);
  }

  // Draw Orbiting Candidate Gear attached to player's caliper arm
  if (state === STATES.PLAYING && g.cand) {
    const dist = active.r + g.cand.r - 2;
    const ox = active.x + Math.cos(g.orbitAng) * dist;
    const oy = active.y + Math.sin(g.orbitAng) * dist;
    const sox = WX(ox), soy = WY(oy), sr = g.cand.r * S;

    // Caliper arm connecting active center to candidate center
    ctx.strokeStyle = 'rgba(255, 246, 232, 0.35)';
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.moveTo(WX(active.x), WY(active.y));
    ctx.lineTo(sox, soy);
    ctx.stroke();

    drawGearShape(sox, soy, sr, g.cand.teeth, g.cand.ang, g.cand.col, null, -1, 0.85);
  }
}

function panel(x, y, w, h) {
  rrect(x, y, w, h, 12);
  ctx.fillStyle = 'rgba(22, 12, 6, 0.84)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255, 190, 11, 0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawHUD(now) {
  const g = G, pad = 10, topY = safeTop + 8, ph = Math.min(52, W * 0.13);
  const w1 = W * 0.31, w2 = W * 0.26, w3 = W * 0.28;

  // Left: Score
  panel(pad, topY, w1, ph);
  txt('SCORE', pad + w1 * 0.5, topY + ph * 0.28, Math.min(10, W / 35), '#d8b898', 'center', w1 - 10, 700);
  txt(String(Math.floor(g.score)), pad + w1 * 0.5, topY + ph * 0.68, Math.min(22, W / 16), '#fff', 'center', w1 - 12, 900);

  // Center: Multiplier & Cogs Meshed
  const x2 = W * 0.5 - w2 * 0.5;
  panel(x2, topY, w2, ph);
  txt('x' + mult().toFixed(2).replace(/\.00$/, '.0'), W * 0.5, topY + ph * 0.35, Math.min(18, W / 19), '#ffbe0b', 'center', w2 - 8, 900);
  txt('COGS ' + g.cogsMeshed, W * 0.5, topY + ph * 0.74, Math.min(10, W / 35), '#ffe6cc', 'center', w2 - 8, 700);

  // Right: Lives
  const x3 = W - pad - w3;
  panel(x3, topY, w3, ph);
  for (let i = 0; i < 3; i++) {
    const hx = x3 + w3 * (0.22 + i * 0.28), hy = topY + ph * 0.5, r = Math.min(8, w3 / 12);
    ctx.fillStyle = i < g.lives ? '#ffbe0b' : 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.arc(hx, hy, r, 0, TAU); ctx.fill();
  }

  // Mainspring Tension Bar below top HUD
  const by = topY + ph + 10, bw = Math.min(300, W - 28), bx = W * 0.5 - bw * 0.5;
  rrect(bx, by, bw, 8, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
  const fr = clamp(g.windTime / g.maxWind, 0, 1);
  rrect(bx, by, Math.max(6, bw * fr), 8, 4);
  ctx.fillStyle = fr < 0.28 ? '#ef476f' : '#06d6a0'; ctx.fill();
  txt('MAINSPRING WIND  •  HIT GREEN TOOTH OR ARBOR', W * 0.5, by + 18, Math.min(10.5, W / 33), fr < 0.28 ? '#ef476f' : '#ffbe0b', 'center', W - 20, 800);

  // Onboarding Hint
  if (state === STATES.PLAYING && g.hint > 0) {
    ctx.globalAlpha = clamp(g.hint, 0, 1);
    const hw = Math.min(330, W * 0.9), hy = H - 46;
    panel(W * 0.5 - hw * 0.5, hy - 24, hw, 48);
    txt('DRAG to orbit gear into the dotted arbor • RELEASE!', W * 0.5, hy - 7, Math.min(13, W / 25), '#fff', 'center', hw - 16, 900);
    txt('Mesh green tooth for bonus wind • Avoid red rust teeth!', W * 0.5, hy + 11, Math.min(11, W / 32), '#ffbe0b', 'center', hw - 16, 600);
    ctx.globalAlpha = 1;
  }
}

function drawStart(now) {
  ctx.fillStyle = 'rgba(15, 8, 4, 0.64)'; ctx.fillRect(0, 0, W, H);
  const b = Math.min(54, W / 7);
  txt('GEAR CLOCK', W * 0.5, safeTop + H * 0.16, b, '#ffbe0b', 'center', W - 28, 900);
  txt('Mesh the brass cogs. Wind the grand clock tower.', W * 0.5, safeTop + H * 0.16 + b * 0.85, Math.min(15, W / 23), '#fff6e8', 'center', W - 28, 600);
  ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.006);
  txt('TAP TO WIND', W * 0.5, H * 0.72, Math.min(28, W / 12), '#06d6a0', 'center', W - 28, 900);
  ctx.globalAlpha = 1;
  if (top5[0]) txt('BEST ' + top5[0] + '  •  COGS ' + bestCogs + '  •  STREAK ' + bestStreak, W * 0.5, H * 0.72 + 36, Math.min(14, W / 25), '#ffbe0b', 'center', W - 28, 700);
}

function drawOver(now) {
  ctx.fillStyle = 'rgba(15, 8, 4, 0.82)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 24, 360), ph = Math.min(H - safeTop - 24, 350);
  const x = W * 0.5 - pw * 0.5, y = Math.max(safeTop + 10, (H - ph) * 0.5), k = ph / 350;
  panel(x, y, pw, ph);
  txt(G.reason || 'CLOCKWORK JAMMED', W * 0.5, y + 30 * k, Math.min(22, pw / 12), '#ef476f', 'center', pw - 24, 900);
  txt(String(Math.floor(G.score)), W * 0.5, y + 72 * k, Math.min(44, pw / 6.5), '#fff', 'center', pw - 24, 900);
  txt(G.hiNew ? 'NEW HIGH SCORE!' : 'Cogs Meshed: ' + G.cogsMeshed + '  •  Best Streak: ' + G.maxStreak, W * 0.5, y + 108 * k, Math.min(14, pw / 20), G.hiNew ? '#ffbe0b' : '#ffe6cc', 'center', pw - 24, 800);
  txt('TOP 5 HOROLOGISTS', W * 0.5, y + 136 * k, 12, '#d8b898', 'center', pw - 24, 700);

  for (let i = 0; i < 5; i++) {
    const yy = y + (160 + i * 23) * k, sc = top5[i], me = i === G.rank;
    if (me) { rrect(x + 16, yy - 10 * k, pw - 32, 20 * k, 6); ctx.fillStyle = 'rgba(255,190,11,0.22)'; ctx.fill(); }
    txt((i + 1) + '.', x + 28, yy, 14, me ? '#ffbe0b' : '#d8b898', 'left', 30, 800);
    txt(sc === undefined ? '-' : String(sc), x + pw - 28, yy, 14, me ? '#ffbe0b' : '#fff6e8', 'right', pw - 80, 800);
  }
  if (performance.now() - overAt > 800) {
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.007);
    txt('TAP TO WIND AGAIN', W * 0.5, y + ph - 26 * k, Math.min(20, pw / 15), '#06d6a0', 'center', pw - 24, 900);
    ctx.globalAlpha = 1;
  }
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rr(-1, 1) * G.shake, rr(-1, 1) * G.shake);

  drawClockworkWorld(now);

  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.l / p.m, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of G.pops) {
    ctx.globalAlpha = clamp(p.l * 1.4, 0, 1);
    txt(p.t, clamp(p.x, 75, W - 75), p.y, p.sz, p.col, 'center', W - 20, 900);
  }
  ctx.globalAlpha = 1;
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${G.flash * 0.38})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (state === STATES.START) drawStart(now);
  else {
    drawHUD(now);
    if (state === STATES.GAMEOVER) drawOver(now);
  }
}

resize();
resetGame();
startLoop();
})();
</script>
