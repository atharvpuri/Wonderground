<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Deep Ping</title>
<style>
:root{--bg:#020712;--fg:#d8f6ff;--acc:#4fe0ff}
@media (prefers-color-scheme:dark){:root{--bg:#01040b;--fg:#e2f9ff;--acc:#5ae6ff}}
[data-theme=abyss]{--acc:#4fe0ff}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head>
<body data-theme="abyss"><div id="probe"></div><canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WW=400,KEY='deep-ping-v1',FONT='system-ui,-apple-system,Segoe UI,Roboto,sans-serif',PSPEED=700,PRANGE=480,BR=9,PCOST=.34;
const STATES={START:0,PLAYING:1,GAMEOVER:2};
let W=0,H=0,dpr=1,safeTop=0,S=1,OX=0;
let st=STATES.START,paused=false,raf=0,last=0,gt=0;
let sub,bz,tgtX,rocks,plank,fish,pings,parts,pops,genZ,energy,score,streak,bestStreak,comboT,planktonN,nearN,pingN,shake,slow,flash,overT,saved,rank,newBest,reason,revealAll,dead,pid,btnShake;
let bonus=0,steerId=null,lastPX=0,downT=0,moved=0,keyL=false,keyR=false,hintSeen=false,hintA=0,rng,distSc;
let save={scores:[],bestDepth:0,bestStreak:0,hint:false};
const motes=[];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dAt=z=>1-Math.exp(-Math.max(0,z)/3500);
function hwAt(z){return 125-55*dAt(z)}
function cxAt(z){const d=dAt(z),A=60+70*d,hw=hwAt(z);return clamp(200+A*(Math.sin(z*.0042)*.6+Math.sin(z*.0117+1.2)*.4),hw+15,385-hw)}
const SX=x=>OX+x*S,SY=z=>H*.3+(z-bz)*S;
const btn=()=>({x:W-Math.min(54,W*.14)-12,y:H-Math.min(54,W*.14)-18-0,r:Math.min(40,W*.1)});

function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object'){
 if(Array.isArray(d.scores))save.scores=d.scores.filter(n=>typeof n==='number'&&isFinite(n)&&n>=0).sort((a,b)=>b-a).slice(0,5);
 save.bestDepth=clamp(+d.bestDepth||0,0,9e6);save.bestStreak=clamp(+d.bestStreak||0,0,9999);save.hint=!!d.hint}}catch(e){}
 hintSeen=save.hint;hintA=hintSeen?0:1}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* audio */
let AC=null,master=null,nbuf=null;const sfxT={};
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type,v,slide,delay){if(!AC)return;try{const tt=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,tt);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),tt+d);g.gain.setValueAtTime(v||.15,tt);g.gain.exponentialRampToValueAtTime(.001,tt+d);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+d+.03)}catch(e){}}
function hiss(d,v,fq,type,delay){if(!AC||!nbuf)return;try{const tt=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(.001,tt+d);s.connect(f);f.connect(g);g.connect(master);s.start(tt);s.stop(tt+d)}catch(e){}}
function sfx(n,a){const now=performance.now();if(sfxT[n]&&now-sfxT[n]<(n==='tick'?70:50))return;sfxT[n]=now;
 switch(n){
 case'ui':tone(520,.1,'square',.1,300);tone(780,.1,'square',.08,0,.06);break;
 case'ping':tone(1500,.5,'sine',.16,-1100);tone(750,.6,'sine',.08,-400,.02);break;
 case'tick':tone(1400-clamp(a,0,500)*1.6,.06,'triangle',.05);break;
 case'deny':tone(140,.15,'sawtooth',.09,-50);break;
 case'plank':tone(600*Math.pow(1.0595,Math.min(a,12)*2),.14,'sine',.15);tone(1200*Math.pow(1.0595,Math.min(a,12)*2),.1,'triangle',.06,0,.04);break;
 case'near':hiss(.2,.25,3000,'bandpass');tone(500,.18,'triangle',.08,500);break;
 case'screech':hiss(.5,.2,5000,'highpass');tone(900,.45,'sawtooth',.05,900);break;
 case'die':hiss(.8,.55,800);tone(160,.8,'sawtooth',.16,-120);break;
 case'best':[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,0,i*.1));break}}

/* game */
function startGame(){
 rng=mulberry32((Date.now()&0xffffff)|1);
 sub={x:200,vx:0};bz=0;bonus=0;tgtX=200;rocks=[];plank=[];fish=[];pings=[];parts=[];pops=[];genZ=330;energy=1;score=0;streak=0;bestStreak=0;comboT=0;planktonN=0;nearN=0;pingN=0;
 shake=0;slow=0;flash=0;overT=0;saved=false;rank=-1;newBest=false;reason='';revealAll=false;dead=false;pid=0;btnShake=0;steerId=null;keyL=keyR=false;paused=false;distSc=0;
 genAhead();st=STATES.PLAYING;startLoop()}
const mult=()=>1+Math.min(4,Math.floor(streak/3));
function pop(x,z,txt,col){if(pops.length<14)pops.push({x,z,txt,col,life:1})}
function genRow(){
 const z=genZ,d=dAt(z),cx=cxAt(z),hw=hwAt(z),sp=230-110*d+rng()*60;
 genZ+=sp;
 if(rng()<.88){let r=14+rng()*(12+8*d),x=cx+(rng()*2-1)*(hw-r-6),xl=cx-hw;
  const fl=(x-r)-xl,fr=(cx+hw)-(x+r);if(Math.max(fl,fr)<46){r=Math.max(12,r-6);x=fl>fr?cx-hw+r+50:cx+hw-r-50}
  rocks.push({x,z,r,pid:-1,seed:rng()*6})}
 if(rng()<.55){const pz=z+sp*.5,px=cx+(rng()*2-1)*(hw-24);plank.push({x:px,z:pz,got:false,ph:rng()*6})}
 if(z>1500&&rng()<.1+.25*d&&!fish.some(f=>f.z>bz)){const dir=rng()<.5?1:-1;fish.push({x:dir>0?-30:430,z:z+sp*.6,dir,sp:150+80*d+rng()*40,on:false,pid:-1,r:15,ph:rng()*6})}}
function genAhead(){while(genZ<bz+H/S*.8+500)genRow()}
function ping(){
 if(st!==STATES.PLAYING||paused||dead)return;
 if(energy<PCOST){btnShake=.3;sfx('deny');return}
 energy-=PCOST;pings.push({x:sub.x,z:bz,age:0,id:++pid});pingN++;sfx('ping');
 if(!hintSeen){hintSeen=true;save.hint=true;persist()}}
function die(r){if(dead)return;dead=true;reason=r;st=STATES.GAMEOVER;overT=0;revealAll=true;shake=14;slow=.5;flash=.6;sfx('die');
 for(let i=0;i<30;i++){const a=Math.random()*6.283,s=40+Math.random()*160;parts.push({x:sub.x,z:bz,vx:Math.cos(a)*s,vz:Math.sin(a)*s,life:1,col:'#ffd24a',size:2+Math.random()*3})}
 if(!saved){saved=true;const sc=score;let i=save.scores.findIndex(v=>sc>v);if(i<0)i=save.scores.length;
  if(sc>0){save.scores.splice(i,0,sc);save.scores=save.scores.slice(0,5);rank=i<5?i:-1}
  newBest=rank===0;save.bestStreak=Math.max(save.bestStreak,bestStreak);save.bestDepth=Math.max(save.bestDepth,Math.floor(bz/10));persist();if(newBest)setTimeout(()=>sfx('best'),500)}}
function addStreak(){streak++;comboT=3.2;if(streak>bestStreak)bestStreak=streak}

function reveal(x,z){let f=0;
 for(const p of pings){const dd=Math.hypot(x-p.x,z-p.z),fr=p.age*PSPEED;if(fr>=dd&&dd<PRANGE+60){f=Math.max(f,clamp(1-(p.age-dd/PSPEED)/2,0,1))}}
 const da=Math.hypot(x-sub.x,z-bz);if(da<75)f=Math.max(f,.75*(1-da/75));
 return revealAll?1:f}

function update(dt){
 gt+=dt;
 for(const m of motes){m.y-=m.sp*(st===STATES.PLAYING?(140+170*dAt(bz)):40)*S*dt*.6;if(m.y<-5){m.y=H+5;m.x=Math.random()*W}}
 if(paused||st===STATES.START)return;
 slow=Math.max(0,slow-dt);const d=dt*(slow>0?.4:1);
 if(st===STATES.PLAYING){
  const df=dAt(bz),v=140+170*df;
  if(keyL)tgtX-=330*dt;if(keyR)tgtX+=330*dt;tgtX=clamp(tgtX,0,400);
  const px=sub.x;sub.x+=clamp((tgtX-sub.x)*Math.min(1,d*10),-420*d,420*d);sub.vx=(sub.x-px)/Math.max(d,1e-4);
  bz+=v*d;distSc=bz;
  const cx=cxAt(bz),hw=hwAt(bz);
  if(sub.x-BR<cx-hw||sub.x+BR>cx+hw){die('Hit the trench wall');return}
  for(const r of rocks){if(Math.abs(r.z-bz)<r.r+BR&&Math.hypot(r.x-sub.x,r.z-bz)<r.r+BR-2){die('Hit a boulder');return}
   if(!r.passed&&r.z<bz){r.passed=true;const gap=Math.hypot(r.x-sub.x,r.z-bz)-r.r-BR;if(gap<14){nearN++;addStreak();const p=5*mult();bonus+=p;pop(sub.x,bz-30,'CLOSE +'+p,'#ff9');slow=.18;sfx('near')}}}
  for(const p of plank)if(!p.got&&Math.abs(p.z-bz)<24&&Math.hypot(p.x-sub.x,p.z-bz)<20){p.got=true;planktonN++;energy=Math.min(1,energy+.3);addStreak();const pt=10*mult();bonus+=pt;sfx('plank',streak);pop(p.x,p.z-20,'+'+pt,'#7dffb0');for(let i=0;i<8;i++)parts.push({x:p.x,z:p.z,vx:(Math.random()-.5)*120,vz:(Math.random()-.5)*120,life:.6,col:'#7dffb0',size:2})}
  for(const f of fish){if(!f.on&&f.z-bz<420){f.on=true;sfx('screech')}
   if(f.on){f.x+=f.dir*f.sp*d;if(Math.abs(f.z-bz)<f.r+BR&&Math.hypot(f.x-sub.x,f.z-bz)<f.r+BR-2){die('Eaten by an anglerfish');return}}}
  fish=fish.filter(f=>!(f.on&&(f.x<-80||f.x>480))&&f.z>bz-200);
  energy=Math.min(1,energy+.05*d);
  if(hintSeen&&hintA>0)hintA=Math.max(0,hintA-dt*1.5);
  if(comboT>0){comboT-=d;if(comboT<=0)streak=0}
  for(const p of pings){p.age+=d}
  pings=pings.filter(p=>p.age<(PRANGE/PSPEED+2.1));
  for(const p of pings){const fr=p.age*PSPEED;
   for(const r of rocks)if(r.pid!==p.id&&Math.abs(r.z-bz)<PRANGE+40){const dd=Math.hypot(r.x-p.x,r.z-p.z);if(fr>=dd&&dd<PRANGE){r.pid=p.id;sfx('tick',dd);
     for(let i=0;i<4;i++)parts.push({x:r.x+(Math.random()-.5)*r.r*2,z:r.z+(Math.random()-.5)*r.r*2,vx:(Math.random()-.5)*30,vz:(Math.random()-.5)*30,life:.5,col:'#9ef',size:1.8})}}
   for(const f of fish)if(f.pid!==p.id){const dd=Math.hypot(f.x-p.x,f.z-p.z);if(fr>=dd&&dd<PRANGE)f.pid=p.id}}
  genAhead();
  if(rocks.length>30){const lim=bz-300;rocks=rocks.filter(r=>r.z>lim);plank=plank.filter(p=>p.z>lim)}
  score=Math.floor(bz/12)+bonus;
  if(Math.random()<d*14&&parts.length<200)parts.push({x:sub.x+(Math.random()-.5)*6,z:bz-8,vx:(Math.random()-.5)*10,vz:-30,life:.8,col:'#6bd',size:1.5,bub:1});
 }else overT+=dt;
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=d;if(q.life<=0){parts.splice(i,1);continue}q.x+=q.vx*d;q.z+=(q.bub?-60:q.vz)*d}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.life-=dt*1.1;q.z-=25*dt;if(q.life<=0)pops.splice(i,1)}
 shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*1.5);btnShake=Math.max(0,btnShake-dt)}

/* draw */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,al,wt,out){ctx.font=(wt||800)+' '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';
 if(out){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='rgba(2,6,16,.9)';ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function panel(x,y,w,h,a){rr(x,y,w,h,14);ctx.fillStyle='rgba(4,12,28,'+(a||.8)+')';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(90,220,255,.35)';ctx.stroke()}

function drawWalls(){
 const z0=bz-.3*H/S-40,z1=bz+.7*H/S+40;let first=true;
 for(let side=0;side<2;side++){
  const pts=[];
  for(let z=Math.floor(z0/20)*20;z<=z1;z+=20){const x=side?cxAt(z)+hwAt(z):cxAt(z)-hwAt(z);pts.push([x,z,reveal(x,z)])}
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],f=(a[2]+b[2])/2;if(f<.02)continue;
   ctx.fillStyle='rgba(30,70,120,'+f*.7+')';ctx.beginPath();ctx.moveTo(SX(a[0]),SY(a[1]));ctx.lineTo(SX(b[0]),SY(b[1]));ctx.lineTo(side?W:0,SY(b[1]));ctx.lineTo(side?W:0,SY(a[1]));ctx.closePath();ctx.fill();
   ctx.strokeStyle='rgba(150,225,255,'+f+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(SX(a[0]),SY(a[1]));ctx.lineTo(SX(b[0]),SY(b[1]));ctx.stroke()}}}

function drawRock(r){const sy=SY(r.z);if(sy<-60||sy>H+60)return;const f=reveal(r.x,r.z);if(f<.02)return;
 const x=SX(r.x),R=r.r*S,dx=sub.x-r.x,dz=bz-r.z,dd=Math.hypot(dx,dz)||1,lx=dx/dd*R*.4,ly=dz/dd*R*.4;
 ctx.globalAlpha=f;const g=ctx.createRadialGradient(x+lx,sy+ly,R*.1,x,sy,R*1.05);g.addColorStop(0,'#d6efff');g.addColorStop(.5,'#4f78a8');g.addColorStop(1,'#101c36');
 ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*6.283,k=1+.1*Math.sin(r.seed*3+i*2.3);ctx.lineTo(x+Math.cos(a)*R*k,sy+Math.sin(a)*R*k)}ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(170,230,255,.85)';ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1}

function drawFish(f){const sy=SY(f.z);if(sy<-60||sy>H+60)return;const x=SX(f.x),R=f.r*S,fr=reveal(f.x,f.z)>0||(f.pid>=0&&0),rv=reveal(f.x,f.z);
 const lx=x+f.dir*(R*1.5),ly=sy-R*1.3,fl=.7+.3*Math.sin(gt*6+f.ph);
 ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(lx,ly,1,lx,ly,R*2.6);g.addColorStop(0,'rgba(255,220,90,'+fl+')');g.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=g;ctx.fillRect(lx-R*3,ly-R*3,R*6,R*6);ctx.globalCompositeOperation='source-over';
 ctx.strokeStyle='rgba(255,220,100,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+f.dir*R*.6,sy-R*.5);ctx.quadraticCurveTo(x+f.dir*R*1.4,sy-R*1.6,lx,ly);ctx.stroke();
 if(rv>.02){ctx.globalAlpha=rv;ctx.save();ctx.translate(x,sy);ctx.scale(f.dir,1);
  const bg=ctx.createRadialGradient(-R*.2,-R*.3,1,0,0,R*1.4);bg.addColorStop(0,'#c9a0ff');bg.addColorStop(.6,'#5a2f8a');bg.addColorStop(1,'#1a0c30');ctx.fillStyle=bg;
  ctx.beginPath();ctx.ellipse(0,0,R*1.3,R*.9,0,0,6.283);ctx.fill();ctx.beginPath();ctx.moveTo(-R*1.1,0);ctx.lineTo(-R*2,-R*.7);ctx.lineTo(-R*2,R*.7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(R*.6,-R*.15,R*.18,0,6.283);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<5;i++){ctx.moveTo(R*(.9+i*.08),R*.12);ctx.lineTo(R*(.95+i*.08),R*.4)}ctx.stroke();ctx.restore();ctx.globalAlpha=1}}

function drawPlank(p){const sy=SY(p.z);if(sy<-30||sy>H+30)return;const x=SX(p.x),r=6*S,pl=.6+.4*Math.sin(gt*4+p.ph);
 ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,sy,1,x,sy,r*3.5);g.addColorStop(0,'rgba(125,255,176,'+pl+')');g.addColorStop(1,'rgba(125,255,176,0)');ctx.fillStyle=g;ctx.fillRect(x-r*4,sy-r*4,r*8,r*8);ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#d8ffe8';ctx.beginPath();ctx.arc(x,sy,r*.5,0,6.283);ctx.fill()}

function drawSub(){const x=SX(sub.x),y=SY(bz),s=S,tilt=clamp(sub.vx/500,-.5,.5);
 ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
 ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(0,12*s,2,0,12*s,70*s);gl.addColorStop(0,'rgba(120,230,255,.22)');gl.addColorStop(1,'rgba(120,230,255,0)');ctx.fillStyle=gl;ctx.fillRect(-70*s,-60*s,140*s,170*s);ctx.globalCompositeOperation='source-over';
 const g=ctx.createLinearGradient(-9*s,0,9*s,0);g.addColorStop(0,'#a8741a');g.addColorStop(.4,'#ffd24a');g.addColorStop(1,'#8a5a10');
 ctx.fillStyle='#caa000';ctx.beginPath();ctx.moveTo(-10*s,-13*s);ctx.lineTo(0,-8*s);ctx.lineTo(10*s,-13*s);ctx.lineTo(7*s,-4*s);ctx.lineTo(-7*s,-4*s);ctx.closePath();ctx.fill();
 ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,9*s,15*s,0,0,6.283);ctx.fill();
 ctx.fillStyle='#4a2e08';ctx.fillRect(-2*s,-18*s,4*s,5*s);
 const pg=ctx.createRadialGradient(-1*s,3*s,1,0,5*s,5*s);pg.addColorStop(0,'#e6fbff');pg.addColorStop(1,'#2a7ab0');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,5*s,4.4*s,0,6.283);ctx.fill();
 ctx.strokeStyle='#5a3a0a';ctx.lineWidth=1.2*s;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.arc(0,0,7*s,3.5,4.6);ctx.stroke();
 ctx.fillStyle='rgba(220,250,255,.7)';ctx.beginPath();ctx.ellipse(0,16*s+Math.sin(gt*30)*1.5*s,5*s,1.4*s,0,0,6.283);ctx.fill();
 ctx.restore()}

function drawWorld(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04122a');g.addColorStop(1,'#01040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(140,220,255,.18)';for(const m of motes)ctx.fillRect(m.x,m.y,m.s,m.s);
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 if(rocks){drawWalls();for(const r of rocks)drawRock(r);for(const p of plank)if(!p.got)drawPlank(p);for(const f of fish)drawFish(f);
  ctx.globalCompositeOperation='lighter';
  for(const p of pings){const rad=Math.min(p.age*PSPEED,PRANGE)*S,a=clamp(1-p.age/(PRANGE/PSPEED+.4),0,1);if(a<=0)continue;ctx.strokeStyle='rgba(110,230,255,'+a*.8+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(SX(p.x),SY(p.z),rad,0,6.283);ctx.stroke();
   ctx.strokeStyle='rgba(110,230,255,'+a*.25+')';ctx.lineWidth=10;ctx.stroke()}
  for(const q of parts){ctx.globalAlpha=clamp(q.life*1.6,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(SX(q.x),SY(q.z),q.size*S,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(!dead)drawSub();
  for(const q of pops){ctx.globalAlpha=clamp(q.life*1.5,0,1);txt(q.txt,SX(q.x),SY(q.z),Math.min(20,W/17),q.col,'center',900,true)}ctx.globalAlpha=1}
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(200,240,255,'+flash*.3+')';ctx.fillRect(0,0,W,H)}}

function drawHUD(){
 const y0=safeTop+10,fs=Math.min(34,W/11);
 txt(String(score),W/2,y0+fs*.6,fs,'#fff','center',900,true);
 txt('DEPTH '+Math.floor(bz/10)+'m',W/2,y0+fs*1.25+6,Math.min(13,W/26),'#9fe8ff','center',800,true);
 panel(12,y0,92,30,.75);ctx.fillStyle='rgba(255,255,255,.12)';rr(20,y0+10,76,10,5);ctx.fill();
 const e=clamp(energy,0,1);ctx.fillStyle=energy<PCOST?'#ff6a5a':'#4fe0ff';if(e>0){rr(20,y0+10,Math.max(8,76*e),10,5);ctx.fill()}
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(20+76*PCOST,y0+8,2,14);
 const m=mult();panel(W-12-66,y0,66,30,.75);txt('x'+m,W-12-33,y0+16,16,m>1?'#7dffb0':'#9fe8ff','center',900);
 if(streak>0){ctx.fillStyle='rgba(125,255,176,.7)';ctx.fillRect(W-12-62,y0+34,62*clamp(comboT/3.2,0,1),3)}
 const b=btn(),sh=btnShake>0?Math.sin(gt*60)*4:0,rdy=energy>=PCOST;
 ctx.save();ctx.translate(sh,0);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fillStyle=rdy?'rgba(20,90,130,.75)':'rgba(60,30,40,.75)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=rdy?'rgba(110,230,255,.9)':'rgba(255,110,90,.7)';ctx.stroke();
 for(let i=1;i<=2;i++){ctx.strokeStyle='rgba(150,240,255,'+(rdy?.5:.2)/i+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(.25+.18*i),-2.3,-.8);ctx.stroke()}
 txt('PING',b.x,b.y+b.r*.42,Math.min(13,b.r*.34),'#d8f6ff','center',900);ctx.restore();
 if(hintA>0){ctx.globalAlpha=hintA;const hf=Math.min(16,W/22),hy=H*.62;txt('DRAG to steer  •  TAP PING to see',W/2,hy,hf,'#fff','center',800,true);txt('Rocks are invisible until you ping. Eat plankton.',W/2,hy+hf*1.5,hf*.85,'#9fe8ff','center',700,true);ctx.globalAlpha=1}}

function drawStart(){
 ctx.fillStyle='rgba(2,6,16,.45)';ctx.fillRect(0,0,W,H);
 const fs=Math.min(60,W/7);
 txt('DEEP',W/2,H*.3,fs,'#4fe0ff','center',900,true);txt('PING',W/2,H*.3+fs*.95,fs,'#ffd24a','center',900,true);
 txt('Dive the black trench by sonar.',W/2,H*.3+fs*1.9,Math.min(17,W/21),'#e2f9ff','center',700,true);
 txt('Ping to reveal rocks. Eat plankton.',W/2,H*.3+fs*1.9+24,Math.min(17,W/21),'#e2f9ff','center',700,true);
 const r=(gt*.6)%1;ctx.strokeStyle='rgba(110,230,255,'+(1-r)*.6+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H*.3-fs*1.1,20+r*60,0,6.283);ctx.stroke();
 txt('BEST  '+(save.scores[0]||0),W/2,H*.62,Math.min(22,W/16),'#7dffb0','center',900,true);
 ctx.globalAlpha=.6+.4*Math.sin(gt*5);txt('TAP TO PLAY',W/2,H*.72,Math.min(30,W/11),'#fff','center',900,true);ctx.globalAlpha=1}

function drawOver(){
 ctx.fillStyle='rgba(2,6,16,.5)';ctx.fillRect(0,0,W,H);
 const pw=Math.min(W-24,360),ph=Math.min(H-safeTop-20,400),x=(W-pw)/2,y=Math.max(safeTop+10,(H-ph)/2),cx=W/2,u=ph/400;
 panel(x,y,pw,ph,.9);
 txt(newBest?'NEW HIGH SCORE!':'SIGNAL LOST',cx,y+34*u,Math.min(28,pw/11),newBest?'#7dffb0':'#4fe0ff','center',900);
 txt(reason,cx,y+62*u,Math.min(15,pw/22),'#bfeeff','center',700);
 txt(String(score),cx,y+110*u,Math.min(54,pw/6.5),'#fff','center',900);
 txt('Depth '+Math.floor(bz/10)+'m  Plankton '+planktonN+'  Streak '+bestStreak,cx,y+152*u,Math.min(14,pw/25),'#e2f9ff','center',700);
 txt('TOP 5',cx,y+182*u,13,'#6bd','center',800);
 for(let i=0;i<5;i++){const v=save.scores[i],ry=y+208*u+i*24*u;
  if(i===rank){rr(x+24,ry-11*u,pw-48,22*u,8);ctx.fillStyle='rgba(125,255,176,.2)';ctx.fill()}
  txt((i+1)+'.',x+40,ry,14,i===rank?'#7dffb0':'#bfeeff','left',800);txt(v===undefined?'-':String(v),x+pw-40,ry,14,i===rank?'#7dffb0':'#bfeeff','right',800)}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(gt*6);txt('TAP TO RETRY',cx,y+ph-34*u,Math.min(24,pw/13),'#fff','center',900);ctx.globalAlpha=1}}

function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 drawWorld();
 if(st===STATES.START)drawStart();
 else{drawHUD();if(st===STATES.GAMEOVER)drawOver();
  if(paused){ctx.fillStyle='rgba(2,6,16,.75)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H*.45,40,'#fff','center',900);txt('TAP TO RESUME',W/2,H*.45+44,20,'#bfeeff','center',800)}}}

/* loop & input */
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:.016;last=ts;if(!isFinite(dt)||dt<0)dt=.016;dt=Math.min(.04,dt);
 try{update(dt);draw()}catch(e){console.error(e)}}
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 safeTop=document.getElementById('probe').offsetHeight||0;S=Math.min(W,H*.75,560)/WW;OX=(W-WW*S)/2}
function tapAction(){audio();
 if(st===STATES.START){sfx('ui');startGame();return true}
 if(st===STATES.GAMEOVER){if(overT>.8){sfx('ui');startGame()}return true}
 if(paused){paused=false;last=0;return true}
 return false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(tapAction())return;
 const b=btn();if(Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+10){ping();return}
 if(steerId!==null)return;steerId=e.pointerId;lastPX=e.clientX;downT=performance.now();moved=0});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==steerId||st!==STATES.PLAYING)return;const dx=e.clientX-lastPX;lastPX=e.clientX;moved+=Math.abs(dx);tgtX=clamp(tgtX+dx/S*1.3,0,400)});
function pend(e){if(e.pointerId!==steerId)return;steerId=null;if(moved<10&&performance.now()-downT<250)ping()}
cv.addEventListener('pointerup',pend);cv.addEventListener('pointercancel',e=>{if(e.pointerId===steerId)steerId=null});
window.addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA'){keyL=true;e.preventDefault();return}
 if(e.code==='ArrowRight'||e.code==='KeyD'){keyR=true;e.preventDefault();return}
 if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();if(e.repeat)return;if(tapAction())return;ping()}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keyL=false;else if(e.code==='ArrowRight'||e.code==='KeyD')keyR=false});
function lose(){steerId=null;keyL=keyR=false;if(st===STATES.PLAYING)paused=true}
window.addEventListener('blur',lose);
document.addEventListener('visibilitychange',()=>{if(document.hidden){lose();stopLoop()}else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,100));
document.addEventListener('contextmenu',e=>e.preventDefault());

load();resize();for(let i=0;i<50;i++)motes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*1.5,sp:.5+Math.random()});
bz=0;sub={x:200,vx:0};rocks=[];plank=[];fish=[];pings=[];parts=[];pops=[];energy=1;score=0;streak=0;shake=0;flash=0;dead=false;revealAll=false;tgtX=200;
startLoop();
</script></body></html>
