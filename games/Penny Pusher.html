if(ty===3){ctx.fillStyle='#ff4a4a';ctx.beginPath();ctx.arc(x,y,rx*0.28,0,6.283);ctx.fill();var fk=Math.sin(clock*18+ph);ctx.fillStyle=fk>0?'#ffd84a':'#ff7a2a';ctx.beginPath();ctx.arc(x+rx*0.55,y-ry*0.9,rx*0.18,0,6.283);ctx.fill();ctx.strokeStyle='#bbb';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+rx*0.3,y-ry*0.3);ctx.lineTo(x+rx*0.55,y-ry*0.9);ctx.stroke()}
ctx.globalAlpha=1}
function hud(){var pad=Math.max(10,W*0.03),tp=safeTop+pad,fs=Math.min(26,W/13);
ctx.fillStyle='rgba(10,4,24,0.65)';rr(pad,tp,Math.min(170,W*0.44),fs*2.1,12);ctx.fill();
txt('SCORE',pad+10,tp+fs*0.6,fs*0.4,'#d0b0ff','left','700');txt(String(Math.floor(score)),pad+10,tp+fs*1.4,fs,'#fff','left');
var hw=Math.min(130,W*0.34);ctx.fillStyle=tokens<=2?'rgba(120,10,30,0.8)':'rgba(10,4,24,0.65)';rr(W-pad-hw,tp,hw,fs*2.1,12);ctx.fill();
txt('TOKENS',W-pad-hw/2,tp+fs*0.6,fs*0.4,'#d0b0ff','center','700');txt(String(tokens),W-pad-hw/2,tp+fs*1.4,fs,tokens<=2?'#ff8a8a':'#ffe066','center');
if(chain>=2){txt('CHAIN '+chain+'  x'+mult(),W/2,tp+fs*2.9,Math.min(20,W/17),'#ffe066');ctx.fillStyle='rgba(255,224,102,0.8)';ctx.fillRect(W/2-40,tp+fs*3.6,80*Math.max(0,chainT/3),3)}
if(tokens<=0&&pend.length===0)txt('NO TOKENS! '+Math.max(0,5-noTok).toFixed(1)+'s',W/2,bot+60,Math.min(20,W/17),'#ff8a8a');
var bw=Math.min(110,W*0.3),bh=44,bx=W-pad-bw,by=H-bh-Math.max(12,H*0.02);nudgeBtn={x:bx,y:by,w:bw,h:bh};ctx.fillStyle=nudges>0?'rgba(255,90,200,0.85)':'rgba(60,40,80,0.8)';rr(bx,by,bw,bh,12);ctx.fill();txt('NUDGE x'+nudges,bx+bw/2,by+bh/2,Math.min(16,bw/7),'#fff');
txt('DRAG to aim \u2022 RELEASE to drop',pad+8,by+bh/2,Math.min(13,W/26),'#d0b0ff','left','700')}
function draw(){ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bgDraw();shelf();
var arr=coins.slice().sort(function(a,b){return a.y-b.y});
for(var i=0;i<arr.length;i++){var c=arr[i],p=proj(c.x,c.y);drawItem(c.ty,p.x,p.y,c.r*p.s,c.fl,c.ph)}
if(state===ST.PLAY){var ap=proj(aimX,pf+CR),at=proj(aimX,-10);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(at.x,at.y);ctx.lineTo(ap.x,ap.y);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.ellipse(ap.x,ap.y,CR*ap.s,CR*ap.s*0.55,0,0,6.283);ctx.stroke();if(cd<=0&&tokens>0)drawItem(0,at.x,at.y-6,CR*at.s*1.1,0,0)}
for(i=0;i<pend.length;i++){var pd=pend[i],k=Math.max(0,pd.t/0.22),pr=proj(pd.x,pf+CR),h=k*70;drawItem(pd.ty,pr.x,pr.y-h,rOf(pd.ty)*pr.s,0,0)}
for(i=0;i<falls.length;i++){var fl=falls[i],p2=proj(fl.x,fl.y);drawItem(fl.ty,p2.x,p2.y,fl.r*p2.s*(1-(1-fl.l)*0.4),0,fl.ph,Math.max(0,fl.l))}
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i],po=proj(o.x,o.y);ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(90,Math.min(W-90,po.x)),po.y+22+(1-o.l)*24,Math.min(16,W/20),o.c)}ctx.globalAlpha=1;
ctx.restore();
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.3)+')';ctx.fillRect(0,0,W,H)}
if(state===ST.PLAY){hud();if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(10,4,24,0.8)';var hw=Math.min(W-24,340),hy=top+(bot-top)*0.35;rr(W/2-hw/2,hy,hw,70,14);ctx.fill();txt('Drop coins in front of the pusher',W/2,hy+17,Math.min(15,W/23),'#fff');txt('Push them into the CHUTE, not the gutters!',W/2,hy+37,Math.min(12,W/28),'#d0b0ff','center','600');txt('Bombs in the chute cost 3 tokens.',W/2,hy+55,Math.min(12,W/28),'#ff9a9a','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(10,4,24,0.55)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('PENNY',W/2,y,Math.min(70,W/5.2),'#ffe066');txt('PUSHER',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#ff7ad0');
txt('Drop coins. Push the pile. Cash in.',W/2,y+Math.min(128,W/3),Math.min(15,W/23),'#e8d8ff','center','600');
var p=0.5+0.5*Math.sin(clock*4);txt('TAP TO PLAY',W/2,H*0.58,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   CHAIN '+best.chain,W/2,H*0.58+34,Math.min(15,W/24),'#d0b0ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(10,4,24,0.72)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#2a1450';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#ffe066';ctx.lineWidth=3;ctx.stroke();
var u=ph/430,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9ab8');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt(got+' collected \u2022 best chain '+bestChain+' \u2022 '+Math.floor(t)+'s',W/2,cy+114*u,Math.min(13,pw/24),'#d0b0ff','center','700');
txt('TOP 5',W/2,cy+142*u,Math.min(14,pw/24),'#e8d8ff','center','700');
for(var i=0;i<5;i++){var ry=cy+168*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(clock*5);ctx.fillStyle='rgba(255,224,102,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*u,Math.min(20,pw/16),'#2a1450')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
function onBtn(x,y){return nudgeBtn&&x>=nudgeBtn.x&&x<=nudgeBtn.x+nudgeBtn.w&&y>=nudgeBtn.y&&y<=nudgeBtn.y+nudgeBtn.h}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();
if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>0.8)startGame();return}
if(onBtn(e.clientX,e.clientY)){nudge();return}
if(aimId===null){aimId=e.pointerId;aiming=true;aimX=wxFromScreen(e.clientX)}});
cv.addEventListener('pointermove',function(e){if(state!==ST.PLAY)return;if(aimId===e.pointerId)aimX=wxFromScreen(e.clientX);else if(aimId===null&&e.pointerType==='mouse')aimX=wxFromScreen(e.clientX)});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}if(aimId===e.pointerId){aimId=null;aiming=false;if(e.type==='pointerup'&&state===ST.PLAY){aimX=wxFromScreen(e.clientX);dropCoin()}}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if([' ','ArrowLeft','ArrowRight'].indexOf(k)>-1)e.preventDefault();keys[k]=true;if(e.repeat)return;
if(k===' '||k==='Enter'){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}}
else if((k==='n'||k==='N'))nudge()});
window.addEventListener('keyup',function(e){keys[e.key]=false});
function relAll(){keys={};aimId=null;aiming=false}
window.addEventListener('blur',function(){relAll();stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){relAll();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
