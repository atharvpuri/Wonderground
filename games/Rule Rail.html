for(i=0;i<flying.length;i++){var fl=flying[i],e=fl.t*fl.t*(3-2*fl.t),x=fl.x+(fl.tx-fl.x)*e,y=fl.y+(fl.ty-fl.y)*e-Math.sin(fl.t*3.14)*30;drawItem(fl,x,y,fl.sc*(1-0.4*e),1-0.5*fl.t);if(!fl.ok){ctx.strokeStyle='rgba(255,60,60,'+(1-fl.t)+')';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-18,y-18);ctx.lineTo(x+18,y+18);ctx.moveTo(x+18,y-18);ctx.lineTo(x-18,y+18);ctx.stroke()}}}
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(80,Math.min(W-80,o.x)),o.y,Math.min(18,W/18),o.c)}ctx.globalAlpha=1;
ctx.restore();
if(flash>0){ctx.fillStyle='rgba(255,60,80,'+(flash*0.25)+')';ctx.fillRect(0,0,W,H)}
if(state===ST.PLAY){hud();
if(phase==='shift'){ctx.fillStyle='rgba(6,10,24,0.75)';ctx.fillRect(0,beltTop-40,W,beltBot-beltTop+30);txt(banner,W/2,beltTop+10,Math.min(26,W/12),'#ffe066');txt('MEMORIZE THE RULES!',W/2,beltTop+44,Math.min(15,W/24),'#fff');txt('First matching bin wins \u2022 else bin catches the rest',W/2,beltTop+72,Math.min(12,W/29),'#a0b4f0','center','600');
var pw2=Math.max(0,phaseT/2.6);ctx.fillStyle='#7aa8ff';ctx.fillRect(W/2-60,beltTop+96,120*pw2,5)}
if(toastT>0&&toast){ctx.globalAlpha=Math.min(1,toastT*2);ctx.fillStyle='rgba(120,10,30,0.88)';var tw=Math.min(W-20,360);rr(W/2-tw/2,beltBot-62,tw,36,10);ctx.fill();fit(toast,W/2,beltBot-44,tw-16,Math.min(14,W/24),'#fff','700');ctx.globalAlpha=1}
if(hintAlpha>0&&phase==='run'){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(6,10,24,0.8)';var hw2=Math.min(W-24,340),hy=beltTop-54;rr(W/2-hw2/2,hy,hw2,40,12);ctx.fill();txt('TAP a bin (or keys 1-2-3) to sort the front item',W/2,hy+14,Math.min(12.5,W/27),'#fff');txt('Left rule first, then middle, else right!',W/2,hy+29,Math.min(11.5,W/30),'#a0b4f0','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(6,10,24,0.6)';ctx.fillRect(0,0,W,H);var y=H*0.17+safeTop*0.5;
txt('RULE',W/2,y,Math.min(70,W/5.2),'#7aa8ff');txt('RAIL',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#ffd23f');
txt('Read the rules. Sort the cargo. Rules keep changing.',W/2,y+Math.min(126,W/3),Math.min(13.5,W/25),'#d0dcff','center','600');
txt('Think fast \u2022 first matching rule wins',W/2,y+Math.min(150,W/2.6),Math.min(12.5,W/28),'#8094c8','center','600');
var p=0.5+0.5*Math.sin(clock*4);txt('TAP TO PLAY',W/2,H*0.6,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   STREAK '+best.streak+'   \u2022   SHIFT '+best.shift,W/2,H*0.6+34,Math.min(13,W/26),'#8094c8','center','700')}
function drawOver(){ctx.fillStyle='rgba(6,10,24,0.78)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,440),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#18224a';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#7aa8ff';ctx.lineWidth=3;ctx.stroke();
var u=ph/440,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9ab0');if(toast)fit(toast,W/2,cy+24*u,pw-24,Math.min(12,pw/28),'#c0ccf0','600');
txt(String(Math.floor(score)),W/2,cy+72*u,Math.min(54,pw/6),'#fff');if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+110*u,Math.min(20,pw/16),'#ffd84a');
txt(sortedN+' sorted \u2022 best streak '+bestStreak+' \u2022 shift '+shiftIdx,W/2,cy+136*u,Math.min(13,pw/24),'#a0b4f0','center','700');
txt('TOP 5',W/2,cy+164*u,Math.min(14,pw/24),'#d0dcff','center','700');
for(var i=0;i<5;i++){var ry=cy+188*u+i*25*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-11*u,pw-32,22*u,8);ctx.fill()}var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(clock*5);ctx.fillStyle='rgba(122,168,255,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-60*u,200,44*u,14);ctx.fill();txt('TRY AGAIN',W/2,py+ph-38*u,Math.min(20,pw/16),'#0a1030')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();
if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>0.8)startGame();return}
var lane=Math.max(0,Math.min(2,Math.floor(e.clientX/(W/3))));decide(lane)});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){if(e.repeat)return;var k=e.key;if([' ','ArrowLeft','ArrowRight','ArrowDown'].indexOf(k)>-1)e.preventDefault();initAudio();
if(state===ST.START&&(k===' '||k==='Enter')){startGame();return}if(state===ST.OVER&&overT>0.8&&(k===' '||k==='Enter')){startGame();return}
if(state===ST.PLAY){if(k==='1'||k==='a'||k==='A'||k==='ArrowLeft')decide(0);else if(k==='2'||k==='s'||k==='S'||k==='ArrowDown')decide(1);else if(k==='3'||k==='d'||k==='D'||k==='ArrowRight')decide(2)}});
window.addEventListener('blur',function(){stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();resetRun();state=ST.START;startLoop();
})();
</script>
