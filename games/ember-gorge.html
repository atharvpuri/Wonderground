<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ember Gorge</title>
<style>
:root{--bg:#1a0a0a;--fg:#fff3e6;--accent:#ffc04d}
@media(prefers-color-scheme:dark){:root{--bg:#120606}}
:root[data-theme=ash]{--bg:#0c0c10;--accent:#ffd27a}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body><div id="probe"></div><canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,dpr=1,safe=0,sc=1,vw=360,vh=640,state=ST.START,raf=0,last=0,wt=0,ACC='#ffc04d';
const LAVA=560;
/* storage */
const KEY='emberGorge.v1';let save={scores:[],bestDist:0,bestChain:0};
const ci=n=>typeof n==='number'&&isFinite(n)?clamp(Math.floor(n),0,1e9):0;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.scores)){save.scores=d.scores.filter(n=>typeof n==='number'&&isFinite(n)).map(ci).sort((a,b)=>b-a).slice(0,5);save.bestDist=ci(d.bestDist);save.bestChain=ci(d.bestChain)}}catch(e){}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
/* audio */
let AC=null,master=null,nb=null;
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d,ty,v,sg,dl){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(dl||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sg)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sg),n+d);g.gain.setValueAtTime(v||.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.03)}catch(e){}}
function noise(d,v,fc){if(!AC||!nb)return;try{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),n=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(master);s.start(n);s.stop(n+d+.02)}catch(e){}}
/* game */
let p,anchors,gems,bats,parts,pops,trail,hold,att,score,chain,bestChain,gemsGot,dist,camX,camY,shake,slow,hint,overT,newRank,hiNew,saved,genX,ramp,tgt,swung,keyHold=false,ptrHold=false,deadWhy='';
function startGame(){p={x:-50,y:250,vx:130,vy:-40};anchors=[];gems=[];bats=[];parts=[];pops=[];trail=[];hold=false;att=null;score=0;chain=0;bestChain=0;gemsGot=0;dist=0;camX=-100;camY=0;shake=0;slow=0;hint=1;overT=0;newRank=-1;hiNew=false;saved=false;genX=60;ramp=0;tgt=null;swung=0;deadWhy='';
anchors.push({x:60,y:120,type:0,life:1,crumb:-1,a:0});genX=60;gen();state=ST.PLAY;tone(330,.15,'triangle',.2,2);tone(660,.2,'triangle',.2,1.5,.1);startLoop()}
function gen(){while(genX<p.x+vw+500){const r=1-Math.exp(-Math.max(0,genX)/4000);const sp=lerp(150,275,r)*rnd(.85,1.15);const px=genX,nx=genX+sp;const ny=clamp(lerp(110,200,r)+rnd(-70,80),50,300);
const q=Math.random();let ty=0;if(genX>600&&q<r*.45)ty=1;else if(q>.88)ty=2;
anchors.push({x:nx,y:ny,type:ty,life:1,crumb:-1,a:0});
const py=anchors[anchors.length-2].y;for(let i=1;i<=3;i++){const f=i/4;gems.push({x:lerp(px,nx,f),y:lerp(py,ny,f)+55-Math.sin(f*Math.PI)*0-20+Math.sin(f*Math.PI)*40,got:false})}
if(genX>1400&&Math.random()<r*.6)bats.push({x:lerp(px,nx,.5),y:rnd(150,320),by:0,ph:rnd(0,6),amp:rnd(40,90)});
genX=nx}}
function pop(x,y,s,c,sz){pops.push({x,y,s,c,sz:sz||20,l:1.1})}
function burst(x,y,n,cols,sp){for(let i=0;i<n&&parts.length<300;i++){const a=rnd(0,6.283),v=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,l:rnd(.4,.9),m:.9,c:cols[i%cols.length],r:rnd(1.5,3.5)})}}
const mult=()=>Math.min(6,1+chain*.2);
function pickTarget(){let best=null,bd=1e9;for(const a of anchors){if(a.life<=0)continue;const dx=a.x-p.x,dy=a.y-p.y,d=Math.hypot(dx,dy);if(dy>-30||dx<-40||d>340)continue;const sc2=d+(dx<20?220:0);if(sc2<bd){bd=sc2;best=a}}return best}
function attach(a){att={a,L:clamp(Math.hypot(a.x-p.x,a.y-p.y),70,320)};chain++;bestChain=Math.max(bestChain,chain);swung++;const pts=Math.floor(15*mult());score+=pts;tone(220+Math.min(chain,15)*30,.12,'square',.1);noise(.1,.15,1200);burst(a.x,a.y,8,['#ffc04d','#fff'],120);if(a.type===1)a.crumb=1.0}
function release(){if(!att)return;const perfect=p.vx>140&&p.vy<-60;let m=mult();if(perfect){const sp=Math.hypot(p.vx,p.vy)*1.07;const k=sp/Math.max(1,Math.hypot(p.vx,p.vy));p.vx*=k;p.vy*=k;const b=Math.floor(40*m);score+=b;pop(p.x,p.y-26,'PERFECT +'+b,'#ffe27a',22);tone(660,.15,'triangle',.2,1.6);tone(990,.2,'triangle',.15,1.3,.08)}if(att.a.type===2){p.vx*=1.1;p.vy*=1.05}att=null;tone(300,.12,'sine',.1,1.8)}
function die(why){if(state!==ST.PLAY)return;deadWhy=why;burst(p.x,p.y,40,['#ff5a2a','#ffc04d','#fff'],280);shake=16;noise(.6,.5,600);tone(120,.6,'sawtooth',.3,.4);endGame()}
function endGame(){if(saved)return;saved=true;state=ST.OVER;overT=0;const total=Math.floor(score);const prior=save.scores[0]||0;save.scores.push(total);save.scores.sort((a,b)=>b-a);save.scores=save.scores.slice(0,5);newRank=total>0?save.scores.indexOf(total):-1;hiNew=total>prior&&total>0;save.bestDist=Math.max(save.bestDist,Math.floor(dist/10));save.bestChain=Math.max(save.bestChain,bestChain);store()}
function update(rdt){wt+=rdt;shake*=Math.exp(-6*rdt);
for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=rdt;if(q.l<=0){parts.splice(i,1);continue}q.vy+=500*rdt;q.x+=q.vx*rdt;q.y+=q.vy*rdt}
for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=rdt;if(q.l<=0)pops.splice(i,1);else q.y-=30*rdt}
if(state===ST.OVER){overT+=rdt;return}if(state!==ST.PLAY)return;
let dt=rdt;
hold=keyHold||ptrHold;
ramp=1-Math.exp(-Math.max(0,p.x)/4000);
const sub=4,h=dt/sub;
for(let s=0;s<sub;s++){
 if(hold&&!att){const a=pickTarget();if(a)attach(a)}
 if(!hold&&att)release();
 p.vy+=900*h;p.vx*=Math.exp(-.05*h);
 p.x+=p.vx*h;p.y+=p.vy*h;
 if(att){const a=att.a;att.L=Math.max(70,att.L-(a.type===2?70:35)*h);let dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);if(d<1e-3)d=1e-3;if(d>att.L){const nx=dx/d,ny=dy/d;p.x=a.x+nx*att.L;p.y=a.y+ny*att.L;const vn=p.vx*nx+p.vy*ny;if(vn>0){p.vx-=nx*vn;p.vy-=ny*vn}}
  if(a.crumb>=0){a.crumb-=h;if(a.crumb<0){a.life=0;att=null;burst(a.x,a.y,16,['#8a7a6a','#5a4a3a'],150);noise(.3,.3,500);pop(a.x,a.y-20,'CRUMBLED!','#ff9f5d',18)}}}
}
if(p.y<-260&&p.vy<0)p.vy=0;
trail.push({x:p.x,y:p.y});if(trail.length>12)trail.shift();
dist=Math.max(dist,p.x);if(p.x>0)score+=Math.max(0,p.vx>0?p.vx*dt*.01:0)*mult();
tgt=att?null:pickTarget();
for(const g of gems){if(!g.got&&Math.hypot(g.x-p.x,g.y-p.y)<26){g.got=true;gemsGot++;const pts=Math.floor(25*mult());score+=pts;pop(g.x,g.y-14,'+'+pts,'#7df0ff',16);burst(g.x,g.y,8,['#7df0ff','#fff'],120);tone(880+Math.min(gemsGot%12,11)*70,.14,'triangle',.14)}}
for(const b of bats){b.cy=b.y+Math.sin(wt*2+b.ph)*b.amp;b.cx=b.x+Math.sin(wt*.9+b.ph)*40;if(Math.hypot(b.cx-p.x,b.cy-p.y)<24){die('Hit by a bat');return}}
if(p.y>LAVA){die('Fell in the lava');return}
if(hint>0&&swung>0)hint-=rdt*2;
if(Math.random()<.6&&parts.length<250)parts.push({x:camX+rnd(0,vw),y:LAVA+4,vx:rnd(-10,10),vy:rnd(-160,-60),l:rnd(.8,1.6),m:1.6,c:'#ff8a3a',r:rnd(1,2.5)});
gen();
anchors=anchors.filter(a=>a.x>p.x-500);gems=gems.filter(g=>g.x>p.x-500&&!g.got);bats=bats.filter(b=>b.x>p.x-500);
const lead=vw*.3;camX+=(p.x-lead-camX)*(1-Math.exp(-6*rdt));let ty=p.y-vh*.5;ty=clamp(ty,-300,LAVA+90-vh);camY+=(ty-camY)*(1-Math.exp(-4*rdt))}
/* draw */
function layout(){sc=Math.min(H/640,W/360);vw=W/sc;vh=H/sc}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,sz,col,al,mw,wg){let f=sz;const w=wg||800;ctx.font=w+' '+f+'px system-ui,sans-serif';if(mw)while(f>8&&ctx.measureText(s).width>mw){f--;ctx.font=w+' '+f+'px system-ui,sans-serif'}ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
const SX=x=>(x-camX)*sc,SY=y=>(y-camY)*sc;
function ridge(par,col,base,amp,fr,ph){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+20;x+=20){const wx=x/sc+camX*par;const y=base+Math.sin(wx*fr+ph)*amp+Math.sin(wx*fr*2.3+ph*2)*amp*.5+Math.abs(Math.sin(wx*fr*.5))*amp*.4;ctx.lineTo(x,y*1)}ctx.lineTo(W+20,H);ctx.closePath();ctx.fill()}
function drawBack(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a0f2e');g.addColorStop(.45,'#b0402a');g.addColorStop(1,'#ffa34a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const sx=W*.72,sy=SY(300)*.3+H*.35;const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,H*.5);sg.addColorStop(0,'rgba(255,230,160,.9)');sg.addColorStop(.2,'rgba(255,170,80,.4)');sg.addColorStop(1,'rgba(255,120,60,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
const oy=-camY*sc*.15;ridge(.15,'#6a2a3a',H*.55+oy,40*sc,.008,1);ridge(.3,'#3f1a2c',H*.68+oy,50*sc,.011,3);ridge(.55,'#241020',H*.8+oy,45*sc,.015,5)}
function drawLava(){const y0=SY(LAVA);if(y0>H+5)return;let g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,'#ffb347');g.addColorStop(.15,'#ff5a1f');g.addColorStop(1,'#7a1208');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10){ctx.lineTo(x,y0+Math.sin(x*.03+wt*2)*4*sc+Math.sin(x*.011-wt*1.3)*5*sc)}ctx.lineTo(W+10,H);ctx.closePath();ctx.fill();
const gl=ctx.createLinearGradient(0,y0-60*sc,0,y0);gl.addColorStop(0,'rgba(255,120,40,0)');gl.addColorStop(1,'rgba(255,120,40,.35)');ctx.fillStyle=gl;ctx.fillRect(0,y0-60*sc,W,60*sc)}
function drawAnchor(a){if(a.life<=0)return;const x=SX(a.x),y=SY(a.y);if(x<-60||x>W+60)return;const top=SY(-340),k=sc;
const shake2=a.crumb>=0&&a.crumb<1?Math.sin(wt*60)*2*k:0;ctx.save();ctx.translate(shake2,0);
ctx.fillStyle=a.type===1?'#6a5848':'#3a2a30';ctx.beginPath();ctx.moveTo(x-14*k,top);ctx.lineTo(x+14*k,top);ctx.lineTo(x+4*k,y-6*k);ctx.lineTo(x-4*k,y-6*k);ctx.closePath();ctx.fill();
const c=a.type===2?'#ffd24a':a.type===1?'#b8a08a':'#9ad8ff';const rg=ctx.createRadialGradient(x,y,0,x,y,22*k);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(255,255,255,0)');ctx.globalAlpha=.55;ctx.fillStyle=rg;ctx.fillRect(x-22*k,y-22*k,44*k,44*k);ctx.globalAlpha=1;
ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,7*k,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2*k;ctx.stroke();
if(a.type===1){ctx.strokeStyle='#3a2a1a';ctx.lineWidth=1.5*k;ctx.beginPath();ctx.moveTo(x-5*k,y-2*k);ctx.lineTo(x+1*k,y+3*k);ctx.lineTo(x+5*k,y-1*k);ctx.stroke()}
ctx.restore()}
function drawPlayer(){const x=SX(p.x),y=SY(p.y),k=sc;
if(trail.length>1){ctx.lineCap='round';for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];ctx.strokeStyle='rgba(255,90,60,'+(i/trail.length*.8)+')';ctx.lineWidth=(i/trail.length)*9*k;ctx.beginPath();ctx.moveTo(SX(a.x),SY(a.y));ctx.lineTo(SX(b.x),SY(b.y));ctx.stroke()}}
const g=ctx.createRadialGradient(x-4*k,y-4*k,1,x,y,13*k);g.addColorStop(0,'#fff2d6');g.addColorStop(.6,'#ffb04a');g.addColorStop(1,'#a8501a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,12*k,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.5*k;ctx.stroke();
const d=p.vx>=0?1:-1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+4*k*d,y-2*k,3.5*k,0,7);ctx.arc(x-1*k*d,y-2*k,3.5*k,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x+5*k*d,y-2*k,1.6*k,0,7);ctx.arc(x*1+0*k+0-0,0,0,0,7);ctx.arc(x+0*k*d,y-2*k,1.6*k,0,7);ctx.fill()}
function drawBat(b){const x=SX(b.cx),y=SY(b.cy),k=sc,f=Math.sin(wt*14+b.ph)*7*k;ctx.fillStyle='#1a0f18';ctx.beginPath();ctx.moveTo(x,y-4*k);ctx.quadraticCurveTo(x-14*k,y-12*k-f,x-22*k,y+2*k+f);ctx.quadraticCurveTo(x-10*k,y,x,y+8*k);ctx.quadraticCurveTo(x+10*k,y,x+22*k,y+2*k+f);ctx.quadraticCurveTo(x+14*k,y-12*k-f,x,y-4*k);ctx.fill();ctx.fillStyle='#ff3b3b';ctx.fillRect(x-4*k,y-1*k,2*k,2*k);ctx.fillRect(x+2*k,y-1*k,2*k,2*k)}
function drawWorld(){ctx.save();if(shake>.3)ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);drawBack();
for(const a of anchors)drawAnchor(a);
for(const g of gems){if(g.got)continue;const x=SX(g.x),y=SY(g.y),k=sc,b=Math.sin(wt*4+g.x)*2*k;ctx.fillStyle='#7df0ff';ctx.beginPath();ctx.moveTo(x,y-8*k+b);ctx.lineTo(x+6*k,y+b);ctx.lineTo(x,y+8*k+b);ctx.lineTo(x-6*k,y+b);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(x-1*k,y-5*k+b,2*k,4*k)}
for(const b of bats)if(b.cx!==undefined)drawBat(b);
if(tgt&&state===ST.PLAY){const x=SX(tgt.x),y=SY(tgt.y);ctx.strokeStyle='rgba(255,255,255,'+(.5+.3*Math.sin(wt*8))+')';ctx.lineWidth=2*sc;ctx.setLineDash([5*sc,5*sc]);ctx.beginPath();ctx.arc(x,y,15*sc,0,7);ctx.stroke();ctx.setLineDash([])}
if(att){ctx.strokeStyle='#f4e4c8';ctx.lineWidth=2.5*sc;ctx.beginPath();ctx.moveTo(SX(att.a.x),SY(att.a.y));ctx.lineTo(SX(p.x),SY(p.y));ctx.stroke()}
if(state!==ST.OVER||overT<.1)drawPlayer();
drawLava();
for(const q of parts){ctx.globalAlpha=clamp(q.l/q.m,0,1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(SX(q.x),SY(q.y),q.r*sc,0,7);ctx.fill()}ctx.globalAlpha=1;
for(const q of pops){ctx.globalAlpha=clamp(q.l*1.5,0,1);ctx.font='900 '+q.sz*sc+'px system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.textAlign='center';ctx.textBaseline='middle';const px=clamp(SX(q.x),70,W-70),py=SY(q.y);ctx.strokeText(q.s,px,py);ctx.fillStyle=q.c;ctx.fillText(q.s,px,py)}ctx.globalAlpha=1;
ctx.restore()}
function panel(x,y,w,h){rr(x,y,w,h,12);ctx.fillStyle='rgba(20,6,10,.7)';ctx.fill();ctx.strokeStyle='rgba(255,190,120,.3)';ctx.lineWidth=1.5;ctx.stroke()}
function drawHUD(){const pad=10,y=safe+8,ph=Math.min(54,W*.13),w1=W*.32,w3=W*.28,w2=W*.24;
panel(pad,y,w1,ph);txt('SCORE',pad+w1/2,y+ph*.28,Math.min(11,W/32),'#d9a98a','center',w1-12,700);txt(String(Math.floor(score)),pad+w1/2,y+ph*.67,Math.min(24,W/15),'#fff','center',w1-14);
const x3=W-pad-w3;panel(x3,y,w3,ph);txt('DIST',x3+w3/2,y+ph*.28,Math.min(11,W/32),'#d9a98a','center',w3-12,700);txt(Math.floor(dist/10)+'m',x3+w3/2,y+ph*.67,Math.min(22,W/16),'#fff','center',w3-14);
const x2=W/2-w2/2;panel(x2,y,w2,ph);txt('x'+mult().toFixed(1),W/2,y+ph*.36,Math.min(20,W/18),ACC,'center',w2-10);txt('CHAIN '+chain,W/2,y+ph*.74,Math.min(11,W/32),'#e8c8b0','center',w2-10,700)}
function drawHint(){if(hint<=0||state!==ST.PLAY)return;ctx.globalAlpha=clamp(hint,0,1);const bw=Math.min(300,W*.8),y=H*.62;rr(W/2-bw/2,y-28,bw,56,14);ctx.fillStyle='rgba(20,6,10,.78)';ctx.fill();txt('HOLD to grab the rope',W/2,y-9,Math.min(18,W/19),'#fff','center',bw-20,900);txt('RELEASE at the up-swing to fly far',W/2,y+13,Math.min(12,W/29),'#e8c8b0','center',bw-20,600);ctx.globalAlpha=1}
function drawStart(){const b=Math.min(54,W/7);txt('EMBER GORGE',W/2,H*.2,b,'#fff','center',W-30,900);txt('Swing over the lava. Never touch down.',W/2,H*.2+b*.85,Math.min(17,W/20),'#ffe2c6','center',W-30,600);ctx.globalAlpha=.6+.4*Math.sin(wt*4);txt('TAP TO PLAY',W/2,H*.5,Math.min(30,W/11),ACC,'center',W-30,900);ctx.globalAlpha=1;txt(save.scores[0]?'BEST '+save.scores[0]:'Hold = rope  |  Release = fly',W/2,H*.5+38,Math.min(17,W/20),'#ffe2c6','center',W-30,700)}
function drawOver(){ctx.fillStyle='rgba(10,2,4,.62)';ctx.fillRect(0,0,W,H);const pw=Math.min(W-24,360),ph=Math.min(H-safe-24,340),x=W/2-pw/2,y=Math.max(safe+10,(H-ph)/2);panel(x,y,pw,ph);const k=ph/340;
txt(deadWhy.toUpperCase(),W/2,y+30*k,Math.min(24,pw/10),'#ff8a6a','center',pw-24,900);txt(String(Math.floor(score)),W/2,y+72*k,Math.min(46,pw/6),'#fff','center',pw-24,900);
txt(hiNew?'NEW HIGH SCORE!':Math.floor(dist/10)+'m  |  chain '+bestChain+'  |  gems '+gemsGot,W/2,y+108*k,Math.min(15,pw/20),hiNew?ACC:'#e8c8b0','center',pw-24,800);
txt('TOP 5',W/2,y+136*k,12,'#d9a98a','center',pw-24,700);
for(let i=0;i<5;i++){const yy=y+(158+i*22)*k,s=save.scores[i],me=i===newRank;if(me){rr(x+16,yy-10*k,pw-32,20*k,6);ctx.fillStyle='rgba(255,192,77,.2)';ctx.fill()}txt((i+1)+'.',x+30,yy,Math.min(15,pw/22),me?ACC:'#d9a98a','left',30,800);txt(s===undefined?'-':String(s),x+pw-30,yy,Math.min(15,pw/22),me?ACC:'#fff3e6','right',pw-90,800)}
if(overT>.8){ctx.globalAlpha=.65+.35*Math.sin(wt*5);txt('TAP TO RETRY',W/2,y+ph-28*k,Math.min(22,pw/14),ACC,'center',pw-24,900);ctx.globalAlpha=1}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);drawWorld();if(state!==ST.START)drawHUD();if(state===ST.START)drawStart();drawHint();if(state===ST.OVER)drawOver()}
/* loop */
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:.016;last=ts;if(!(dt>0))dt=.016;dt=Math.min(.033,dt);try{update(dt);draw()}catch(e){}}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
/* input */
let pid=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}
if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>.8)startGame();return}pid=e.pointerId;ptrHold=true});
const up=e=>{if(e.pointerId===pid){ptrHold=false;pid=null}};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
const HK={Space:1,ArrowUp:1,KeyW:1,Enter:1};
addEventListener('keydown',e=>{if(!HK[e.code])return;e.preventDefault();ensureAudio();if(e.repeat)return;if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>.8)startGame();return}keyHold=true});
addEventListener('keyup',e=>{if(HK[e.code])keyHold=false});
function clearIn(){keyHold=false;ptrHold=false;pid=null}
addEventListener('blur',clearIn);document.addEventListener('visibilitychange',()=>{clearIn();if(document.hidden)stopLoop();else startLoop()});
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.offsetHeight||0;layout()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
ACC=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ffc04d';
load();resize();startGame();state=ST.START;startLoop();
</script></body></html>
