<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penguin Slide</title>
<style>
:root{--bg:#0c1e3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1e3a}}
:root[data-theme="dark"]{--bg:#0c1e3a}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('penguinslide.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop(), bestLv = parseInt(store.get('penguinslide.lv') || '0', 10) || 0;
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('penguinslide.top5', JSON.stringify(top5)); return top5.indexOf(s); }
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------- canvas ---------- */
let W, H, dpr, safeTop = 0, TW = 60, OX = 0, OY = 0;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0; layoutBoard(); }
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
function layoutBoard() {
  if (!G || !G.cols) return; const top = safeTop + 112, bot = H - 100, availH = Math.max(120, bot - top);
  TW = Math.min(88, (W * 0.94) / G.cols, availH / (G.rows * 0.8 + 0.7)); OX = W / 2 - G.cols * TW / 2; OY = top + (availH - (G.rows * TW * 0.8 + TW * 0.5)) / 2 + TW * 0.3;
}
const cx = c => OX + (c + 0.5) * TW, cy = r => OY + (r + 0.5) * TW * 0.8;

/* ---------- audio ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(type, f0, f1, dur, vol, delay) { const a = audio(); if (!a) return; try { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03); } catch (e) {} }
const sfx = {
  slide(n) { tone('sawtooth', 500 + n * 40, 160, 0.22 + n * 0.03, 0.05); }, bump() { tone('square', 140, 60, 0.15, 0.12); }, nomove() { tone('square', 200, 150, 0.08, 0.06); },
  fish() { tone('triangle', 900, 1400, 0.12, 0.1); tone('triangle', 1400, 1800, 0.12, 0.08, 0.07); }, undo() { tone('triangle', 600, 400, 0.1, 0.08); }, ui() { tone('triangle', 600, 900, 0.08, 0.08); },
  win() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.16, 0.12, i * 0.08)); }, fail() { tone('sawtooth', 300, 50, 0.6, 0.13); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- level generation (solver verified) ---------- */
function slideFrom(L, idx, d) {

  for (;;) { const nc = c + DIRS[d][0], nr = r + DIRS[d][1]; if (nc < 0 || nc >= L.cols || nr < 0 || nr >= L.rows || L.rock[nr * L.cols + nc]) break; c = nc; r = nr; const i = r * L.cols + c; path.push(i); if (i === L.goal) break; }
  return path;
}
function solve(L) {

function genLevel(lv) {

    const L = { cols, rows, rock: new Array(cols * rows).fill(false) }; for (let i = 0; i < cols * rows; i++) L.rock[i] = rnd() < dens;
    const free = []; for (let i = 0; i < cols * rows; i++) if (!L.rock[i]) free.push(i); if (free.length < 8) continue;
    L.start = free[Math.floor(rnd() * free.length)]; L.goal = free[Math.floor(rnd() * free.length)]; if (L.start === L.goal) continue;

}

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, ui = [], swipe = null;
function loadLevel() {
  const g = G, L = genLevel(g.level); g.cols = L.cols; g.rows = L.rows; g.rock = L.rock; g.start = L.start; g.goal = L.goal; g.par = L.par; g.limit = L.limit; g.fishAll = new Set(L.fish); g.fish = new Set(L.fish);
  g.pos = L.start; g.fx = L.start % L.cols; g.fy = Math.floor(L.start / L.cols); g.moves = 0; g.undos = 2; g.hist = []; g.ph = 'play'; g.anim = null; g.parts = []; g.pops = []; g.shake = 0; g.face = 2; g.pt = 0; g.fishGot = 0; g.lvScore = g.score; g.squash = 0; g.hintShown = g.level > 0; layoutBoard();

function newGame() { G = { level: 0, score: 0, lives: 3, streak: 0, rank: -1, over: false, t: 0, cols: 0, rows: 0 }; loadLevel(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });

/* ---------- logic ---------- */

function tryMove(d) {

  const path = slideFrom(g, g.pos, d); if (!path.length) { sfx.nomove(); g.shake = 0.3; g.squash = 0.5; return; }

}
function finishSlide() {

}
function undo() { const g = G; if (state !== STATES.PLAYING || g.ph !== 'play' || g.undos <= 0 || !g.hist.length) { sfx.nomove(); return; } const h = g.hist.pop(); g.pos = h.pos; g.moves = h.moves; g.fish = h.fish; g.fishGot = h.got; g.fx = g.pos % g.cols; g.fy = Math.floor(g.pos / g.cols); g.undos--; sfx.undo(); }
function update(dt) {

/* ---------- input ---------- */
function btnHit(x, y) { for (const b of ui) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; } return false; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; } if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 900) startGame(); return; }
  if (btnHit(e.clientX, e.clientY)) return; swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
});
cv.addEventListener('pointerup', e => { if (!swipe || swipe.id !== e.pointerId) return; const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null; if (state !== STATES.PLAYING) return; if (Math.hypot(dx, dy) < 22) return; tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); });

addEventListener('keydown', e => { const c = e.code, m = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 }[c]; if (m != null) { e.preventDefault(); audio(); if (!e.repeat) tryMove(m); } else if (c === 'KeyZ' || c === 'KeyU') { undo(); } else if (c === 'KeyR' && state === STATES.PLAYING && G.ph === 'play') { restart(); } else if ((c === 'Space' || c === 'Enter') && !e.repeat) { e.preventDefault(); audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); } });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) { ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col; ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }
function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function button(x, y, w, h, label, fn, col, disabled, sub) { ui.push({ x, y, w, h, fn: disabled ? () => sfx.nomove() : fn }); ctx.fillStyle = disabled ? 'rgba(255,255,255,0.1)' : col; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(14, h / 3)); ctx.fill(); if (!disabled) { ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.roundRect(x, y, w, h * 0.45, Math.min(14, h / 3)); ctx.fill(); } txt(label, x + w / 2, y + h / 2 - (sub ? 7 : 0), Math.min(18, h * 0.4), disabled ? '#7a8aa8' : '#0c1e3a', 'bold'); if (sub) txt(sub, x + w / 2, y + h / 2 + 11, 11, disabled ? '#6a7a98' : '#1c3a5a', 'bold', 0.9); }
function drawTile(c, r) {
  const x = OX + c * TW, y = OY + r * TW * 0.8, w = TW, h = TW * 0.8, d = TW * 0.3, alt = (c + r) % 2;
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, alt ? '#e6f6ff' : '#d4eeff'); g.addColorStop(1, alt ? '#bfe2f8' : '#aed8f4'); ctx.fillStyle = g; ctx.fillRect(x, y, w - 1, h - 1);

function drawRock(c, r) {

function drawIgloo(c, r, now) {

function drawPenguin(g, now) {
