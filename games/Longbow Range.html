cv.addEventListener('pointermove',function(e){if(ptrId!==e.pointerId||state!==ST.PLAY||phase!==PH.AIM)return;var dx=e.clientX-lastPx,dy=e.clientY-lastPy;lastPx=e.clientX;lastPy=e.clientY;var f=f0*zoomF;aimYaw+=dx*0.9/f;aimPitch-=dy*0.9/f;aimYaw=Math.max(-0.8,Math.min(0.8,aimYaw));aimPitch=Math.max(-0.25,Math.min(0.55,aimPitch));if(Math.hypot(dx,dy)>2.5)still=Math.max(0,still-0.25)});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}if(ptrId===e.pointerId){ptrId=null;if(e.type==='pointerup')release();else{drawing=false;drawStop()}}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>-1)e.preventDefault();keys[k]=true;if(e.repeat)return;initAudio();
if(k===' '||k==='Enter'){if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else if(state===ST.ROUND){if(resT>0.6){level++;newRound()}}else if(state===ST.PLAY)startDraw()}});
window.addEventListener('keyup',function(e){keys[e.key]=false;if((e.key===' '||e.key==='Enter')&&state===ST.PLAY)release()});
function relAll(){keys={};ptrId=null;drawing=false;drawStop()}
window.addEventListener('blur',function(){relAll();stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){relAll();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();resetRun();state=ST.START;startLoop();
})();
</script>
