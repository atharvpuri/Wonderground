<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheese Heist</title>
<style>
:root{--bg:#2a1a10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a10}}
:root[data-theme="dark"]{--bg:#2a1a10}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, AW = 360, AD = 520, YT = 0.86, MR = 7, CR = 12, OH = 26;

let top5 = loadTop(), bestLv = parseInt(store.get('cheeseheist.lv') || '0', 10) || 0;
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('cheeseheist.top5', JSON.stringify(top5)); return top5.indexOf(s); }

/* ---------- canvas ---------- */
let W, H, dpr, S = 1, OX = 0, OY = 0, safeTop = 0;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0; const top = safeTop + 100; S = Math.min((W - 16) / AW, (H - top - 10) / (AD * YT)); OX = (W - AW * S) / 2; OY = top + ((H - top - 10) - AD * YT * S) / 2; }
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
const X = x => OX + x * S, Y = y => OY + y * S * YT;

/* ---------- audio ---------- */
let AC = null, snd = {};

function tone(type, f0, f1, dur, vol, delay) { const a = audio(); if (!a) return; try { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03); } catch (e) {} }
const th = (k, ms) => { const n = performance.now(); if (n - (snd[k] || 0) < ms) return false; snd[k] = n; return true; };
const sfx = {
  cheese(n) { const b = 600 * Math.pow(1.0595, n * 3); tone('triangle', b, b * 1.5, 0.12, 0.12); tone('triangle', b * 1.5, b * 2, 0.12, 0.1, 0.07); }, dash() { tone('sawtooth', 300, 900, 0.15, 0.07); }, alert() { tone('square', 500, 900, 0.15, 0.1); }, chase() { if (th('ch', 400)) tone('sawtooth', 220, 330, 0.2, 0.06); },
  snap() { tone('square', 800, 100, 0.12, 0.16); }, caught() { tone('sawtooth', 400, 40, 0.7, 0.15); tone('square', 200, 50, 0.7, 0.1, 0.1); }, clear() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.15, 0.12, i * 0.08)); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }, step() { if (th('st', 140)) tone('sine', 900, 700, 0.03, 0.02); }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, joy = null, joyT = 0, joyMoved = false;
const keys = { l: 0, r: 0, u: 0, d: 0 };
const PAL = [['#8a5a3a', '#b87a4a', 'SOFA'], ['#6a4a3a', '#9a6a4a', 'TABLE'], ['#4a6a8a', '#6a8aaa', 'TRUNK'], ['#7a4a6a', '#a06a8a', 'BED'], ['#5a7a4a', '#7a9a6a', 'PLANTER']];
const inRect = (o, x, y, m) => x > o.x - m && x < o.x + o.w + m && y > o.y - m && y < o.y + o.h + m;
function freePt(g, m, avoid) { for (let i = 0; i < 80; i++) { const x = 30 + Math.random() * (AW - 60), y = 70 + Math.random() * (AD - 100); if (g.obs.some(o => inRect(o, x, y, m))) continue; if (avoid && avoid.some(a => Math.hypot(a.x - x, a.y - y) < a.r)) continue; return { x, y }; } return { x: AW / 2, y: AD / 2 }; }
function loadLevel() {
  const g = G, lv = g.level; g.obs = []; const n = 6 + Math.min(lv, 5);
  for (let t = 0; t < 600 && g.obs.length < n; t++) { const w = 46 + Math.random() * 62, h = 42 + Math.random() * 62, x = 20 + Math.random() * (AW - 40 - w), y = 70 + Math.random() * (AD - 100 - h), o = { x, y, w, h, p: PAL[Math.floor(Math.random() * PAL.length)] }; if (x < 110 && y + h > AD - 110) continue; if (x + w > AW - 110 && y < 130) continue; if (g.obs.some(q => x < q.x + q.w + 56 && x + w + 56 > q.x && y < q.y + q.h + 56 && y + h + 56 > q.y)) continue; g.obs.push(o); }
  g.mouse = { x: 28, y: AD - 28, vx: 0, vy: 0, face: 1, dash: 0, dcd: 0, spd: 0, step: 0 }; g.hole = { x: AW - 34, y: 44 }; g.cheese = []; const av = [{ x: 28, y: AD - 28, r: 120 }, { x: g.hole.x, y: g.hole.y, r: 90 }];
  for (let i = 0; i < 3; i++) { const p = freePt(g, 16, av); av.push({ x: p.x, y: p.y, r: 70 }); g.cheese.push({ x: p.x, y: p.y, got: false, ph: Math.random() * 6 }); }
  g.traps = []; for (let i = 0; i < Math.min(5, lv); i++) { const p = freePt(g, 18, av); av.push({ x: p.x, y: p.y, r: 50 }); g.traps.push({ x: p.x, y: p.y, snap: 0 }); }
  g.cats = []; const nc = Math.min(3, 1 + Math.floor(lv / 3)); for (let i = 0; i < nc; i++) { const p = freePt(g, 24, [{ x: 28, y: AD - 28, r: 220 }, { x: g.hole.x, y: g.hole.y, r: 80 }]), wp = []; for (let k = 0; k < 4; k++) wp.push(freePt(g, 24)); g.cats.push({ x: p.x, y: p.y, a: Math.random() * TAU, wp, wi: 0, st: 'patrol', aw: 0, tx: p.x, ty: p.y, tm: 0, sx: 0, sy: 0, chaseT: 0, tired: 0, bang: 0, face: 1, sp: 0 }); }
  g.parts = []; g.pops = []; g.shake = 0; g.ph = 'play'; g.pt = 0; g.t = 0; g.spotted = false; g.got = 0; g.hint = g.level === 0; g.catchBy = null;
}
function newGame() { G = { level: 0, score: 0, lives: 3, rank: -1, over: false, tt: 0 }; loadLevel(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) { raf = requestAnimationFrame(frame); const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(now); }
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); joy = null; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */
const pop = (t, col, x, y, big) => G.pops.push({ t, col, x, y, life: big ? 1.4 : 0.9, big: !!big });
function burst(x, y, n, cols) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = 50 + Math.random() * 130; if (G.parts.length < 160) G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.4, max: 0.8, col: cols[i % cols.length], sz: 2 + Math.random() * 3 }); } }
function resolve(e, r) { for (const o of G.obs) { const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h), dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy); if (d < r) { if (d > 0.001) { e.x = cx + dx / d * r; e.y = cy + dy / d * r; } else { e.x = o.x - r; } } } e.x = clamp(e.x, r, AW - r); e.y = clamp(e.y, 52 + r, AD - r); }
function los(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; for (const o of G.obs) { let t0 = 0, t1 = 1; for (const [p, q, lo, hi] of [[dx, ax, o.x, o.x + o.w], [dy, ay, o.y, o.y + o.h]]) { if (Math.abs(p) < 1e-6) { if (q < lo || q > hi) { t0 = 2; break; } } else { let a = (lo - q) / p, b = (hi - q) / p; if (a > b) { const t = a; a = b; b = t; } t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) break; } } if (t0 <= t1) return false; } return true; }
function caught(c) { const g = G; if (g.ph !== 'play') return; g.lives--; g.ph = 'caught'; g.pt = 1.5; g.catchBy = c; g.shake = 1; sfx.caught(); burst(g.mouse.x, g.mouse.y, 20, ['#fff', '#ffb0b0']); if (g.lives <= 0) { g.over = true; g.rank = saveTop(Math.floor(g.score)); g.pt = 1.4; sfx.over(); } }
function resetPos() { const g = G; g.mouse.x = 28; g.mouse.y = AD - 28; g.mouse.vx = g.mouse.vy = 0; for (const c of g.cats) { const p = freePt(g, 24, [{ x: 28, y: AD - 28, r: 220 }]); c.x = p.x; c.y = p.y; c.st = 'patrol'; c.aw = 0; c.tired = 0; c.chaseT = 0; } g.ph = 'play'; }
function updateCat(c, dt) {
  const g = G, m = g.mouse, lv = g.level, dx = m.x - c.x, dy = m.y - c.y, d = Math.hypot(dx, dy) || 1, stealth = m.spd < 70, range = (170 + lv * 6) * (stealth ? 0.62 : 1), half = 0.62;
  let ang = c.a, diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - ang), Math.cos(Math.atan2(dy, dx) - ang)); const sees = d < range && Math.abs(diff) < half && los(c.x, c.y, m.x, m.y);
  const noise = (m.spd > 150 || m.dash > 0) && d < 120;
  c.bang = Math.max(0, c.bang - dt); c.tired = Math.max(0, c.tired - dt);
  if (sees) { c.aw = Math.min(1, c.aw + dt * (1.6 + (1 - d / range) * 2)); c.sx = m.x; c.sy = m.y; c.tm = 3; } else c.aw = Math.max(0, c.aw - dt * 0.5);
  if (c.st !== 'chase' && c.aw >= 1) { c.st = 'chase'; c.chaseT = 0; c.bang = 1; g.spotted = true; sfx.alert(); }
  else if (c.st === 'patrol' && (noise || (c.aw > 0.4 && !sees))) { c.st = 'investigate'; c.tx = m.x; c.ty = m.y; c.tm = 3; c.bang = 0.6; }
  let tx = c.tx, ty = c.ty, sp = 70 + lv * 7;
  if (c.st === 'patrol') { const w = c.wp[c.wi]; tx = w.x; ty = w.y; if (Math.hypot(w.x - c.x, w.y - c.y) < 18) c.wi = (c.wi + 1) % c.wp.length; }
  else if (c.st === 'investigate') { sp = 95 + lv * 6; c.tm -= dt; if (Math.hypot(tx - c.x, ty - c.y) < 18 || c.tm <= 0) c.st = 'patrol'; }
  else { c.chaseT += dt; sp = Math.min(185, 118 + lv * 9); if (c.tired > 0) sp *= 0.3; if (sees) { tx = m.x; ty = m.y; } else { tx = c.sx; ty = c.sy; c.tm -= dt; if (Math.hypot(tx - c.x, ty - c.y) < 16 || c.tm <= 0) { c.st = 'patrol'; c.aw = 0.3; } } if (c.chaseT > 6 + lv * 0.3) { c.tired = 2.2; c.chaseT = 0; c.st = 'patrol'; c.aw = 0; } sfx.chase(); }
  const ddx = tx - c.x, ddy = ty - c.y, dd = Math.hypot(ddx, ddy) || 1, want = Math.atan2(ddy, ddx), da = Math.atan2(Math.sin(want - c.a), Math.cos(want - c.a)); c.a += clamp(da, -6 * dt, 6 * dt); const ox = c.x, oy = c.y; c.x += Math.cos(c.a) * sp * dt; resolve(c, CR); c.y += Math.sin(c.a) * sp * dt; resolve(c, CR); c.sp = Math.hypot(c.x - ox, c.y - oy) / Math.max(dt, 0.001); if (Math.abs(Math.cos(c.a)) > 0.2) c.face = Math.cos(c.a) > 0 ? 1 : -1;
  if (c.sp < sp * 0.3 && c.st !== 'patrol') { c.a += 1.2 * dt * 3; }
  if (d < CR + MR + 3 && g.ph === 'play' && c.tired < 1.6) caught(c);
}
function update(dt) {
  const g = G; g.tt += dt; g.shake = Math.max(0, g.shake - dt * 2.5);
  for (let i = g.parts.length - 1; i >= 0; i--) { const q = g.parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95; if (q.life <= 0) g.parts.splice(i, 1); }

  if (g.ph === 'caught') { g.pt -= dt; if (g.pt <= 0) { if (g.over) { state = STATES.GAMEOVER; overAt = performance.now(); } else resetPos(); } return; }

  let ix = keys.r - keys.l, iy = keys.d - keys.u; if (joy) { ix = (joy.x - joy.x0) / 50; iy = (joy.y - joy.y0) / 50; } const mag = Math.min(1, Math.hypot(ix, iy)); if (mag > 0.12) { const k = 1 / Math.hypot(ix, iy); ix *= k; iy *= k; g.hint = false; } else { ix = iy = 0; }
  const sp = m.dash > 0 ? 330 : 125 * (joy ? mag : (ix || iy ? 1 : 0)); const ox = m.x, oy = m.y; m.x += ix * sp * dt; resolve(m, MR); m.y += iy * sp * dt; resolve(m, MR); m.spd = Math.hypot(m.x - ox, m.y - oy) / Math.max(dt, 0.001); if (Math.abs(ix) > 0.2) m.face = ix > 0 ? 1 : -1; if (m.spd > 20) sfx.step();
  for (const ch of g.cheese) if (!ch.got && Math.hypot(ch.x - m.x, ch.y - m.y) < 16) { ch.got = true; g.got++; g.score += 50; sfx.cheese(g.got); burst(ch.x, ch.y, 12, ['#ffd24a', '#fff']); pop('+50', '#ffe28a', ch.x, ch.y - 14, false); if (g.got === 3) pop('NOW RUN TO THE HOLE!', '#9affd8', AW / 2, AD / 2, true); }
  for (const t of g.traps) { t.snap = Math.max(0, t.snap - dt); if (t.snap <= 0 && Math.hypot(t.x - m.x, t.y - m.y) < 14) { t.snap = 1; g.lives--; g.shake = 1; sfx.snap(); burst(t.x, t.y, 14, ['#ffd24a', '#c88a4a']); pop('SNAP!', '#ff8a6a', t.x, t.y - 16, true); g.score = Math.max(0, g.score - 30); g.ph = 'caught'; g.pt = 1.2; g.catchBy = null; if (g.lives <= 0) { g.over = true; g.rank = saveTop(Math.floor(g.score)); g.pt = 1.3; sfx.over(); } return; } }
  for (const c of g.cats) { updateCat(c, dt); if (g.ph !== 'play') return; }

/* ---------- input ---------- */

cv.addEventListener('pointermove', e => { if (joy && joy.id === e.pointerId) { joy.x = e.clientX; joy.y = e.clientY; if (Math.hypot(joy.x - joy.x0, joy.y - joy.y0) > 12) joyMoved = true; } });
const dash = () => { const g = G; if (state !== STATES.PLAYING || g.ph !== 'play' || g.mouse.dcd > 0) return; g.mouse.dash = 0.22; g.mouse.dcd = 1.6; sfx.dash(); burst(g.mouse.x, g.mouse.y, 8, ['#cfcfe0', '#fff']); };
const rel = e => { if (joy && joy.id === e.pointerId) { if (!joyMoved && performance.now() - joyT < 220) dash(); joy = null; } };
cv.addEventListener('pointerup', rel); cv.addEventListener('pointercancel', e => { if (joy && joy.id === e.pointerId) joy = null; }); addEventListener('blur', () => { joy = null; keys.l = keys.r = keys.u = keys.d = 0; });
addEventListener('keydown', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 1; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 1; else if (c === 'ArrowUp' || c === 'KeyW') keys.u = 1; else if (c === 'ArrowDown' || c === 'KeyS') keys.d = 1; else if ((c === 'Space' || c === 'Enter') && !e.repeat) { audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); else dash(); } else return; e.preventDefault(); });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) { ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col; ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }

}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; }
