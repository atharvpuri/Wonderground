<!DOCTYPE html>
<html lang="en" data-theme="arcade">
<head>

<style>

</head>
<body>
<div id="sp"></div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');

var ST={START:0,PLAY:1,OVER:2};
var P={SX:0,SZ:1,DROP:2,CLOSE:3,RISE:4,MOVE:5,REL:6};
var state=ST.START,raf=0,last=0,clock=0;
var ph,pt,lx,lz,dx_,dz_,prizes,held,heldQ,parts,pops,falls,score,timeLeft,t,combo,bestCombo,grabbed,perfects,shake,flash,hint,hintAlpha,overT,saved,rank,reason,mx,my,openA,lastTick,slipped,missed,sx0,sy0;
var best={scores:[],combo:0};
var TYPES=[
{n:'ball',v:10,r:0.058,c:['#ff7aa8','#c93a6c']},
{n:'bear',v:20,r:0.062,c:['#c98a5a','#7a4a2a']},
{n:'cube',v:15,r:0.056,c:['#6ac8ff','#2a78c8']},
{n:'star',v:50,r:0.05,c:['#fff07a','#e8a010']},
{n:'clock',v:5,r:0.054,c:['#9affc0','#2aa86a']},
{n:'bomb',v:0,r:0.056,c:['#555','#111']}];
function load(){try{var d=JSON.parse(localStorage.getItem('clawrush1'));if(d&&Array.isArray(d.scores)){best.scores=d.scores.filter(function(x){return typeof x==='number'&&isFinite(x)}).slice(0,5);best.combo=Math.max(0,+d.combo||0)|0}}catch(e){}}
function save(){try{localStorage.setItem('clawrush1',JSON.stringify(best))}catch(e){}}
load();
var ac=null;
function initAudio(){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function beep(f,d,type,v,sl){if(!ac)return;try{var o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);gn.gain.setValueAtTime(v||0.15,n);gn.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+d+0.02)}catch(e){}}
function noise(d,v,fr){if(!ac)return;try{var n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var sr=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||700;gn.gain.value=v||0.2;sr.buffer=b;sr.connect(f);f.connect(gn);gn.connect(ac.destination);sr.start()}catch(e){}}
function sLock(){beep(700,0.07,'square',0.09,500)}
function sDrop(){beep(500,0.35,'sawtooth',0.06,150)}
function sGrab(){beep(900,0.06,'square',0.1);beep(600,0.08,'square',0.08)}
function sSlip(){beep(400,0.3,'triangle',0.12,100)}
function sCoin(c){beep(700+Math.min(c,10)*50,0.1,'triangle',0.14);setTimeout(function(){beep(1050+Math.min(c,10)*60,0.14,'triangle',0.12)},70)}
function sPerfect(){[660,880,1320,1760].forEach(function(f,i){setTimeout(function(){beep(f,0.12,'triangle',0.13)},i*45)})}
function sBomb(){noise(0.5,0.3,500);beep(120,0.4,'sawtooth',0.12,40)}
function sMiss(){beep(220,0.2,'square',0.08,120)}
function sTick(){beep(1000,0.04,'square',0.06)}
function sOver(){beep(300,0.6,'sawtooth',0.15,60);noise(0.4,0.2)}
function sUI(){beep(520,0.08,'square',0.08);beep(780,0.1,'square',0.06)}
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth||360;H=window.innerHeight||640;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);safeTop=document.getElementById('sp').offsetHeight||0;
cx=W/2;fB=H*0.82;railY=safeTop+Math.max(92,H*0.15);fT=Math.max(railY+H*0.17,H*0.5);boxW=Math.min(W*0.94,(fB-fT)*2.6,640);home=railY+28}
function X(x,z){return cx+(x-0.5)*boxW*(0.72+0.28*z)}
function Y(z){return fT+z*(fB-fT)}
function pers(z){return 0.72+0.28*z}
function reach(){return 0.125-0.04*(1-Math.exp(-t/50))}
function sweepV(){return 0.8+1.1*(1-Math.exp(-t/40))}
function newPrize(){var tt=Math.random(),bp=Math.min(0.24,0.05+t/260),ty;
if(tt<bp)ty=5;else if(tt<bp+0.07)ty=4;else if(tt<bp+0.13)ty=3;else ty=(Math.random()*3)|0;
for(var tries=0;tries<40;tries++){var x=0.08+Math.random()*0.84,z=0.05+Math.random()*0.9;if(x>0.8&&z>0.78)continue;var ok=true;for(var i=0;i<prizes.length;i++){var p=prizes[i];if(Math.hypot(p.x-x,(p.z-z)*1.6)<0.115){ok=false;break}}
if(ok){prizes.push({x:x,z:z,ty:ty,sc:0,ph:Math.random()*6});return}}}
function reset(){prizes=[];parts=[];pops=[];falls=[];held=null;heldQ=0;score=0;timeLeft=40;t=0;combo=0;bestCombo=0;grabbed=0;perfects=0;shake=0;flash=0;hint=true;hintAlpha=1;overT=0;saved=false;rank=-1;reason='';ph=P.SX;pt=0;lx=0.5;lz=0.5;dx_=1;dz_=1;mx=0;my=0;openA=1;lastTick=0;slipped=0;missed=0;sx0=0;sy0=0;for(var i=0;i<13;i++)newPrize()}
function startGame(){reset();state=ST.PLAY;sUI();startLoop()}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
function pop(x,y,s,c){if(pops.length<20)pops.push({x:x,y:y,s:s,c:c||'#fff',l:1})}
function burst(x,y,col,n){for(var i=0;i<n&&parts.length<180;i++){var a=Math.random()*6.283,v=40+Math.random()*180;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:1,c:col,s:2+Math.random()*2.5})}}
function mult(){return 1+0.2*Math.min(combo,10)}
function tap(){if(state!==ST.PLAY)return;hint=false;
if(ph===P.SX){ph=P.SZ;lz=0;dz_=1;sLock()}
else if(ph===P.SZ){ph=P.DROP;pt=0;sx0=X(lx,0.5);sLock();sDrop()}}
function endGame(){if(state!==ST.PLAY)return;state=ST.OVER;reason="Time's up!";overT=0;sOver();shake=10;
if(!saved){saved=true;var sc=Math.floor(score);best.scores.push(sc);best.scores.sort(function(a,b){return b-a});rank=best.scores.indexOf(sc);best.scores=best.scores.slice(0,5);if(rank>4)rank=-1;best.combo=Math.max(best.combo,bestCombo);save()}}
function clawTarget(){return {x:X(lx,lz),y:Y(lz)-8}}
function update(dt){clock+=dt;
if(state===ST.PLAY){t+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endGame()}
if(timeLeft<8&&Math.floor(timeLeft)!==lastTick){lastTick=Math.floor(timeLeft);sTick()}

if(ph===P.SX){lx+=dx_*v*dt;if(lx>1){lx=1;dx_=-1}else if(lx<0){lx=0;dx_=1}mx=X(lx,0.5);my=home;openA=1}
else if(ph===P.SZ){lz+=dz_*v*1.15*dt;if(lz>1){lz=1;dz_=-1}else if(lz<0){lz=0;dz_=1}mx=X(lx,0.5);my=home;openA=1}
else if(ph===P.DROP){var k=Math.min(1,pt/0.4),e=k*k,tg=clawTarget();mx=sx0+(tg.x-sx0)*k;my=home+(tg.y-home)*e;openA=1;if(pt>=0.4){ph=P.CLOSE;pt=0;
var bi=-1,bd=1e9,R=reach();for(var i=0;i<prizes.length;i++){var p=prizes[i],d=Math.hypot(p.x-lx,(p.z-lz)*1.6);if(d<R&&d<bd){bd=d;bi=i}}
if(bi>=0){held=prizes.splice(bi,1)[0];heldQ=bd/R;sGrab();newPrize()}else{held=null;missed++;combo=0;timeLeft=Math.max(0,timeLeft-1.5);pop(mx,my-20,'MISS -1.5s','#ff8a8a');sMiss()}}}
else if(ph===P.CLOSE){openA=1-Math.min(1,pt/0.18)*0.85;if(pt>=0.18){ph=P.RISE;pt=0}}
else if(ph===P.RISE){var k2=Math.min(1,pt/0.35),tg2=clawTarget();mx=tg2.x;my=tg2.y+(home-tg2.y)*k2;openA=0.15;
if(held&&heldQ>0.62&&k2>0.5){falls.push({x:mx,y:my+14,vy:0,ty:held.ty,z:lz,l:1});held=null;slipped++;combo=0;shake=5;sSlip();pop(mx,my,'SLIPPED!','#ff9a9a')}
if(pt>=0.35){ph=held?P.MOVE:P.SX;pt=0;sx0=mx;if(!held){lx=Math.random();lz=0;dx_=Math.random()<0.5?1:-1;dz_=1}}}
else if(ph===P.MOVE){var k3=Math.min(1,pt/0.3),chx=X(0.92,1);mx=sx0+(chx-sx0)*k3;my=home;openA=0.15;if(pt>=0.3){ph=P.REL;pt=0}}
else if(ph===P.REL){openA=0.15+Math.min(1,pt/0.15)*0.85;if(pt>=0.15){var h=held,ty=TYPES[h.ty];held=null;var chx2=X(0.92,1);falls.push({x:chx2,y:home+10,vy:0,ty:h.ty,z:1,l:1,chute:true});
if(h.ty===5){timeLeft=Math.max(0,timeLeft-5);combo=0;shake=14;flash=1;sBomb();pop(chx2,home+30,'BOMB! -5s','#ff6a6a');burst(chx2,home+30,'#ff9a3a',20)}
else if(h.ty===4){timeLeft=Math.min(60,timeLeft+4);combo++;bestCombo=Math.max(bestCombo,combo);score+=5;sCoin(combo);pop(chx2,home+30,'+4s TIME','#9affc0');burst(chx2,home+30,'#9affc0',12);grabbed++}
else{var perf=heldQ<0.3;if(perf){perfects++;timeLeft=Math.min(60,timeLeft+1);sPerfect()}combo++;bestCombo=Math.max(bestCombo,combo);var g=Math.round(ty.v*mult()*(perf?1.5:1));score+=g;grabbed++;sCoin(combo);burst(chx2,home+30,ty.c[0],14);pop(chx2,home+30,(perf?'PERFECT ':'')+'+'+g,perf?'#fff07a':'#fff')}
ph=P.SX;pt=0;lx=Math.random();lz=0;dx_=Math.random()<0.5?1:-1;dz_=1}}
}
if(state===ST.OVER)overT+=dt;
hintAlpha=hint?1:Math.max(0,hintAlpha-dt*2);shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*3);
for(var i2=0;i2<prizes.length;i2++)prizes[i2].sc=Math.min(1,prizes[i2].sc+dt*4);
for(var f=falls.length-1;f>=0;f--){var fl=falls[f];fl.vy+=1400*dt;fl.y+=fl.vy*dt;if(fl.chute){fl.l-=dt*2.5;if(fl.l<=0)falls.splice(f,1)}else{var gy=Y(fl.z)-6;if(fl.y>=gy){fl.y=gy;fl.vy*=-0.3;fl.l-=dt*2}if(fl.l<=0.0||fl.y>H+50)falls.splice(f,1)}}
for(var p2=parts.length-1;p2>=0;p2--){var q=parts[p2];q.vy+=600*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*1.6;if(q.l<=0)parts.splice(p2,1)}
for(p2=pops.length-1;p2>=0;p2--){pops[p2].l-=dt*1.1;pops[p2].y-=36*dt;if(pops[p2].l<=0)pops.splice(p2,1)}}
function txt(st,x,y,sz,col,al,w){ctx.font=(w||'800')+' '+Math.round(sz)+'px system-ui,-apple-system,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(st,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

for(var i=0;i<14;i++){var gx=(i*97)%W,gy=(i*61)%(H*0.6);ctx.fillStyle='rgba(255,'+(100+i*10)+',220,0.07)';ctx.beginPath();ctx.arc(gx,gy,24+i%4*8,0,6.283);ctx.fill()}
var tl=cx-boxW*0.5*0.72,tr=cx+boxW*0.5*0.72,bl=cx-boxW*0.5,br=cx+boxW*0.5;
ctx.fillStyle='#1b0e3a';ctx.beginPath();ctx.moveTo(tl,railY-12);ctx.lineTo(tr,railY-12);ctx.lineTo(tr,fT);ctx.lineTo(tl,fT);ctx.closePath();ctx.fill();
var fg=ctx.createLinearGradient(0,fT,0,fB);fg.addColorStop(0,'#5a2a7a');fg.addColorStop(1,'#a04a9a');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(tl,fT);ctx.lineTo(tr,fT);ctx.lineTo(br,fB);ctx.lineTo(bl,fB);ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;for(var k=0;k<=8;k++){var u=k/8;ctx.beginPath();ctx.moveTo(X(u,0),fT);ctx.lineTo(X(u,1),fB);ctx.stroke();var yy=Y(k/6);ctx.beginPath();ctx.moveTo(X(0,k/6),yy);ctx.lineTo(X(1,k/6),yy);ctx.stroke()}
var cxh=X(0.92,1),chw=boxW*0.09;ctx.fillStyle='#08030f';ctx.beginPath();ctx.ellipse(cxh,fB-4,chw,chw*0.35,0,0,6.283);ctx.fill();ctx.strokeStyle='#ffd84a';ctx.lineWidth=3;ctx.stroke();txt('PRIZE',cxh,fB+14,Math.min(12,W/30),'#ffd84a','center','800');
ctx.fillStyle='#3a1a6a';ctx.fillRect(tl-8,railY-18,tr-tl+16,10);ctx.fillStyle='#9a6ae8';ctx.fillRect(tl-8,railY-18,tr-tl+16,3)}
function drawPrize(ty,x,y,r,sc,ph0){var c=TYPES[ty].c;ctx.save();ctx.translate(x,y);var bob=Math.sin(clock*2+ph0)*0.02;ctx.scale(sc*(1+bob),sc*(1-bob));
ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,r*0.8,r*0.9,r*0.28,0,0,6.283);ctx.fill();
if(ty===3){ctx.fillStyle=c[1];ctx.beginPath();for(var i=0;i<10;i++){var a=-1.57+i*0.628,rad=i%2?r*0.5:r*1.15;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.fillStyle=c[0];ctx.beginPath();for(i=0;i<10;i++){a=-1.57+i*0.628;rad=i%2?r*0.35:r*0.85;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
else{var g=ctx.createRadialGradient(-r*0.3,-r*0.4,r*0.1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(0.3,c[0]);g.addColorStop(1,c[1]);
if(ty===1){ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(-r*0.7,-r*0.7,r*0.35,0,6.283);ctx.arc(r*0.7,-r*0.7,r*0.35,0,6.283);ctx.fill()}
ctx.fillStyle=g;if(ty===2){rr(-r*0.9,-r*0.9,r*1.8,r*1.8,r*0.3);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill()}
if(ty===0||ty===1||ty===2){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.35,-r*0.1,r*0.2,0,6.283);ctx.arc(r*0.35,-r*0.1,r*0.2,0,6.283);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*0.33,-r*0.08,r*0.1,0,6.283);ctx.arc(r*0.37,-r*0.08,r*0.1,0,6.283);ctx.fill()}
if(ty===4){ctx.strokeStyle='#0a4a2a';ctx.lineWidth=Math.max(2,r*0.12);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-r*0.6);ctx.moveTo(0,0);ctx.lineTo(r*0.45,r*0.2);ctx.stroke()}
if(ty===5){ctx.strokeStyle='#aaa';ctx.lineWidth=Math.max(2,r*0.1);ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*0.3,-r*1.4,r*0.5,-r*1.3);ctx.stroke();var fl=0.5+0.5*Math.sin(clock*20);ctx.fillStyle=fl>0.5?'#ffd84a':'#ff6a2a';ctx.beginPath();ctx.arc(r*0.5,-r*1.3,r*0.2,0,6.283);ctx.fill();ctx.fillStyle='#ff4a4a';ctx.fillRect(-r*0.35,-r*0.1,r*0.7,r*0.2)}}
ctx.restore()}
function drawClaw(x,y,open){ctx.strokeStyle='#cfd8e8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,railY-12);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#8a9ab8';rr(x-10,railY-20,20,10,3);ctx.fill();

function hud(){var pad=Math.max(10,W*0.03),top=safeTop+pad,fs=Math.min(28,W/12);
ctx.fillStyle='rgba(8,3,20,0.6)';rr(pad,top,Math.min(170,W*0.44),fs*2.1,12);ctx.fill();
txt('SCORE',pad+10,top+fs*0.6,fs*0.4,'#d0a8ff','left','700');txt(String(Math.floor(score)),pad+10,top+fs*1.4,fs,'#fff','left');
var hw=Math.min(130,W*0.34),low=timeLeft<8;ctx.fillStyle=low&&Math.floor(clock*4)%2?'rgba(120,10,30,0.8)':'rgba(8,3,20,0.6)';rr(W-pad-hw,top,hw,fs*2.1,12);ctx.fill();

function draw(){ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bgDraw();
if(state===ST.PLAY&&(ph===P.SX||ph===P.SZ)){var R=reach();if(ph===P.SX){ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(X(lx,0),fT);ctx.lineTo(X(lx,1),fB);ctx.stroke();ctx.setLineDash([])}
else{var rz=Y(lz),rcx=X(lx,lz);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(X(0,lz),rz);ctx.lineTo(X(1,lz),rz);ctx.stroke();ctx.setLineDash([]);
ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(rcx,rz,R*boxW*pers(lz),R/1.6*(fB-fT),0,0,6.283);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fill()}}
if(state===ST.PLAY&&ph===P.DROP||ph===P.CLOSE){var R2=reach();ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(X(lx,lz),Y(lz),R2*boxW*pers(lz),R2/1.6*(fB-fT),0,0,6.283);ctx.stroke()}
var arr=prizes.slice().sort(function(a,b){return a.z-b.z});
for(var i=0;i<arr.length;i++){var p=arr[i];var r=TYPES[p.ty].r*boxW*pers(p.z);drawPrize(p.ty,X(p.x,p.z),Y(p.z)-r*0.7,r,p.sc,p.ph)}
for(i=0;i<falls.length;i++){var fl=falls[i],rf=TYPES[fl.ty].r*boxW*pers(fl.z);ctx.globalAlpha=Math.max(0,Math.min(1,fl.l));drawPrize(fl.ty,fl.x,fl.y,rf,1,0)}ctx.globalAlpha=1;
if(state===ST.PLAY||state===ST.OVER){var clx=(ph===P.SX||ph===P.SZ)?X(lx,0.5):mx,cly=(ph===P.SX||ph===P.SZ)?home:my;if(state===ST.OVER){clx=X(0.5,0.5);cly=home}drawClaw(clx,cly,state===ST.OVER?1:openA)}
else{drawClaw(X(0.5+Math.sin(clock)*0.3,0.5),home,1)}
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(80,Math.min(W-80,o.x)),o.y,Math.min(18,W/18),o.c)}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.3)+')';ctx.fillRect(-20,-20,W+40,H+40)}
ctx.restore();
if(state===ST.PLAY){hud();var ins=ph===P.SX?'TAP to lock LEFT-RIGHT':ph===P.SZ?'TAP to lock DEPTH':'';if(ins)txt(ins,W/2,fB+Math.min(44,H*0.06),Math.min(20,W/17),'#fff');
if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(8,3,20,0.78)';var hw=Math.min(W-24,340),hy=H*0.9-18;txt('Center the ring on a prize = PERFECT. Avoid bombs!',W/2,hy,Math.min(13,W/26),'#d0a8ff','center','700');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(8,3,20,0.5)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('CLAW',W/2,y,Math.min(70,W/5.2),'#ff7aa8');txt('RUSH',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#fff07a');
txt('Lock the claw. Grab the loot. Beat the clock.',W/2,y+Math.min(130,W/3),Math.min(15,W/23),'#e0c8ff','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.62,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   COMBO '+best.combo,W/2,H*0.62+34,Math.min(15,W/24),'#d0a8ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(8,3,20,0.72)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph2=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph2)/2);
ctx.fillStyle='#2a1250';rr(px,py,pw,ph2,20);ctx.fill();ctx.strokeStyle='#ff7aa8';ctx.lineWidth=3;ctx.stroke();
var u=ph2/430,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9ab8');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt(grabbed+' prizes \u2022 '+perfects+' perfect \u2022 best combo '+bestCombo,W/2,cy+114*u,Math.min(13,pw/24),'#d0a8ff','center','700');
txt('TOP 5',W/2,cy+142*u,Math.min(14,pw/24),'#e0c8ff','center','700');
for(var i=0;i<5;i++){var ry=cy+168*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(255,122,168,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph2-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph2-40*u,Math.min(20,pw/16),'#2a1250')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
function press(){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else tap()}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}press()});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>-1)e.preventDefault();if(e.repeat)return;if(k===' '||k==='Enter'||k.indexOf('Arrow')===0)press()});
window.addEventListener('blur',function(){stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
</body>
