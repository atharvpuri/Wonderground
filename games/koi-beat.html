{name:'Koi Rush',bpm:128,root:146.8,sc:[0,2,3,5,7,9,10],bars:32,seed:23,d:1,busy:true,tf:1.45,prog:[0,3,5,2]},

/* audio */

function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=.6;mus.connect(master);nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}

function playEv(e,at){switch(e.k){case'k':toneAt(at,150,.14,'sine',.9,.3);break;case's':noiseAt(at,.12,.35,1800);toneAt(at,200,.08,'triangle',.2,.6);break;case'h':noiseAt(at,.04,e.v||.1,7500,'highpass');break;case'b':toneAt(at,e.f,e.d,'triangle',.5,0,500);break;case'p':toneAt(at,e.f,e.d,'sine',.12);toneAt(at,e.f*1.5,e.d,'sine',.07);break;case'l':toneAt(at,e.f,e.d,'triangle',.28,.99,3000);toneAt(at,e.f*2,e.d*.5,'sine',.07);break}}
/* ---- game ---- */
let ti,ev,evI,chart,songStart,songT,total,score,combo,maxCombo,health,cntP,cntG,cntO,cntM,mult,parts,pops,ripples,shake,pulse,hint,overT,saved,res,fail,beatLast,ptrs={},keys={},selHit=-1,jx=0,btnR=null,btnM=null,dodges=0;
function build(i){const T=TRACKS[i],r=mb(T.seed),sd=60/T.bpm/4,n=T.sc.length;ev=[];chart=[];const lastT=[-9,-9,-9,-9];let prevIdx=n,prevSp=0;

  if(b>=1&&!end){if(s%8===0||(T.busy&&(s===6||s===10||s===14)&&r()<.4))ev.push({t,k:'k'});if(b>=2&&(s===4||s===12))ev.push({t,k:'s'});if(s%2===0)ev.push({t,k:'h',v:s%4===0?.14:.08});if(T.busy&&s%2===1&&r()<.3)ev.push({t,k:'h',v:.05});
   if(s===0||s===6||s===8||(T.busy&&s===12)){const f=T.root*.5*Math.pow(2,dn/12);ev.push({t,k:'b',f,d:sd*(s===0?5:3)})}}
  if(s===0&&b>=1){const f=T.root*Math.pow(2,dn/12);ev.push({t,k:'p',f,d:sd*15})}
  let hasLead=false;
  if(b>=2&&!end){const q=s%4===0?.85:(s%2===0?.3+prog*.5*T.d:.04+prog*.3*T.d);if(r()<q){const st=[-2,-1,-1,0,1,1,2][(r()*7)|0];prevIdx=clamp(prevIdx+st,n-2,n*2+2);const dir=st>0?1:st<0?-1:0;let sp=dir>0?(r()<.5?0:1):dir<0?(r()<.5?2:3):prevSp;if(t-lastT[sp]<.24)sp=(sp+1)%4;if(t-lastT[sp]<.24)sp=(sp+2)%4;
    if(t-lastT[sp]>=.24){hasLead=true;prevSp=sp;lastT[sp]=t;chart.push({t,sp,kind:0,done:false});ev.push({t,k:'l',f:fq(prevIdx),d:sd*1.8});

function startSong(i){ti=i;build(i);evI=0;fb=0;score=0;combo=0;maxCombo=0;health=100;cntP=cntG=cntO=cntM=0;dodges=0;mult=1;parts=[];pops=[];ripples=[];shake=0;pulse=0;hint=1;overT=0;saved=false;res=null;fail=false;beatLast=-1;ptrs={};songStart=now()+2.4;songT=-2.4;state=ST.PLAY;startSched();startLoop()}
function startSched(){stopSched();schedId=setInterval(sched,25)}
function stopSched(){if(schedId){clearInterval(schedId);schedId=0}}
function sched(){if(state!==ST.PLAY||!AC||fail)return;const n=now();while(evI<ev.length&&songStart+ev[evI].t<n+.3){const at=songStart+ev[evI].t;if(at>=n-.05)playEv(ev[evI],Math.max(at,n));evI++}}

  pop(hp.x-DIRS[sp][0]*30,hp.y-DIRS[sp][1]*30-14,['PERFECT','GREAT','OK'][g],['#ffd27a','#8ae0ff','#c8d8e0'][g],g===0?24:20);
  const f=700*Math.pow(1.04,Math.min(combo,20));sfx(f,.09,'triangle',.12);if(g===0)sfx(f*1.5,.12,'sine',.08);if(combo>0&&combo%25===0){pop(cx,cy-L*.6,combo+' COMBO!','#ffb347',30);sfx(1047,.3,'triangle',.18)}

function failSong(){if(fail)return;fail=true;health=0;shake=14;if(AC)for(let k=0;k<3;k++)toneAt(now()+k*.15,300-k*70,.3,'sawtooth',.25,.5,0,master);setTimeout(()=>{if(state===ST.PLAY)finish(true)},900)}

function update(rdt){wt+=rdt;shake*=Math.exp(-6*rdt);pulse=Math.max(0,pulse-rdt*4);

/* ---- draw ---- */
function layout(){const top=safe+84;L=Math.max(80,Math.min(W/2-18,(H-top-14)/2-6));R0=Math.max(28,L*.3);cx=W/2;cy=top+(H-top-8)/2}

for(const p of pads){const x=p[0]*W,y=p[1]*H,r=Math.min(W,H)*.06*p[2];ctx.fillStyle='rgba(30,110,60,.55)';ctx.beginPath();ctx.ellipse(x,y,r,r*.8,p[3],0.3,TAU-.1);ctx.lineTo(x,y);ctx.fill();if(p[4]){ctx.fillStyle='rgba(255,170,200,.8)';for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(x+Math.cos(k*1.26)*r*.25,y+Math.sin(k*1.26)*r*.2,r*.22,r*.12,k*1.26,0,TAU);ctx.fill()}}}
const rg=ctx.createRadialGradient(cx,cy,R0*.2,cx,cy,L);rg.addColorStop(0,'rgba(255,190,90,'+(.1+pulse*.15)+')');rg.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,L,0,TAU);ctx.fill();
for(let d=0;d<4;d++){const dx=DIRS[d][0],dy=DIRS[d][1];const g2=ctx.createLinearGradient(cx+dx*R0,cy+dy*R0,cx+dx*L,cy+dy*L);g2.addColorStop(0,'rgba(140,230,255,.28)');g2.addColorStop(1,'rgba(140,230,255,.04)');ctx.strokeStyle=g2;ctx.lineWidth=R0*.9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx+dx*R0,cy+dy*R0);ctx.lineTo(cx+dx*(L-6),cy+dy*(L-6));ctx.stroke()}

function koi(x,y,ang,s,col,ph){ctx.save();ctx.translate(x,y);ctx.rotate(ang);const wag=Math.sin(wt*10+ph)*s*.18;ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(3,5,s*.95,s*.38,0,0,TAU);ctx.fill();

const KC=[['#fff4e8','#ffb347','#ff6a1a'],['#fff8f0','#ff8a5a','#d8281a'],['#ffe8c8','#ffd27a','#ff9a1a'],['#f0f8ff','#7ac8ff','#2a78d8']];

const g=ctx.createRadialGradient(-s*.25,-s*.25,2,0,0,s);g.addColorStop(0,'#dff0a0');g.addColorStop(1,'#5a8a30');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*.85,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.28,-s*.12,s*.2,0,TAU);ctx.arc(s*.28,-s*.12,s*.2,0,TAU);ctx.fill();ctx.fillStyle='#c01a1a';ctx.beginPath();ctx.arc(-s*.28,-s*.08,s*.1,0,TAU);ctx.arc(s*.28,-s*.08,s*.1,0,TAU);ctx.fill();ctx.strokeStyle='#2a3a10';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s*.35,s*.3);ctx.lineTo(s*.35,s*.3);ctx.stroke();ctx.restore()}
function drawNotes(){const T=TRACKS[ti];for(let i=chart.length-1;i>=0;i--){const n=chart[i];if(n.done)continue;const fr=(n.t-songT)/T.tf;if(fr>1.02)continue;const p=npos(n,songT),sc=lerp(.5,1,1-clamp(fr,0,1)),s=R0*.46*sc*(n.kind?.85:1);
 if(n.kind)puffer(p.x,p.y,s);else{const ang=Math.atan2(-DIRS[n.sp][1],-DIRS[n.sp][0]);koi(p.x,p.y,ang,s,KC[(i*3)%4],i)}}}
function panel(x,y,w,h){rr(x,y,w,h,12);ctx.fillStyle='rgba(4,20,28,.78)';ctx.fill();ctx.strokeStyle='rgba(140,230,255,.3)';ctx.lineWidth=1.5;ctx.stroke()}
function drawHUD(){const pad=10,y=safe+8,ph=Math.min(52,W*.125),w1=W*.34,w3=W*.3,mw=W-pad*2-w1-w3-8;
panel(pad,y,w1,ph);txt('SCORE',pad+w1/2,y+ph*.28,Math.min(11,W/32),'#8fc8d8','center',w1-12,700);txt(String(Math.floor(score)),pad+w1/2,y+ph*.67,Math.min(24,W/15),'#fff','center',w1-14);
const mx=pad+w1+4;panel(mx,y,mw,ph);txt(combo>0?combo+' COMBO':'COMBO',mx+mw/2,y+ph*.36,Math.min(16,W/22),combo>0?ACC:'#7a98a8','center',mw-8);txt('x'+mult.toFixed(1),mx+mw/2,y+ph*.74,Math.min(12,W/30),'#c8ecf4','center',mw-6,800);
const x3=W-pad-w3;panel(x3,y,w3,ph);txt('HEALTH',x3+w3/2,y+ph*.28,Math.min(11,W/32),'#8fc8d8','center',w3-12,700);rr(x3+10,y+ph*.5,w3-20,ph*.28,6);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill();rr(x3+10,y+ph*.5,Math.max(4,(w3-20)*clamp(health/100,0,1)),ph*.28,6);ctx.fillStyle=health<30?'#ff6b6b':health<60?'#ffd24a':'#5affb0';ctx.fill();
const by=y+ph+8,bw=W-pad*2,tl=chart.length?chart[chart.length-1].t+1.8:1,f=clamp(songT/tl,0,1);rr(pad,by,bw,6,3);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();rr(pad,by,Math.max(4,bw*f),6,3);ctx.fillStyle=ACC;ctx.fill()}
function drawWorld(){ctx.save();if(shake>.3)ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);drawPond();if(state===ST.PLAY||state===ST.OVER)drawNotes();
for(const q of parts){ctx.globalAlpha=clamp(q.l/q.m,0,1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
for(const q of pops){ctx.globalAlpha=clamp(q.l*1.6,0,1);ctx.font='900 '+q.sz+'px system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(2,14,20,.85)';ctx.textAlign='center';ctx.textBaseline='middle';const px=clamp(q.x,70,W-70);ctx.strokeText(q.s,px,q.y);ctx.fillStyle=q.c;ctx.fillText(q.s,px,q.y)}ctx.globalAlpha=1;ctx.restore()}
function drawStart(){const b=Math.min(58,W/6.5);txt('KOI BEAT',W/2,safe+H*.14,b,'#fff','center',W-24,900);txt('Swipe the koi home to the music',W/2,safe+H*.14+b*.8,Math.min(17,W/21),'#c8ecf4','center',W-30,600);ctx.globalAlpha=.6+.4*Math.sin(wt*4);txt('TAP TO PLAY',W/2,cy+L*.62,Math.min(30,W/11),ACC,'center',W-30,900);ctx.globalAlpha=1;const best=Math.max(...save.tr.map(t=>t.top[0]||0));txt(best?'BEST '+best:'Swipe toward where the fish come from',W/2,cy+L*.62+34,Math.min(16,W/22),'#c8ecf4','center',W-30,700)}
function cardGeo(i){const w=Math.min(W-24,380),h=Math.min(96,(H-safe-170)/3),x=W/2-w/2,y=safe+90+i*(h+12);return{x,y,w,h}}
function drawStars(x,y,n,s){for(let i=0;i<3;i++){ctx.fillStyle=i<n?'#ffd24a':'rgba(255,255,255,.15)';ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?s*.45:s;ctx.lineTo(x+i*s*2.4+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}}
function drawSelect(){txt('CHOOSE A TRACK',W/2,safe+44,Math.min(26,W/12),'#fff','center',W-24,900);for(let i=0;i<3;i++){const c=cardGeo(i),u=unlocked(i),t=save.tr[i];panel(c.x,c.y,c.w,c.h);if(i===selHit){rr(c.x,c.y,c.w,c.h,12);ctx.fillStyle='rgba(255,179,71,.15)';ctx.fill()}
 txt((i+1)+'. '+TRACKS[i].name,c.x+16,c.y+c.h*.3,Math.min(20,c.w/14),u?'#fff':'#6a8a98','left',c.w*.62,900);txt(TRACKS[i].bpm+' BPM  |  '+['EASY','MEDIUM','HARD'][i],c.x+16,c.y+c.h*.58,Math.min(12,c.w/28),'#8fc8d8','left',c.w*.6,700);
 if(u){drawStars(c.x+c.w-70,c.y+c.h*.3,t.stars,Math.min(9,c.h*.1));txt(t.top[0]?'BEST '+t.top[0]:'NEW',c.x+c.w-16,c.y+c.h*.7,Math.min(14,c.w/24),ACC,'right',c.w*.4,800)}else txt('LOCKED - earn 1 star on '+(i)+'.',c.x+16,c.y+c.h*.82,Math.min(12,c.w/28),'#ff9a9a','left',c.w-30,700)}}
function drawPlayExtras(){if(songT<0){const n=Math.ceil(-songT/.8);ctx.globalAlpha=.9;txt(String(Math.min(3,n)),cx,cy,Math.min(100,L*.8),ACC,'center',L,900);ctx.globalAlpha=1}
if(hint>0&&state===ST.PLAY){ctx.globalAlpha=clamp(hint,0,1);const bw=Math.min(320,W*.88),y=cy+L*.62;rr(W/2-bw/2,y-32,bw,64,14);ctx.fillStyle='rgba(4,20,28,.9)';ctx.fill();txt('SWIPE toward the side the koi comes from',W/2,y-12,Math.min(14,W/25),'#fff','center',bw-20,900);txt('Time it on the glowing ring. Dodge the puffers!',W/2,y+12,Math.min(12,W/28),'#c8ecf4','center',bw-20,600);ctx.globalAlpha=1}
if(fail){txt('SUNK!',cx,cy,Math.min(60,W/6),'#ff8a8a','center',W-30,900)}}
function drawOver(){ctx.fillStyle='rgba(2,10,16,.74)';ctx.fillRect(0,0,W,H);const pw=Math.min(W-24,380),ph=Math.min(H-safe-24,420),x=W/2-pw/2,y=Math.max(safe+10,(H-ph)/2);panel(x,y,pw,ph);const k=ph/420,t=save.tr[ti];
txt(res.failed?'SUNK':'TRACK CLEAR',W/2,y+28*k,Math.min(28,pw/9),res.failed?'#ff9b9b':'#9bffd0','center',pw-24,900);drawStars(W/2-Math.min(14,pw/20)*2.4,y+64*k,res.stars,Math.min(14,pw/20));
txt(String(Math.floor(score)),W/2,y+104*k,Math.min(44,pw/6.5),'#fff','center',pw-24,900);txt(res.hi?'NEW HIGH SCORE!':TRACKS[ti].name,W/2,y+134*k,Math.min(15,pw/20),res.hi?ACC:'#c8ecf4','center',pw-24,800);
txt('P '+cntP+'   G '+cntG+'   OK '+cntO+'   MISS '+cntM,W/2,y+158*k,Math.min(14,pw/22),'#c8ecf4','center',pw-24,700);txt('Accuracy '+Math.round(res.acc*100)+'%  |  Max combo '+maxCombo,W/2,y+178*k,Math.min(14,pw/22),'#c8ecf4','center',pw-24,700);
txt('TOP 5',W/2,y+204*k,12,'#8fc8d8','center',pw-24,700);for(let i=0;i<5;i++){const yy=y+(224+i*20)*k,s=t.top[i],me=i===res.rank;if(me){rr(x+16,yy-9*k,pw-32,18*k,6);ctx.fillStyle='rgba(255,179,71,.2)';ctx.fill()}txt((i+1)+'.',x+30,yy,Math.min(14,pw/24),me?ACC:'#8fc8d8','left',30,800);txt(s===undefined?'-':String(s),x+pw-30,yy,Math.min(14,pw/24),me?ACC:'#fff','right',pw-90,800)}
if(overT>.8){const bw=(pw-48)/2,by=y+ph-56*k,bh=40*k;btnR={x:x+16,y:by,w:bw,h:bh};btnM={x:x+32+bw,y:by,w:bw,h:bh};for(const [b,l,c] of[[btnR,'RETRY','#e8742a'],[btnM,'MENU','#2a8ab8']]){rr(b.x,b.y,b.w,b.h,12);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();txt(l,b.x+b.w/2,b.y+b.h/2,Math.min(20,b.w/5),'#fff','center',b.w-10,900)}}else{btnR=btnM=null}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);drawWorld();if(state===ST.START)drawStart();else if(state===ST.SELECT)drawSelect();else{drawHUD();drawPlayExtras();if(state===ST.OVER&&res)drawOver()}}
/* loop */
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:.016;last=ts;if(!(dt>0))dt=.016;dt=Math.min(.05,dt);try{update(dt);draw()}catch(e){}}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
/* input */
const inR=(b,x,y)=>b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
function pick(i){if(!unlocked(i)){sfx(150,.15,'sawtooth',.15,.6);return}ensureAudio();startSong(i)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}const x=e.clientX,y=e.clientY;
if(state===ST.START){state=ST.SELECT;sfx(600,.1,'triangle',.15);return}
if(state===ST.SELECT){for(let i=0;i<3;i++)if(inR(cardGeo(i),x,y)){pick(i);return}return}
if(state===ST.OVER){if(overT>.8){if(inR(btnR,x,y))pick(ti);else if(inR(btnM,x,y)){state=ST.SELECT}}return}
ptrs[e.pointerId]={x,y,sx:x,sy:y}});
cv.addEventListener('pointermove',e=>{const p=ptrs[e.pointerId];if(!p||state!==ST.PLAY)return;const dx=e.clientX-p.sx,dy=e.clientY-p.sy;if(Math.hypot(dx,dy)>26){const sp=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);swipe(sp);p.sx=e.clientX;p.sy=e.clientY}});
const up=e=>{delete ptrs[e.pointerId]};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
const KM={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{const c=e.code,dg=/^Digit([1-3])$/.exec(c);if(c in KM||dg||c==='Space'||c==='Enter'||c==='Escape'){e.preventDefault();ensureAudio();if(e.repeat)return;
 if(state===ST.START){state=ST.SELECT;return}
 if(state===ST.SELECT){if(dg)pick(+dg[1]-1);return}
 if(state===ST.OVER){if(overT>.8){if(c==='Escape')state=ST.SELECT;else if(c==='Space'||c==='Enter')pick(ti)}return}
 if(c in KM)swipe(KM[c]);else if(c==='Escape'){stopSched();state=ST.SELECT}}});
function clearIn(){ptrs={};keys={}}
addEventListener('blur',clearIn);document.addEventListener('visibilitychange',()=>{clearIn();if(document.hidden){stopLoop();stopSched();try{if(AC&&state===ST.PLAY)AC.suspend()}catch(e){}}else{try{if(AC)AC.resume()}catch(e){}startLoop();if(state===ST.PLAY&&!fail)startSched()}});
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.offsetHeight||0;layout()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
ACC=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ffb347';
ti=0;chart=[];ev=[];parts=[];pops=[];ripples=[];score=0;combo=0;mult=1;health=100;songT=0;hint=0;shake=0;pulse=0;res=null;fail=false;
load();resize();startLoop();
</script></body></html>
