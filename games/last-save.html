<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Last Save</title>
<style>
:root{--bg:#07140d;--fg:#f2fff6;--accent:#ffe14a}
@media(prefers-color-scheme:dark){:root{--bg:#050f09}}
:root[data-theme=night]{--bg:#040c07;--accent:#fff06a}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body><div id="probe"></div><canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let W=0,H=0,dpr=1,safe=0,cx=0,F=300,CY=0,state=ST.START,raf=0,last=0,wt=0,ACC='#ffe14a';
const CAMH=4.2,CAMB=3.8,PIT=.48,cp=Math.cos(PIT),sn=Math.sin(PIT),GW=3.66,GH=2.44,SPOT=11;
function P(x,y,z){const ry=y-CAMH,rz=z+CAMB,d=-ry*sn+rz*cp,up=ry*cp+rz*sn,k=F/d;return{x:cx+x*k,y:CY-up*k,k:k}}
/* storage */
const KEY='lastSave.v1';let save={scores:[],bestStreak:0,bestSaves:0};
const ci=n=>typeof n==='number'&&isFinite(n)?clamp(Math.floor(n),0,1e9):0;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.scores)){save.scores=d.scores.filter(n=>typeof n==='number'&&isFinite(n)).map(ci).sort((a,b)=>b-a).slice(0,5);save.bestStreak=ci(d.bestStreak);save.bestSaves=ci(d.bestSaves)}}catch(e){}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
/* audio */
let AC=null,master=null,nb=null;
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d,ty,v,sg,dl){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(dl||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sg)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sg),n+d);g.gain.setValueAtTime(v||.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.03)}catch(e){}}
function noise(d,v,fc){if(!AC||!nb)return;try{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),n=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(master);s.start(n);s.stop(n+d+.02)}catch(e){}}
/* game */
const DIVES={LL:{x:-2.7,y:.7,r:1},LH:{x:-2.5,y:2,r:1},UP:{x:0,y:2.15,r:1},RH:{x:2.5,y:2,r:1},RL:{x:2.7,y:.7,r:1},ST:{x:0,y:1.1,r:1.1}};
let round,ramp,score,streak,bestStreak,saves,lives,ph,pt,ball,shot,kp,kx,ky,tx,ty,dived,early,dkey,res,msg,shake,flash,hint,overT,newRank,hiNew,saved,parts,pops,dragging,ptr=null,dsx=0,dsy=0,net=0,kickAnim=0,lastRes='';
const mult=()=>Math.min(5,1+streak*.25);
function startGame(){round=0;score=0;streak=0;bestStreak=0;saves=0;lives=3;kx=0;ky=1.1;tx=0;ty=1.1;shake=0;flash=0;hint=1;overT=0;newRank=-1;hiNew=false;saved=false;parts=[];pops=[];msg='';dragging=false;ptr=null;state=ST.PLAY;newRound();tone(392,.15,'triangle',.2,2);tone(784,.2,'triangle',.2,1.5,.1);startLoop()}
function planShot(){const r=ramp;let type='placed';const q=Math.random();if(round>=12&&q<.12)type='chip';else if(round>=8&&q<.32)type='curve';else if(round>=4&&q<.55)type='power';
let sx=Math.random()<.5?-1:1,a=rnd(.3,3.3),y=rnd(.3,2.15),wide=Math.random()<.06&&round>2;if(Math.random()<.14)a=rnd(0,.4);let tX=sx*a;if(wide){tX=sx*rnd(4.1,5.2)}
let T=lerp(.95,.5,r),lift=.5,A=0;if(type==='power'){T*=.8;y=rnd(.25,1.6)}if(type==='chip'){T*=1.5;y=rnd(1.2,1.9);tX*=.3;lift=2.7}if(type==='curve'){A=-sx*rnd(1.3,1.9)}
const stutter=round>=6&&Math.random()<.3+r*.2;const rel=lerp(.92,.4,r);const lean=Math.random()<rel?clamp(tX/3.3,-1,1):clamp(-tX/3.3,-1,1)*.6;
shot={type,tx:tX,ty:y,T,lift,A,stutter,lean,wide,side:sx}}
function newRound(){round++;ramp=1-Math.exp(-round/14);planShot();ph='wait';pt=.75;dived=false;early=false;dkey=null;res=null;ball={x:0,y:.11,z:SPOT,u:0,vx:0,vy:0,vz:0,state:'rest',spin:0};kp={x:-shot.side*1.2,z:14.6,run:0};tx=0;ty=1.1;kickAnim=0}
function pop(x,y,s,c,sz){pops.push({x,y,s,c,sz:sz||22,l:1.2})}
function burst(x,y,n,cols,sp){for(let i=0;i<n&&parts.length<240;i++){const a=rnd(0,TAU),v=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.9),m:.9,c:cols[i%cols.length],r:rnd(1.5,3.5)})}}
function dive(k){if(state!==ST.PLAY||dived||(ph!=='run'&&ph!=='fly'))return;const d=DIVES[k];if(!d)return;dived=true;dkey=k;early=ph==='run';tx=d.x;ty=d.y;noise(.15,.15,1200);tone(220,.15,'sine',.1,1.5);if(hint>0)hint=Math.min(hint,.99)}
function endGame(){if(saved)return;saved=true;state=ST.OVER;overT=0;dragging=false;const prior=save.scores[0]||0;score=Math.floor(score);save.scores.push(score);save.scores.sort((a,b)=>b-a);save.scores=save.scores.slice(0,5);newRank=score>0?save.scores.indexOf(score):-1;hiNew=score>prior&&score>0;save.bestStreak=Math.max(save.bestStreak,bestStreak);save.bestSaves=Math.max(save.bestSaves,saves);store();tone(300,.5,'triangle',.25,.5);tone(200,.6,'triangle',.25,.5,.25)}
function ballPos(u){const s=shot,x=s.tx*u+s.A*Math.sin(Math.PI*u),y=.11+(s.ty-.11)*u+s.lift*Math.sin(Math.PI*u)*(s.type==='chip'?1:Math.min(1,s.ty/1.6)*.5);return{x,y,z:SPOT*(1-u)}}
function result(kind,info){res=kind;pt=kind==='wide'?.7:1;ph='res';const p=P(0,1.2,1);
 if(kind==='save'){const m=mult();let base=100;const hd=info.d,perf=hd<info.r*.4;if(early)base*=2;if(perf)base+=50;const pts=Math.floor(base*m);score+=pts;streak++;saves++;bestStreak=Math.max(bestStreak,streak);
  pop(p.x,p.y-30,(early?'READ! ':'')+(perf?'PERFECT ':'SAVE ')+'+'+pts,early?'#7df0ff':(perf?'#ffe14a':'#9bffb0'),early||perf?28:24);burst(p.x,p.y,26,['#fff','#ffe14a','#9bffb0'],260);noise(.3,.45,1500);noise(.9,.18,500);const f=520*Math.pow(1.06,Math.min(streak,14));tone(f,.15,'triangle',.22);tone(f*1.5,.22,'triangle',.15,1,.07);ball.state='deflect';const dir=ball.x>kx?1:-1;ball.vx=dir*rnd(2,5);ball.vy=rnd(1,4);ball.vz=rnd(4,9)}
 else if(kind==='goal'){lives--;streak=0;shake=14;flash=1;net=1;pop(p.x,p.y-30,'GOAL!','#ff6b6b',34);noise(.5,.3,300);tone(150,.5,'sawtooth',.25,.5);if(lives<=0){msg='Eliminated';endGame()}}
 else{pop(p.x,p.y-30,'WIDE!','#c8d8c8',26);tone(300,.2,'triangle',.12,.6)}}
function update(rdt){wt+=rdt;shake*=Math.exp(-6*rdt);flash=Math.max(0,flash-rdt*3);net=Math.max(0,net-rdt*1.2);
for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=rdt;if(q.l<=0){parts.splice(i,1);continue}q.vy+=300*rdt;q.x+=q.vx*rdt;q.y+=q.vy*rdt}
for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=rdt;if(q.l<=0)pops.splice(i,1);else q.y-=24*rdt}
if(state===ST.OVER){overT+=rdt;}
if(state===ST.START){return}
const dt=rdt;
if(state===ST.PLAY||state===ST.OVER){const k=1-Math.exp(-10*dt);kx+=(tx-kx)*k;ky+=(ty-ky)*k}
if(state!==ST.PLAY)return;
if(hint<1)hint-=dt*1.2;
if(ph==='wait'){pt-=dt;if(pt<=0){ph='run';pt=0;kp.run=0;tone(1800,.25,'sine',.12);tone(1800,.25,'sine',.12,1,.3)}}
else if(ph==='run'){pt+=dt;const total=1.1+(shot.stutter?.5:0);let run=pt;if(shot.stutter){if(pt>.55&&pt<1.05)run=.55;else if(pt>=1.05)run=pt-.5}kp.run=clamp(run/1.1,0,1);kp.x=lerp(-shot.side*1.2,-shot.side*.5,kp.run);kp.z=lerp(14.6,SPOT+.6,kp.run);
 if(pt>=total){ph='fly';pt=0;ball.state='fly';kickAnim=1;noise(.12,.5,900);tone(110,.12,'sine',.35,.5)}}
else if(ph==='fly'){pt+=dt;kickAnim=Math.max(0,kickAnim-dt*3);const u=clamp(pt/shot.T,0,1),bp=ballPos(u);ball.x=bp.x;ball.y=bp.y;ball.z=bp.z;ball.spin+=dt*14;
 const hx=kx,hy=ky,rr=(DIVES[dkey]||DIVES.ST).r,rrr=dived?rr:.9,dd=Math.hypot(ball.x-hx,ball.y-hy);
 if(ball.z<1.6&&ball.z>-.3&&dd<rrr){ball.u=u;result('save',{d:dd,r:rrr});return}
 if(u>=1){if(Math.abs(ball.x)<GW-.1&&ball.y<GH-.05&&ball.y>0){result('goal');ball.state='net'}else{result('wide');ball.state='net'}}}
else if(ph==='res'){pt-=dt;if(ball.state==='deflect'){ball.x+=ball.vx*dt;ball.y=Math.max(.11,ball.y+ball.vy*dt);ball.vy-=9*dt;ball.z+=ball.vz*dt;ball.spin+=dt*10}else if(ball.state==='net'){ball.z=Math.max(-1.6,ball.z-4*dt)}
 if(pt<=0){if(state===ST.PLAY)newRound()}}}
/* draw */
function layout(){const dG=CAMH*sn+CAMB*cp,tw=Math.min(W*.94,H*.88);F=tw*dG/(GW*2);const up0=-CAMH*cp+CAMB*sn;CY=H*.8+up0*(F/dG)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,sz,col,al,mw,wg){let f=sz;const w=wg||800;ctx.font=w+' '+f+'px system-ui,sans-serif';if(mw)while(f>8&&ctx.measureText(s).width>mw){f--;ctx.font=w+' '+f+'px system-ui,sans-serif'}ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function line3(a,b,c,w){const p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function drawStadium(hy){let g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#05080f');g.addColorStop(.6,'#142238');g.addColorStop(1,'#26385a');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);
const r=mb(5);for(let i=0;i<420;i++){const x=r()*W,y=hy-r()*Math.min(hy,H*.3),c=r();ctx.globalAlpha=.35+.4*r();ctx.fillStyle=c<.3?'#ff6b6b':c<.6?'#ffe14a':c<.8?'#7dc4ff':'#fff';ctx.fillRect(x,y,2.5,2.5)}ctx.globalAlpha=1;
for(const lx of[.15,.85]){const gl=ctx.createRadialGradient(W*lx,hy*.3,2,W*lx,hy*.3,H*.25);gl.addColorStop(0,'rgba(255,250,220,.9)');gl.addColorStop(.2,'rgba(255,250,220,.25)');gl.addColorStop(1,'rgba(255,250,220,0)');ctx.fillStyle=gl;ctx.fillRect(W*lx-H*.25,hy*.3-H*.25,H*.5,H*.5)}
ctx.fillStyle='#0c1a2a';ctx.fillRect(0,hy-6,W,6)}
function drawPitch(){const hy=P(0,0,120).y;drawStadium(hy);let g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#1d6a34');g.addColorStop(1,'#2f9a4a');ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
for(let z=-6,i=0;z<60;z+=3.66,i++){if(i%2)continue;const a=P(-40,0,z),b=P(40,0,z),c=P(40,0,z+3.66),d=P(-40,0,z+3.66);ctx.fillStyle='rgba(0,0,0,.09)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill()}
const lc='rgba(255,255,255,.8)',lw=Math.max(2,F*.012);line3([-30,0,0],[30,0,0],lc,lw);line3([-20.16,0,0],[-20.16,0,16.5],lc,lw);line3([20.16,0,0],[20.16,0,16.5],lc,lw);line3([-20.16,0,16.5],[20.16,0,16.5],lc,lw);line3([-9.16,0,0],[-9.16,0,5.5],lc,lw);line3([9.16,0,0],[9.16,0,5.5],lc,lw);line3([-9.16,0,5.5],[9.16,0,5.5],lc,lw);
const sp=P(0,0,SPOT);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sp.x,sp.y,sp.k*.14,sp.k*.07,0,0,TAU);ctx.fill()}
function person(x,z,col,short,h,lean,legA,kick,back){const f=P(x,0,z),k=f.k,H2=h*k,w=H2*.17;ctx.save();ctx.translate(f.x,f.y);
ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,H2*.22,H2*.05,0,0,TAU);ctx.fill();
ctx.strokeStyle='#f1c8a0';ctx.lineWidth=w*.55;ctx.lineCap='round';const lg=H2*.45;ctx.beginPath();ctx.moveTo(-w*.4,-lg);ctx.lineTo(-w*.4+Math.sin(legA)*lg*.6,-2);ctx.moveTo(w*.4,-lg);ctx.lineTo(w*.4+(kick?Math.sin(-1.2)*lg*.9:Math.sin(-legA)*lg*.6),kick?-lg*.5:-2);ctx.stroke();
ctx.fillStyle=short;ctx.fillRect(-w*.85,-lg-H2*.05,w*1.7,H2*.12);
ctx.rotate(lean*.25);const tt=H2*.32,g=ctx.createLinearGradient(-w,0,w,0);g.addColorStop(0,col);g.addColorStop(.5,'#fff');g.addColorStop(1,col);ctx.fillStyle=col;rr(-w,-lg-tt-H2*.02,w*2,tt,w*.5);ctx.fill();ctx.globalAlpha=.25;ctx.fillStyle=g;rr(-w,-lg-tt-H2*.02,w*2,tt,w*.5);ctx.fill();ctx.globalAlpha=1;
ctx.fillStyle='#f1c8a0';ctx.beginPath();ctx.arc(0,-lg-tt-H2*.1,w*.62,0,TAU);ctx.fill();ctx.fillStyle=back?'#3a2a1a':'#2a1a10';ctx.beginPath();ctx.arc(0,-lg-tt-H2*.12,w*.64,Math.PI,TAU);ctx.fill();ctx.restore()}
function drawKicker(){if(ph==='res'&&res!=='x')kp.run=1;const run=kp.run,sw=Math.sin(run*24)*(ph==='run'?1:0);person(kp.x,kp.z,'#e8412c','#fff',1.75,shot.lean*clamp(run*1.4,0,1),sw*.6,ph==='fly'&&kickAnim>.1)}
function drawBall(){const b=ball;const p=P(b.x,b.y,b.z),sh=P(b.x,0,b.z),r=Math.max(2.5,p.k*.13);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,r*1.1,r*.4,0,0,TAU);ctx.fill();
const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.35,r*.1,p.x,p.y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#a8b0bc');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();ctx.fillStyle='#2a2f38';for(let i=0;i<3;i++){const a=b.spin+i*2.1,px=p.x+Math.cos(a)*r*.5,py=p.y+Math.sin(a*1.3)*r*.5;ctx.beginPath();ctx.arc(px,py,r*.22,0,TAU);ctx.fill()}ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.stroke()}
function drawKeeper(){const hx=kx,hy=ky,bx=hx*.82,by=Math.max(.75,hy*.62),bc=P(bx,by,.3),hp=P(hx,hy,.3),k=bc.k,lean=clamp(hx/3,-1,1)*1.1,diving=Math.abs(hx)>.3||hy>1.4||hy<.9;
ctx.save();ctx.translate(bc.x,bc.y);ctx.rotate(lean*(Math.abs(hx)>.3?1:0));
ctx.strokeStyle='#1a2a3a';ctx.lineWidth=k*.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-k*.14,k*.3);ctx.lineTo(-k*.2-lean*k*.1,k*.9);ctx.moveTo(k*.14,k*.3);ctx.lineTo(k*.2-lean*k*.1,k*.9);ctx.stroke();
const g=ctx.createLinearGradient(-k*.3,0,k*.3,0);g.addColorStop(0,'#1a9b3c');g.addColorStop(.5,'#7dff8a');g.addColorStop(1,'#1a9b3c');ctx.fillStyle=g;rr(-k*.3,-k*.45,k*.6,k*.8,k*.14);ctx.fill();
ctx.fillStyle='#f1c8a0';ctx.beginPath();ctx.arc(0,-k*.62,k*.17,0,TAU);ctx.fill();ctx.fillStyle='#2a1a10';ctx.beginPath();ctx.arc(0,-k*.64,k*.18,Math.PI,TAU);ctx.fill();
ctx.rotate(-lean*(Math.abs(hx)>.3?1:0));ctx.translate(-bc.x,-bc.y);
ctx.strokeStyle='#1a9b3c';ctx.lineWidth=k*.15;for(const s of[-1,1]){const sx=bc.x+s*k*.3*Math.cos(lean*.3),sy=bc.y-k*.3,gx=hp.x+s*k*.16,gy=hp.y;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(gx,gy);ctx.stroke();ctx.fillStyle='#ffe14a';ctx.beginPath();ctx.arc(gx,gy,k*.2,0,TAU);ctx.fill();ctx.strokeStyle='#ff9a1f';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#1a9b3c';ctx.lineWidth=k*.15}
ctx.restore()}
function drawGoal(){const lc='#fff';const a=P(-GW,0,0),b=P(-GW,GH,0),c=P(GW,GH,0),d=P(GW,0,0),w=Math.max(4,a.k*.12);
const nets=P(-GW,GH,-2),nete=P(GW,GH,-2);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;for(let i=0;i<=10;i++){const x=-GW+i*GW*.2,p=P(x,GH,0),q=P(x,GH,-2);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
if(net>0){ctx.fillStyle='rgba(255,255,255,'+net*.25+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill()}
ctx.lineCap='round';ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=w+3;ctx.beginPath();ctx.moveTo(a.x+3,a.y+3);ctx.lineTo(b.x+3,b.y+3);ctx.lineTo(c.x+3,c.y+3);ctx.lineTo(d.x+3,d.y+3);ctx.stroke();
ctx.strokeStyle=lc;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.stroke();ctx.strokeStyle='rgba(180,200,220,.9)';ctx.lineWidth=w*.35;ctx.beginPath();ctx.moveTo(a.x+w*.2,a.y);ctx.lineTo(b.x+w*.2,b.y);ctx.stroke()}
function drawWorld(){ctx.save();if(shake>.3)ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);drawPitch();
if(state!==ST.START||true){drawKicker();if(ball.z>.3)drawBall();drawKeeper();drawGoal();if(ball.z<=.3)drawBall()}
for(const q of parts){ctx.globalAlpha=clamp(q.l/q.m,0,1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
for(const q of pops){ctx.globalAlpha=clamp(q.l*1.5,0,1);ctx.font='900 '+q.sz+'px system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,20,10,.8)';ctx.textAlign='center';ctx.textBaseline='middle';const px=clamp(q.x,90,W-90);ctx.strokeText(q.s,px,q.y);ctx.fillStyle=q.c;ctx.fillText(q.s,px,q.y)}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+flash*.3+')';ctx.fillRect(0,0,W,H)}ctx.restore()}
function panel(x,y,w,h){rr(x,y,w,h,12);ctx.fillStyle='rgba(4,16,10,.75)';ctx.fill();ctx.strokeStyle='rgba(160,240,190,.3)';ctx.lineWidth=1.5;ctx.stroke()}
function drawHUD(){const pad=10,y=safe+8,ph2=Math.min(54,W*.13),w1=W*.32,w3=W*.28,w2=W*.24;
panel(pad,y,w1,ph2);txt('SCORE',pad+w1/2,y+ph2*.28,Math.min(11,W/32),'#9ad8b0','center',w1-12,700);txt(String(Math.floor(score)),pad+w1/2,y+ph2*.67,Math.min(24,W/15),'#fff','center',w1-14);
const x3=W-pad-w3;panel(x3,y,w3,ph2);for(let i=0;i<3;i++){const hx=x3+w3*(.2+i*.3),hy=y+ph2*.5,r=Math.min(8,w3/12);ctx.fillStyle=i<lives?'#fff':'rgba(255,255,255,.14)';ctx.beginPath();ctx.arc(hx,hy,r,0,TAU);ctx.fill();if(i<lives){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(hx,hy,r*.4,0,TAU);ctx.fill()}}
const x2=W/2-w2/2;panel(x2,y,w2,ph2);txt('x'+mult().toFixed(2).replace(/0$/,''),W/2,y+ph2*.36,Math.min(20,W/18),ACC,'center',w2-10);txt('SAVES '+streak,W/2,y+ph2*.74,Math.min(11,W/32),'#d0f0dc','center',w2-8,700);
txt('SHOT '+round,W/2,y+ph2+14,Math.min(12,W/30),'#d0f0dc','center',W-20,800)}
function drawHint(){if(state!==ST.PLAY||hint<=0)return;ctx.globalAlpha=clamp(hint,0,1);const bw=Math.min(320,W*.86),y=H*.9;rr(W/2-bw/2,y-30,bw,60,14);ctx.fillStyle='rgba(4,16,10,.88)';ctx.fill();txt('SWIPE to dive: left, right, up. TAP to crouch',W/2,y-10,Math.min(14,W/25),'#fff','center',bw-20,900);txt('Watch the kicker lean. Dive early for a READ x2!',W/2,y+12,Math.min(12,W/28),'#d0f0dc','center',bw-20,600);ctx.globalAlpha=1}
function drawStart(){const b=Math.min(56,W/7);txt('LAST SAVE',W/2,safe+H*.1,b,'#fff','center',W-24,900);txt('Read the kicker. Dive. Stop the shootout.',W/2,safe+H*.1+b*.8,Math.min(17,W/21),'#d0f0dc','center',W-30,600);ctx.globalAlpha=.6+.4*Math.sin(wt*4);txt('TAP TO PLAY',W/2,H*.5,Math.min(30,W/11),ACC,'center',W-30,900);ctx.globalAlpha=1;txt(save.scores[0]?'BEST '+save.scores[0]:'Swipe = dive  |  Keys: Q W E / A S D',W/2,H*.5+36,Math.min(16,W/22),'#d0f0dc','center',W-30,700)}
function drawOver(){ctx.fillStyle='rgba(2,10,6,.72)';ctx.fillRect(0,0,W,H);const pw=Math.min(W-24,360),ph2=Math.min(H-safe-24,340),x=W/2-pw/2,y=Math.max(safe+10,(H-ph2)/2);panel(x,y,pw,ph2);const k=ph2/340;
txt('ELIMINATED',W/2,y+30*k,Math.min(28,pw/9),'#ff9b9b','center',pw-24,900);txt(String(Math.floor(score)),W/2,y+72*k,Math.min(46,pw/6),'#fff','center',pw-24,900);
txt(hiNew?'NEW HIGH SCORE!':'Saves '+saves+'  |  best streak '+bestStreak,W/2,y+108*k,Math.min(16,pw/18),hiNew?ACC:'#d0f0dc','center',pw-24,800);
txt('TOP 5',W/2,y+136*k,12,'#9ad8b0','center',pw-24,700);
for(let i=0;i<5;i++){const yy=y+(158+i*22)*k,s=save.scores[i],me=i===newRank;if(me){rr(x+16,yy-10*k,pw-32,20*k,6);ctx.fillStyle='rgba(255,225,74,.2)';ctx.fill()}txt((i+1)+'.',x+30,yy,Math.min(15,pw/22),me?ACC:'#9ad8b0','left',30,800);txt(s===undefined?'-':String(s),x+pw-30,yy,Math.min(15,pw/22),me?ACC:'#fff','right',pw-90,800)}
if(overT>.8){ctx.globalAlpha=.65+.35*Math.sin(wt*5);txt('TAP TO RETRY',W/2,y+ph2-28*k,Math.min(22,pw/14),ACC,'center',pw-24,900);ctx.globalAlpha=1}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);drawWorld();if(state===ST.START)drawStart();else drawHUD();drawHint();if(state===ST.OVER)drawOver()}
/* loop */
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:.016;last=ts;if(!(dt>0))dt=.016;dt=Math.min(.033,dt);try{update(dt);draw()}catch(e){}}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
/* input */
function swipeKey(dx,dy){const ax=Math.abs(dx),ay=Math.abs(dy);if(dy<0&&ax<ay*.45)return'UP';if(dy>0&&ay>ax*.8)return'ST';const sd=dx<0?'L':'R';return dy<-ax*.55?sd+'H':sd+'L'}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}
if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>.8)startGame();return}if(ptr===null){ptr=e.pointerId;dsx=e.clientX;dsy=e.clientY;dragging=true}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptr||!dragging)return;const dx=e.clientX-dsx,dy=e.clientY-dsy;if(Math.hypot(dx,dy)>34){dragging=false;dive(swipeKey(dx,dy))}});
const up=e=>{if(e.pointerId!==ptr)return;ptr=null;if(dragging){dragging=false;if(state===ST.PLAY)dive('ST')}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(e.pointerId===ptr){ptr=null;dragging=false}});cv.addEventListener('contextmenu',e=>e.preventDefault());
const KD={KeyA:'LL',ArrowLeft:'LL',KeyQ:'LH',KeyW:'UP',ArrowUp:'UP',KeyE:'RH',KeyD:'RL',ArrowRight:'RL',KeyS:'ST',ArrowDown:'ST',Space:'ST'};
addEventListener('keydown',e=>{const c=e.code;if(c in KD||c==='Enter'){e.preventDefault();ensureAudio();if(e.repeat)return;if(state===ST.START){startGame();return}if(state===ST.OVER){if(overT>.8)startGame();return}if(c in KD)dive(KD[c])}});
function clearIn(){ptr=null;dragging=false}
addEventListener('blur',clearIn);document.addEventListener('visibilitychange',()=>{clearIn();if(document.hidden)stopLoop();else startLoop()});
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);safe=probe.offsetHeight||0;cx=W/2;layout()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
ACC=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ffe14a';
load();resize();startGame();state=ST.START;startLoop();
</script></body></html>
