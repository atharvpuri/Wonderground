<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  browserLocalPersistence,
  onAuthStateChanged,
  getRedirectResult,
  setPersistence,
  signInWithPopup,
  signInWithRedirect,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCB1IEbgkTLkzoLeEt4LYurTqIAkjTqkP0",
  authDomain: "wonderground-30fe4.firebaseapp.com",
  projectId: "wonderground-30fe4",
  storageBucket: "wonderground-30fe4.firebasestorage.app",
  messagingSenderId: "580927947801",
  appId: "1:580927947801:web:93dc1fc4facc7f70671688",
  measurementId: "G-JMV33WS3BR"
};

const authButton = document.querySelector("#auth");
const authLabel = document.querySelector("#authLabel");
const authNote = document.querySelector("#authNote");
const authNoteClose = document.querySelector("#authNoteClose");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const notify = message => {
  const toast = document.querySelector("#toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("on");
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => toast.classList.remove("on"), 2600);
};

const updateAuthButton = user => {
  if (!authButton) return;
  if (authLabel) authLabel.textContent = user ? (user.displayName || user.email || "Signed in") : "Sign up";
  authButton.title = user ? "Sign out" : "Sign in with Google";
  authButton.dataset.signedIn = user ? "true" : "false";
  authButton.setAttribute("aria-label", user ? `Sign out ${user.displayName || user.email || "account"}` : "Sign in with Google");
};

authNoteClose?.addEventListener("click", () => {
  authNote.classList.remove("visible");
});

window.revealAuthNote = () => {
  if (auth.currentUser || !authNote || window.plays < 4 || localStorage.getItem("wg-auth-note-shown") === "1") return;
  authNote.classList.add("visible");
  localStorage.setItem("wg-auth-note-shown", "1");
};

const persistenceReady = setPersistence(auth, browserLocalPersistence).catch(error => {
  notify("Browser storage is unavailable; sign-in may not persist");
  console.error("Firebase persistence error", error);
  throw error;
});
onAuthStateChanged(auth, updateAuthButton);
getRedirectResult(auth).catch(error => {
  if (error?.code) {
    notify(`Google sign-in failed: ${error.code.replace("auth/", "")}`);
    console.error("Firebase redirect authentication error", error);
  }
});
authButton?.addEventListener("click", async () => {
  try {
    if (auth.currentUser) {
      await signOut(auth);
      notify("Signed out");
    } else {
      await persistenceReady;
      await signInWithPopup(auth, provider);
      notify("Signed in with Google");
    }
  } catch (error) {
    if (error?.code === "auth/popup-blocked") notify("Allow popups to sign in");
    else if (error?.code === "auth/popup-closed-by-user") notify("Sign-in cancelled");
    else if (["auth/internal-error", "auth/operation-not-supported-in-this-environment", "auth/popup-failed-to-open"].includes(error?.code)) {
      notify("Opening Google sign-in...");
      await signInWithRedirect(auth, provider);
      return;
    } else notify(`Google sign-in failed: ${error?.code?.replace("auth/", "") || "unknown error"}`);
    console.error("Firebase Authentication error", error);
  }
});
</script>

 full:P("M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4"),play:P("M8 5.500v13l11-6.500z"),
 gear:P("M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6"),vol:P("M4 10v4h4l5 4V6L8 10zM16.500 9a4 4 0 0 1 0 6"),mute:P("M4 10v4h4l5 4V6L8 10zM17 9l4 6M21 9l-4 6"),

let favs=new Set(),seen=[];try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));seen=JSON.parse(localStorage.getItem("seen")||"[]")}catch(e){}

let plays=0,filt="All",toastT;try{plays=Math.max(0,Number(localStorage.getItem("wg-plays")||0))}catch(e){};window.plays=plays;$("#pc").textContent=plays;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)};

/* sound: injected into each game so the volume works from outside */
const SND="<script>(()=>{const B=window.BaseAudioContext;if(!B)return;window.__v=1;const d=Object.getOwnPropertyDescriptor(B.prototype,'destination');window.__g=[];Object.defineProperty(B.prototype,'destination',{configurable:true,get(){if(!this.__m){this.__m=this.createGain();this.__m.connect(d.get.call(this));this.__m.gain.value=window.__v;window.__g.push(this.__m)}return this.__m}});addEventListener('message',e=>{if(e.data&&e.data.vol!=null){window.__v=e.data.vol;window.__g.forEach(g=>g.gain.value=e.data.vol)}})})();<\/script>";

/* feed */
const feed=$("#feed");let order=[],cur=-1;

/* views */

 if(v!=="play"){const s=feed.children[cur],f=s&&s.querySelector&&s.querySelector("iframe");if(f)f.remove();if(s&&s.querySelector){const l=s.querySelector(".loader");if(l)l.classList.remove("off")}cur=-1}

$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;b.dataset.v==="rnd"?rndGame():show(b.dataset.v)};
$$("[data-go]").forEach(b=>b.onclick=()=>show("play"));$("#hr2").onclick=rndGame;

apply();build();

<script>
/* Background fluid: GPU ping-pong solver kept independent from the game feed. */
(()=>{const canvas=document.querySelector("#fluidCanvas"),gl=canvas&&canvas.getContext("webgl2",{alpha:true,antialias:false,preserveDrawingBuffer:false});if(!gl)return;
const vs=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const fs=(body,defs="")=>`#version 300 es
precision highp float;in vec2 uv;out vec4 o;${defs}${body}`;
const compile=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};
const program=(frag)=>{const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,frag));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p};
const adv=program(fs(`uniform sampler2D x;uniform sampler2D v;uniform vec2 px;uniform float dt,diss;void main(){vec2 back=uv-dt*texture(v,uv).xy*px; o=diss*texture(x,back);}`));

const div=program(fs(`uniform sampler2D v;uniform vec2 px;void main(){vec2 l=texture(v,uv-vec2(px.x,0)).xy,r=texture(v,uv+vec2(px.x,0)).xy,bot=texture(v,uv-vec2(0,px.y)).xy,top=texture(v,uv+vec2(0,px.y)).xy;o=vec4(.5*(r.x-l.x+top.y-bot.y),0.,0.,1.);}`));
const pressure=program(fs(`uniform sampler2D p,d;uniform vec2 px;void main(){float l=texture(p,uv-vec2(px.x,0)).x,r=texture(p,uv+vec2(px.x,0)).x,b=texture(p,uv-vec2(0,px.y)).x,t=texture(p,uv+vec2(0,px.y)).x;float c=texture(d,uv).x;o=vec4((l+r+b+t-c)*.25,0,0,1.);}`));
const grad=program(fs(`uniform sampler2D v,p;uniform vec2 px;void main(){float l=texture(p,uv-vec2(px.x,0)).x,r=texture(p,uv+vec2(px.x,0)).x,b=texture(p,uv-vec2(0,px.y)).x,t=texture(p,uv+vec2(0,px.y)).x;o=vec4(texture(v,uv).xy-vec2(r-l,t-b)*.5,0,1);}`));

const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const makeTex=(w,h)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);return t};

const target=()=>{const scale=Math.min(devicePixelRatio||1.5,2),max=innerWidth<700?520:900;w=Math.max(160,Math.floor(innerWidth*scale*quality));h=Math.max(120,Math.floor(innerHeight*scale*quality));return [w,h]};
const pair=()=>{const a=makeTex(w,h),b=makeTex(w,h),f=gl.createFramebuffer();return{a,b,f,read:a,write:b}};

const render=()=>{if(document.body.classList.contains("nomo")){canvas.style.opacity="0";requestAnimationFrame(render);return}canvas.style.opacity=".46";const now=performance.now(),dt=Math.min(.025,(now-last)/1000);last=now;if(events.length){const e=events.splice(0,1)[0];splatAt(e.x,e.y,e.dx,e.dy,e.color);idle=now}else if(now-idle>3200){splatAt(.25+Math.random()*.5,.25+Math.random()*.5,(Math.random()-.5)*.003,(Math.random()-.5)*.003,[.12,.02,.08]);idle=now}simulate(dt);gl.bindFramebuffer(gl.FRAMEBUFFER,null);draw(display,null,()=>bind(display,dye.read));requestAnimationFrame(render)};
const input=(x,y,px,py)=>{const dx=(x-px)/innerWidth*2,dy=-(y-py)/innerHeight*2;events.push({x:x/innerWidth,y:1-y/innerHeight,dx,dy,color:Math.random()>.5?[.2,.03,.16]:[.02,.16,.22]});if(events.length>3)events.shift()};
let lastPoint=null;addEventListener("pointermove",e=>{if(!S.motion)return;const p=lastPoint||[e.clientX,e.clientY];input(e.clientX,e.clientY,p[0],p[1]);lastPoint=[e.clientX,e.clientY]},{passive:true});addEventListener("pointerup",()=>{lastPoint=null},{passive:true});addEventListener("touchmove",e=>{if(!S.motion||!e.touches[0])return;const t=e.touches[0],p=lastPoint||[t.clientX,t.clientY];input(t.clientX,t.clientY,p[0],p[1]);lastPoint=[t.clientX,t.clientY]},{passive:true});
addEventListener("resize",resize);resize();idle=performance.now();render();
})()
