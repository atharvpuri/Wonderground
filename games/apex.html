<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounce Apex</title>
<style>
:root{--bg:#0c1022}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1022}}
:root[data-theme="dark"]{--bg:#0c1022}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, BED_RAD = 110, GRAV = 980;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('bounceapex.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop();
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('bounceapex.top5', JSON.stringify(top5)); return top5.indexOf(s); }

/* ---------- canvas & viewport ---------- */
let W, H, dpr, safeTop = 0, scale = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0;
  scale = Math.min(W / 440, H / 700);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio synthesis ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  boing(perfect) {
    tone('triangle', perfect ? 180 : 130, perfect ? 480 : 340, 0.28, perfect ? 0.22 : 0.14);
    if (perfect) tone('sine', 580, 880, 0.35, 0.12, 0.06);
  },
  load() { tone('sine', 160, 90, 0.15, 0.08); },
  flip(n) { const f = 400 * Math.pow(1.12, Math.min(n, 8)); tone('triangle', f, f * 1.3, 0.09, 0.09); },
  ring() { tone('sine', 880, 1760, 0.25, 0.15); tone('triangle', 1320, 2640, 0.3, 0.12, 0.05); },
  crash() { tone('sawtooth', 140, 30, 0.45, 0.2); tone('square', 80, 25, 0.4, 0.14); },
  firework() { tone('triangle', 220, 800, 0.2, 0.1); tone('sawtooth', 400, 80, 0.5, 0.12, 0.1); },
  frenzy() { [523, 659, 784, 1046].forEach((n, i) => tone('triangle', n, n, 0.2, 0.1, i * 0.07)); }
};

/* ---------- environment decorations ---------- */
const stars = Array.from({ length: 45 }, () => ({ x: Math.random(), y: Math.random(), r: rr(0.8, 2.2), a: rr(0.3, 0.9) }));
const clouds = Array.from({ length: 12 }, () => ({ x: rr(-0.2, 1.2), alt: rr(80, 700), s: rr(0.7, 1.6), spd: rr(4, 12) }));
const buildings = Array.from({ length: 18 }, (_, i) => ({ x: -280 + i * 34, w: rr(24, 38), h: rr(120, 260), col: i % 2 ? '#181b36' : '#121429', win: Math.random() }));

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0;
const held = { l: new Set(), r: new Set(), kl: 0, kr: 0, kdown: 0 };

function resetGame() {
  held.l.clear(); held.r.clear(); held.kl = held.kr = held.kdown = 0;
  G = {
    t: 0, score: 0, bestAlt: 0, combo: 0, lives: 3,
    p: { x: 0, y: 0, vx: 0, vy: 520, rot: 0, vrot: 0, tuck: 0, onBed: false, load: 0, flips: 0, spun: 0, crashed: 0 },
    bedY: 0, bedDep: 0,
    rings: [], nextRingAlt: 40,
    parts: [], popups: [], fireworks: [],
    shake: 0, slowmo: 1, frenzy: 0, frenzyTimer: 0,
    hint: 1, tapped: false, rank: -1
  };
  spawnRings(700);
}
function spawnRings(upToAlt) {
  while (G.nextRingAlt < upToAlt) {
    const alt = G.nextRingAlt;
    G.rings.push({ alt, x: rr(-75, 75), r: rr(22, 28), got: false, pulse: Math.random() * TAU });
    G.nextRingAlt += rr(45, 75);
  }
}
resetGame();

/* ---------- game loop ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.04, Math.max(0.001, (now - last) / 1000));
  last = now;
  update(dt * G.slowmo);
  draw(now);
}
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); resetGame(); state = STATES.PLAYING; startLoop(); }

/* ---------- visual juice & helpers ---------- */
const pop = (t, col, x, y, scale = 1) => G.popups.push({ t, col, x, y, life: 1.1, scale });
function spark(x, y, n, cols, sp = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = sp * (0.3 + Math.random());
    if (G.parts.length < 250) G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.45, max: 0.85, col: cols[i % cols.length], sz: 2.5 + Math.random() * 3 });
  }
}
function launchFirework(x, alt) {
  G.fireworks.push({ x, alt, life: 0.8, color: ['#ffd24a', '#ff4a7a', '#4ae6ff', '#59ff8a'][Math.floor(Math.random() * 4)] });
  sfx.firework();
}

/* ---------- update logic ---------- */
function update(dt) {
  const g = G, p = g.p;
  g.t += dt;
  g.shake = Math.max(0, g.shake - dt * 2.8);
  if (g.frenzyTimer > 0) {
    g.frenzyTimer -= dt;
    if (g.frenzyTimer <= 0) g.frenzy = 0;
  }
  for (let i = g.parts.length - 1; i >= 0; i--) { const q = g.parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 180 * dt; if (q.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.popups.length - 1; i >= 0; i--) { const q = g.popups[i]; q.life -= dt; q.y += dt * 38; if (q.life <= 0) g.popups.splice(i, 1); }

  if (state === STATES.START) {
    p.y = Math.sin(g.t * 3.5) * 15;
    g.bedDep = Math.max(0, -p.y * 0.7);
    return;
  }
  if (state === STATES.GAMEOVER) {
    p.vy -= GRAV * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    return;
  }

  /* input reading */
  const steerIn = (held.r.size || held.kr ? 1 : 0) - (held.l.size || held.kl ? 1 : 0);
  const isHolding = held.l.size > 0 || held.r.size > 0 || held.kl || held.kr || held.kdown;

  /* altitude & best score */
  if (p.y > g.bestAlt) {
    const prevMilestone = Math.floor(g.bestAlt / 100);
    g.bestAlt = p.y;
    const curMilestone = Math.floor(g.bestAlt / 100);
    if (curMilestone > prevMilestone && curMilestone > 0) {
      launchFirework(p.x, p.y + 30);
      pop(curMilestone * 100 + ' METERS!', '#ffd24a', p.x, p.y + 40, 1.3);
      g.score += curMilestone * 500;
    }
  }
  spawnRings(g.bestAlt + 600);

  /* wind hazard at higher altitudes */
  const wind = p.y > 90 ? Math.sin(g.t * 0.8 + p.y * 0.01) * Math.min(140, (p.y - 90) * 0.35) : 0;
  p.vx += wind * dt * 0.6;

  /* --- IN AIR VS ON TRAMPOLINE BED --- */
  if (p.y > 0 || p.vy > 0) {
    /* Air physics */
    p.onBed = false;
    p.vy -= GRAV * dt;
    p.y += p.vy * dt;
    p.x += (p.vx + steerIn * 80) * dt;
    p.vx *= Math.pow(0.96, dt * 60);

    /* tucking into flips */
    p.tuck = isHolding ? lerp(p.tuck, 1, dt * 10) : lerp(p.tuck, 0, dt * 8);
    const angAcc = steerIn !== 0 ? steerIn * (9.5 + p.tuck * 9.5) : (p.rot > 0 ? 1 : -1) * p.tuck * 4.5;
    p.vrot += angAcc * dt;
    p.vrot *= Math.pow(0.92, dt * 60);
    p.rot += p.vrot * dt;
    p.spun += Math.abs(p.vrot * dt);

    /* flip counter */
    const fullFlips = Math.floor(p.spun / TAU);
    if (fullFlips > p.flips) {
      p.flips = fullFlips;
      sfx.flip(p.flips);
      const mult = g.frenzy ? 3 : 1;
      const pts = p.flips * 150 * mult;
      g.score += pts;
      const flipNames = ['', 'FLIP!', 'DOUBLE FLIP!', 'TRIPLE FLIP!', 'QUAD TWIST!', 'OMEGA APEX!'];
      pop((flipNames[Math.min(flipNames.length - 1, p.flips)] || 'MEGA FLIP!') + ' +' + pts, '#4ae6ff', p.x, p.y + 20, 1.1);
      spark(p.x, p.y, 8, ['#4ae6ff', '#fff'], 110);
    }

    /* ring collisions */
    for (const r of g.rings) {
      if (!r.got && Math.abs(p.y - r.alt) < 18 && Math.abs(p.x - r.x) < r.r + 12) {
        r.got = true;
        sfx.ring();
        g.combo++;
        const mult = g.frenzy ? 3 : 1;
        const pts = 300 * Math.min(5, g.combo) * mult;
        g.score += pts;
        pop('STAR RING! +' + pts + (g.combo > 1 ? '  x' + g.combo : ''), '#ffd24a', r.x, r.alt, 1.25);
        spark(r.x, r.alt, 16, ['#ffd24a', '#fff', '#ff9f4a'], 190);
        g.shake = 0.35;
        if (g.combo >= 4 && !g.frenzy) {
          g.frenzy = 1;
          g.frenzyTimer = 7.0;
          sfx.frenzy();
          pop('APEX FRENZY! (3X)', '#ff4a7a', p.x, p.y + 45, 1.4);
        }
      }
    }

    /* Bed spring oscillation decay */
    g.bedDep = Math.max(0, g.bedDep - dt * 180);
  } else {
    /* Landed on Trampoline level (y <= 0) */
    const hitRadius = Math.abs(p.x);
    if (hitRadius > BED_RAD) {
      /* Missed the trampoline entirely! */
      p.crashed = 1;
      sfx.crash();
      g.shake = 1.2;
      g.lives = 0;
      spark(p.x, 0, 30, ['#ff4a4a', '#fff'], 220);
      pop('MISSED TRAMPOLINE!', '#ff4a4a', p.x, 20, 1.3);
      state = STATES.GAMEOVER;
      overAt = performance.now();
      g.rank = saveTop(Math.floor(g.score + g.bestAlt * 10));
      return;
    }

    /* Landing evaluation on first frame of contact */
    if (!p.onBed) {
      p.onBed = true;
      const normAng = ((p.rot % TAU) + TAU) % TAU;
      const tilt = Math.min(normAng, TAU - normAng); // 0 = feet down
      const isUpright = tilt < 0.48; // ~27 degrees tolerance
      const isWobbly = tilt >= 0.48 && tilt < 0.95;

      if (isUpright) {
        /* Clean landing */
        g.combo++;
        const pts = 100 * Math.min(4, g.combo);
        g.score += pts;
        pop(tilt < 0.2 ? 'PERFECT LANDING! +' + pts : 'NICE CATCH! +' + pts, '#59ff8a', p.x, 25, 1.1);
        spark(p.x, 0, 10, ['#59ff8a', '#fff'], 120);
      } else if (isWobbly) {
        /* Off-balance */
        g.combo = 0;
        p.vy *= 0.6;
        g.shake = 0.4;
        pop('WOBBLY!', '#ffb24a', p.x, 25);
      } else {
        /* Head/Back crash on canvas */
        sfx.crash();
        g.shake = 0.9;
        g.combo = 0;
        g.lives--;
        p.vy *= 0.25;
        p.vx *= 0.3;
        spark(p.x, 0, 20, ['#ff4a4a', '#ffd24a'], 160);
        pop('HARD SLAM! -1 LIFE', '#ff4a4a', p.x, 25, 1.2);
        if (g.lives <= 0) {
          state = STATES.GAMEOVER;
          overAt = performance.now();
          g.rank = saveTop(Math.floor(g.score + g.bestAlt * 10));
          return;
        }
      }
      p.rot = 0;
      p.vrot = 0;
      p.flips = 0;
      p.spun = 0;
    }

    /* Spring compression */
    p.y = 0;
    if (isHolding) {
      p.load = Math.min(1.0, p.load + dt * 2.8);
      g.bedDep = Math.min(48, g.bedDep + dt * 140);
      if (Math.random() < 0.15) sfx.load();
    } else {
      /* Rebound launch */
      const isPerfectRelease = p.load > 0.45;
      const boostMult = 1.0 + p.load * 0.75 + (g.frenzy ? 0.35 : 0);
      const baseRebound = Math.min(920, 480 + Math.sqrt(g.bestAlt) * 18);
      p.vy = baseRebound * boostMult;
      p.vx = (p.x * -0.6) + steerIn * 90;
      p.load = 0;
      p.onBed = false;
      g.bedDep = 0;
      sfx.boing(isPerfectRelease);
      g.shake = isPerfectRelease ? 0.5 : 0.2;
      if (isPerfectRelease) {
        pop('APEX LAUNCH!', '#ffd24a', p.x, 30, 1.25);
        spark(p.x, 0, 16, ['#ffd24a', '#59ff8a', '#fff'], 180);
      }
    }
  }
}

/* ---------- input handlers ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 850) startGame(); return; }
  G.tapped = true; G.hint = 0;
  (e.clientX < W / 2 ? held.l : held.r).add(e.pointerId);
});
const rel = e => { held.l.delete(e.pointerId); held.r.delete(e.pointerId); };
cv.addEventListener('pointerup', rel);
cv.addEventListener('pointercancel', rel);
addEventListener('blur', () => { held.l.clear(); held.r.clear(); held.kl = held.kr = held.kdown = 0; });

addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') held.kl = 1;
  else if (c === 'ArrowRight' || c === 'KeyD') held.kr = 1;
  else if (c === 'ArrowDown' || c === 'KeyS') held.kdown = 1;
  else if ((c === 'Space' || c === 'Enter') && !e.repeat) {
    audio();
    if (state === STATES.START) startGame();
    else if (state === STATES.GAMEOVER && performance.now() - overAt > 850) startGame();
    else held.kdown = 1;
  } else return;
  if (G) { G.tapped = true; G.hint = 0; }
  e.preventDefault();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') held.kl = 0;
  else if (c === 'ArrowRight' || c === 'KeyD') held.kr = 0;
  else if (c === 'ArrowDown' || c === 'KeyS' || c === 'Space') held.kdown = 0;
});

/* ---------- rendering ---------- */
function txt(s, x, y, size, col, weight = 'bold', alpha = 1, align = 'center') {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.font = weight + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}

function drawBackground(camY) {
  /* Sky gradient based on camera altitude */
  const altRatio = clamp(camY / 700, 0, 1);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, lerpColor('#060714', '#020308', altRatio));
  sky.addColorStop(0.55, lerpColor('#1b173d', '#080c1f', altRatio));
  sky.addColorStop(1, lerpColor('#5a234f', '#121d3b', altRatio));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  /* Stars */
  for (const st of stars) {
    const a = st.a * (0.3 + 0.7 * altRatio);
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.arc(st.x * W, (st.y * H * 1.5 - camY * 0.1) % H, st.r, 0, TAU);
    ctx.fill();
  }

  /* Distant City Skyline (visible at lower altitudes) */
  if (camY < 350) {
    const groundScrY = H * 0.78 + camY * scale;
    ctx.save();
    for (const b of buildings) {
      const bx = W / 2 + b.x * scale, by = groundScrY - b.h * scale, bw = b.w * scale, bh = b.h * scale;
      ctx.fillStyle = b.col;
      ctx.fillRect(bx, by, bw, bh);
      /* illuminated windows */
      if (b.win > 0.3) {
        ctx.fillStyle = '#ffd24a';
        ctx.globalAlpha = 0.25;
        for (let wy = by + 12; wy < groundScrY - 14; wy += 18) {
          ctx.fillRect(bx + 4, wy, bw - 8, 3);
        }
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }

  /* Clouds drifting with altitude */
  for (const c of clouds) {
    const cy = H * 0.78 - (c.alt - camY) * scale;
    if (cy < -80 || cy > H + 80) continue;
    const cx = ((c.x * W + G.t * c.spd) % (W + 200)) - 100;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 75 * c.s * scale, 22 * c.s * scale, 0, 0, TAU);
    ctx.fill();
  }
}
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t), rg = Math.round(ag + (bg - ag) * t), rb = Math.round(ab + (bb - ab) * t);
  return 'rgb(' + rr + ',' + rg + ',' + rb + ')';
}

function drawTrampoline(camY) {
  const scrY = H * 0.78 + camY * scale;
  const cx = W / 2;
  const rw = BED_RAD * 1.25 * scale;
  const rh = 34 * scale;

  ctx.save();
  /* Frame legs */
  ctx.strokeStyle = '#4a4e69';
  ctx.lineWidth = Math.max(2, 4 * scale);
  for (const s of [-0.85, -0.4, 0.4, 0.85]) {
    ctx.beginPath();
    ctx.moveTo(cx + s * rw, scrY);
    ctx.lineTo(cx + s * rw * 1.15, scrY + 65 * scale);
    ctx.stroke();
  }

  /* Padded Frame Ring (Outer Rim) */
  ctx.fillStyle = '#22253f';
  ctx.beginPath();
  ctx.ellipse(cx, scrY, rw, rh, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#38d9a9';
  ctx.lineWidth = Math.max(2, 5 * scale);
  ctx.stroke();

  /* Elastic Canvas Bed (depressed in center) */
  const dep = (G.bedDep || 0) * scale;
  const bw = BED_RAD * scale;
  const bh = 24 * scale;

  const grad = ctx.createRadialGradient(cx, scrY + dep, 5, cx, scrY, bw);
  grad.addColorStop(0, '#121422');
  grad.addColorStop(0.75, '#1b1e33');
  grad.addColorStop(1, '#252945');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(cx, scrY + dep * 0.6, bw, bh + dep * 0.4, 0, 0, TAU);
  ctx.fill();

  /* Center target cross on canvas */
  ctx.strokeStyle = 'rgba(56,217,169,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, scrY + dep * 0.6, bw * 0.4, bh * 0.4, 0, 0, TAU);
  ctx.stroke();

  /* Springs around edge */
  ctx.strokeStyle = '#9a9eb8';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * TAU;
    const x1 = cx + Math.cos(a) * bw;
    const y1 = scrY + Math.sin(a) * bh;
    const x2 = cx + Math.cos(a) * rw * 0.94;
    const y2 = scrY + Math.sin(a) * rh * 0.94;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRings(camY, now) {
  for (const r of G.rings) {
    if (r.got) continue;
    const scrY = H * 0.78 - (r.alt - camY) * scale;
    if (scrY < -50 || scrY > H + 50) continue;
    const scrX = W / 2 + r.x * scale;
    const pulse = Math.sin(now * 0.007 + r.pulse) * 3;
    const rad = (r.r + pulse) * scale;

    ctx.save();
    ctx.shadowColor = '#ffd24a';
    ctx.shadowBlur = 12 * scale;
    ctx.strokeStyle = '#ffd24a';
    ctx.lineWidth = Math.max(2, 4.5 * scale);
    ctx.beginPath();
    ctx.arc(scrX, scrY, rad, 0, TAU);
    ctx.stroke();

    /* Inner rotating sparkle */
    ctx.fillStyle = '#ffffff';
    const sa = now * 0.004;
    ctx.beginPath();
    ctx.arc(scrX + Math.cos(sa) * rad * 0.7, scrY + Math.sin(sa) * rad * 0.4, 3 * scale, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawGymnast(camY, now) {
  const p = G.p;
  const scrX = W / 2 + p.x * scale;
  const scrY = H * 0.78 - (p.y - camY) * scale;
  const tuck = p.tuck || 0;
  const sz = 38 * scale;

  ctx.save();
  ctx.translate(scrX, scrY);

  /* Shadow on trampoline bed when near */
  if (p.y >= 0 && p.y < 120) {
    const shadowAlpha = clamp(1 - p.y / 120, 0, 0.55);
    const shadowW = Math.max(8, (BED_RAD * 0.35 - p.y * 0.15) * scale);
    const bedScrY = (H * 0.78 + camY * scale) - scrY;
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha + ')';
    ctx.beginPath();
    ctx.ellipse(0, bedScrY, shadowW, shadowW * 0.35, 0, 0, TAU);
    ctx.fill();
  }

  ctx.rotate(p.rot);

  /* Speed blur flame trail during apex frenzy */
  if (G.frenzy) {
    ctx.fillStyle = 'rgba(255,74,122,0.45)';
    ctx.beginPath();
    ctx.arc(0, sz * 0.4, sz * (0.5 + Math.random() * 0.2), 0, TAU);
    ctx.fill();
  }

  /* Articulated Gymnast Body */
  const skin = '#fcd5b8';
  const suit = G.frenzy ? '#ff4a7a' : '#38d9a9';
  const suitDark = G.frenzy ? '#d92055' : '#1fad85';

  if (tuck > 0.4) {
    /* Tucked ball pose for fast spinning */
    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.45, 0, TAU);
    ctx.fill();

    /* Head */
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -sz * 0.38, sz * 0.22, 0, TAU);
    ctx.fill();

    /* Arms grasping knees */
    ctx.strokeStyle = skin;
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.48, 0.4, Math.PI - 0.4);
    ctx.stroke();
  } else {
    /* Extended graceful layout pose */
    /* Torso */
    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.roundRect(-sz * 0.2, -sz * 0.4, sz * 0.4, sz * 0.65, 5 * scale);
    ctx.fill();

    /* Torso accent stripe */
    ctx.fillStyle = suitDark;
    ctx.fillRect(-sz * 0.08, -sz * 0.38, sz * 0.16, sz * 0.62);

    /* Head */
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -sz * 0.62, sz * 0.2, 0, TAU);
    ctx.fill();

    /* Hair */
    ctx.fillStyle = '#2a1a15';
    ctx.beginPath();
    ctx.arc(0, -sz * 0.68, sz * 0.18, Math.PI, 0);
    ctx.fill();

    /* Extended Arms */
    ctx.strokeStyle = skin;
    ctx.lineWidth = Math.max(2, 4.5 * scale);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.18, -sz * 0.3);
    ctx.lineTo(-sz * 0.55, -sz * 0.45);
    ctx.moveTo(sz * 0.18, -sz * 0.3);
    ctx.lineTo(sz * 0.55, -sz * 0.45);
    ctx.stroke();

    /* Extended Legs */
    ctx.strokeStyle = '#22253f';
    ctx.lineWidth = Math.max(2, 5 * scale);
    ctx.beginPath();
    ctx.moveTo(-sz * 0.12, sz * 0.22);
    ctx.lineTo(-sz * 0.1, sz * 0.68);
    ctx.moveTo(sz * 0.12, sz * 0.22);
    ctx.lineTo(sz * 0.1, sz * 0.68);
    ctx.stroke();

    /* Pointed Toes / Shoes */
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-sz * 0.1, sz * 0.72, 3.5 * scale, 0, TAU);
    ctx.arc(sz * 0.1, sz * 0.72, 3.5 * scale, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function drawHUD(now) {
  const g = G, p = g.p;
  const pad = Math.max(12, W * 0.035);
  const topY = safeTop + 10;
  const fs = Math.min(1, W / 420);

  /* Left Panel: Score & Best Altitude */
  ctx.fillStyle = 'rgba(12,16,34,0.65)';
  ctx.beginPath();
  ctx.roundRect(pad, topY, 130 * fs, 58 * fs, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.stroke();

  txt(String(Math.floor(g.score)), pad + 65 * fs, topY + 22 * fs, 22 * fs, '#ffffff');
  txt('ALT ' + Math.floor(g.bestAlt) + 'm', pad + 65 * fs, topY + 44 * fs, 11 * fs, '#ffd24a', 'bold', 0.95);

  /* Right Panel: Altitude & Lives */
  const rw = 120 * fs;
  const rx = W - pad - rw;
  ctx.fillStyle = 'rgba(12,16,34,0.65)';
  ctx.beginPath();
  ctx.roundRect(rx, topY, rw, 58 * fs, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.stroke();

  /* Lives (heart icons) */
  let heartsStr = '';
  for (let i = 0; i < 3; i++) heartsStr += i < g.lives ? '♥ ' : '♡ ';
  txt(heartsStr.trim(), rx + rw / 2, topY + 22 * fs, 16 * fs, '#ff4a7a');
  txt(Math.floor(Math.max(0, p.y)) + ' M NOW', rx + rw / 2, topY + 44 * fs, 11 * fs, '#4ae6ff', 'bold', 0.95);

  /* Streak / Combo Pill */
  if (g.combo > 1) {
    const pillW = 88 * fs;
    ctx.fillStyle = g.frenzy ? 'rgba(255,74,122,0.9)' : 'rgba(56,217,169,0.85)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - pillW / 2, topY + 8 * fs, pillW, 26 * fs, 13);
    ctx.fill();
    txt(g.combo + 'X STREAK', W / 2, topY + 21 * fs, 12 * fs, '#0c1022', '900');
  }

  /* Spring Compression Meter (when loading on bed) */
  if (p.onBed && p.load > 0) {
    const barW = Math.min(220, W * 0.55);
    const barY = H * 0.88;
    ctx.fillStyle = 'rgba(12,16,34,0.75)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - barW / 2 - 4, barY - 4, barW + 8, 20, 8);
    ctx.fill();

    const isSweet = p.load > 0.45;
    ctx.fillStyle = isSweet ? '#59ff8a' : '#ffd24a';
    ctx.fillRect(W / 2 - barW / 2, barY, barW * p.load, 12);
    txt(isSweet ? 'RELEASE TO LAUNCH!' : 'COMPRESSING...', W / 2, barY - 14, 12 * fs + 2, '#ffffff', 'bold');
  }

  /* Onboarding Hint */
  if (g.hint > 0 && !g.tapped) {
    const hw = Math.min(W * 0.9, 440);
    const hy = H * 0.32;
    ctx.fillStyle = 'rgba(12,16,34,0.88)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - hw / 2, hy - 40, hw, 84, 16);
    ctx.fill();
    ctx.strokeStyle = '#38d9a9';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    txt('HOLD on bed to load springs • RELEASE to launch!', W / 2, hy - 14, Math.min(16, W / 23), '#ffffff', 'bold');
    txt('HOLD LEFT / RIGHT in mid-air to tuck & spin!', W / 2, hy + 10, Math.min(14, W / 26), '#ffd24a', 'bold');
    txt('LAND FEET FIRST on the trampoline to survive.', W / 2, hy + 30, Math.min(13, W / 28), '#38d9a9', 'bold');
  }
}

function drawPanel(title, tcol, sub, now) {
  const g = G, pulse = Math.sin(now * 0.008);
  const w = Math.min(W * 0.9, 400), x0 = (W - w) / 2, y0 = Math.max(safeTop + 25, H * 0.14), h = 380;

  ctx.fillStyle = 'rgba(6,8,18,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(18,22,46,0.95)';
  ctx.beginPath();
  ctx.roundRect(x0, y0, w, h, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  txt(title, W / 2, y0 + 38, Math.min(32, w / 10), tcol);
  txt(sub, W / 2, y0 + 68, 14, '#a5a8c8', 'bold', 0.9);

  const finalScore = Math.floor(g.score + g.bestAlt * 10);
  txt(String(finalScore), W / 2, y0 + 118, 48, '#ffffff');
  txt('TOTAL APEX SCORE', W / 2, y0 + 152, 12, '#ffd24a', 'bold');

  txt('MAX ALTITUDE: ' + Math.floor(g.bestAlt) + 'm', W / 2, y0 + 178, 14, '#4ae6ff', 'bold');

  /* Top 5 Leaderboard */
  txt('LOCAL LEADERBOARD', W / 2, y0 + 208, 11, '#8a8eac', 'bold');
  top5.forEach((s, i) => {
    const yy = y0 + 234 + i * 26;
    const isMe = i === g.rank;
    ctx.fillStyle = isMe ? 'rgba(56,217,169,0.22)' : 'rgba(255,255,255,0.05)';
    ctx.beginPath();
    ctx.roundRect(x0 + 24, yy - 11, w - 48, 22, 6);
    ctx.fill();

    txt('#' + (i + 1), x0 + 44, yy, 12, i === 0 ? '#ffd24a' : '#ffffff', 'bold');
    txt(String(s), x0 + w - 44, yy, 13, isMe ? '#38d9a9' : '#d8daf0', 'bold', 1, 'right');
  });

  if (performance.now() - overAt > 850) {
    txt('TAP TO RETRY', W / 2, y0 + h + 32, 22, '#ffffff', 'bold', 0.65 + 0.35 * pulse);
  }
}

function draw(now) {
  const g = G, p = g.p, pulse = Math.sin(now * 0.008);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* Camera vertical follow with smooth easing */
  const targetCamY = Math.max(0, p.y - 140);
  const camY = targetCamY;

  ctx.save();
  if (g.shake > 0) {
    ctx.translate((Math.random() - 0.5) * 12 * g.shake, (Math.random() - 0.5) * 12 * g.shake);
  }

  drawBackground(camY);
  drawTrampoline(camY);
  drawRings(camY, now);

  /* Floating Popups & Particles */
  for (const q of g.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(W / 2 + q.x * scale, H * 0.78 - (q.y - camY) * scale, q.sz * scale, q.sz * scale);
  }
  ctx.globalAlpha = 1;

  if (state !== STATES.START || true) {
    drawGymnast(camY, now);
  }

  for (const q of g.popups) {
    txt(q.t, W / 2 + q.x * scale, H * 0.78 - (q.y - camY) * scale, (18 * q.scale) * scale, q.col, 'bold', clamp(q.life * 1.5, 0, 1));
  }

  ctx.restore();

  /* Vignette overlay */
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,10,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* HUD & Menus */
  if (state === STATES.PLAYING) {
    drawHUD(now);
  } else if (state === STATES.START) {
    ctx.fillStyle = 'rgba(8,10,24,0.65)';
    ctx.fillRect(0, 0, W, H);
    txt('BOUNCE APEX', W / 2, H * 0.24, Math.min(54, W / 7), '#ffd24a');
    txt('Master vertical acrobatics. Reach the stratosphere.', W / 2, H * 0.24 + 48, Math.min(16, W / 24), '#ffffff', 'bold', 0.95);
    txt('Hold on bed to load springs. Release to blast off.', W / 2, H * 0.24 + 74, Math.min(14, W / 26), '#a5a8c8', 'bold', 0.9);
    txt('TAP TO LAUNCH', W / 2, H * 0.62, 24, '#ffffff', 'bold', 0.65 + 0.35 * pulse);
    if (top5.length) txt('BEST RECORD  ' + top5[0], W / 2, H * 0.62 + 38, 16, '#ffd24a', 'bold');
  } else if (state === STATES.GAMEOVER) {
    drawPanel('RUN CONCLUDED', '#ff4a7a', 'You wiped out on the trampoline bed', now);
  }
}

resize(); startLoop();
})();
</script>
