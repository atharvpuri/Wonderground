<!DOCTYPE html>
<html lang="en" data-theme="cave">
<head>

<title>Silk Swing</title>
<style>

</style>
</head>
<body>
<div id="sp"></div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,H=640,dpr=1,safeTop=0,s=1,cy0=80;
var ST={START:0,PLAY:1,OVER:2};
var state=ST.START,raf=0,last=0;
var sp,anchors,flies,bats,parts,pops,camX,x0,t,score,bonus,combo,comboT,bestCombo,flyCount,shake,flash,hint,hintAlpha,overT,saved,rank,reason,holdId,keyHold,nextAx,nextFx,batT,target,seed,launches,perfects,clock=0;
var best={scores:[],dist:0,combo:0};
function load(){try{var d=JSON.parse(localStorage.getItem('silkswing1'));if(d&&Array.isArray(d.scores)){best.scores=d.scores.filter(function(x){return typeof x==='number'&&isFinite(x)}).slice(0,5);best.dist=Math.max(0,+d.dist||0)|0;best.combo=Math.max(0,+d.combo||0)|0}}catch(e){}}
function save(){try{localStorage.setItem('silkswing1',JSON.stringify(best))}catch(e){}}
load();
var ac=null;
function initAudio(){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function beep(f,d,type,v,sl){if(!ac)return;try{var o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);gn.gain.setValueAtTime(v||0.15,n);gn.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+d+0.02)}catch(e){}}
function noise(d,v,fr){if(!ac)return;try{var n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var sr=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||700;gn.gain.value=v||0.2;sr.buffer=b;sr.connect(f);f.connect(gn);gn.connect(ac.destination);sr.start()}catch(e){}}
function sThwip(){beep(900,0.09,'triangle',0.1,300)}
function sRelease(){noise(0.15,0.08,2500)}
function sFly(c){beep(500+Math.min(c,14)*55,0.1,'sine',0.13);beep(1000+Math.min(c,14)*80,0.07,'sine',0.05)}
function sPerfect(){[660,880,1320].forEach(function(f,i){setTimeout(function(){beep(f,0.12,'triangle',0.13)},i*45)})}
function sCrack(){noise(0.2,0.2,1800);beep(200,0.15,'square',0.08,80)}
function sDie(){noise(0.5,0.25,500);beep(280,0.6,'sawtooth',0.14,50)}
function sUI(){beep(520,0.08,'square',0.08);beep(780,0.1,'square',0.06)}
function hsh(n){var v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v)}
function rnd(){seed=(seed+0x6D2B79F5)|0;var tt=Math.imul(seed^(seed>>>15),1|seed);tt=(tt+Math.imul(tt^(tt>>>7),61|tt))^tt;return((tt^(tt>>>14))>>>0)/4294967296}
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth||360;H=window.innerHeight||640;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);safeTop=document.getElementById('sp').offsetHeight||0;s=Math.max(0.7,Math.min(1.5,H/640));cy0=safeTop+Math.max(74,H*0.11)}
function floorY(){var d=Math.max(0,sp?sp.x-x0:0);return H*0.9-H*0.17*(1-Math.exp(-d/(6000*s)))}
function reset(){seed=(Date.now()&0xffffff)|1;anchors=[];flies=[];bats=[];parts=[];pops=[];t=0;bonus=0;combo=0;comboT=0;bestCombo=0;flyCount=0;shake=0;flash=0;hint=true;hintAlpha=1;overT=0;saved=false;rank=-1;reason='';holdId=null;keyHold=false;launches=0;perfects=0;batT=3;
x0=0;sp={x:0,y:H*0.36,vx:260*s,vy:-160*s,att:null,L:0,hold:0};camX=-W*0.3;score=0;nextAx=120*s;nextFx=300*s;target=null;
anchors.push({x:170*s,y:cy0+H*0.12,type:0,hold:0,dead:false,sh:0});nextAx=170*s}
function startGame(){reset();state=ST.PLAY;sUI();startLoop()}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
function dist(){return Math.max(0,(sp.x-x0)/(40*s))}
function genAhead(){var d=Math.max(0,nextAx-x0)/s;
while(nextAx<camX+W*2.2){var gap=(150+Math.min(140,d*0.045))*s*(0.85+rnd()*0.4);nextAx+=gap;d=(nextAx-x0)/s;
var ty=0;if(d>700){var r=rnd();if(r<Math.min(0.35,0.05+d/18000))ty=1;else if(r<Math.min(0.35,0.05+d/18000)+0.09)ty=2}
var ay=cy0+8*s+rnd()*H*0.26;anchors.push({x:nextAx,y:ay,type:ty,hold:0,dead:false,sh:0});
if(rnd()<0.8){var fx=nextAx-gap*0.5,fy=cy0+H*0.18+rnd()*(H*0.42),n=1+((rnd()*3)|0);for(var i=0;i<n;i++)flies.push({x:fx+(i-(n-1)/2)*34*s,y:fy+Math.sin(i*1.3)*22*s,ph:rnd()*6,got:false})}}
while(anchors.length&&anchors[0].x<camX-W)anchors.shift();while(flies.length&&flies[0].x<camX-200)flies.shift()}
function pop(x,y,st,c){if(pops.length<24)pops.push({x:x,y:y,s:st,c:c||'#fff',l:1})}
function burst(x,y,col,n){for(var i=0;i<n&&parts.length<200;i++){var a=Math.random()*6.283,v=40+Math.random()*180;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col,s:2+Math.random()*2.5})}}
function findTarget(){var best=null,bs=1e9,reach=440*s;for(var i=0;i<anchors.length;i++){var a=anchors[i];if(a.dead||a.x<sp.x-30*s||a.y>sp.y-10*s)continue;var dx=a.x-sp.x,dy=a.y-sp.y,d=Math.sqrt(dx*dx+dy*dy);if(d>reach||d<40*s)continue;var sc=d-dx*0.35;if(sc<bs){bs=sc;best=a}}return best}
function attach(){if(state!==ST.PLAY||sp.att)return;var a=findTarget();if(!a){beep(160,0.08,'square',0.05);return}
var dx=a.x-sp.x,dy=a.y-sp.y;sp.att=a;sp.L=Math.sqrt(dx*dx+dy*dy);sp.hold=0;a.hold=0;sThwip();burst(a.x,a.y,'#9ff',4)}
function release(){if(state!==ST.PLAY||!sp.att)return;var a=sp.att;sp.att=null;sRelease();launches++;hint=false;
var spd=Math.sqrt(sp.vx*sp.vx+sp.vy*sp.vy),ang=Math.atan2(-sp.vy,sp.vx);
if(spd>380*s&&ang>0.4&&ang<1.0){perfects++;sp.vx*=1.1;sp.vy*=1.1;var b=25;bonus+=b;pop(sp.x,sp.y-26*s,'PERFECT LAUNCH +'+b,'#9ff2ff');sPerfect();burst(sp.x,sp.y,'#9ff2ff',14)}
if(a.type===2){sp.vx*=1.22;pop(sp.x,sp.y-48*s,'BOOST!','#ffd84a');burst(sp.x,sp.y,'#ffd84a',10)}}
function die(why){if(state!==ST.PLAY)return;state=ST.OVER;reason=why;overT=0;sp.att=null;sDie();shake=16;flash=1;burst(sp.x,sp.y,'#c9a0ff',24);
if(!saved){saved=true;var sc=Math.floor(score);best.scores.push(sc);best.scores.sort(function(a,b){return b-a});rank=best.scores.indexOf(sc);best.scores=best.scores.slice(0,5);if(rank>4)rank=-1;best.dist=Math.max(best.dist,Math.floor(dist()));best.combo=Math.max(best.combo,bestCombo);save()}}
function update(dt){
clock+=dt;
if(state===ST.PLAY){
t+=dt;var G=900*s,vmax=1250*s;
sp.vy+=G*dt;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;
if(sp.att){var a=sp.att;sp.hold+=dt;a.hold+=dt;sp.L=Math.max(70*s,sp.L-26*s*dt);
var ddx=sp.x-a.x,ddy=sp.y-a.y,d=Math.sqrt(ddx*ddx+ddy*ddy);
if(d>sp.L&&d>1e-4){var nx=ddx/d,ny=ddy/d;sp.x=a.x+nx*sp.L;sp.y=a.y+ny*sp.L;var vn=sp.vx*nx+sp.vy*ny;if(vn>0){sp.vx-=vn*nx;sp.vy-=vn*ny}}
if(a.type===1&&a.hold>1.25){a.dead=true;sCrack();burst(a.x,a.y,'#ff6a6a',16);pop(a.x,a.y+20*s,'SNAP!','#ff8a8a');sp.att=null;shake=6}}

var sv=Math.sqrt(sp.vx*sp.vx+sp.vy*sp.vy);if(sv>vmax){sp.vx*=vmax/sv;sp.vy*=vmax/sv}

if(sp.y<cy0){sp.y=cy0;if(sp.vy<0)sp.vy*=-0.3}
var fl=floorY();if(sp.y>fl-8*s&&t>0.3)die('Dissolved in acid!');

genAhead();target=sp.att?null:findTarget();
for(var i=0;i<flies.length;i++){var f=flies[i];if(f.got)continue;var fx=f.x-sp.x,fy=f.y+Math.sin(clock*2+f.ph)*6*s-sp.y;if(fx*fx+fy*fy<(26*s)*(26*s)){f.got=true;combo++;comboT=3;bestCombo=Math.max(bestCombo,combo);flyCount++;var g=5*Math.min(combo,10);bonus+=g;sFly(combo);burst(f.x,f.y,'#fff7a0',8);pop(f.x,f.y-14*s,'+'+g,'#fff7a0')}}
if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}

for(i=bats.length-1;i>=0;i--){var b=bats[i];b.x+=b.vx*dt;var by2=b.y+Math.sin(clock*3+b.ph)*b.amp;b.cy=by2;var bx=b.x-sp.x,bY=by2-sp.y;if(bx*bx+bY*bY<(20*s)*(20*s))die('Bat strike!');if(b.x<camX-120)bats.splice(i,1)}
score=Math.floor(dd)+bonus;hintAlpha=hint?1:Math.max(0,hintAlpha-dt*2)}
if(state===ST.OVER)overT+=dt;
shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*3);
for(var p=parts.length-1;p>=0;p--){var q=parts[p];q.vy+=500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*1.5;if(q.l<=0)parts.splice(p,1)}
for(p=pops.length-1;p>=0;p--){pops[p].l-=dt*1.1;pops[p].y-=36*dt;if(pops[p].l<=0)pops.splice(p,1)}}
function txt(st,x,y,sz,col,al,w){ctx.font=(w||'800')+' '+Math.round(sz)+'px system-ui,-apple-system,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(st,x,y)}

function bgDraw(){var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1d0f3a');gr.addColorStop(0.7,'#2a1550');gr.addColorStop(1,'#10241c');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
var L=[{p:0.2,sp:140,c:'rgba(70,40,120,0.5)',h:0.22},{p:0.4,sp:110,c:'rgba(50,28,95,0.7)',h:0.16},{p:0.65,sp:90,c:'rgba(32,16,66,0.9)',h:0.12}];
for(var l=0;l<L.length;l++){var o=L[l],spc=o.sp*s,off=camX*o.p,i0=Math.floor(off/spc)-1;ctx.fillStyle=o.c;ctx.beginPath();ctx.moveTo(-10,-10);for(var i=i0;i*spc-off<W+spc;i++){var px=i*spc-off,hh=(0.4+hsh(i*3+l*17)*0.9)*o.h*H;ctx.lineTo(px-spc*0.28,0);ctx.lineTo(px,hh);ctx.lineTo(px+spc*0.28,0)}ctx.lineTo(W+10,-10);ctx.closePath();ctx.fill()}
var fo=camX*0.5,fs=70*s,f0=Math.floor(fo/fs)-1;for(var k=f0;k*fs-fo<W+fs;k++){if(hsh(k*7.7)<0.45){var mx=k*fs-fo,my=floorY()-hsh(k)*30*s-20*s;ctx.fillStyle='rgba(120,255,200,0.25)';ctx.beginPath();ctx.arc(mx,my,6*s+hsh(k*2)*5*s,0,6.283);ctx.fill()}}
ctx.fillStyle='rgba(8,4,18,0.8)';ctx.fillRect(0,0,W,cy0-6*s);ctx.fillStyle='rgba(150,100,255,0.35)';ctx.fillRect(0,cy0-6*s,W,2)}
function acid(){var fl=floorY();var gr=ctx.createLinearGradient(0,fl,0,H);gr.addColorStop(0,'#7dff6a');gr.addColorStop(0.15,'#37c24a');gr.addColorStop(1,'#0c4a2a');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<=W;x+=10){ctx.lineTo(x,fl+Math.sin((x+camX)*0.03+clock*2.4)*4*s)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(220,255,200,0.7)';ctx.lineWidth=2;ctx.beginPath();for(x=0;x<=W;x+=10){var yy=fl+Math.sin((x+camX)*0.03+clock*2.4)*4*s;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke();
for(var i=0;i<6;i++){var bx=((i*137+clock*30*(1+i%3)+camX*0.4)%(W+40))-20,by=fl+14*s+((clock*20+i*40)%60)*s;ctx.fillStyle='rgba(220,255,200,0.3)';ctx.beginPath();ctx.arc(W-bx,by,2+i%3,0,6.283);ctx.fill()}}
function drawAnchor(a){var x=a.x-camX,y=a.y;if(x<-40||x>W+40)return;var sh=a.type===1&&sp&&sp.att===a?Math.sin(clock*60)*2*s:0;x+=sh;
var col=a.type===1?['#ff9a9a','#c43a3a']:a.type===2?['#fff0a0','#e0a010']:['#a8f0ff','#3a9ad6'];
ctx.fillStyle='#1a0e30';ctx.beginPath();ctx.arc(x,y-14*s,9*s,0,6.283);ctx.fill();
if(a.dead){ctx.globalAlpha=0.25}
var gl=ctx.createRadialGradient(x,y,2,x,y,26*s);gl.addColorStop(0,col[0]+'88');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,26*s,0,6.283);ctx.fill();
var g2=ctx.createLinearGradient(x-8*s,y,x+8*s,y);g2.addColorStop(0,col[0]);g2.addColorStop(1,col[1]);ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(x,y-16*s);ctx.lineTo(x+9*s,y);ctx.lineTo(x,y+13*s);ctx.lineTo(x-9*s,y);ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.moveTo(x,y-16*s);ctx.lineTo(x-9*s,y);ctx.lineTo(x-2*s,y-2*s);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
if(target===a&&!a.dead){var pl=0.5+0.5*Math.sin(clock*8);ctx.strokeStyle='rgba(255,255,255,'+(0.5+pl*0.4)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,(20+pl*4)*s,0,6.283);ctx.stroke()}
if(a.type===1&&sp&&sp.att===a){ctx.fillStyle='rgba(255,100,100,0.9)';ctx.fillRect(x-14*s,y+20*s,28*s*Math.max(0,1-a.hold/1.25),4*s)}}
function drawFly(f){if(f.got)return;var x=f.x-camX,y=f.y+Math.sin(clock*2+f.ph)*6*s;if(x<-20||x>W+20)return;var gl=ctx.createRadialGradient(x,y,1,x,y,16*s);gl.addColorStop(0,'rgba(255,250,150,0.9)');gl.addColorStop(1,'rgba(255,250,150,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,16*s,0,6.283);ctx.fill();ctx.fillStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,3.5*s,0,6.283);ctx.fill()}

function drawSpider(){var x=sp.x-camX,y=sp.y;if(sp.att){var ax=sp.att.x-camX,ay=sp.att.y;ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=4*s;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(x,y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.6*s;ctx.stroke()}
ctx.strokeStyle='#2a1450';ctx.lineWidth=2*s;ctx.lineCap='round';for(var i=0;i<8;i++){var side=i<4?-1:1,k=i%4,ph=Math.sin(clock*12+i*1.7)*0.35;var a=(-0.9+k*0.55)+ph;var ex=x+side*(14+k*2)*s*Math.cos(a*0.6),ey=y+Math.sin(a)*14*s+4*s;ctx.beginPath();ctx.moveTo(x+side*4*s,y);ctx.lineTo(x+side*12*s,y-8*s+k*3*s);ctx.lineTo(ex+side*4*s,ey);ctx.stroke()}
var gr=ctx.createRadialGradient(x-3*s,y-3*s,1,x,y,11*s);gr.addColorStop(0,'#9a6af0');gr.addColorStop(1,'#2a1160');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,10*s,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(x-Math.sign(sp.vx||1)*9*s,y+2*s,7*s,0,6.283);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+4*s,y-3*s,2.6*s,0,6.283);ctx.arc(x+8*s,y-2*s,2.2*s,0,6.283);ctx.fill();ctx.fillStyle='#120a24';ctx.beginPath();ctx.arc(x+5*s,y-3*s,1.2*s,0,6.283);ctx.arc(x+9*s,y-2*s,1*s,0,6.283);ctx.fill()}
function hud(){var pad=Math.max(10,W*0.03),top=safeTop+pad,fs=Math.min(28,W/12);
ctx.fillStyle='rgba(8,4,18,0.6)';rr(pad,top,Math.min(190,W*0.5),fs*2.1,12);ctx.fill();
txt('SCORE',pad+10,top+fs*0.6,fs*0.4,'#b9a0ff','left','700');txt(String(Math.floor(score)),pad+10,top+fs*1.4,fs,'#fff','left');
var hw=Math.min(130,W*0.34);ctx.fillStyle='rgba(8,4,18,0.6)';rr(W-pad-hw,top,hw,fs*2.1,12);ctx.fill();
txt('DISTANCE',W-pad-hw/2,top+fs*0.6,fs*0.4,'#b9a0ff','center','700');txt(Math.floor(dist())+' m',W-pad-hw/2,top+fs*1.4,fs*0.8,'#fff','center');

function draw(){ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bgDraw();
for(var i=0;i<anchors.length;i++)drawAnchor(anchors[i]);
for(i=0;i<flies.length;i++)drawFly(flies[i]);
for(i=0;i<bats.length;i++)drawBat(bats[i]);
if(state!==ST.OVER)drawSpider();
acid();
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x-camX,q.y,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(80,Math.min(W-80,o.x-camX)),o.y,Math.min(18,W/18),o.c)}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.3)+')';ctx.fillRect(-20,-20,W+40,H+40)}
ctx.restore();
if(state===ST.PLAY){hud();if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(8,4,18,0.78)';var hw=Math.min(W-24,340),hy=H*0.5;rr(W/2-hw/2,hy,hw,64,14);ctx.fill();txt('HOLD to shoot web \u2022 RELEASE to fly',W/2,hy+22,Math.min(18,W/19),'#fff');txt('Release while swinging up-forward = PERFECT',W/2,hy+46,Math.min(13,W/27),'#b9a0ff','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(8,4,18,0.55)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('SILK',W/2,y,Math.min(70,W/5.2),'#a8f0ff');txt('SWING',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#c9a0ff');
txt('Swing through the glowing cave. Don\u2019t touch the acid.',W/2,y+Math.min(130,W/3),Math.min(15,W/23),'#d8c8ff','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.55,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   FARTHEST '+best.dist+' m',W/2,H*0.55+34,Math.min(15,W/24),'#b9a0ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(8,4,18,0.7)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#1d1138';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#9a6af0';ctx.lineWidth=3;ctx.stroke();
var u=ph/430,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff8aa0');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt(Math.floor(dist())+' m  \u2022  '+flyCount+' flies  \u2022  '+perfects+' perfect',W/2,cy+114*u,Math.min(13,pw/24),'#b9a0ff','center','700');
txt('TOP 5',W/2,cy+142*u,Math.min(14,pw/24),'#d8c8ff','center','700');
for(var i=0;i<5;i++){var ry=cy+168*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(154,106,240,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*u,Math.min(20,pw/16),'#fff')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();
if(state===ST.START){startGame()}else if(state===ST.OVER){if(overT>0.8)startGame()}else if(holdId===null){holdId=e.pointerId;attach()}});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}if(holdId===e.pointerId){holdId=null;release()}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>-1)e.preventDefault();if(e.repeat)return;
if(k===' '||k==='Enter'||k==='ArrowUp'||k==='ArrowDown'||k==='w'||k==='W'||k==='s'||k==='S'){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else if(!keyHold){keyHold=true;attach()}}});
window.addEventListener('keyup',function(e){var k=e.key;if(k===' '||k==='Enter'||k==='ArrowUp'||k==='ArrowDown'||k==='w'||k==='W'||k==='s'||k==='S'){if(keyHold){keyHold=false;release()}}});
function releaseAll(){holdId=null;keyHold=false;if(state===ST.PLAY&&sp&&sp.att)release()}
window.addEventListener('blur',function(){releaseAll();stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){releaseAll();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
