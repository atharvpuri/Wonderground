<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clayspin</title>
<style>
:root{--bg:#e2bf93}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e2bf93}}
:root[data-theme="dark"]{--bg:#e2bf93}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, BETWEEN: 2, GAMEOVER: 3 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const N = 72, K = 0.26, TAU = Math.PI * 2, HUES = [18, 175, 235, 45, 330, 95];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let best = parseInt(store.get('clayspin.best') || '0', 10) || 0;

/* ---------- canvas ---------- */
let W, H, dpr, ax, baseY, rowH, rmin, rmax, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0;
  ax = W / 2; rmax = Math.min(W * 0.38, H * 0.2); rmin = rmax * 0.22;
  const vh = Math.min(H * 0.56, W * 1.25); rowH = vh / N;
  baseY = Math.min(H - rmax * K * 1.5 - 24, Math.max(H * 0.78, safeTop + 130 + vh + rmax * K));
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null, hum = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function humOn() {
  const a = audio(); if (!a || hum) return;
  try { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = 70; g.gain.value = 0.025; o.connect(g); g.connect(a.destination); o.start(); hum = { o, g }; } catch (e) {}
}
function humOff() { if (hum) { try { hum.o.stop(); } catch (e) {} hum = null; } }
const sfx = {
  tink(c) { const b = 520 * Math.pow(1.0595, Math.min(c / 3, 14)); tone('sine', b, b * 1.5, 0.1, 0.1); },
  thud() { tone('sawtooth', 130, 45, 0.18, 0.13); },
  done() { [523, 659, 784, 1046].forEach((n, i) => tone('triangle', n, n, 0.2, 0.12, i * 0.09)); },
  crash() { tone('sawtooth', 200, 30, 0.8, 0.15); tone('square', 90, 25, 0.9, 0.1, 0.05); },
  start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0;
const speckles = Array.from({ length: 40 }, () => ({ h: Math.random(), a: Math.random() * TAU, s: 1 + Math.random() * 1.6 }));
const keys = { l: 0, r: 0 };
const rate = () => Math.min(15, 6 + 1.1 * G.level);

function makeTarget(level) {
  const L = Math.min(level, 6), p1 = Math.random() * TAU, p2 = Math.random() * TAU;
  const a1 = 0.1 + 0.015 * L, a2 = 0.03 + 0.012 * Math.min(level, 5), f1 = Math.min(2.4, 0.9 + level * 0.15), f2 = Math.min(4, 1.7 + level * 0.25);
  return Array.from({ length: N + 1 }, (_, i) => {
    const h = i / N, foot = 0.7 + 0.3 * clamp(h / 0.08, 0, 1);
    return clamp((0.55 + a1 * Math.sin(TAU * f1 * h + p1) + a2 * Math.sin(TAU * f2 * h + p2)) * foot, 0.18, 0.95);
  });
}
function newVase() {
  G.rows = []; G.cur = 0; G.acc = 0; G.stability = 1; G.combo = 0; G.perfects = 0; G.miss = false;
  G.target = makeTarget(G.level); G.between = 0; G.bonus = 0; G.acc2 = 0;
}
function resetGame() {
  G = { level: 0, score: 0, spin: 0, t: 0, rcur: 0.55, want: 0.55, popups: [], collapse: 0, shake: 0, vases: 0 };
  newVase();
}

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(now);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopLoop(); humOff(); } else { startLoop(); if (state === STATES.PLAYING) humOn(); } });
function startGame() { stopLoop(); humOff(); resetGame(); state = STATES.PLAYING; sfx.start(); humOn(); startLoop(); }

/* ---------- logic ---------- */
function popup(t, col) { G.popups.push({ t, col, life: 1, y: 0 }); }
function commit() {
  const i = G.cur, wob = 0.012 * Math.min(G.level, 8) * Math.sin(G.t * 9 + G.level) + 0.008 * Math.min(G.level, 8) * (Math.random() - .5);
  const r = clamp(G.rcur + wob, 0, 1); G.rows[i] = r;
  const err = Math.abs(r - G.target[i]), mult = 1 + Math.min(G.combo, 20) * 0.1;
  if (err < 0.045) {
    G.combo++; G.perfects++; G.score += 3 * mult; G.stability = Math.min(1, G.stability + 0.012); G.miss = false;
    if (G.combo % 3 === 0) sfx.tink(G.combo);
    if (G.combo % 10 === 0) popup('COMBO x' + mult.toFixed(1), '#fff3b0');
  } else if (err < 0.11) {
    G.score += 1 * mult; G.stability = Math.min(1, G.stability + 0.003); G.miss = false;
  } else {
    if (G.combo >= 8) popup('COMBO LOST', '#ff8a7a');
    G.combo = 0; G.stability -= 0.05 + err * 0.6; G.shake = 0.4;
    if (!G.miss) sfx.thud(); G.miss = true;
  }
  G.cur++;
}
function update(dt) {
  const g = G; g.spin += dt * (1.5 + (state === STATES.PLAYING ? rate() * 0.2 : 0));
  g.shake = Math.max(0, g.shake - dt * 2.5);
  for (let i = g.popups.length - 1; i >= 0; i--) { const p = g.popups[i]; p.life -= dt * 0.8; p.y -= dt * 40; if (p.life <= 0) g.popups.splice(i, 1); }
  if (state === STATES.PLAYING) {
    g.t += dt;
    g.want = clamp(g.want + (keys.r - keys.l) * dt * 1.1, 0, 1);
    g.rcur += (g.want - g.rcur) * (1 - Math.exp(-dt * 12));
    if (hum) hum.o.frequency.value = 60 + rate() * 6;
    g.acc += dt * rate();
    while (g.acc >= 1 && g.cur <= N && state === STATES.PLAYING) {
      g.acc -= 1; commit();
      if (g.stability <= 0) {
        state = STATES.GAMEOVER; overAt = performance.now(); humOff(); sfx.crash(); g.shake = 1;
        const s = Math.floor(g.score); if (s > best) { best = s; store.set('clayspin.best', String(best)); }
      } else if (g.cur > N) {
        state = STATES.BETWEEN; humOff(); g.between = 2; g.vases++;
        g.bonus = Math.round(200 * (1 + g.level) * (0.5 + g.stability)); g.score += g.bonus; sfx.done();
        popup('VASE COMPLETE  +' + g.bonus, '#fff3b0');
        const s = Math.floor(g.score); if (s > best) { best = s; store.set('clayspin.best', String(best)); }
      }
    }
  } else if (state === STATES.BETWEEN) {
    g.between -= dt;
    if (g.between <= 0) { g.level++; newVase(); state = STATES.PLAYING; humOn(); }
  } else if (state === STATES.GAMEOVER) g.collapse = Math.min(1, g.collapse + dt * 1.2);
}

/* ---------- input ---------- */
function setWant(e) { if (state === STATES.PLAYING) G.want = clamp((Math.abs(e.clientX - ax) - rmin) / (rmax - rmin), 0, 1); }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  if (state === STATES.START) { startGame(); setWant(e); }
  else if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 700) startGame(); }
  else setWant(e);
});
cv.addEventListener('pointermove', setWant);
addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 1; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 1;
  else if ((c === 'Space' || c === 'Enter') && !e.repeat) {
    audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 700) startGame();
  } else return;
  e.preventDefault();
});
addEventListener('keyup', e => { const c = e.code; if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 0; else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 0; });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col;
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
const px = r => rmin + r * (rmax - rmin);
function draw(now) {
  const g = G, c = g.collapse, ys = 1 - 0.75 * c, ex = 1 + 0.35 * c, pulse = Math.sin(now * 0.008);
  const Y = i => baseY - i * rowH * ys, R = i => px(g.rows[i]) * ex, Rt = i => px(g.target[i]);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wall = ctx.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#f0d6b3'); wall.addColorStop(0.7, '#d9a877'); wall.addColorStop(1, '#b9824f');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
  const lg = ctx.createRadialGradient(W * 0.8, 0, 10, W * 0.8, 0, H * 0.7); lg.addColorStop(0, 'rgba(255,245,200,0.55)'); lg.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  const tb = baseY + rmax * K * 0.5; const wood = ctx.createLinearGradient(0, tb, 0, H); wood.addColorStop(0, '#8a5530'); wood.addColorStop(1, '#5a3319');
  ctx.fillStyle = wood; ctx.fillRect(0, tb, W, H - tb);
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - .5) * 12 * g.shake, (Math.random() - .5) * 12 * g.shake);

  /* wheel */
  const wr = rmax * 1.2;
  ctx.fillStyle = '#26262d'; ctx.beginPath(); ctx.ellipse(ax, baseY + 12, wr, wr * K, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3d3d47'; ctx.beginPath(); ctx.ellipse(ax, baseY + 4, wr, wr * K, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#a5a5b3'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < 16; i++) { const a = g.spin * 2 + i / 16 * TAU; if (Math.sin(a) > 0) { ctx.fillStyle = '#c8c8d4'; ctx.fillRect(ax + Math.cos(a) * wr * 0.9, baseY + 4 + Math.sin(a) * wr * K * 0.9, 3, 3); } }

  /* target ghost outline */
  ctx.setLineDash([6, 7]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  for (const s of [-1, 1]) { ctx.beginPath(); for (let i = 0; i <= N; i++) { const x = ax + s * Rt(i), y = baseY - i * rowH; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  ctx.setLineDash([]);
  const hue = HUES[g.level % HUES.length];

  /* vase (lathe) */
  const n = g.cur;
  if (n > 1) {
    const gr = ctx.createLinearGradient(ax - rmax * ex, 0, ax + rmax * ex, 0);
    gr.addColorStop(0, 'hsl(' + hue + ',55%,20%)'); gr.addColorStop(0.3, 'hsl(' + hue + ',55%,58%)'); gr.addColorStop(0.45, 'hsl(' + hue + ',60%,68%)'); gr.addColorStop(0.7, 'hsl(' + hue + ',55%,42%)'); gr.addColorStop(1, 'hsl(' + hue + ',55%,18%)');
    ctx.beginPath(); ctx.moveTo(ax - R(0), Y(0));
    for (let i = 1; i < n; i++) ctx.lineTo(ax - R(i), Y(i));
    ctx.ellipse(ax, Y(n - 1), R(n - 1), R(n - 1) * K, 0, Math.PI, TAU);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(ax + R(i), Y(i));
    ctx.ellipse(ax, Y(0), R(0), R(0) * K, 0, 0, Math.PI);
    ctx.closePath(); ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.09)'; ctx.lineWidth = 1;
    for (let i = 2; i < n; i += 2) { ctx.beginPath(); ctx.ellipse(ax, Y(i), R(i), R(i) * K, 0, 0, Math.PI); ctx.stroke(); }
    for (const s of speckles) {
      const i = Math.floor(s.h * (n - 1)), a = s.a + g.spin * 2; if (Math.sin(a) <= 0) continue;
      ctx.fillStyle = 'rgba(255,240,220,0.4)'; ctx.fillRect(ax + R(i) * Math.cos(a), Y(i) + R(i) * K * Math.sin(a), s.s, s.s);
    }
    const rt = R(n - 1), yt = Y(n - 1);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(ax, yt, rt * 0.92, rt * K * 0.92, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'hsl(' + hue + ',60%,75%)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ax, yt, rt, rt * K, 0, 0, TAU); ctx.stroke();
  }

  /* fingers + control ring */
  if (state === STATES.PLAYING || state === STATES.START) {
    const i = Math.min(g.cur, N), er = px(clamp(g.rcur, 0, 1)), y = baseY - i * rowH;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(ax, y, er, er * K, 0, 0, TAU); ctx.stroke();
    for (const s of [-1, 1]) {
      const x0 = ax + s * (er + 2), len = Math.min(70, W * 0.18);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.roundRect(Math.min(x0, x0 + s * len), y - 8 + 8, len, 20, 10); ctx.fill();
      ctx.fillStyle = '#f2cba8'; ctx.beginPath(); ctx.roundRect(Math.min(x0, x0 + s * len), y - 12, len, 22, 11); ctx.fill();
      ctx.strokeStyle = '#d9a67f'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  ctx.restore();

  for (const p of g.popups) txt(p.t, ax, safeTop + 130 + p.y, 22, p.col, 'bold', clamp(p.life, 0, 1));

  const top = safeTop + 32, ink = '#3a2214';
  if (state === STATES.PLAYING || state === STATES.BETWEEN) {
    txt(String(Math.floor(g.score)), ax, top, 34, ink);
    const bw = Math.min(240, W * 0.55), low = g.stability < 0.35;
    ctx.fillStyle = 'rgba(58,34,20,0.2)'; ctx.fillRect(ax - bw / 2, top + 24, bw, 8);
    ctx.fillStyle = low ? '#d6362f' : '#2f9e5b'; ctx.globalAlpha = low ? 0.6 + 0.4 * pulse : 1; ctx.fillRect(ax - bw / 2, top + 24, bw * clamp(g.stability, 0, 1), 8); ctx.globalAlpha = 1;
    txt(low ? 'CLAY WOBBLING!' : 'CLAY STABILITY', ax, top + 46, 12, low ? '#d6362f' : ink, 'bold', 0.85);
    txt('VASE ' + (g.vases + 1) + '   BEST ' + best + (g.combo > 4 ? '   x' + (1 + Math.min(g.combo, 20) * 0.1).toFixed(1) : ''), ax, top + 66, 13, ink, 'bold', 0.75);
    if (state === STATES.PLAYING && g.t < 6) txt('Slide left / right to match the dotted outline', ax, Math.min(H - 20, baseY + rmax * K * 2.2 + 24), Math.min(17, W / 22), '#fff3dc', 'bold', clamp(1.4 - g.t / 5, 0, 1));
  } else if (state === STATES.START) {
    txt('CLAYSPIN', ax, safeTop + 64, Math.min(56, W / 7), ink);
    txt('Shape the spinning clay to match the dotted outline', ax, safeTop + 104, Math.min(16, W / 24), ink, 'normal', 0.85);
    txt('Slide left / right. Stay on the line. Keep it steady.', ax, safeTop + 128, Math.min(15, W / 26), ink, 'normal', 0.75);
    txt('TAP / CLICK TO START', ax, safeTop + 168, 22, '#fff8ea', 'bold', 0.65 + 0.35 * pulse);
    if (best) txt('BEST ' + best, ax, safeTop + 198, 15, ink, 'bold', 0.8);
  } else {
    ctx.fillStyle = 'rgba(40,22,10,0.55)'; ctx.fillRect(0, 0, W, H);
    txt('IT COLLAPSED!', ax, H * 0.3, Math.min(46, W / 9), '#ffb199');
    txt('SCORE ' + Math.floor(g.score), ax, H * 0.3 + 50, 30, '#fff3dc');
    txt('VASES ' + g.vases + '   BEST ' + best, ax, H * 0.3 + 86, 17, '#ffd98a', 'normal');
    if (performance.now() - overAt > 700) txt('TAP / CLICK TO RETRY', ax, H * 0.3 + 134, 22, '#fff3dc', 'bold', 0.6 + 0.4 * pulse);
  }
}

resize(); resetGame(); startLoop();
})();
</script>
</body>
</html>
