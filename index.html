<div id="app">
<header><div class="logo"><span class="logoMark">W</span><b>WONDERGROUND</b></div><div class="hr"><span class="chip"><b id="pc">0</b> played</span><div class="authWrap"><button class="auth" id="auth" type="button"><span class="googleMark" aria-hidden="true">G</span><span id="authLabel">Sign up</span></button><div class="authNote" id="authNote"><button id="authNoteClose" type="button" aria-label="Close">×</button><b>Save your games.</b><br>Sign in to keep favorites and progress across devices. You can still play without signing in.</div></div><button class="ib" id="snd" aria-label="Sound"></button></div></header>

<main>
 <section class="view" id="home"><div class="scroll">
  <div class="hero"><div><h2>Swipe. Play. <em>Repeat.</em></h2><p>Endless one-tap games. Jump in, beat your best, move on.</p><div class="btns"><button class="pill pri" data-go="play" id="hp"></button><button class="pill" id="hr2"></button></div></div><div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
  <div id="hrows"></div></div></section>

 <section class="view" id="disc"><div class="scroll"><div class="top"><div class="srow"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" aria-label="Search" autocomplete="off"></label></div><div class="chips" id="chips"></div></div><div class="grid" id="dgrid"></div></div></section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  browserLocalPersistence,
  onAuthStateChanged,
  getRedirectResult,
  setPersistence,
  signInWithPopup,
  signInWithRedirect,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCB1IEbgkTLkzoLeEt4LYurTqIAkjTqkP0",
  authDomain: "wonderground-30fe4.firebaseapp.com",
  projectId: "wonderground-30fe4",
  storageBucket: "wonderground-30fe4.firebasestorage.app",
  messagingSenderId: "580927947801",
  appId: "1:580927947801:web:93dc1fc4facc7f70671688",
  measurementId: "G-JMV33WS3BR"
};

const authButton = document.querySelector("#auth");
const authLabel = document.querySelector("#authLabel");
const authNote = document.querySelector("#authNote");
const authNoteClose = document.querySelector("#authNoteClose");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const notify = message => {
  const toast = document.querySelector("#toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("on");
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => toast.classList.remove("on"), 2600);
};

const updateAuthButton = user => {
  if (!authButton) return;
  if (authLabel) authLabel.textContent = user ? (user.displayName || user.email || "Signed in") : "Sign up";
  authButton.title = user ? "Sign out" : "Sign in with Google";
  authButton.dataset.signedIn = user ? "true" : "false";
  authButton.setAttribute("aria-label", user ? `Sign out ${user.displayName || user.email || "account"}` : "Sign in with Google");
};

authNoteClose?.addEventListener("click", () => {
  authNote.classList.remove("visible");
});

window.revealAuthNote = () => {
  if (auth.currentUser || !authNote || window.plays < 4 || localStorage.getItem("wg-auth-note-shown") === "1") return;
  authNote.classList.add("visible");
  localStorage.setItem("wg-auth-note-shown", "1");
};

const persistenceReady = setPersistence(auth, browserLocalPersistence).catch(error => {
  notify("Browser storage is unavailable; sign-in may not persist");
  console.error("Firebase persistence error", error);
  throw error;
});
onAuthStateChanged(auth, updateAuthButton);
getRedirectResult(auth).catch(error => {
  if (error?.code) {
    notify(`Google sign-in failed: ${error.code.replace("auth/", "")}`);
    console.error("Firebase redirect authentication error", error);
  }
});
authButton?.addEventListener("click", async () => {
  try {
    if (auth.currentUser) {
      await signOut(auth);
      notify("Signed out");
    } else {
      await persistenceReady;
      await signInWithPopup(auth, provider);
      notify("Signed in with Google");
    }
  } catch (error) {
    if (error?.code === "auth/popup-blocked") notify("Allow popups to sign in");
    else if (error?.code === "auth/popup-closed-by-user") notify("Sign-in cancelled");
    else if (["auth/internal-error", "auth/operation-not-supported-in-this-environment", "auth/popup-failed-to-open"].includes(error?.code)) {
      notify("Opening Google sign-in...");
      await signInWithRedirect(auth, provider);
      return;
    } else notify(`Google sign-in failed: ${error?.code?.replace("auth/", "") || "unknown error"}`);
    console.error("Firebase Authentication error", error);
  }
});
</script>
<script src="games.js"></script>
<script>
const FOLDER="games/",CATS=window.CATS||{};
const G=(window.GAMES||[]).map(f=>({f,name:f.replace(/\.html?$/i,"").replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()),c:CATS[f]||""}));
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const P=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const I={heart:P("M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"),up:P("M6 14l6-6 6 6"),dn:P("M6 10l6 6 6-6"),
 rnd:P("M4 7h3c5 0 5 10 10 10h3M4 17h3c1.500 0 2.600-.8 3.500-2M14 8c.9-.7 1.800-1 3-1h3M17 4l3 3-3 3M17 14l3 3-3 3"),
 full:P("M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4"),play:P("M8 5.500v13l11-6.500z"),
 gear:P("M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6"),vol:P("M4 10v4h4l5 4V6L8 10zM16.500 9a4 4 0 0 1 0 6"),mute:P("M4 10v4h4l5 4V6L8 10zM17 9l4 6M21 9l-4 6"),
 home:P("M4 11l8-7 8 7v9h-5v-6H9v6H4z"),grid:P("M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z")};
/* state */
const def={accent:"blue",motion:true,quick:true,muted:false,vol:80,shape:"tall"};
let S={...def};try{S={...def,...JSON.parse(localStorage.getItem("st")||"{}")}}catch(e){}
let favs=new Set(),seen=[];try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));seen=JSON.parse(localStorage.getItem("seen")||"[]")}catch(e){}
const store=()=>{try{localStorage.setItem("st",JSON.stringify(S));localStorage.setItem("favs",JSON.stringify([...favs]));localStorage.setItem("seen",JSON.stringify(seen))}catch(e){}};
let plays=0,filt="All",toastT;try{plays=Math.max(0,Number(localStorage.getItem("wg-plays")||0))}catch(e){};window.plays=plays;$("#pc").textContent=plays;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* sound: injected into each game so the volume works from outside */
const SND="<script>(()=>{const B=window.BaseAudioContext;if(!B)return;window.__v=1;const d=Object.getOwnPropertyDescriptor(B.prototype,'destination');window.__g=[];Object.defineProperty(B.prototype,'destination',{configurable:true,get(){if(!this.__m){this.__m=this.createGain();this.__m.connect(d.get.call(this));this.__m.gain.value=window.__v;window.__g.push(this.__m)}return this.__m}});addEventListener('message',e=>{if(e.data&&e.data.vol!=null){window.__v=e.data.vol;window.__g.forEach(g=>g.gain.value=e.data.vol)}})})();<\/script>";
const inject=t=>/<head[^>]*>/i.test(t)?t.replace(/<head[^>]*>/i,m=>m+SND):/<html[^>]*>/i.test(t)?t.replace(/<html[^>]*>/i,m=>m+SND):SND+t;
const cache=new Map();
function html(f){if(cache.has(f))return cache.get(f);const p=fetch(FOLDER+encodeURIComponent(f)).then(r=>{if(!r.ok)throw 0;return r.text()}).then(inject);cache.set(f,p);p.catch(()=>cache.delete(f));if(cache.size>12)cache.delete(cache.keys().next().value);return p}
function warm(f){html(f).catch(()=>{if(!document.querySelector(`link[data-p="${CSS.escape(f)}"]`)){const l=document.createElement("link");l.rel="prefetch";l.href=FOLDER+encodeURIComponent(f);l.dataset.p=f;document.head.appendChild(l)}})}
const volNow=()=>S.muted?0:S.vol/100;
const sendVol=fr=>{try{fr.contentWindow.postMessage({vol:volNow()},"*")}catch(e){}};
/* apply settings */
function apply(){const r=document.documentElement;S.accent="blue";r.dataset.accent="blue";document.body.classList.toggle("nomo",!S.motion);r.style.setProperty("--r",".5625");
 $("#snd").innerHTML=S.muted?I.mute:I.vol;
 const f=$("iframe",feed);const a=feed.querySelector("iframe");if(a)sendVol(a);store()}
/* nav */
const NAV=[["home","Home",I.home],["disc","Discover",I.grid],["play","Play",I.play,"go"],["saved","Saved",I.heart],["rnd","Random",I.rnd]];
$("#nav").innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${n[3]||""}">${n[2]}${n[1]}</button>`).join("");
$("#hp").innerHTML=I.play+"Play now";$("#hr2").innerHTML=I.rnd+"Surprise me";
/* feed */
const feed=$("#feed");let order=[],cur=-1;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)activate(+e.target.dataset.i)}),{root:feed,threshold:.6});
function mk(i){const g=order[i],s=document.createElement("div");s.className="slide";s.dataset.i=i;
 s.innerHTML=`<div class="col"><div class="mid"><div class="head"><b>${g.name}</b></div><div class="prog"><u style="width:${(i%G.length+1)/G.length*100}%"></u></div><div class="stage"><div class="loader">${g.name[0]}</div></div></div>
 <div class="ctl"><button data-a="rnd" title="Random">${I.rnd}<span>Random</span></button><button class="fav ${favs.has(g.f)?"on":""}" data-a="fav" title="Save">${I.heart}<span>Save</span></button><button data-a="full" title="Fullscreen">${I.full}<span>Full</span></button><button class="pri" data-a="prev" title="Previous">${I.up}<span>Prev</span></button><button class="pri" data-a="next" title="Next">${I.dn}<span>Next</span></button></div></div>`;
 feed.appendChild(s);io.observe(s)}
function batch(){if(!G.length)return;const b=shuffle([...G]);if(order.length&&b[0]===order[order.length-1]&&b.length>1)b.push(b.shift());const st=order.length;order.push(...b);b.forEach((_,k)=>mk(st+k))}
function build(){feed.innerHTML="";order=[];cur=-1;if(!G.length){feed.innerHTML='<div class="empty">No games found. Add your games to the games folder and list them in games.js.</div>';return}batch()}
async function mount(i,st){const g=order[i],fr=document.createElement("iframe");fr.allow="autoplay;fullscreen";
 fr.onload=()=>{const l=st.querySelector(".loader");if(l)l.classList.add("off");sendVol(fr)};
 try{fr.srcdoc=await html(g.f)}catch(e){fr.src=FOLDER+encodeURIComponent(g.f)}
 if(cur===i)st.appendChild(fr)}
function activate(i){if(i===cur||!feed.children[i]||!feed.children[i].dataset||!order[i])return;
 const o=feed.children[cur];if(o){const f=o.querySelector("iframe");if(f)f.remove();const l=o.querySelector(".loader");if(l)l.classList.remove("off")}
 cur=i;const g=order[i];mount(i,feed.children[i].querySelector(".stage"));
 seen=[g.f,...seen.filter(x=>x!==g.f)].slice(0,40);$("#pc").textContent=++plays;window.plays=plays;try{localStorage.setItem("wg-plays",String(plays))}catch(e){};window.revealAuthNote?.();store();
 if(i>order.length-4)batch();
 if(S.quick)for(let k=1;k<=2;k++)if(order[i+k])warm(order[i+k].f);else if(G.length)warm(G[k%G.length].f)}
const go=i=>{const s=feed.children[Math.max(0,Math.min(order.length-1,i))];if(s)s.scrollIntoView({behavior:S.motion?"smooth":"auto"})};
function jump(i){const s=feed.children[i];if(!s)return;feed.scrollTop=s.offsetTop;activate(i)}
function rndGame(){if(!G.length)return;show("play");let i;do{i=Math.random()*order.length|0}while(i===cur&&order.length>1);jump(i)}
function openGame(f){show("play");let i=order.findIndex(g=>g.f===f);if(i<0)return;jump(i)}
const toggleFav=f=>{favs.has(f)?(favs.delete(f),toast("Removed from saved")):(favs.add(f),toast("Saved"));store();$$(`[data-s="${CSS.escape(f)}"]`).forEach(x=>x.classList.toggle("on",favs.has(f)));return favs.has(f)};
feed.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const i=+b.closest(".slide").dataset.i,a=b.dataset.a,g=order[i];
 if(a==="next")go(i+1);else if(a==="prev")go(i-1);else if(a==="rnd")rndGame();
 else if(a==="fav")b.classList.toggle("on",toggleFav(g.f));
 else if(a==="full"){const st=b.closest(".slide").querySelector(".stage");(st.requestFullscreen||st.webkitRequestFullscreen||(()=>{})).call(st)}});
addEventListener("keydown",e=>{if(!$("#play").classList.contains("on"))return;if(e.key==="ArrowDown"||e.key==="j")go(cur+1);if(e.key==="ArrowUp"||e.key==="k")go(cur-1)});
/* cards */
const pvQ=[],pvDocs=new Map();let pvB=0;
function pump(){while(pvB<4&&pvQ.length){const c=pvQ.shift();if(!c.isConnected||!c._v||c.querySelector("iframe"))continue;pvB++;mountPv(c)}}
async function mountPv(c){if(!c.isConnected||!c._v||c.querySelector("iframe")){pvB=Math.max(0,pvB-1);return}const f=document.createElement("iframe");f.tabIndex=-1;f.loading="eager";f.style.transform=`scale(${c.clientWidth/360})`;f.onload=()=>{f.classList.add("loaded");pvB=Math.max(0,pvB-1);pump()};c.insertBefore(f,c.children[1]);try{let doc=pvDocs.get(c.dataset.f);if(!doc){doc=html(c.dataset.f);pvDocs.set(c.dataset.f,doc)}f.srcdoc=await doc}catch(e){pvDocs.delete(c.dataset.f);f.src=FOLDER+encodeURIComponent(c.dataset.f)}}
const pio=new IntersectionObserver(es=>es.forEach(e=>{const c=e.target;c._v=e.isIntersecting;if(e.isIntersecting){pvQ.push(c);pump()}}),{rootMargin:"800px"});
const card=(g,i)=>`<div class="card" data-f="${g.f}" style="--d:${Math.min(i,12)}"><div class="mono">${g.name[0]}</div><div class="shade"></div><div class="pl"><i>${I.play}</i></div><div class="n">${g.name}</div><button class="f ${favs.has(g.f)?"on":""}" data-s="${g.f}">${I.heart}</button></div>`;
function paint(el,l,msg){el.innerHTML=l.length?l.map(card).join(""):`<div class="empty">${msg}</div>`;el.querySelectorAll(".card").forEach(c=>pio.observe(c))}
const byF=f=>G.find(g=>g.f===f);
function drawHome(){const rec=seen.map(byF).filter(Boolean).slice(0,10),sv=G.filter(g=>favs.has(g.f)).slice(0,10),fresh=shuffle([...G]).slice(0,12);
 const row=(t,l)=>l.length?`<h3 class="t">${t}</h3><div class="rowx">${l.map(card).join("")}</div>`:"";
 $("#hrows").innerHTML=row("Jump back in",rec)+row("Fresh picks",fresh)+row("Your saved",sv);$$("#hrows .card").forEach(c=>pio.observe(c))}
function drawDisc(){const q=$("#q").value.toLowerCase().trim(),cats=[...new Set(G.map(g=>g.c).filter(Boolean))];
 const fl=["All","Unplayed","Played","Saved",...cats];$("#chips").innerHTML=fl.map(c=>`<button class="${c===filt?"on":""}">${c}</button>`).join("");
 let l=G.filter(g=>g.name.toLowerCase().includes(q));
 l=l.filter(g=>filt==="Unplayed"?!seen.includes(g.f):filt==="Played"?seen.includes(g.f):filt==="Saved"?favs.has(g.f):filt==="All"||g.c===filt);
 paint($("#dgrid"),[...l].sort((a,b)=>a.name.localeCompare(b.name)),"Nothing matches. Try another filter.")}
const drawSaved=()=>paint($("#sgrid"),G.filter(g=>favs.has(g.f)),"Nothing saved yet. Tap the heart on any game and it lands here.");
$("#chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){filt=b.textContent;drawDisc()}});
$("#q").addEventListener("input",drawDisc);
document.addEventListener("click",e=>{const s=e.target.closest("[data-s]");if(s){e.stopPropagation();toggleFav(s.dataset.s);if($("#saved").classList.contains("on"))drawSaved();return}
 const c=e.target.closest(".card");if(c)openGame(c.dataset.f)});
document.addEventListener("mousemove",e=>{if(!S.motion)return;const c=e.target.closest&&e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*12+"deg");c.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*12+"deg")});
document.addEventListener("mouseout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){c.style.removeProperty("--rx");c.style.removeProperty("--ry")}});
/* views */
function show(v){$$(".view").forEach(x=>x.classList.toggle("on",x.id===v));$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 if(v!=="play"){const s=feed.children[cur],f=s&&s.querySelector&&s.querySelector("iframe");if(f)f.remove();if(s&&s.querySelector){const l=s.querySelector(".loader");if(l)l.classList.remove("off")}cur=-1}
 else if(G.length)activate(Math.round(feed.scrollTop/(feed.clientHeight||1)));
 if(v==="home")drawHome();if(v==="disc")drawDisc();if(v==="saved")drawSaved()}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;b.dataset.v==="rnd"?rndGame():show(b.dataset.v)};
$$("[data-go]").forEach(b=>b.onclick=()=>show("play"));$("#hr2").onclick=rndGame;
/* settings */
$("#snd").onclick=()=>{S.muted=!S.muted;apply();toast(S.muted?"Sound off":"Sound on")};
/* start */
apply();build();
const h=decodeURIComponent((location.hash.match(/g=([^&]+)/)||[])[1]||"");
setTimeout(()=>{if(h&&byF(h))openGame(h);else activate(0)},30);
</script></body></html>
