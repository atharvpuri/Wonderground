<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Orbit</title>
<style>
:root{--bg:#05060f;--fg:#e8f6ff;--accent:#47e6ff;--gold:#ffd24a;--danger:#ff4d6d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f;--fg:#e8f6ff}}
:root[data-theme="dark"]{--bg:#05060f;--fg:#e8f6ff}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none;background:var(--bg)}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, TUTORIAL: 1, PLAYING: 2, GAMEOVER: 3 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const probe = document.getElementById('probe');
const BASE_W = 1.7, TWO_PI = Math.PI * 2;
const KEY_DONE = 'cosmicOrbit.tutorialDone', KEY_BEST = 'cosmicOrbit.best';

/* ---------- storage (safe) ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let isFirstTimePlayer = store.get(KEY_DONE) !== '1';
let best = parseInt(store.get(KEY_BEST) || '0', 10) || 0;

/* ---------- HiDPI canvas ---------- */
let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 0, SR = 0, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.3; SR = Math.hypot(W, H) / 2 + 40;
  safeTop = probe.offsetHeight || 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  laser() { tone('square', 960, 340, 0.1, 0.07); },
  ping() { tone('triangle', 1320, 1320, 0.07, 0.12); tone('triangle', 1980, 1980, 0.14, 0.12, 0.07); },
  boom() { tone('sawtooth', 150, 28, 0.7, 0.2); tone('square', 70, 20, 0.85, 0.14); tone('sawtooth', 55, 16, 1.0, 0.12); },
  start() { tone('square', 440, 880, 0.12, 0.06); tone('square', 660, 1320, 0.14, 0.06, 0.1); }
};

/* ---------- game state ---------- */
let state = STATES.START, G = null, overAt = 0;
let raf = 0, last = 0;
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, v: Math.random() * 14 + 4 }));

function resetGame() {
  G = {
    ang: -Math.PI / 2, dir: 1, w: 0, score: 0, mult: 1, multT: 0, boost: 0, grace: 0,
    t: 0, spawnT: 1.4, dustT: 3, ents: [], parts: [], trail: [],
    shake: 0, ts: 1, tsT: 1, tut: { phase: 0, timer: 0, obs: null }, goFlash: 0
  };
}
resetGame();

function diff() { return 1 - Math.exp(-G.score / 1800); } /* non-linear 0..1 */
function playerPos() { return { x: cx + R * Math.cos(G.ang), y: cy + R * Math.sin(G.ang) }; }

/* ---------- loop control: single pointer, never stacked ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(now);
}
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });

function startGame() {
  stopLoop();
  resetGame();
  state = isFirstTimePlayer ? STATES.TUTORIAL : STATES.PLAYING;
  if (state === STATES.PLAYING) G.grace = 1.2;
  sfx.start();
  startLoop();
}

/* ---------- spawning ---------- */
function edgePoint() { const a = Math.random() * TWO_PI; return { x: cx + SR * Math.cos(a), y: cy + SR * Math.sin(a) }; }
function shape(n, r) { return Array.from({ length: n }, () => r * (0.7 + Math.random() * 0.4)); }
function spawnDebris(speed, targetAng, from) {
  const p = from || edgePoint();
  const tx = cx + R * Math.cos(targetAng), ty = cy + R * Math.sin(targetAng);
  const d = Math.hypot(tx - p.x, ty - p.y) || 1, r = 11 + Math.random() * 9;
  const e = { type: 'debris', x: p.x, y: p.y, vx: (tx - p.x) / d * speed, vy: (ty - p.y) / d * speed, r, rot: 0, vr: (Math.random() - .5) * 5, age: 0, pts: shape(8, r) };
  G.ents.push(e); return e;
}
function spawnProbe(speed) {
  const p = edgePoint(), pp = playerPos();
  const h = Math.atan2(pp.y - p.y, pp.x - p.x);
  G.ents.push({ type: 'probe', x: p.x, y: p.y, h, sp: speed, vx: 0, vy: 0, r: 12, rot: 0, vr: 3, age: 0 });
}
function spawnDust() {
  const a = G.ang + G.dir * (0.9 + Math.random() * 1.6);
  G.ents.push({ type: 'dust', x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), r: 9, age: 0, life: 6 });
}
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TWO_PI, s = spd * (0.2 + Math.random());
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.7, max: 1.2, col, size: 1.5 + Math.random() * 2.5 });
  }
}

/* ---------- update ---------- */
function update(dt) {
  const g = G;
  g.ts += (g.tsT - g.ts) * Math.min(1, dt * (g.tsT > g.ts ? 2.5 : 8));
  const sd = dt * g.ts;
  const playing = state === STATES.PLAYING, tut = state === STATES.TUTORIAL, live = playing || tut;

  for (const s of stars) { s.y += s.v * dt * (0.3 + 0.7 * g.ts) / H * 8; if (s.y > 1) { s.y = 0; s.x = Math.random(); } }
  g.shake = Math.max(0, g.shake - dt * 2.2);
  g.goFlash = Math.max(0, g.goFlash - dt);
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985;
    if (p.life <= 0) g.parts.splice(i, 1);
  }
  for (let i = g.trail.length - 1; i >= 0; i--) { g.trail[i].l -= dt * 2.4; if (g.trail[i].l <= 0) g.trail.splice(i, 1); }
  if (!live) return;

  /* ship with lerped angular velocity (inertia) */
  g.t += sd;
  const bm = g.boost > 0 ? 1.6 : 1;
  g.w += (g.dir * BASE_W * bm - g.w) * (1 - Math.exp(-sd * 7));
  g.ang += g.w * sd;
  g.boost = Math.max(0, g.boost - sd); g.grace = Math.max(0, g.grace - sd);
  const pp = playerPos();
  g.trail.push({ x: pp.x, y: pp.y, l: 1, b: g.boost > 0 });

  if (playing) {
    g.score += sd * 10 * g.mult;
    g.multT -= sd; if (g.multT <= 0) g.mult = 1;
    const d = diff();
    g.spawnT -= sd;
    if (g.spawnT <= 0) {
      g.spawnT = Math.max(0.38, 1.5 - 1.1 * Math.pow(d, 0.7)) * (0.75 + Math.random() * 0.5);
      const sp = 150 + 340 * d;
      if (Math.random() < 0.14 + 0.28 * d) spawnProbe(sp * 0.5);
      else spawnDebris(sp, g.ang + g.w * (0.5 + Math.random()) + (Math.random() - .5) * 0.8);
    }
    g.dustT -= sd;
    if (g.dustT <= 0) {
      g.dustT = 3 + Math.random() * 2.5;
      if (g.ents.filter(e => e.type === 'dust').length < 3) spawnDust();
    }
  } else tickTutorial(sd, pp);

  for (let i = g.ents.length - 1; i >= 0; i--) {
    const e = g.ents[i]; e.age += sd;
    if (e.type === 'probe') {
      const pd = Math.atan2(pp.y - e.y, pp.x - e.x);
      let df = pd - e.h; df = Math.atan2(Math.sin(df), Math.cos(df));
      const turn = 0.8 * sd; e.h += Math.max(-turn, Math.min(turn, df));
      e.vx = Math.cos(e.h) * e.sp; e.vy = Math.sin(e.h) * e.sp;
    }
    if (e.type !== 'dust') { e.x += e.vx * sd; e.y += e.vy * sd; e.rot += e.vr * sd; }
    const far = Math.hypot(e.x - cx, e.y - cy) > SR + 120;
    if ((e.type === 'dust' && e.age > e.life) || (e.type === 'probe' && e.age > 13) || (e.type === 'debris' && far && e.age > 0.5)) {
      if (g.tut.obs === e) g.tut.obs = null;
      g.ents.splice(i, 1); continue;
    }
    if (!playing) continue;
    const dist = Math.hypot(e.x - pp.x, e.y - pp.y);
    if (e.type === 'dust') {
      if (dist < e.r + 15) {
        g.mult = Math.min(8, g.mult + 1); g.multT = 6; g.boost = 2.2; g.score += 25 * g.mult;
        burst(e.x, e.y, 18, '#ffd24a', 160); sfx.ping(); g.ents.splice(i, 1);
      }
    } else if (g.grace <= 0 && dist < e.r + 8) { die(pp); return; }
  }
}

function tickTutorial(sd, pp) {
  const T = G.tut;
  if (T.phase === 0) {
    T.timer += sd;
    if (!T.obs && T.timer > 1.0) {
      const spd = 170, from = edgePoint();
      const dist = Math.hypot(from.x - cx, from.y - cy) - R;
      const ta = G.ang + G.dir * BASE_W * (dist / spd);
      T.obs = spawnDebris(spd, ta, from);
    }
    if (T.obs && Math.hypot(T.obs.x - pp.x, T.obs.y - pp.y) < 300) { T.phase = 1; G.tsT = 0.03; }
  } else if (T.phase === 2) {
    T.timer += sd;
    if (T.timer > 2.2 || !T.obs) beginPlayFromTutorial();
  }
}
function beginPlayFromTutorial() {
  isFirstTimePlayer = false; store.set(KEY_DONE, '1');
  state = STATES.PLAYING; G.tsT = 1; G.score = 0; G.mult = 1; G.spawnT = 1.5; G.dustT = 3; G.grace = 1.0; G.goFlash = 1;
}
function die(pp) {
  state = STATES.GAMEOVER; overAt = performance.now();
  burst(pp.x, pp.y, 70, '#ff4d6d', 320); burst(pp.x, pp.y, 40, '#ffffff', 200);
  G.shake = 1; G.ts = 1; G.tsT = 1; sfx.boom();
  const s = Math.floor(G.score);
  if (s > best) { best = s; store.set(KEY_BEST, String(best)); }
}

/* ---------- input ---------- */
function switchDir() { G.dir *= -1; sfx.laser(); const p = playerPos(); burst(p.x, p.y, 8, '#47e6ff', 90); }
function onInput() {
  audio();
  if (state === STATES.START) startGame();
  else if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 600) startGame(); }
  else if (state === STATES.PLAYING) switchDir();
  else if (state === STATES.TUTORIAL) {
    const T = G.tut;
    if (T.phase === 1) { switchDir(); T.phase = 2; T.timer = 0; G.tsT = 1; }
    else if (T.phase === 0) switchDir();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); onInput(); });
window.addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) { e.preventDefault(); if (!e.repeat) onInput(); }
});

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = col; ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function glowCircle(x, y, r, col) {
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
}
function draw(now) {
  const g = G, pulse = Math.sin(now * 0.008);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - .5) * 20 * g.shake, (Math.random() - .5) * 20 * g.shake);

  ctx.fillStyle = '#9fc4ff';
  for (const s of stars) { ctx.globalAlpha = 0.3 + s.s * 0.3; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  ctx.globalAlpha = 1;

  glowCircle(cx, cy, R * 0.55, 'rgba(90,60,200,0.45)');
  ctx.fillStyle = '#12123a'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.22, 0, TWO_PI); ctx.fill();
  ctx.strokeStyle = 'rgba(71,230,255,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO_PI); ctx.stroke(); ctx.setLineDash([]);

  for (const e of g.ents) {
    if (e.type === 'dust') {
      const k = Math.min(1, e.age * 4) * (e.life - e.age < 1 ? e.life - e.age : 1), r = e.r * (1 + 0.2 * pulse);
      ctx.globalAlpha = k; glowCircle(e.x, e.y, r * 3, 'rgba(255,210,74,0.8)');
      ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.55, 0, TWO_PI); ctx.fill(); ctx.globalAlpha = 1;
    } else if (e.type === 'probe') {
      glowCircle(e.x, e.y, e.r * 3, 'rgba(255,77,109,0.55)');
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath();
      ctx.moveTo(0, -e.r); ctx.lineTo(e.r, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3 + pulse, 0, TWO_PI); ctx.fill(); ctx.restore();
    } else {
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
      ctx.fillStyle = '#7b7f93'; ctx.strokeStyle = '#c9cde0'; ctx.lineWidth = 1.5; ctx.beginPath();
      e.pts.forEach((r, i) => { const a = i / e.pts.length * TWO_PI; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); });
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }

  for (const t of g.trail) { ctx.globalAlpha = t.l * 0.6; ctx.fillStyle = t.b ? '#ffd24a' : '#47e6ff'; ctx.beginPath(); ctx.arc(t.x, t.y, 2 + 4 * t.l, 0, TWO_PI); ctx.fill(); }
  ctx.globalAlpha = 1;

  if (state !== STATES.GAMEOVER && state !== STATES.START) {
    const p = playerPos(), rot = g.ang + (g.w >= 0 ? Math.PI / 2 : -Math.PI / 2);
    const col = g.boost > 0 ? '#ffd24a' : '#47e6ff';
    ctx.globalAlpha = g.grace > 0 ? 0.55 + 0.45 * Math.sin(now * 0.03) : 1;
    glowCircle(p.x, p.y, 28, g.boost > 0 ? 'rgba(255,210,74,0.5)' : 'rgba(71,230,255,0.45)');
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(rot);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(8, 9); ctx.lineTo(0, 5); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  for (const p of g.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.restore();

  const top = safeTop + 34;
  if (state === STATES.PLAYING || state === STATES.TUTORIAL) {
    if (state === STATES.PLAYING) {
      txt(String(Math.floor(g.score)), cx, top, 34, '#e8f6ff');
      if (g.mult > 1) txt('x' + g.mult + (g.boost > 0 ? '  BOOST' : ''), cx, top + 32, 18, '#ffd24a', 'bold', 0.7 + 0.3 * pulse);
      txt('BEST ' + best, cx, top + (g.mult > 1 ? 58 : 30), 13, '#9fc4ff', 'normal', 0.7);
      if (g.goFlash > 0) txt('GO!', cx, cy, 64, '#47e6ff', 'bold', Math.min(1, g.goFlash));
    } else if (g.tut.phase === 0) {
      txt('Orbit the planet. Dodge the debris.', cx, top, 17, '#9fc4ff', 'normal', 0.9);
    } else if (g.tut.phase === 1) {
      const sc = 1 + 0.07 * pulse, py = cy + R + 60 > H - 80 ? H - 90 : cy + R + 60;
      ctx.save(); ctx.translate(cx, py); ctx.scale(sc, sc);
      const fs = Math.max(18, Math.min(30, W / 16));
      txt('Tap / Click anywhere', 0, -fs * 0.7, fs, '#47e6ff', 'bold', 0.8 + 0.2 * pulse);
      txt('to switch orbit direction!', 0, fs * 0.7, fs, '#47e6ff', 'bold', 0.8 + 0.2 * pulse);
      ctx.restore();
      const p = playerPos(); ctx.strokeStyle = '#47e6ff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 - 0.4 * ((pulse + 1) / 2);
      ctx.beginPath(); ctx.arc(p.x, p.y, 20 + 18 * ((pulse + 1) / 2), 0, TWO_PI); ctx.stroke(); ctx.globalAlpha = 1;
    }
  } else if (state === STATES.START) {
    txt('COSMIC ORBIT', cx, cy - 30, Math.min(56, W / 8), '#47e6ff');
    txt('Tap to switch direction. Dodge. Collect dust.', cx, cy + 14, Math.min(17, W / 24), '#9fc4ff', 'normal');
    txt('TAP / CLICK TO LAUNCH', cx, cy + 62, 22, '#e8f6ff', 'bold', 0.6 + 0.4 * pulse);
    if (best) txt('BEST ' + best, cx, cy + 100, 15, '#ffd24a', 'normal', 0.85);
  } else {
    ctx.fillStyle = 'rgba(5,6,15,0.55)'; ctx.fillRect(0, 0, W, H);
    txt('SHIP DESTROYED', cx, cy - 56, Math.min(46, W / 9), '#ff4d6d');
    txt('SCORE ' + Math.floor(g.score), cx, cy, 30, '#e8f6ff');
    txt('BEST ' + best, cx, cy + 36, 18, '#ffd24a', 'normal');
    if (performance.now() - overAt > 600) txt('TAP / CLICK TO RETRY', cx, cy + 86, 22, '#47e6ff', 'bold', 0.6 + 0.4 * pulse);
  }
}

resize();
startLoop();
})();
</script>
</body>
</html>
