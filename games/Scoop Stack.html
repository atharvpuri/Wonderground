<!DOCTYPE html>

<style>

</head>
<body>
<div id="sp"></div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,H=640,dpr=1,safeTop=0,R=26,SH=25;
var ST={START:0,PLAY:1,OVER:2};
var state=ST.START,raf=0,last=0;
var COL=[['#ff8fb1','#d94f7d'],['#fff1b8','#e8c75a'],['#8fe3c0','#3fae85'],['#b99cff','#7a55d6'],['#8a5a3c','#5a3320']];
var NAMES=['Strawberry','Vanilla','Mint','Grape','Choco'];
var tx,coneX,pcx,ang,av,tower,items,parts,pops,score,combo,bestCombo,lives,t,spawnT,windV,shake,camY,hint,hintAlpha,overT,saved,rank,reason,cleared,caught,slow,keys={},flash,topple;
var best={scores:[],combo:0,height:0},maxH;
function load(){try{var d=JSON.parse(localStorage.getItem('scoopstack1'));if(d&&Array.isArray(d.scores)){best.scores=d.scores.filter(function(x){return typeof x==='number'&&isFinite(x)}).slice(0,5);best.combo=Math.max(0,+d.combo||0)|0;best.height=Math.max(0,+d.height||0)|0}}catch(e){}}
function save(){try{localStorage.setItem('scoopstack1',JSON.stringify(best))}catch(e){}}
load();
/* audio */
var ac=null;
function initAudio(){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function beep(f,d,type,v,sl){if(!ac)return;try{var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);g.gain.setValueAtTime(v||0.15,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+0.02)}catch(e){}}
function noise(d,v){if(!ac)return;try{var n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;g.gain.value=v||0.2;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
var lastTick=0;
function sCatch(c,perfect){beep(330+Math.min(c,14)*45,0.12,perfect?'triangle':'sine',0.16);if(perfect)beep(660+Math.min(c,14)*60,0.09,'sine',0.08)}
function sBad(){noise(0.3,0.25);beep(150,0.3,'sawtooth',0.12,60)}
function sClear(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.16,'triangle',0.15)},i*60)})}
function sOver(){beep(300,0.6,'sawtooth',0.15,60);noise(0.4,0.2)}
function sUI(){beep(520,0.08,'square',0.08);beep(780,0.1,'square',0.06)}
/* layout */
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth||360;H=window.innerHeight||640;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);safeTop=document.getElementById('sp').offsetHeight||0;R=Math.max(20,Math.min(40,Math.min(W*0.075,H*0.055)));SH=R*0.96}
/* game */
function reset(){tx=coneX=pcx=W/2;ang=0;av=0;tower=[];items=[];parts=[];pops=[];score=0;combo=0;bestCombo=0;lives=3;t=0;spawnT=0.6;windV=0;shake=0;camY=0;hint=true;hintAlpha=1;overT=0;saved=false;rank=-1;reason='';cleared=0;caught=0;slow=0;maxH=0;flash=0;topple=false}
function startGame(){reset();state=ST.PLAY;sUI();startLoop()}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
function baseY(){return H*0.8}
function cum(i){var s=0;for(var j=0;j<=i;j++)s+=tower[j].off;return s}
function scoopPos(i){return {x:coneX+ang*R*0.3*(i+1)+cum(i),y:baseY()-R*0.3-i*SH}}
function spawn(){var r=Math.random(),pk=Math.min(0.2,0.04+t/450),ty;if(r<pk)ty=6;else if(r<pk+0.06)ty=5;else ty=(Math.random()*5)|0;
var sp=190+330*(1-Math.exp(-t/55));items.push({x:R*1.4+Math.random()*(W-R*2.8),y:-camY-R*2,vy:sp*(0.9+Math.random()*0.3),ty:ty,ph:Math.random()*6,rot:0})}
function pop(x,y,s,c){if(pops.length<30)pops.push({x:x,y:y,s:s,c:c||'#fff',l:1})}
function burst(x,y,col,n){for(var i=0;i<n&&parts.length<220;i++){var a=Math.random()*6.283,v=60+Math.random()*220;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:1,c:col,s:2+Math.random()*3})}}
function loseLife(why){lives--;combo=0;shake=14;flash=1;sBad();if(lives<=0)endGame(why)}
function endGame(why){if(state!==ST.PLAY)return;state=ST.OVER;reason=why;overT=0;sOver();shake=18;
for(var i=0;i<tower.length;i++){var p=scoopPos(i);burst(p.x,p.y+camY*0,COL[tower[i].f][0],8)}
if(!saved){saved=true;var s=Math.floor(score);best.scores.push(s);best.scores.sort(function(a,b){return b-a});rank=best.scores.indexOf(s);best.scores=best.scores.slice(0,5);if(rank>4)rank=-1;best.combo=Math.max(best.combo,bestCombo);best.height=Math.max(best.height,maxH);save()}}
function update(dt){
if(state===ST.PLAY){
var sd=slow>0?0.35:1;slow=Math.max(0,slow-dt);var d=dt*sd;t+=d;
var kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);if(kx)tx=Math.max(R,Math.min(W-R,tx+kx*W*1.1*dt));
pcx=coneX;coneX+=(tx-coneX)*Math.min(1,dt*13);var vx=dt>1e-4?(coneX-pcx)/dt:0;
var n=tower.length;
var lean=0;for(var i=0;i<n;i++)lean+=tower[i].off;lean=lean/(R*1.6);
var k=26/(1+n*0.05);av+=((lean-ang)*k-av*1.3)*d;av+=-vx*0.0035*(0.4+n*0.045)*d;ang+=av*d;
for(i=0;i<n;i++)tower[i].off*=1-0.04*d;
if(n>=2&&Math.abs(ang)>1){topple=true;endGame('Tower toppled!')}
spawnT-=d;if(spawnT<=0){spawn();spawnT=0.35+0.95*Math.exp(-t/45)}
windV=t>20?Math.sin(t*0.6)*Math.min(130,(t-20)*3):0;
var top=n?scoopPos(n-1):{x:coneX,y:baseY()+R*0.4};
for(i=items.length-1;i>=0;i--){var it=items[i];it.y+=it.vy*d;it.x+=windV*d+Math.sin(t*3+it.ph)*(t>40?25:0)*d;it.rot+=d*3;
var catchY=top.y-R*0.9;
if(it.y>=catchY&&it.y-it.vy*d<catchY+R*1.2||it.y>=catchY&&it.y<top.y+R*0.2){
var dx=it.x-top.x;
if(Math.abs(dx)<R*1.05){items.splice(i,1);
if(it.ty===6){loseLife('Too many pickles!');av+=dx/R*0.8;burst(it.x,it.y,'#6fa84a',14);pop(it.x,it.y,'YUCK','#9fe070');continue}
if(it.ty===5){score+=50;ang*=0.25;av=0;for(var j=0;j<tower.length;j++)tower[j].off*=0.4;slow=2.2;sClear();burst(it.x,it.y,'#ffd84a',24);pop(it.x,it.y,'SPRINKLES +50 STEADY','#ffd84a');continue}
var perf=Math.abs(dx)<R*0.3;
if(perf){combo++}else combo=0;bestCombo=Math.max(bestCombo,combo);
var gain=Math.round((10+Math.min(combo,12)*8)*(perf?1.5:1));score+=gain;caught++;
tower.push({f:it.ty,off:dx*0.38});av+=dx/R*0.5;shake=Math.max(shake,3);hint=false;
maxH=Math.max(maxH,tower.length);sCatch(combo,perf);burst(it.x,it.y,COL[it.ty][0],perf?10:5);
pop(it.x,it.y-R,(perf?'PERFECT ':'')+'+'+gain,perf?'#fff3a0':'#fff');
var L=tower.length;if(L>=3&&tower[L-1].f===tower[L-2].f&&tower[L-2].f===tower[L-3].f){var f=tower[L-1].f;
for(j=0;j<3;j++){var q=scoopPos(L-1-j);burst(q.x,q.y,COL[f][0],14)}
tower.length=L-3;cleared++;var b=60+combo*15;score+=b;ang*=0.5;av*=0.3;sClear();pop(coneX,baseY()-L*SH,'TRIPLE! +'+b,COL[f][0]);shake=8}
continue}}
if(it.y+camY>H+60){items.splice(i,1);if(it.ty<5){pop(it.x,H-camY-40,'MISS','#ff7a7a');loseLife('Dropped too many scoops!')}}}
var tgt=Math.max(0,tower.length*SH-H*0.3);camY+=(tgt-camY)*Math.min(1,dt*3);
hintAlpha=hint?1:Math.max(0,hintAlpha-dt*2);
}
if(state===ST.OVER)overT+=dt;
shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*3);
for(var p=parts.length-1;p>=0;p--){var q2=parts[p];q2.vy+=700*dt;q2.x+=q2.vx*dt;q2.y+=q2.vy*dt;q2.l-=dt*1.4;if(q2.l<=0)parts.splice(p,1)}
for(p=pops.length-1;p>=0;p--){pops[p].l-=dt*1.1;pops[p].y-=40*dt;if(pops[p].l<=0)pops.splice(p,1)}
}
/* drawing */
function txt(s,x,y,sz,col,al,w){ctx.font=(w||'800')+' '+Math.round(sz)+'px system-ui,-apple-system,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bg(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a2a6e');g.addColorStop(0.6,'#c0527f');g.addColorStop(1,'#ffb48a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
var off=(camY*0.3)%80,sw=Math.max(40,W/9);for(var i=0;i<12;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.0)';ctx.fillRect(i*sw,0,sw,H)}
ctx.fillStyle='rgba(255,255,255,0.06)';for(var y=-80+off;y<H;y+=80){ctx.beginPath();ctx.arc(W*0.2+(y*1.7)%W*0.6,y,18,0,6.283);ctx.fill()}
var by=baseY()+R*2.8+camY;var gg=ctx.createLinearGradient(0,by,0,by+H);gg.addColorStop(0,'#7a3c2a');gg.addColorStop(1,'#4a2218');ctx.fillStyle=gg;ctx.fillRect(0,by,W,H*2);ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(0,by,W,3)}
function scoop(x,y,f,s){var c=COL[f];s=s||1;var r=R*s;ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(x,y+r*0.75,r*0.95,r*0.28,0,0,6.283);ctx.fill();
ctx.fillStyle=c[1];ctx.beginPath();ctx.ellipse(x,y+r*0.5,r*1.02,r*0.42,0,0,6.283);ctx.fill();
for(var i=-2;i<=2;i++){ctx.beginPath();ctx.arc(x+i*r*0.4,y+r*0.62,r*0.2,0,6.283);ctx.fill()}
var g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(0.25,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.ellipse(x-r*0.38,y-r*0.45,r*0.2,r*0.12,-0.6,0,6.283);ctx.fill()}
function drawItem(it){var x=it.x,y=it.y+camY;
if(it.ty<5)scoop(x,y,it.ty,0.9);
else if(it.ty===5){ctx.save();ctx.translate(x,y);ctx.rotate(it.rot);var cs=['#ff5a7a','#ffd84a','#5ad6ff','#9cff6a','#c58aff'];for(var i=0;i<10;i++){ctx.fillStyle=cs[i%5];ctx.rotate(0.628);ctx.fillRect(R*0.25,-2,R*0.5,4)}ctx.fillStyle='rgba(255,230,120,0.35)';ctx.beginPath();ctx.arc(0,0,R*0.95,0,6.283);ctx.fill();ctx.restore()}
else{ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(it.rot)*0.3);var g=ctx.createLinearGradient(-R*0.4,0,R*0.4,0);g.addColorStop(0,'#4f8a2c');g.addColorStop(0.5,'#8fd05a');g.addColorStop(1,'#4f8a2c');ctx.fillStyle=g;rr(-R*0.4,-R*0.8,R*0.8,R*1.6,R*0.4);ctx.fill();ctx.fillStyle='#2e5a18';for(var k=0;k<5;k++){ctx.beginPath();ctx.arc(((k%2)?-1:1)*R*0.12,-R*0.5+k*R*0.28,2,0,6.283);ctx.fill()}ctx.restore()}}
function drawCone(){var x=coneX,y=baseY()+camY,w=R*1.05;var g=ctx.createLinearGradient(x-w,0,x+w,0);g.addColorStop(0,'#c98a3a');g.addColorStop(0.5,'#f2c066');g.addColorStop(1,'#b87a30');
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x+w,y);ctx.lineTo(x,y+R*2.7);ctx.closePath();ctx.fill();
ctx.save();ctx.clip();ctx.strokeStyle='rgba(120,70,20,0.45)';ctx.lineWidth=1.5;for(var i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(x+i*R*0.3,y);ctx.lineTo(x+i*R*0.3+R*1.5,y+R*2.7);ctx.moveTo(x+i*R*0.3,y);ctx.lineTo(x+i*R*0.3-R*1.5,y+R*2.7);ctx.stroke()}ctx.restore();
ctx.fillStyle='#e0a850';rr(x-w-3,y-5,w*2+6,9,4);ctx.fill()}
function hud(){var pad=Math.max(10,W*0.03),top=safeTop+pad,fs=Math.min(30,W/12);
ctx.fillStyle='rgba(20,5,30,0.45)';rr(pad,top,Math.min(190,W*0.5),fs*2.1,12);ctx.fill();
txt('SCORE',pad+10,top+fs*0.6,fs*0.4,'#e8c8ff','left','700');txt(String(Math.floor(score)),pad+10,top+fs*1.4,fs,'#fff','left');
var hw=Math.min(130,W*0.34);ctx.fillStyle='rgba(20,5,30,0.45)';rr(W-pad-hw,top,hw,fs*2.1,12);ctx.fill();
for(var i=0;i<3;i++)txt('\u2665',W-pad-hw+hw*(0.2+i*0.3),top+fs*0.8,fs*0.95,i<lives?'#ff5a7a':'rgba(255,255,255,0.2)');
txt('H '+tower.length,W-pad-hw/2,top+fs*1.65,fs*0.5,'#e8c8ff','center','700');
if(combo>=2){var cs=1+Math.min(0.5,combo*0.03);txt('PERFECT x'+combo,W/2,top+fs*2.9,Math.min(26,W/14)*cs,combo>=8?'#ffd84a':'#fff3a0')}
var n=tower.length,st=Math.min(1,Math.abs(ang));var bw=Math.min(220,W*0.6),bx=W/2-bw/2,by=H-pad-14;
ctx.fillStyle='rgba(20,5,30,0.5)';rr(bx,by,bw,12,6);ctx.fill();ctx.fillStyle=st>0.75?'#ff5a5a':st>0.5?'#ffd84a':'#7ae89a';rr(bx,by,Math.max(8,bw*st),12,6);ctx.fill();
txt('WOBBLE',W/2,by-12,Math.min(13,W/28),'#f3d6ff','center','700');
if(slow>0)txt('STEADY',W/2,top+fs*4.2,Math.min(18,W/20),'#ffd84a')}
function draw(){
ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bg();
if(state!==ST.START){
for(var i=0;i<items.length;i++)drawItem(items[i]);
if(!topple||state===ST.PLAY){drawCone();for(i=0;i<tower.length;i++){var p=scoopPos(i);scoop(p.x,p.y+camY,tower[i].f)}}
}else{coneX=W/2+Math.sin(performance.now()/600)*W*0.15;drawCone();var tt=performance.now()/500;for(i=0;i<3;i++)scoop(coneX+Math.sin(tt+i)*4*(i+1),baseY()-R*0.3-i*SH,[0,2,3][i])}
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y+camY,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(60,Math.min(W-60,o.x)),o.y+camY,Math.min(20,W/16),o.c);}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.3)+')';ctx.fillRect(-20,-20,W+40,H+40)}
ctx.restore();
if(state===ST.PLAY){hud();if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(20,5,30,0.6)';var hw=Math.min(W-30,340);rr(W/2-hw/2,H*0.36,hw,70,14);ctx.fill();txt('Slide to catch scoops',W/2,H*0.36+24,Math.min(22,W/16),'#fff');txt('Center catch = PERFECT. Match 3 flavors!',W/2,H*0.36+50,Math.min(14,W/26),'#f3d6ff','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(20,5,30,0.35)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('SCOOP',W/2,y,Math.min(70,W/5.2),'#ffd0e4');txt('STACK',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#fff3a0');
txt('Catch scoops. Stack high. Don\u2019t wobble.',W/2,y+Math.min(130,W/3),Math.min(16,W/22),'#f3d6ff','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.5,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   TALLEST '+best.height,W/2,H*0.5+34,Math.min(15,W/24),'#e8c8ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(15,3,25,0.62)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,440),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#3a1c4a';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#ff8fb1';ctx.lineWidth=3;ctx.stroke();
var u=ph/440,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9ab8');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt('Height '+maxH+'  \u2022  Best streak '+bestCombo+'  \u2022  Triples '+cleared,W/2,cy+114*u,Math.min(13,pw/24),'#e8c8ff','center','700');
txt('TOP 5',W/2,cy+144*u,Math.min(14,pw/24),'#f3d6ff','center','700');
for(var i=0;i<5;i++){var ry=cy+170*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(255,143,177,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*u,Math.min(20,pw/16),'#3a1c4a')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
/* input */
function pxy(e){return e.clientX}
function press(e){initAudio();if(state===ST.START){startGame();tx=Math.max(R,Math.min(W-R,pxy(e)))}else if(state===ST.OVER){if(overT>0.8)startGame()}else tx=Math.max(R,Math.min(W-R,pxy(e)))}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}press(e)});
cv.addEventListener('pointermove',function(e){if(state===ST.PLAY&&(e.buttons||e.pointerType==='touch'||e.pointerType==='mouse'))tx=Math.max(R,Math.min(W-R,pxy(e)))});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].indexOf(e.key)>-1)e.preventDefault();if(e.key===' '||e.key==='Enter'){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER&&overT>0.8)startGame()}});
window.addEventListener('keyup',function(e){keys[e.key]=false});
function release(){keys={}}
window.addEventListener('blur',function(){release();stopLoop()});
window.addEventListener('focus',function(){release();startLoop()});
document.addEventListener('visibilitychange',function(){release();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
