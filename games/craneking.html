<!-- FILE: crane-king.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crane King</title>
<style>
:root{--bg:#0e1b26;--fg:#f4f9fc;--accent:#ffb703;--jade:#06d6a0;--danger:#ef476f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b26;--fg:#f4f9fc}}
:root[data-theme="dark"]{--bg:#0e1b26;--fg:#f4f9fc}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, SHIP_CLEAR: 2, GAMEOVER: 3 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, COLS = ['#e63946', '#2a9d8f', '#f4a261', '#3a86ff'], GOLD = '#ffd166', HAZ = '#ff0055';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);

/* ---------- storage ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => {
  try {
    const a = JSON.parse(store.get('craneking.top5') || '[]');
    return Array.isArray(a) ? a.filter(n => typeof n === 'number' && isFinite(n)).slice(0, 5) : [];
  } catch (e) { return []; }
};
let top5 = loadTop();
let bestShips = parseInt(store.get('craneking.ships') || '0', 10) || 0;
let bestStreak = parseInt(store.get('craneking.streak') || '0', 10) || 0;
function saveScore(sc, sh, st) {
  const s = Math.floor(sc);
  const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5);
  store.set('craneking.top5', JSON.stringify(top5));
  if (sh > bestShips) { bestShips = sh; store.set('craneking.ships', String(bestShips)); }
  if (st > bestStreak) { bestStreak = st; store.set('craneking.streak', String(bestStreak)); }
  return s > 0 ? top5.indexOf(s) : -1;
}

/* ---------- canvas & layout (360x640 logical harbor world) ---------- */
let W = 0, H = 0, dpr = 1, safeTop = 0, S = 1, OX = 0, OY = 0;
const RAIL_Y = 78, WATER_Y = 535, DECK_Y = 485, COL_X = [-96, -32, 32, 96], BOX_W = 54, BOX_H = 30, DEP = 9;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0;
  const availH = H - safeTop - 74;
  S = Math.max(0.45, Math.min(W / 370, availH / 580));
  OX = W * 0.5;
  OY = safeTop + 68 + (availH - 580 * S) * 0.5;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const SX = wx => OX + wx * S;
const SY = wy => OY + wy * S;
const unSX = sx => (sx - OX) / S;

/* ---------- audio engine ---------- */
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        AC = new C();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, freq, type = 'bandpass') {
  const a = audio(); if (!a || !noiseBuf) return;
  try {
    const s = a.createBufferSource(), f = AC.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  release() {
    tone('triangle', 520, 260, 0.09, 0.11);
  },
  clank(streak, isPerf, match) {
    const base = (isPerf ? 587.33 : 440) * Math.pow(1.0595, Math.min(streak, 15));
    tone('square', 140, 58, 0.11, 0.22);
    tone('triangle', base, base * (match ? 1.5 : 1.15), 0.2, 0.16);
    if (isPerf || match) tone('sine', base * 2, base * 2.5, 0.26, 0.13, 0.05);
  },
  splash() {
    noise(0.45, 0.32, 650, 'lowpass');
    tone('sawtooth', 190, 38, 0.42, 0.22);
  },
  boom() {
    noise(0.55, 0.38, 450, 'lowpass');
    tone('sawtooth', 130, 28, 0.5, 0.28);
    tone('square', 75, 22, 0.45, 0.2);
  },
  horn() {
    tone('sawtooth', 110, 108, 0.75, 0.2);
    tone('triangle', 165, 162, 0.75, 0.14);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, f * 1.01, 0.22, 0.12, 0.18 + i * 0.07));
  },
  start() { tone('triangle', 330, 660, 0.15, 0.12); },
  over() { tone('sawtooth', 330, 38, 0.85, 0.16); }
};

/* ---------- game state ---------- */
let state = STATES.START, G = null, raf = 0, last = 0, overAt = 0;
const stars = Array.from({ length: 42 }, () => ({ x: Math.random(), y: Math.random() * 0.45, r: rr(0.6, 1.8), p: rr(0, TAU) }));
const ptr = { id: null, down: false, startX: 0, startY: 0, moved: false };
const keys = { l: 0, r: 0 };

function nextBoxSpec() {
  const g = G;
  if (g.ship >= 1 && Math.random() < Math.min(0.22, 0.08 + g.diff * 0.15)) {
    return { col: HAZ, haz: true, gold: false, mass: 1.35 };
  }
  if (Math.random() < 0.12) {
    return { col: GOLD, haz: false, gold: true, mass: 1.2 };
  }
  const cIdx = Math.floor(Math.random() * (g.ship === 0 ? 3 : 4));
  return { col: COLS[cIdx], haz: false, gold: false, mass: 1.0 };
}

function setupShip(shIdx) {
  const g = G;
  g.ship = shIdx;
  g.diff = 1 - Math.exp(-(shIdx * 450 + g.score * 0.2) / 3200);
  g.quota = Math.min(16, 6 + shIdx * 2);
  g.loaded = 0;
  g.stacks = [[], [], [], []];
  g.roll = 0;
  g.vRoll = 0;
  g.shipX = 0;
  g.cableLen = lerp(112, 138, g.diff);
  g.wind = shIdx >= 2 ? (Math.random() < 0.5 ? 1 : -1) * lerp(8, 26, g.diff) : 0;
  spawnHeldBox();
}

function spawnHeldBox() {
  const g = G;
  g.held = g.nextSpec || nextBoxSpec();
  g.nextSpec = nextBoxSpec();
  g.falling = null;
}

function resetGame() {
  G = {
    t: 0, diff: 0, score: 0, lives: 3, streak: 0, maxStreak: 0, shipsCleared: 0,
    ship: 0, quota: 6, loaded: 0, stacks: [[], [], [], []],
    roll: 0, vRoll: 0, shipX: 0,
    tx: 0, vx: 0, wantX: 0,
    cableLen: 115, ang: 0.18, vAng: 0,
    held: null, nextSpec: null, falling: null,
    wind: 0, clearT: 0,
    parts: [], pops: [], splashes: [],
    shake: 0, slowmo: 1, flash: 0, hint: 1, dropsDone: 0,
    rank: -1, hiNew: false, reason: '', saved: false
  };
  setupShip(0);
}

/* ---------- loop control ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const rawDt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
  last = now;
  update(rawDt * (G ? G.slowmo : 1), rawDt);
  draw(now);
}
document.addEventListener('visibilitychange', () => {
  ptr.down = false; ptr.id = null; keys.l = keys.r = 0;
  document.hidden ? stopLoop() : startLoop();
});
window.addEventListener('blur', () => { ptr.down = false; ptr.id = null; keys.l = keys.r = 0; });

function startGame() {
  stopLoop();
  ptr.down = false; ptr.id = null; keys.l = keys.r = 0;
  resetGame();
  state = STATES.PLAYING;
  sfx.start();
  startLoop();
}

/* ---------- helpers & juice ---------- */
const mult = () => 1 + Math.min(G.streak, 16) * 0.25;
function pop(t, col, wx, wy, sz = 19) {
  G.pops.push({ t, col, x: SX(wx), y: SY(wy), sz, l: 1.1 });
}
function burst(wx, wy, n, cols, sp = 180) {
  const x = SX(wx), y = SY(wy);
  for (let i = 0; i < n && G.parts.length < 260; i++) {
    const a = Math.random() * TAU, v = sp * rr(0.35, 1.15);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, l: rr(0.35, 0.8), m: 0.8, c: cols[i % cols.length], r: rr(2, 4.5) });
  }
}

// Convert ship-local coordinates (lx, ly where 0,0 is ship pivot at (shipX, DECK_Y)) to world (wx, wy)
function shipToWorld(lx, ly) {
  const c = Math.cos(G.roll), s = Math.sin(G.roll);
  return {
    x: G.shipX + lx * c - ly * s,
    y: DECK_Y + lx * s + ly * c
  };
}

function loseLife(why, wx, wy) {
  const g = G;
  g.lives--;
  g.streak = 0;
  g.shake = 16;
  g.flash = 0.65;
  pop(why, '#ef476f', wx, wy, 22);
  if (g.lives <= 0) {
    g.reason = why;
    endGame();
  }
}

function endGame() {
  if (G.saved) return;
  G.saved = true;
  state = STATES.GAMEOVER;
  overAt = performance.now();
  const prior = top5[0] || 0;
  G.rank = saveScore(G.score, G.shipsCleared, G.maxStreak);
  G.hiNew = G.score > prior && G.score > 0;
  sfx.over();
}

function releaseContainer() {
  const g = G;
  if (state !== STATES.PLAYING || !g.held || g.falling) return;
  const bx = g.tx + Math.sin(g.ang) * g.cableLen;
  const by = RAIL_Y + Math.cos(g.ang) * g.cableLen;
  const bvx = g.vx + Math.cos(g.ang) * g.vAng * g.cableLen;
  const bvy = -Math.sin(g.ang) * g.vAng * g.cableLen;

  g.falling = {
    spec: g.held,
    x: bx, y: by,
    vx: bvx * 0.72,
    vy: Math.max(0, bvy),
    rot: -g.ang * 0.65,
    vRot: -g.vAng * 0.35
  };
  g.held = null;
  g.dropsDone++;
  if (g.dropsDone >= 1) g.hint = Math.min(g.hint, 0.99);
  sfx.release();
}

function landContainer(f, colIdx, localOffset) {
  const g = G, st = g.stacks[colIdx];
  const spec = f.spec;
  const impactSpd = Math.hypot(f.vx, f.vy);

  // Hazmat container check: explodes if dropped crooked or too fast!
  if (spec.haz && (Math.abs(localOffset) > 16 || Math.abs(f.rot - g.roll) > 0.32 || impactSpd > 390)) {
    sfx.boom();
    burst(f.x, f.y, 36, ['#ff0055', '#ffb703', '#ffffff'], 270);
    if (st.length > 0) st.pop();
    g.vRoll += (colIdx - 1.5) * 0.25;
    loseLife('HAZMAT DETONATED!', f.x, f.y - 20);
    g.falling = null;
    if (state === STATES.PLAYING) spawnHeldBox();
    return;
  }

  const prevTop = st.length ? st[st.length - 1] : null;
  const isColorMatch = prevTop && (prevTop.col === spec.col || spec.gold || prevTop.gold);
  const isPerf = Math.abs(localOffset) < 6.5;

  st.push({
    col: spec.col,
    haz: spec.haz,
    gold: spec.gold,
    mass: spec.mass,
    dx: clamp(localOffset * 0.38, -10, 10)
  });

  g.loaded++;
  g.streak++;
  g.maxStreak = Math.max(g.maxStreak, g.streak);

  // Angular impulse on ship hull from impact
  g.vRoll += (COL_X[colIdx] / 110) * 0.14 * spec.mass;

  const basePts = spec.haz ? 240 : spec.gold ? 300 : 100;
  const perfBonus = isPerf ? 80 : 0;
  const matchMult = isColorMatch ? 2.0 : 1.0;
  const pts = Math.round((basePts + perfBonus) * matchMult * mult());
  g.score += pts;

  sfx.clank(g.streak, isPerf, isColorMatch);
  g.shake = isPerf || isColorMatch ? 10 : 5;
  if (isPerf && isColorMatch) g.slowmo = 0.42;

  burst(f.x, f.y, isPerf ? 22 : 12, isPerf ? ['#ffd166', '#06d6a0', '#ffffff'] : [spec.col, '#ffffff'], 180);
  const tag = (isColorMatch ? 'COLOR WELD! ' : '') + (isPerf ? 'DEAD-CENTER! +' : '+') + pts;
  pop(tag, isColorMatch ? '#06d6a0' : (isPerf ? '#ffd166' : '#f4f9fc'), f.x, f.y - 24, isPerf || isColorMatch ? 21 : 17);

  g.falling = null;

  if (g.loaded >= g.quota) {
    // Ship fully loaded!
    g.shipsCleared++;
    const balFactor = clamp(1 - Math.abs(g.roll) / 0.38, 0.25, 1);
    const shipBonus = Math.round((450 + g.ship * 200) * balFactor * mult());
    g.score += shipBonus;
    g.lastShipBonus = shipBonus;
    state = STATES.SHIP_CLEAR;
    g.clearT = 2.2;
    sfx.horn();
    pop('VESSEL DEPARTING! +' + shipBonus, '#ffd166', 0, DECK_Y - 120, 24);
    burst(0, DECK_Y - 60, 45, ['#ffd166', '#06d6a0', '#ffffff', '#3a86ff'], 260);
  } else {
    spawnHeldBox();
  }
}

/* ---------- update ---------- */
function update(dt, rawDt) {
  const g = G;
  g.t += dt;
  g.shake *= Math.exp(-8 * rawDt);
  g.flash = Math.max(0, g.flash - rawDt * 2.5);
  g.slowmo += (1 - g.slowmo) * Math.min(1, rawDt * 5);

  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i]; p.l -= rawDt;
    if (p.l <= 0) { g.parts.splice(i, 1); continue; }
    p.vy += 440 * rawDt; p.x += p.vx * rawDt; p.y += p.vy * rawDt;
  }
  for (let i = g.pops.length - 1; i >= 0; i--) {
    const p = g.pops[i]; p.l -= rawDt;
    if (p.l <= 0) g.pops.splice(i, 1); else p.y -= 30 * rawDt;
  }

  if (state === STATES.START) {
    g.tx = Math.sin(g.t * 1.1) * 85;
    g.ang = Math.cos(g.t * 2.1) * 0.24;
    g.roll = Math.sin(g.t * 1.4) * 0.06;
    return;
  }
  if (state === STATES.GAMEOVER) return;

  if (state === STATES.SHIP_CLEAR) {
    g.clearT -= rawDt;
    g.shipX += 260 * rawDt;
    g.roll *= Math.exp(-4 * rawDt);
    if (g.clearT <= 0) {
      setupShip(g.ship + 1);
      state = STATES.PLAYING;
    }
    return;
  }

  if (g.hint < 1) g.hint = Math.max(0, g.hint - rawDt * 1.4);

  // Trolley physics & coupled pendulum swing (3 substeps for stability)
  const kMove = keys.r - keys.l;
  if (kMove !== 0) g.wantX = clamp(g.wantX + kMove * 240 * dt, -142, 142);

  const sub = 3, h = dt / sub;
  for (let s = 0; s < sub; s++) {
    const prevVx = g.vx;
    const ax = (g.wantX - g.tx) * 58 - g.vx * 11;
    g.vx += ax * h;
    g.tx = clamp(g.tx + g.vx * h, -142, 142);
    const trolleyAcc = (g.vx - prevVx) / Math.max(1e-4, h);

    const grav = 680;
    const angAcc = -(grav / g.cableLen) * Math.sin(g.ang) - (trolleyAcc / g.cableLen) * Math.cos(g.ang) + (g.wind / g.cableLen) - 0.55 * g.vAng;
    g.vAng = clamp(g.vAng + angAcc * h, -5.5, 5.5);
    g.ang = clamp(g.ang + g.vAng * h, -1.05, 1.05);
  }

  // Hydrostatic Ship Roll Torque & Buoyancy Restoring Spring
  let netTorque = 0, totalBoxes = 0;
  for (let c = 0; c < 4; c++) {
    const st = g.stacks[c];
    for (let r = 0; r < st.length; r++) {
      const box = st[r];
      const lx = COL_X[c] + box.dx;
      const ly = -(r + 0.5) * BOX_H;
      // Lateral moment + top-heavy inverted-pendulum torque when ship tilts
      netTorque += (lx - ly * Math.sin(g.roll) * 0.85) * box.mass;
      totalBoxes++;
    }
  }
  const waveTorque = Math.sin(g.t * 1.7) * (0.04 + g.diff * 0.05);
  const targetRoll = (netTorque * 0.00145) + waveTorque;
  const rAcc = (targetRoll - g.roll) * 11.5 - g.vRoll * 3.1;
  g.vRoll += rAcc * dt;
  g.roll += g.vRoll * dt;

  // Capsize check (if hull lists past 24 degrees / 0.42 rad!)
  if (Math.abs(g.roll) >= 0.42) {
    sfx.splash();
    // Dump top containers from the lowest side into the sea
    const dumpSide = g.roll > 0 ? 3 : 0;
    if (g.stacks[dumpSide].length > 0) {
      g.stacks[dumpSide].pop();
      g.loaded = Math.max(0, g.loaded - 1);
    }
    g.roll *= 0.45;
    g.vRoll = 0;
    loseLife('BARGE LISTED OVERBOARD!', 0, DECK_Y - 40);
    if (state !== STATES.PLAYING) return;
  }

  // Update Falling Container
  if (g.falling) {
    const f = g.falling;
    f.vy += 690 * dt;
    f.vx += g.wind * 0.4 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.rot += f.vRot * dt;

    // Transform falling box (f.x, f.y) into ship-local coordinates to test landing on the 4 bays
    const dx = f.x - g.shipX, dy = f.y - DECK_Y;
    const c = Math.cos(-g.roll), sn = Math.sin(-g.roll);
    const lx = dx * c - dy * sn;
    const ly = dx * sn + dy * c;

    // Check which bay column (0..3) it aligns with
    let hitCol = -1, minDist = 30;
    for (let i = 0; i < 4; i++) {
      const d = Math.abs(lx - COL_X[i]);
      if (d < minDist) { minDist = d; hitCol = i; }
    }

    if (hitCol !== -1) {
      const st = g.stacks[hitCol];
      const topLy = -st.length * BOX_H - BOX_H * 0.5;
      if (ly >= topLy && ly <= topLy + 28 && f.vy > 0) {
        landContainer(f, hitCol, lx - COL_X[hitCol]);
        return;
      }
    }

    // Missed ship & splashed into the harbor water!
    if (f.y >= WATER_Y) {
      sfx.splash();
      burst(f.x, WATER_Y, 24, ['#90e0ef', '#ffffff', '#48cae4'], 210);
      loseLife('DROPPED IN THE SEA!', clamp(f.x, -130, 130), WATER_Y - 30);
      g.falling = null;
      if (state === STATES.PLAYING) spawnHeldBox();
    }
  }
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 800) startGame(); return; }
  if (state !== STATES.PLAYING || ptr.id !== null) return;

  ptr.id = e.pointerId;
  ptr.down = true;
  ptr.startX = e.clientX;
  ptr.startY = e.clientY;
  ptr.moved = false;
  G.wantX = clamp(unSX(e.clientX), -142, 142);
});

cv.addEventListener('pointermove', e => {
  if (state !== STATES.PLAYING) return;
  if (e.pointerId === ptr.id || e.pointerType === 'mouse') {
    G.wantX = clamp(unSX(e.clientX), -142, 142);
    if (ptr.down && Math.hypot(e.clientX - ptr.startX, e.clientY - ptr.startY) > 10) {
      ptr.moved = true;
    }
  }
});

function onUp(e) {
  if (e.pointerId !== ptr.id) return;
  ptr.id = null;
  ptr.down = false;
  if (state === STATES.PLAYING) releaseContainer();
}
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', e => { if (e.pointerId === ptr.id) { ptr.id = null; ptr.down = false; } });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') { keys.l = 1; e.preventDefault(); }
  else if (c === 'ArrowRight' || c === 'KeyD') { keys.r = 1; e.preventDefault(); }
  else if ((c === 'Space' || c === 'Enter' || c === 'ArrowDown' || c === 'KeyS') && !e.repeat) {
    e.preventDefault(); audio();
    if (state === STATES.START) startGame();
    else if (state === STATES.GAMEOVER && performance.now() - overAt > 800) startGame();
    else if (state === STATES.PLAYING) releaseContainer();
  }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keys.l = 0;
  else if (c === 'ArrowRight' || c === 'KeyD') keys.r = 0;
});

/* ---------- rendering ---------- */
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, sz, col, align = 'center', maxW = 0, weight = 800) {
  let f = sz;
  ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  if (maxW > 0) {
    while (f > 9 && ctx.measureText(s).width > maxW) {
      f--;
      ctx.font = weight + ' ' + f + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    }
  }
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v * k), 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}

function drawHarborBack(now) {
  const wy = SY(WATER_Y);
  const sky = ctx.createLinearGradient(0, 0, 0, wy);
  sky.addColorStop(0, '#07111a');
  sky.addColorStop(0.55, '#132a3e');
  sky.addColorStop(1, '#2c5364');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, wy);

  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.45 * Math.sin(now * 0.002 + s.p);
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x * W, s.y * wy, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // Distant Harbor Cranes & Port Lights on Horizon
  ctx.fillStyle = '#0a1824';
  ctx.fillRect(0, wy - 28 * S, W, 28 * S);
  ctx.fillStyle = 'rgba(255, 209, 102, 0.55)';
  for (let i = 0; i < 18; i++) {
    ctx.fillRect((i / 18) * W + 10, wy - (10 + (i % 3) * 6) * S, 4 * S, 3 * S);
  }
}

function drawBox3D(x, y, rot, spec) {
  const w = BOX_W * S, h = BOX_H * S, d = DEP * S;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  // 3D Extruded Top & Right Faces
  ctx.fillStyle = shade(spec.col, 1.25);
  ctx.beginPath();
  ctx.moveTo(-w * 0.5, -h * 0.5);
  ctx.lineTo(-w * 0.5 + d, -h * 0.5 - d * 0.7);
  ctx.lineTo(w * 0.5 + d, -h * 0.5 - d * 0.7);
  ctx.lineTo(w * 0.5, -h * 0.5);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = shade(spec.col, 0.65);
  ctx.beginPath();
  ctx.moveTo(w * 0.5, -h * 0.5);
  ctx.lineTo(w * 0.5 + d, -h * 0.5 - d * 0.7);
  ctx.lineTo(w * 0.5 + d, h * 0.5 - d * 0.7);
  ctx.lineTo(w * 0.5, h * 0.5);
  ctx.closePath(); ctx.fill();

  // Front Corrugated Face
  ctx.fillStyle = spec.col;
  rrect(-w * 0.5, -h * 0.5, w, h, 3 * S);
  ctx.fill();

  // Corrugation ribs
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let i = -3; i <= 3; i++) {
    ctx.fillRect(i * (w * 0.12) - 1.5 * S, -h * 0.38, 3 * S, h * 0.76);
  }

  // Corner Twist-Lock Castings
  ctx.fillStyle = '#dee2e6';
  for (const sx of [-1, 1]) {
    for (const sy of [-1, 1]) {
      ctx.fillRect(sx * (w * 0.45) - 2 * S, sy * (h * 0.42) - 2 * S, 4 * S, 4 * S);
    }
  }

  if (spec.haz) {
    txt('HAZMAT', 0, 0, Math.max(8, 9.5 * S), '#fff', 'center', w * 0.85, 900);
  } else if (spec.gold) {
    txt('★ VIP ★', 0, 0, Math.max(8, 9.5 * S), '#140c04', 'center', w * 0.85, 900);
  }
  ctx.restore();
}

function drawShipAndCargo(now) {
  const g = G;
  const pivotX = SX(g.shipX), pivotY = SY(DECK_Y);

  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(g.roll);

  // 4 Bay Guide Markers on Deck
  for (let i = 0; i < 4; i++) {
    const cx = COL_X[i] * S;
    const topBox = g.stacks[i].length ? g.stacks[i][g.stacks[i].length - 1] : null;
    ctx.fillStyle = topBox ? topBox.col : 'rgba(255,255,255,0.25)';
    ctx.fillRect(cx - (BOX_W * 0.45) * S, -5 * S, BOX_W * 0.9 * S, 5 * S);
  }

  // Stacked Containers on Deck
  for (let c = 0; c < 4; c++) {
    const st = g.stacks[c];
    for (let r = 0; r < st.length; r++) {
      const b = st[r];
      const lx = (COL_X[c] + b.dx) * S;
      const ly = -(r + 0.5) * BOX_H * S;
      drawBox3D(lx, ly, 0, b);
    }
  }

  // Bridge Superstructure on Right Stern
  const brX = 132 * S;
  ctx.fillStyle = '#e9ecef';
  rrect(brX, -68 * S, 32 * S, 68 * S, 3 * S);
  ctx.fill();
  ctx.fillStyle = '#1d3557';
  ctx.fillRect(brX + 4 * S, -58 * S, 24 * S, 10 * S);

  // Heavy Freighter Hull & Red Plimsoll Waterline
  const hw = 168 * S, hh = 58 * S;
  ctx.fillStyle = '#1b263b';
  ctx.beginPath();
  ctx.moveTo(-hw, 0);
  ctx.lineTo(hw, 0);
  ctx.lineTo(hw * 0.86, hh);
  ctx.lineTo(-hw * 0.86, hh);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#bc4749';
  ctx.beginPath();
  ctx.moveTo(-hw * 0.91, hh * 0.55);
  ctx.lineTo(hw * 0.91, hh * 0.55);
  ctx.lineTo(hw * 0.86, hh);
  ctx.lineTo(-hw * 0.86, hh);
  ctx.closePath();
  ctx.fill();

  // White Hull Name & Tilt Angle Readout
  const deg = Math.round(Math.abs(g.roll) * 180 / Math.PI);
  const warnTilt = Math.abs(g.roll) > 0.28;
  txt('EVER-CRANE  •  LIST ' + deg + '° / 24°', 0, hh * 0.32, Math.max(9, 10.5 * S), warnTilt ? '#ffbe0b' : '#f4f9fc', 'center', hw * 1.4, 800);
  ctx.restore();
}

function drawCraneAndFalling(now) {
  const g = G;
  const ry = SY(RAIL_Y);

  // Top Orange Gantry Girder
  ctx.fillStyle = '#d97706';
  ctx.fillRect(0, ry - 14 * S, W, 12 * S);
  ctx.strokeStyle = '#92400e';
  ctx.lineWidth = 2 * S;
  for (let x = 0; x < W; x += 22 * S) {
    ctx.beginPath();
    ctx.moveTo(x, ry - 14 * S);
    ctx.lineTo(x + 11 * S, ry - 2 * S);
    ctx.lineTo(x + 22 * S, ry - 14 * S);
    ctx.stroke();
  }

  // Rolling Trolley Carriage
  const tx = SX(g.tx);
  ctx.fillStyle = '#343a40';
  rrect(tx - 24 * S, ry - 8 * S, 48 * S, 16 * S, 4 * S);
  ctx.fill();
  ctx.strokeStyle = '#ffb703';
  ctx.lineWidth = 2 * S;
  ctx.stroke();

  // Dual Hoist Cables + Spreader Bar
  const hx = g.tx + Math.sin(g.ang) * g.cableLen;
  const hy = RAIL_Y + Math.cos(g.ang) * g.cableLen;
  const shx = SX(hx), shy = SY(hy);

  ctx.strokeStyle = '#ced4da';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(tx - 8 * S, ry + 6 * S); ctx.lineTo(shx - 8 * S, shy - 16 * S);
  ctx.moveTo(tx + 8 * S, ry + 6 * S); ctx.lineTo(shx + 8 * S, shy - 16 * S);
  ctx.stroke();

  // Yellow Spreader Beam
  ctx.save();
  ctx.translate(shx, shy - 15 * S);
  ctx.rotate(-g.ang * 0.65);
  ctx.fillStyle = '#ffb703';
  rrect(-26 * S, -5 * S, 52 * S, 8 * S, 2 * S);
  ctx.fill();
  ctx.restore();

  // Held Container + Vertical Drop Guide Line
  if (g.held && state === STATES.PLAYING) {
    ctx.save();
    ctx.setLineDash([4 * S, 5 * S]);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath();
    ctx.moveTo(shx, shy);
    ctx.lineTo(shx, SY(DECK_Y));
    ctx.stroke();
    ctx.restore();

    drawBox3D(shx, shy, -g.ang * 0.65, g.held);
  }

  // Falling Container
  if (g.falling) {
    drawBox3D(SX(g.falling.x), SY(g.falling.y), g.falling.rot, g.falling.spec);
  }
}

function drawWaterForeground(now) {
  const wy = SY(WATER_Y);
  const wg = ctx.createLinearGradient(0, wy, 0, H);
  wg.addColorStop(0, 'rgba(14, 116, 144, 0.84)');
  wg.addColorStop(0.4, 'rgba(11, 60, 88, 0.94)');
  wg.addColorStop(1, '#051923');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 16; x += 16) {
    const wave = Math.sin(x * 0.025 + now * 0.004) * 4 * S;
    ctx.lineTo(x, wy + wave);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  for (let x = 0; x <= W + 16; x += 16) {
    const wave = Math.sin(x * 0.025 + now * 0.004) * 4 * S;
    x === 0 ? ctx.moveTo(x, wy + wave) : ctx.lineTo(x, wy + wave);
  }
  ctx.stroke();
}

function panel(x, y, w, h) {
  rrect(x, y, w, h, 12);
  ctx.fillStyle = 'rgba(9, 20, 30, 0.84)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255, 183, 3, 0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawHUD(now) {
  const g = G, pad = 10, topY = safeTop + 8, ph = Math.min(52, W * 0.13);
  const w1 = W * 0.31, w2 = W * 0.26, w3 = W * 0.28;

  // Left: Score
  panel(pad, topY, w1, ph);
  txt('REVENUE', pad + w1 * 0.5, topY + ph * 0.28, Math.min(10, W / 35), '#94a3b8', 'center', w1 - 10, 700);
  txt(String(Math.floor(g.score)), pad + w1 * 0.5, topY + ph * 0.68, Math.min(22, W / 16), '#fff', 'center', w1 - 12, 900);

  // Center: Multiplier & Ship Progress
  const x2 = W * 0.5 - w2 * 0.5;
  panel(x2, topY, w2, ph);
  txt('x' + mult().toFixed(2).replace(/\.00$/, '.0'), W * 0.5, topY + ph * 0.35, Math.min(18, W / 19), '#ffb703', 'center', w2 - 8, 900);
  txt('CARGO ' + g.loaded + '/' + g.quota, W * 0.5, topY + ph * 0.74, Math.min(10, W / 35), '#cbd5e1', 'center', w2 - 8, 700);

  // Right: Lives
  const x3 = W - pad - w3;
  panel(x3, topY, w3, ph);
  for (let i = 0; i < 3; i++) {
    const hx = x3 + w3 * (0.22 + i * 0.28), hy = topY + ph * 0.5, r = Math.min(8, w3 / 12);
    ctx.fillStyle = i < g.lives ? '#ffb703' : 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.arc(hx, hy, r, 0, TAU); ctx.fill();
  }

  // Onboarding Hint
  if (state === STATES.PLAYING && g.hint > 0) {
    ctx.globalAlpha = clamp(g.hint, 0, 1);
    const hw = Math.min(330, W * 0.9), hy = H - 56;
    panel(W * 0.5 - hw * 0.5, hy - 24, hw, 48);
    txt('DRAG to move crane • RELEASE to drop container!', W * 0.5, hy - 7, Math.min(13, W / 25), '#fff', 'center', hw - 16, 900);
    txt('Match colors for 2x Weld • Keep the barge balanced!', W * 0.5, hy + 11, Math.min(11, W / 32), '#ffb703', 'center', hw - 16, 600);
    ctx.globalAlpha = 1;
  }
}

function drawStart(now) {
  ctx.fillStyle = 'rgba(7, 17, 26, 0.62)'; ctx.fillRect(0, 0, W, H);
  const b = Math.min(54, W / 7);
  txt('CRANE KING', W * 0.5, safeTop + H * 0.16, b, '#ffb703', 'center', W - 28, 900);
  txt('Swing the gantry. Stack the freighter. Don’t capsize!', W * 0.5, safeTop + H * 0.16 + b * 0.85, Math.min(15, W / 23), '#f4f9fc', 'center', W - 28, 600);
  ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.006);
  txt('TAP TO LOAD', W * 0.5, H * 0.7, Math.min(28, W / 12), '#06d6a0', 'center', W - 28, 900);
  ctx.globalAlpha = 1;
  if (top5[0]) txt('BEST ' + top5[0] + '  •  SHIPS ' + bestShips + '  •  STREAK ' + bestStreak, W * 0.5, H * 0.7 + 36, Math.min(14, W / 25), '#ffb703', 'center', W - 28, 700);
}

function drawOver(now) {
  ctx.fillStyle = 'rgba(7, 17, 26, 0.82)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 24, 360), ph = Math.min(H - safeTop - 24, 350);
  const x = W * 0.5 - pw * 0.5, y = Math.max(safeTop + 10, (H - ph) * 0.5), k = ph / 350;
  panel(x, y, pw, ph);
  txt(G.reason || 'CARGO LOST', W * 0.5, y + 30 * k, Math.min(22, pw / 12), '#ef476f', 'center', pw - 24, 900);
  txt(String(Math.floor(G.score)), W * 0.5, y + 72 * k, Math.min(44, pw / 6.5), '#fff', 'center', pw - 24, 900);
  txt(G.hiNew ? 'NEW HIGH SCORE!' : 'Ships Loaded: ' + G.shipsCleared + '  •  Best Streak: ' + G.maxStreak, W * 0.5, y + 108 * k, Math.min(14, pw / 20), G.hiNew ? '#ffb703' : '#cbd5e1', 'center', pw - 24, 800);
  txt('TOP 5 DOCKMASTERS', W * 0.5, y + 136 * k, 12, '#94a3b8', 'center', pw - 24, 700);

  for (let i = 0; i < 5; i++) {
    const yy = y + (160 + i * 23) * k, sc = top5[i], me = i === G.rank;
    if (me) { rrect(x + 16, yy - 10 * k, pw - 32, 20 * k, 6); ctx.fillStyle = 'rgba(255,183,3,0.22)'; ctx.fill(); }
    txt((i + 1) + '.', x + 28, yy, 14, me ? '#ffb703' : '#94a3b8', 'left', 30, 800);
    txt(sc === undefined ? '-' : String(sc), x + pw - 28, yy, 14, me ? '#ffb703' : '#f4f9fc', 'right', pw - 80, 800);
  }
  if (performance.now() - overAt > 800) {
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 0.007);
    txt('TAP TO LOAD AGAIN', W * 0.5, y + ph - 26 * k, Math.min(20, pw / 15), '#06d6a0', 'center', pw - 24, 900);
    ctx.globalAlpha = 1;
  }
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rr(-1, 1) * G.shake, rr(-1, 1) * G.shake);

  drawHarborBack(now);
  drawShipAndCargo(now);
  drawCraneAndFalling(now);
  drawWaterForeground(now);

  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.l / p.m, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of G.pops) {
    ctx.globalAlpha = clamp(p.l * 1.4, 0, 1);
    txt(p.t, clamp(p.x, 75, W - 75), p.y, p.sz, p.col, 'center', W - 20, 900);
  }
  ctx.globalAlpha = 1;
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${G.flash * 0.38})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (state === STATES.START) drawStart(now);
  else {
    drawHUD(now);
    if (state === STATES.GAMEOVER) drawOver(now);
  }
}

resize();
resetGame();
startLoop();
})();
</script>
</body>
