<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin Smash</title>
<style>
:root{--bg:#120a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120a2a}}
:root[data-theme="dark"]{--bg:#120a2a}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');

/* ---------- canvas + camera ---------- */

addEventListener('orientationchange', () => setTimeout(resize, 120));
const pj0 = (x, y, z) => { const vx = x - CX, vy = y - CYc, vz = Math.max(z, CZ + 5) - CZ, ca = Math.cos(CA), sa = Math.sin(CA), yc = vy * ca + vz * sa, zc = vz * ca - vy * sa; if (zc < 1) return null; return { x: W / 2 + CF * vx / zc, y: CY - CF * yc / zc, k: CF / zc, zc }; };

  roll() { if (th('r', 120)) tone('sawtooth', 70, 60, 0.12, 0.03); }, clack(v) { if (th('c', 35)) tone('square', 700 + Math.random() * 500, 300, 0.05, clamp(v / 60, 0.03, 0.12)); }, pin() { if (th('p', 30)) tone('triangle', 900 + Math.random() * 600, 500, 0.08, 0.07); },
  bump() { tone('sine', 300, 700, 0.12, 0.1); }, boom() { tone('sawtooth', 130, 30, 0.5, 0.17); tone('square', 70, 25, 0.6, 0.1); }, throw() { tone('sine', 120, 320, 0.25, 0.12); },

/* ---------- levels ---------- */

}

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0;
const aim = { on: false, id: null, x0: 0, y0: 0, x: 0, y: 0 }, steer = { id: null, x0: 0, s: 0 }, keys = { l: 0, r: 0 };

}
function newGame() { G = { level: 0, score: 0, lives: 3, rank: -1, hint: true, over: false, t: 0 }; loadLevel(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });

/* ---------- physics + logic ---------- */

}

/* ---------- input ---------- */
