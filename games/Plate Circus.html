</head>
<body>

<script>
(function(){

var ac=null;

function sGust(){noise(0.8,0.12,1200)}

function sOver(){beep(300,0.6,'sawtooth',0.15,60);noise(0.4,0.2)}

function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}

function update(dt){clock+=dt;

ctx.fillStyle=col[1];ctx.beginPath();ctx.ellipse(0,0,R,R*0.4,0,0,6.283);ctx.fill();
var g=ctx.createLinearGradient(0,-R*0.4,0,R*0.4);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-R*0.04,R*0.94,R*0.34,0,0,6.283);ctx.fill();

if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(10,3,10,0.5)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('PLATE',W/2,y,Math.min(70,W/5.2),'#ffd23f');txt('CIRCUS',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#ff7a9a');
txt('Keep every plate spinning. Don\u2019t drop one.',W/2,y+Math.min(130,W/3),Math.min(15,W/23),'#ffd8e0','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.55,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   STREAK '+best.streak,W/2,H*0.55+34,Math.min(15,W/24),'#ffc0d0','center','700')}
function drawOver(){ctx.fillStyle='rgba(10,3,10,0.72)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#3a1020';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.stroke();
var u=ph/430,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ff9ab0');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt(Math.floor(t)+'s \u2022 '+perfects+' perfect \u2022 best streak '+bestStreak,W/2,cy+114*u,Math.min(13,pw/24),'#ffc0d0','center','700');
txt('TOP 5',W/2,cy+142*u,Math.min(14,pw/24),'#ffd8e0','center','700');
for(var i=0;i<5;i++){var ry=cy+168*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(255,210,63,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*u,Math.min(20,pw/16),'#3a1020')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
function hit(x,y){var bi=-1,bd=1e9;for(var i=0;i<8;i++){var pl=pole(i),p=plates[i],py=p.on?platePos(p).y:pl.top,px=p.on?platePos(p).x:pl.x;var ddx=(x-px)/(PR*pl.sc*1.7),ddy=(y-(py+pl.base)/2*1)/((pl.base-py)/2+PR*0.8*pl.sc);
var ax=Math.abs(x-px)/(PR*1.7*pl.sc),ay=y<py-PR*0.9?(py-PR*0.9-y)/(PR*pl.sc):(y>pl.base+PR*0.3?(y-pl.base)/(PR*pl.sc):0);var d=ax*ax+ay*ay;if(ax<=1&&ay<=1&&d<bd){bd=d;bi=i}}return bi}
function press(e){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else{var i=hit(e.clientX,e.clientY);if(i>=0)tapPole(plates[i])}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}press(e)});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){if(e.repeat)return;var k=e.key;if(k===' '||k==='Enter'){e.preventDefault();initAudio();if(state===ST.START)startGame();else if(state===ST.OVER&&overT>0.8)startGame();return}
var n=parseInt(k,10);if(state===ST.PLAY&&n>=1&&n<=8){var sorted=[4,0,5,1,2,6,3,7];tapPole(plates[sorted[n-1]])}});
window.addEventListener('blur',function(){stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
