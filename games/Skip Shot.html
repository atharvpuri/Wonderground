<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skip Shot</title>
<style>
:root{--bg:#6ec6e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6ec6e8}}
:root[data-theme="dark"]{--bg:#6ec6e8}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, GRAV = 14, CH = 8, CAMD = 14, LAKEW = 20;
const E = { n: 0.57, g: 0.68, p: 0.78 }, M = { n: 0.87, g: 0.915, p: 0.96 }, RANK = { n: 0, g: 1, p: 2 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('skipshot.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop(), bestDist = parseInt(store.get('skipshot.dist') || '0', 10) || 0, bestSkips = parseInt(store.get('skipshot.skips') || '0', 10) || 0;
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('skipshot.top5', JSON.stringify(top5)); return top5.indexOf(s); }

/* ---------- canvas ---------- */
let W, H, dpr, F, HZ, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0;
  F = Math.min(W, H * 0.62) * 0.78; HZ = Math.max(H * 0.4, safeTop + 170);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
const pr = (x, y, z) => { const zc = z - G.camZ; if (zc < 0.8) return null; const k = F / zc; return { x: W / 2 + (x - G.camX) * k, y: HZ + (CH - y) * k, k, zc }; };

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  skip(n, q) { const b = 480 * Math.pow(1.0595, Math.min(n, 24)); tone('triangle', b, b * 1.3, 0.1, 0.12); if (q === 'p') tone('sine', b * 2, b * 2.6, 0.18, 0.1, 0.03); else if (q === 'g') tone('sine', b * 1.5, b * 1.7, 0.12, 0.06, 0.03); },
  throw() { tone('sine', 200, 700, 0.2, 0.1); }, sink() { tone('sine', 320, 70, 0.5, 0.13); tone('sawtooth', 120, 40, 0.3, 0.06, 0.05); },
  quack() { tone('square', 420, 260, 0.1, 0.07); tone('square', 400, 240, 0.1, 0.07, 0.12); }, gold() { [660, 880, 1100, 1320].forEach((n, i) => tone('triangle', n, n, 0.12, 0.1, i * 0.06)); },
  rock() { tone('sawtooth', 150, 40, 0.3, 0.15); }, buoy() { tone('triangle', 500, 1000, 0.2, 0.1); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0;
const aim = { on: false, id: null, x0: 0, y0: 0, x: 0, y: 0 };
const clouds = Array.from({ length: 6 }, () => ({ x: Math.random(), y: Math.random() * 0.8, s: 0.7 + Math.random() }));

function genLake(n) {
  const t = []; let z = 20;
  while (z < 720) {
    z += 7 + Math.random() * 9; const x = (Math.random() * 2 - 1) * 15, r = Math.random(), rockP = z > 36 ? Math.min(0.34, 0.1 + z / 2600 + n * 0.012) : 0; let k = null;
    if (r < rockP) k = 'rock'; else if (r < rockP + 0.5) k = 'duck'; else if (r < rockP + 0.62) k = 'buoy'; else if (r < rockP + 0.64) k = 'gold';
    if (!k || t.some(o => Math.hypot(o.x - x, o.z - z) < 5)) continue;
    t.push({ k, x, z, r: k === 'rock' ? 1.8 : 1.6, ph: Math.random() * 6, done: false, fly: 0, seed: Math.random() * 10 });
  }
  return t;
}
function newThrow() { const g = G; g.targets = genLake(g.throwN); g.ripples = []; g.parts = []; g.pops = []; g.ph = 'aim'; g.st = null; g.camZ = lerp(g.camZ, -CAMD, 1); g.camX = 0; g.skipsT = 0; }
function newGame() { G = { score: 0, stones: 5, throwN: 0, camZ: -CAMD, camX: 0, ph: 'aim', st: null, targets: [], ripples: [], parts: [], pops: [], t: 0, rank: -1, totalSkips: 0, maxDist: 0, maxSkips: 0, hint: true, summary: '', pt: 0, shake: 0, over: false }; newThrow(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) { raf = requestAnimationFrame(frame); const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(now); }
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); aim.on = false; aim.id = null; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */
const pop = (t, col, x, y, z) => G.pops.push({ t, col, x, y, z, life: 1.1 });
function splash(x, z, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = (sp || 2.4) * (0.3 + Math.random()); if (G.parts.length < 160) G.parts.push({ x, y: 0.1, z, vx: Math.cos(a) * v, vy: 2 + Math.random() * 3, vz: Math.sin(a) * v * 0.6, life: 0.6 }); } }
function launch(angle, power) {
  const g = G, vz = 9 + 21 * power; g.st = { x: 0, h: 1.1, z: 0, vx: vz * Math.tan(angle), vz, vh: 2.4, t: 0, skips: 0, streak: 0, tap: null, lb: null, alive: true, rot: 0, perfects: 0 };
  g.stones--; g.throwN++; g.ph = 'fly'; g.hint = false; g.skipsT = 0; sfx.throw();
}
function bounce() {
  const g = G, st = g.st, imp = -st.vh; if (imp > 11.5) { sink('TOO STEEP!'); return; }
  const q = st.tap || 'n'; st.tap = null; st.lb = { t: st.t, imp, vz0: st.vz, q };
  st.vh = imp * E[q]; st.vz = st.vz * M[q]; st.h = 0.001; st.skips++; g.totalSkips++;
  st.streak = q === 'p' ? st.streak + 1 : 0; if (q === 'p') st.perfects++;
  const mult = 1 + Math.min(st.streak, 4), pts = 10 * mult; g.score += pts; g.ripples.push({ x: st.x, z: st.z, age: 0, q }); splash(st.x, st.z, q === 'p' ? 8 : 4, 2);
  sfx.skip(st.skips, q); if (q !== 'n') pop(q === 'p' ? 'PERFECT x' + mult : 'GOOD', q === 'p' ? '#fff3a0' : '#9affd8', st.x, 1.6, st.z); else if (st.skips % 5 === 0) pop(st.skips + ' SKIPS', '#fff', st.x, 1.6, st.z);
  if (st.vz < 4.2) sink('SUNK');
}
function tapFlick() {
  const g = G; if (state !== STATES.PLAYING || g.ph !== 'fly' || !g.st || !g.st.alive) return; const st = g.st;
  if (st.lb && st.t - st.lb.t <= 0.09) { const nq = st.t - st.lb.t <= 0.05 ? 'p' : 'g'; if (RANK[nq] > RANK[st.lb.q]) { const el = st.t - st.lb.t; st.vh = st.lb.imp * E[nq] - GRAV * el; st.h = Math.max(0.001, st.lb.imp * E[nq] * el - 0.5 * GRAV * el * el); st.vz = st.lb.vz0 * M[nq]; st.lb.q = nq; st.streak = nq === 'p' ? st.streak + 1 : st.streak; if (nq === 'p') st.perfects++; g.score += 10 * (1 + Math.min(st.streak, 4)); sfx.skip(st.skips, nq); pop(nq === 'p' ? 'PERFECT!' : 'GOOD', nq === 'p' ? '#fff3a0' : '#9affd8', st.x, 1.6, st.z); } return; }
  const tc = (st.vh + Math.sqrt(st.vh * st.vh + 2 * GRAV * Math.max(st.h, 0))) / GRAV;
  if (tc <= 0.17) { const q = tc <= 0.07 ? 'p' : 'g'; if (!st.tap || RANK[q] > RANK[st.tap]) st.tap = q; }
}
function sink(msg) { const g = G, st = g.st; if (!st.alive) return; st.alive = false; g.ph = 'sink'; g.pt = 1.2; g.msg = msg; splash(st.x, st.z, 14, 3); if (msg === 'ROCK!') { sfx.rock(); g.shake = 0.8; } else sfx.sink(); }
function endThrow() {
  const g = G, st = g.st, dist = Math.floor(st.z), bonus = dist * 2; g.score += bonus; g.maxDist = Math.max(g.maxDist, dist); g.maxSkips = Math.max(g.maxSkips, st.skips);
  if (dist > bestDist) { bestDist = dist; store.set('skipshot.dist', String(dist)); } if (st.skips > bestSkips) { bestSkips = st.skips; store.set('skipshot.skips', String(st.skips)); }

}
function update(dt) {

  for (const c of clouds) { c.x -= dt * 0.004 * c.s; if (c.x < -0.2) c.x = 1.2; }
  for (let i = g.parts.length - 1; i >= 0; i--) { const p = g.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 12 * dt; if (p.y < 0) { p.y = 0; p.vy = 0; p.life -= dt * 2; } if (p.life <= 0) g.parts.splice(i, 1); }
  for (let i = g.pops.length - 1; i >= 0; i--) { g.pops[i].life -= dt; g.pops[i].y += dt * 0.8; if (g.pops[i].life <= 0) g.pops.splice(i, 1); }
  for (let i = g.ripples.length - 1; i >= 0; i--) { g.ripples[i].age += dt; if (g.ripples[i].age > 1.4) g.ripples.splice(i, 1); }
  for (const t of g.targets) if (t.done) t.fly += dt;
  if (state === STATES.START) { g.camZ = -CAMD; return; }
  if (state === STATES.GAMEOVER) return;
  if (g.ph === 'aim') { g.camZ += (-CAMD - g.camZ) * Math.min(1, dt * 5); g.camX += (0 - g.camX) * Math.min(1, dt * 5); }
  else if (g.ph === 'fly') {
    const st = g.st, n = Math.max(1, Math.ceil(dt / 0.008)), sd = dt / n;
    for (let i = 0; i < n && st.alive; i++) {
      st.vh -= GRAV * sd; st.h += st.vh * sd; st.z += st.vz * sd; st.x += st.vx * sd; st.rot += sd * 30; st.t += sd;
      if (st.h <= 0 && st.vh < 0) bounce(); if (!st.alive) break;
      if (Math.abs(st.x) > LAKEW - 0.5) { sink('SHORE!'); break; }
      for (const t of g.targets) {
        if (t.done || st.h > 1.6 || Math.hypot(t.x - st.x, t.z - st.z) > t.r + 0.3) continue;
        if (t.k === 'rock') { sink('ROCK!'); break; }
        t.done = true; t.fly = 0;
        if (t.k === 'duck') { g.score += 50; pop('+50', '#ffe28a', t.x, 2, t.z); sfx.quack(); } else if (t.k === 'gold') { g.score += 200; g.stones = Math.min(8, g.stones + 1); pop('BONUS STONE!', '#ffd24a', t.x, 2.4, t.z); sfx.gold(); } else { g.score += 30; st.vz = Math.min(36, st.vz * 1.1); pop('BOOST!', '#9affd8', t.x, 2, t.z); sfx.buoy(); }
      }
    }
    g.camZ += (st.z - CAMD - g.camZ) * Math.min(1, dt * 6); g.camX += (clamp(st.x * 0.6, -9, 9) - g.camX) * Math.min(1, dt * 4);
  } else if (g.ph === 'sink') { g.pt -= dt; if (g.pt <= 0) endThrow(); }
  else if (g.ph === 'tally') { g.pt -= dt; if (g.pt <= 0) { if (g.stones > 0) newThrow(); else { g.over = true; state = STATES.GAMEOVER; g.rank = saveTop(Math.floor(g.score)); overAt = performance.now(); sfx.over(); } } }
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 900) startGame(); return; }
  if (G.ph === 'fly') { tapFlick(); return; }
  if (G.ph === 'aim' && aim.id == null) { aim.id = e.pointerId; aim.on = true; aim.x0 = aim.x = e.clientX; aim.y0 = aim.y = e.clientY; }
});
cv.addEventListener('pointermove', e => { if (aim.id === e.pointerId) { aim.x = e.clientX; aim.y = e.clientY; } });
const aimVals = () => { const dy = aim.y - aim.y0; return { pw: clamp(dy / (H * 0.26), 0, 1), an: clamp(Math.atan2(-(aim.x - aim.x0), Math.max(dy, 30)), -0.26, 0.26) }; };
cv.addEventListener('pointerup', e => { if (aim.id === e.pointerId) { const v = aimVals(); aim.id = null; aim.on = false; if (state === STATES.PLAYING && G.ph === 'aim' && v.pw > 0.1) launch(v.an, v.pw); } });
cv.addEventListener('pointercancel', e => { if (aim.id === e.pointerId) { aim.id = null; aim.on = false; } });
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); else tapFlick(); } });

/* ---------- drawing ---------- */
function txt(s, x, y, size, col, weight, alpha, align) {
  ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col; ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function flat(x, z, r, col, a, lw, fill) { const p = pr(x, 0, z); if (!p) return; const rx = r * p.k, ry = rx * clamp(CH / p.zc, 0.04, 0.9); if (fill) { ctx.fillStyle = col.replace('A', fill * a); ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, TAU); ctx.fill(); } ctx.strokeStyle = col.replace('A', a); ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, TAU); ctx.stroke(); }
function duck(t, now) {
  const p = pr(t.x, 0, t.z); if (!p) return; const u = p.k, gold = t.k === 'gold', fl = t.done ? t.fly : 0, bob = Math.sin(now * 0.003 + t.ph) * 0.08 * u, y = p.y - 0.45 * u - fl * 6 * u + bob, x = p.x + fl * 2 * u; if (fl > 1) return; ctx.globalAlpha = 1 - fl;
  ell(p.x, p.y + 0.05 * u, 0.9 * u, 0.9 * u * 0.25, 'rgba(0,30,60,0.25)'); if (gold) { const g = ctx.createRadialGradient(x, y, 0, x, y, 2.2 * u); g.addColorStop(0, 'rgba(255,230,100,0.7)'); g.addColorStop(1, 'rgba(255,230,100,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 2.2 * u, 0, TAU); ctx.fill(); }
  ell(x, y, 0.8 * u, 0.5 * u, gold ? '#ffd24a' : '#ffe23a'); ell(x + 0.45 * u, y - 0.45 * u, 0.32 * u, 0.32 * u, gold ? '#ffe680' : '#ffe84a'); ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.moveTo(x + 0.7 * u, y - 0.5 * u); ctx.lineTo(x + 1.1 * u, y - 0.4 * u); ctx.lineTo(x + 0.7 * u, y - 0.32 * u); ctx.fill(); ell(x + 0.55 * u, y - 0.55 * u, 0.06 * u, 0.06 * u, '#222'); ell(x - 0.15 * u, y - 0.05 * u, 0.4 * u, 0.22 * u, gold ? '#e0a800' : '#f0c820'); ctx.globalAlpha = 1;
}
function buoy(t) { const p = pr(t.x, 0, t.z); if (!p) return; const u = p.k, bob = Math.sin(performance.now() * 0.003 + t.ph) * 0.06 * u; ell(p.x, p.y + 0.05 * u, 0.6 * u, 0.15 * u, 'rgba(0,30,60,0.25)'); for (let i = 0; i < 3; i++) { const y0 = p.y - i * 0.38 * u + bob, w0 = (0.55 - i * 0.14) * u, w1 = (0.55 - (i + 1) * 0.14) * u; ctx.fillStyle = i % 2 ? '#fff' : '#ff4a4a'; ctx.beginPath(); ctx.moveTo(p.x - w0, y0); ctx.lineTo(p.x + w0, y0); ctx.lineTo(p.x + w1, y0 - 0.38 * u); ctx.lineTo(p.x - w1, y0 - 0.38 * u); ctx.fill(); } ell(p.x, p.y - 1.2 * u + bob, 0.12 * u, 0.12 * u, '#ffe84a'); }
function rock(t) { const p = pr(t.x, 0, t.z); if (!p) return; const u = p.k * t.r; ell(p.x, p.y + 0.05 * u, u * 1.05, u * 0.22, 'rgba(0,30,60,0.3)'); ctx.fillStyle = '#6a7080'; ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, rr = u * (0.75 + 0.3 * hash(t.seed, i)); ctx.lineTo(p.x + Math.cos(a) * rr, p.y - u * 0.55 + Math.sin(a) * rr * 0.62); } ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(p.x - u * 0.25, p.y - u * 0.8, u * 0.4, u * 0.18, -0.3, 0, TAU); ctx.fill(); ctx.fillStyle = '#4a8a4a'; ctx.beginPath(); ctx.ellipse(p.x + u * 0.3, p.y - u * 0.15, u * 0.45, u * 0.14, 0, 0, TAU); ctx.fill(); }
function stoneDraw(st, now) {
  const base = pr(st.x, 0, st.z), p = pr(st.x, st.h + 0.25, st.z); if (!p || !base) return; const r = p.k * 0.36, s = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.2, r * 0.1, p.x, p.y, r * 1.1);
  ctx.fillStyle = 'rgba(0,30,60,' + 0.35 / (1 + st.h * 0.6) + ')'; ctx.beginPath(); ctx.ellipse(base.x, base.y, r * 1.1, r * 1.1 * clamp(CH / base.zc, 0.04, 0.9), 0, 0, TAU); ctx.fill();
  s.addColorStop(0, '#d0d4de'); s.addColorStop(0.6, '#6a7080'); s.addColorStop(1, '#2e3240'); ctx.fillStyle = s; ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.1, r * 0.55, Math.sin(st.rot) * 0.15, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.7, st.rot, st.rot + 1.2); ctx.stroke();
}
function sceneBg(now) {
  const sk = ctx.createLinearGradient(0, 0, 0, HZ); sk.addColorStop(0, '#4aa8e8'); sk.addColorStop(1, '#fff0d0'); ctx.fillStyle = sk; ctx.fillRect(0, 0, W, HZ + 2);
  const sx = W * 0.72, sy = HZ - Math.min(W, H) * 0.12, sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, Math.min(W, H) * 0.3); sg.addColorStop(0, 'rgba(255,250,200,1)'); sg.addColorStop(0.2, 'rgba(255,240,170,0.6)'); sg.addColorStop(1, 'rgba(255,240,170,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, HZ);
