<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chain Burst</title>
<style>
:root{--bg:#0a0f24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f24}}
:root[data-theme="dark"]{--bg:#0a0f24}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');
const TAU = Math.PI * 2, YR = 0.9, ORBR = 4.8, TAPR = 21, COLORS = ['#ff4d6d', '#ffb703', '#3ddc84', '#35b8ff', '#b86bff'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const loadTop = () => { try { const a = JSON.parse(store.get('chainburst.top5') || '[]'); return Array.isArray(a) ? a.filter(n => typeof n === 'number').slice(0, 5) : []; } catch (e) { return []; } };
let top5 = loadTop(), bestLv = parseInt(store.get('chainburst.lv') || '0', 10) || 0, bestChain = parseInt(store.get('chainburst.chain') || '0', 10) || 0;
function saveTop(s) { const a = top5.slice(); a.push(s); a.sort((x, y) => y - x); top5 = a.slice(0, 5); store.set('chainburst.top5', JSON.stringify(top5)); return top5.indexOf(s); }
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- canvas + arena mapping ---------- */
let W, H, dpr, s, AW, AD, TOP, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  safeTop = probe.offsetHeight || 0; TOP = safeTop + 112; const VA = Math.max(200, H - TOP - 14);
  s = Math.sqrt((W - 16) * VA / (YR * 18000)); AW = (W - 16) / s; AD = VA / (YR * s);
}
const kk = z => 0.88 + 0.12 * clamp(z / AD, 0, 1);
const P = (x, z) => { const k = kk(z); return { x: W / 2 + (x - AW / 2) * s * k, y: TOP + z * s * YR, k }; };
const unP = (px, py) => { const z = (py - TOP) / (s * YR), k = kk(z); return { x: (px - W / 2) / (s * k) + AW / 2, z }; };
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  pop(c) { const b = 330 * Math.pow(1.0595, Math.min(c, 26)); tone('triangle', b, b * 1.6, 0.1, 0.1); },
  tap() { tone('sine', 160, 60, 0.25, 0.14); }, crack() { tone('square', 300, 150, 0.08, 0.07); }, bomb() { tone('sawtooth', 160, 30, 0.5, 0.15); },
  freeze() { tone('sine', 1400, 500, 0.5, 0.09); }, bonus() { [660, 880, 1320].forEach((n, i) => tone('triangle', n, n, 0.12, 0.1, i * 0.07)); },
  clear() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone('triangle', n, n, 0.16, 0.12, i * 0.08)); },
  fail() { tone('sawtooth', 300, 50, 0.6, 0.13); }, over() { tone('sawtooth', 380, 35, 0.9, 0.14); }, start() { tone('triangle', 330, 660, 0.14, 0.1); }
};

/* ---------- state ---------- */
let state = STATES.START, G, raf = 0, last = 0, overAt = 0, aim = { on: false, x: 0, z: 0, id: null, show: false };
const bokeh = Array.from({ length: 24 }, () => ({ x: Math.random(), y: Math.random(), r: 8 + Math.random() * 30, h: Math.floor(Math.random() * 5), v: 0.004 + Math.random() * 0.01 }));
const tapsFor = L => L < 2 ? 5 : L < 6 ? 4 : 3, targetFor = L => clamp(0.5 + 0.05 * L, 0.5, 0.95);

function genOrbs(L) {
  const rnd = mulberry(7000 + L * 131), n = Math.min(55, 14 + 3 * L), orbs = [];
  for (let i = 0, tries = 0; i < n && tries < 4000; tries++) {
    const x = ORBR + rnd() * (AW - 2 * ORBR), z = ORBR + rnd() * (AD - 2 * ORBR); if (orbs.some(o => Math.hypot(o.x - x, o.z - z) < ORBR * 2 + 5)) continue;
    const q = rnd(); let type = 'n'; if (L >= 1 && q < 0.07 + 0.01 * Math.min(L, 6)) type = 'bomb'; else if (L >= 2 && q < 0.15 + 0.012 * Math.min(L, 6)) type = 'armor'; else if (L >= 3 && q < 0.2 + 0.01 * Math.min(L, 6)) type = 'freeze'; else if (L >= 4 && q < 0.25) type = 'dud'; else if (L >= 1 && q < 0.3) type = 'prism';

    orbs.push({ id: i, x, z, vx: Math.cos(a) * v, vz: Math.sin(a) * v, type, hp: type === 'armor' ? 2 : 1, c: Math.floor(rnd() * 5), ph: rnd() * 6, flash: 0, r: ORBR }); i++;

  return orbs;
}
function loadLevel() {
  const g = G; g.orbs = genOrbs(g.level); g.total = g.orbs.length; g.popped = 0; g.taps = tapsFor(g.level); g.waves = []; g.parts = []; g.popups = []; g.ph = 'aim'; g.pt = 0; g.chain = 0; g.maxChain = 0; g.freeze = 0; g.ts = 1; g.tsT = 0; g.shake = 0; g.big = 0; g.lvScore = g.score; g.firstFire = g.level > 0 || g.firedOnce;
}
function newGame() { G = { level: 0, score: 0, lives: 3, t: 0, rank: -1, over: false, firedOnce: false, bonusTaps: 0 }; loadLevel(); }
resize(); newGame();

/* ---------- loop (single pointer) ---------- */
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(now);
}
document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop(); });
function startGame() { stopLoop(); aim.on = false; aim.id = null; newGame(); state = STATES.PLAYING; sfx.start(); startLoop(); }

/* ---------- logic ---------- */
const pop = (t, col, x, z, big) => G.popups.push({ t, col, x, z, life: big ? 1.4 : 1, big: !!big, y: 0 });
function burst(x, z, n, col, sp) { const p = P(x, z); for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = (sp || 140) * (0.3 + Math.random()); if (G.parts.length < 300) G.parts.push({ x: p.x, y: p.y - 6, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.4 + Math.random() * 0.5, max: 0.9, col, sz: 2 + Math.random() * 3 }); } }
function addWave(x, z, col, amp, maxR, neutral) { G.waves.push({ x, z, col, amp, r: 2, maxR, st: 'grow', ht: 0.18, ft: 0.32, hit: new Set(), neutral: !!neutral }); }
function popOrb(o, w) {
  const g = G; g.chain++; g.maxChain = Math.max(g.maxChain, g.chain); g.popped++; o.dead = true;
  const pts = Math.round(10 * g.chain * (1 + 0.1 * g.level)); g.score += pts; sfx.pop(g.chain);
  const col = o.type === 'prism' ? '#ffffff' : o.type === 'dud' ? '#9aa0b0' : o.type === 'bomb' ? '#ff9a3a' : COLORS[o.c];
  burst(o.x, o.z, 12, col, 170); pop('+' + pts, col, o.x, o.z, false);
  if (o.type === 'dud') return;
  const match = o.type === 'prism' || w.neutral || w.col === o.c, amp = match ? w.amp + 1 : 0;
  const base = o.type === 'bomb' ? 34 : o.type === 'prism' ? 28 : 19, maxR = o.type === 'bomb' ? base : base * (1 + 0.18 * Math.min(amp, 5));
  addWave(o.x, o.z, o.c, o.type === 'bomb' ? 0 : amp, maxR, o.type === 'prism');
  if (o.type === 'bomb') { sfx.bomb(); g.shake = Math.max(g.shake, 0.7); }
  if (o.type === 'freeze') { g.freeze = 3.5; sfx.freeze(); pop('FROZEN!', '#9fe8ff', o.x, o.z, true); }
  if (g.chain % 8 === 0) { g.taps = Math.min(9, g.taps + 1); sfx.bonus(); pop('+1 TAP!', '#7aff9a', AW / 2, AD * 0.4, true); }

}
function fire(x, z) {
  const g = G; if (state !== STATES.PLAYING || g.ph !== 'aim' || g.taps <= 0) return;
  g.taps--; g.ph = 'resolve'; g.chain = 0; g.firedOnce = true; g.firstFire = true; addWave(clamp(x, 0, AW), clamp(z, 0, AD), null, 0, TAPR, true); sfx.tap(); g.shake = Math.max(g.shake, 0.2);
}
function evaluate() {
  const g = G, pct = g.popped / g.total;

    const stars = pct >= 0.999 ? 3 : pct >= targetFor(g.level) + 0.1 ? 2 : 1, bonus = g.taps * 150 + 200 * (g.level + 1) + (stars - 1) * 150; g.score += bonus; g.bonus = bonus; g.stars = stars; g.ph = 'clear'; g.pt = 2.4; sfx.clear();
    if (g.level + 1 > bestLv) { bestLv = g.level + 1; store.set('chainburst.lv', String(bestLv)); }
  } else if (g.taps <= 0) {
    g.lives--; g.ph = 'fail'; g.pt = 1.8; sfx.fail();
    if (g.lives <= 0) { g.over = true; state = STATES.GAMEOVER; g.rank = saveTop(Math.floor(g.score)); overAt = performance.now(); sfx.over(); }
  } else g.ph = 'aim';

}
function update(dt) {

  if (state === STATES.START || state === STATES.PLAYING) {
    const fz = g.freeze > 0 ? 0.0 : 1; g.freeze = Math.max(0, g.freeze - dt);

    if (w.st === 'grow') { w.r += 58 * sdt; if (w.r >= w.maxR) { w.r = w.maxR; w.st = 'hold'; } } else if (w.st === 'hold') { w.ht -= sdt; if (w.ht <= 0) w.st = 'fade'; } else { w.ft -= sdt; if (w.ft <= 0) { g.waves.splice(i, 1); continue; } }

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === STATES.START) { startGame(); return; }
  if (state === STATES.GAMEOVER) { if (performance.now() - overAt > 900) startGame(); return; }
  if (aim.id != null) return; aim.id = e.pointerId; aim.on = true; setAim(e); aim.show = true;
});
function setAim(e) { const off = e.pointerType === 'touch' ? 46 : 0, q = unP(e.clientX, e.clientY - off); aim.x = clamp(q.x, 0, AW); aim.z = clamp(q.z, 0, AD); }
cv.addEventListener('pointermove', e => { if (state !== STATES.PLAYING) return; if (e.pointerType === 'mouse') { setAim(e); aim.show = true; } else if (aim.id === e.pointerId) setAim(e); });
cv.addEventListener('pointerup', e => { if (aim.id === e.pointerId) { aim.id = null; aim.on = false; if (state === STATES.PLAYING) { setAim(e); fire(aim.x, aim.z); if (e.pointerType !== 'mouse') aim.show = false; } } });
cv.addEventListener('pointercancel', e => { if (aim.id === e.pointerId) { aim.id = null; aim.on = false; aim.show = false; } });
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); audio(); if (state === STATES.START) startGame(); else if (state === STATES.GAMEOVER && performance.now() - overAt > 900) startGame(); else if (state === STATES.PLAYING && aim.show) fire(aim.x, aim.z); } });

/* ---------- drawing ---------- */
function txt(str, x, y, size, col, weight, alpha, align) {
  ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col;
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; };

function orb(o, now, hl) {
  const p = P(o.x, o.z), R = o.r * s * p.k, cx = p.x, cy = p.y - R * 0.5, base = o.type === 'bomb' ? '#2a2a3a' : o.type === 'dud' ? '#8a90a2' : o.type === 'freeze' ? '#aee9ff' : o.type === 'armor' ? COLORS[o.c] : COLORS[o.c];
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(p.x + R * 0.18, p.y + R * 0.3, R * 0.95, R * 0.5, 0, 0, TAU); ctx.fill();
  if (o.type === 'prism') { const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R); const h = (now * 0.1) % 360; g.addColorStop(0, '#fff'); g.addColorStop(0.5, 'hsl(' + h + ',90%,65%)'); g.addColorStop(1, 'hsl(' + (h + 120) + ',80%,40%)'); ctx.fillStyle = g; }
  else { const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R); g.addColorStop(0, tint(base, 0.8)); g.addColorStop(0.45, base); g.addColorStop(1, shade(base, 0.45)); ctx.fillStyle = g; }

  else if (o.type === 'dud') { ctx.strokeStyle = '#4a4e60'; ctx.lineWidth = Math.max(2, R * 0.16); ctx.beginPath(); ctx.moveTo(cx - R * 0.4, cy - R * 0.4); ctx.lineTo(cx + R * 0.4, cy + R * 0.4); ctx.moveTo(cx + R * 0.4, cy - R * 0.4); ctx.lineTo(cx - R * 0.4, cy + R * 0.4); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(cx - R * 0.35, cy - R * 0.42, R * 0.26, R * 0.16, -0.6, 0, TAU); ctx.fill();

  if (G.freeze > 0) { ctx.strokeStyle = 'rgba(190,240,255,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, TAU); ctx.stroke(); }
  if (hl) { ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, R * 1.25, 0, TAU); ctx.stroke(); }
}

}
function draw(now) {
  const g = G, pulse = Math.sin(now * 0.008);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1a1650'); bg.addColorStop(0.5, '#0d1236'); bg.addColorStop(1, '#070a1f'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
