<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Switchyard</title>
<style>
:root{--bg:#14101c;--fg:#ffe4a8}
@media(prefers-color-scheme:dark){:root{--bg:#0e0b15}}
[data-theme=mine]{--bg:#1a1410}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head><body>
<div id="probe"></div><canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const ST={START:0,PLAY:1,OVER:2};
let W=360,H=640,dpr=1,safe=0,state=ST.START,raf=0,last=0,time=0,paused=false;
let TOP=100,BOT=500,CX=180,LW=70;
const KEY='switchyard.v1',save={scores:[],bestCombo:0,bestDel:0};
const cn=n=>typeof n==='number'&&isFinite(n)?Math.max(0,Math.min(1e8,n|0)):0;
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.scores)){save.scores=j.scores.map(cn).filter(n=>n>0).sort((a,b)=>b-a).slice(0,5);save.bestCombo=cn(j.bestCombo);save.bestDel=cn(j.bestDel)}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const F=(px,w)=>(w||'700')+' '+Math.round(px)+'px system-ui,-apple-system,sans-serif';
function txt(s,x,y,px,c,al,w){ctx.font=F(px,w);ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* audio */
let AC=null,mg=null,nb=null,lastT=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}}
function tone(f,d,ty,v,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc){if(!AC)return;try{if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.value=fc||800;g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d)}catch(e){}}
const sfx={sw(){const n=performance.now();if(n-lastT<50)return;lastT=n;tone(180,.08,'square',.12,120);noise(.05,.15,2500)},ok(c){tone(440*Math.pow(1.06,Math.min(c,14)*2),.15,'triangle',.22);tone(880*Math.pow(1.06,Math.min(c,14)*2),.2,'sine',.1)},bad(){noise(.5,.5,500);tone(160,.4,'sawtooth',.2,40)},start(){tone(330,.1,'triangle',.2);setTimeout(()=>tone(494,.1,'triangle',.2),90);setTimeout(()=>tone(660,.2,'triangle',.2),180)},over(){tone(300,.5,'sawtooth',.18,70)}};

const COLS=['#ff4d6d','#4dabff','#5ee08a','#ffd23f'],NAMES=['RED','BLUE','GREEN','GOLD'];
/* junctions: row v, pair left col a (swaps a<->a+1) */
const JD=[{v:.24,a:0},{v:.24,a:2},{v:.48,a:1},{v:.72,a:0},{v:.72,a:2}];
let cars,sw,parts,pops,score,combo,bestCombo,lives,deliv,t,spawnT,shake,slow,over,overT,rank,saved,cause,hintA,hintDone,crashes;
function reset(){cars=[];sw=JD.map(()=>false);parts=[];pops=[];score=0;combo=0;bestCombo=0;lives=3;deliv=0;t=0;spawnT=.8;shake=0;slow=1;over=false;overT=0;rank=-1;saved=false;cause='';hintA=1;hintDone=false}
reset();
const dd=()=>1-Math.exp(-t/50);
const pv=v=>TOP+(BOT-TOP)*Math.pow(clamp(v,0,1.2),1.25);
const psc=v=>.42+.58*clamp(v,0,1.2);
const px=(col,v)=>CX+(col-1.5)*LW*psc(v);
function spawn(){
 const d=dd(),nc=t<14?2:t<32?3:4;
 const free=[0,1,2,3].filter(c=>!cars.some(k=>Math.abs(k.tc-c)<.5&&k.v<.16));
 if(!free.length)return false;
 const col=free[(Math.random()*free.length)|0];
 const gold=t>20&&Math.random()<.07;
 cars.push({col,tc:col,from:col,to:col,v0:0,v:0,jd:0,color:(Math.random()*nc)|0,gold,ph:Math.random()*6});
 return true;
}
function burst(x,y,n,c,sp){for(let i=0;i<n&&parts.length<260;i++){const a=rnd(0,6.28),v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:rnd(.4,.9),ml:.9,c,s:rnd(2,4)})}}
function pop(x,y,s,c){if(pops.length<16)pops.push({x,y,s,c,l:1})}
function loseLife(why,x,y){lives--;combo=0;cause=why;shake=14;slow=.3;sfx.bad();burst(x,y,26,'#ffb347',200);pop(x,y-14,'-1 LIFE','#ff6b6b');if(lives<=0)endGame()}
function endGame(){state=ST.OVER;over=true;overT=0;sfx.over();
 if(!saved){saved=true;if(score>0){const a=save.scores.slice();a.push(score);a.sort((x,y)=>y-x);rank=a.indexOf(score);save.scores=a.slice(0,5);if(rank>4)rank=-1}
  save.bestCombo=Math.max(save.bestCombo,bestCombo);save.bestDel=Math.max(save.bestDel,deliv);persist()}}
function toggle(i){if(i<0||i>=sw.length)return;sw[i]=!sw[i];hintDone=true;sfx.sw();const j=JD[i];const x=px(j.a+.5,j.v),y=pv(j.v);burst(x,y,6,'#ffd27a',70)}
function update(dt){
 if(state===ST.START){time+=0;return}
 slow=Math.min(1,slow+dt*.9);const sd=dt*(state===ST.OVER?Math.max(.3,slow):slow);
 shake=Math.max(0,shake-sd*30);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=sd;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*sd;q.y+=q.vy*sd;q.vy+=500*sd}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.l-=sd;q.y-=36*sd;if(q.l<=0)pops.splice(i,1)}
 if(state===ST.OVER){overT+=dt;return}
 if(hintDone)hintA=Math.max(0,hintA-dt*1.5);
 t+=sd;const d=dd(),sp=.17+.3*d;
 spawnT-=sd;if(spawnT<=0){spawnT=spawn()?Math.max(.55,1.9-1.35*d)*rnd(.75,1.15):.2}
 for(const c of cars){
  c.v+=sp*sd;
  for(let j=0;j<JD.length;j++){
   if(c.jd&(1<<j)||c.v<JD[j].v)continue;c.jd|=1<<j;
   const J=JD[j];
   if(sw[j]&&(c.tc===J.a||c.tc===J.a+1)){c.from=c.col;c.to=c.tc===J.a?J.a+1:J.a;c.v0=J.v-.02;c.tc=c.to}
  }
  if(c.from!==c.to){const u=clamp((c.v-c.v0)/.1,0,1);c.col=c.from+(c.to-c.from)*(u*u*(3-2*u));if(u>=1){c.from=c.to=c.tc;c.col=c.tc}}
 }
 /* collisions */
 for(let i=0;i<cars.length&&state===ST.PLAY;i++)for(let k=i+1;k<cars.length;k++){
  const a=cars[i],b=cars[k];
  if(Math.abs(a.col-b.col)<.55&&Math.abs(a.v-b.v)<.06){const x=px((a.col+b.col)/2,a.v),y=pv(a.v);cars.splice(k,1);cars.splice(i,1);loseLife('Carts collided',x,y);break}
 }
 /* arrivals */
 for(let i=cars.length-1;i>=0;i--){
  const c=cars[i];if(c.v<1)continue;
  const lane=Math.round(c.col),x=px(c.col,1),y=pv(1);cars.splice(i,1);
  if(state!==ST.PLAY)continue;
  if(c.gold||lane===c.color){
   combo++;bestCombo=Math.max(bestCombo,combo);deliv++;
   const pts=Math.round(100*(1+.5*Math.min(combo-1,16))*(c.gold?3:1));score+=pts;sfx.ok(combo);
   burst(x,y,16,c.gold?'#ffd23f':COLS[c.color],160);pop(x,y-20,'+'+pts+(combo>1?' x'+combo:''),'#ffe4a8');
  }else loseLife('Wrong depot: '+NAMES[c.color]+' cart into '+NAMES[lane],x,y);
 }
}
/* drawing */
function drawBG(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d1830');g.addColorStop(1,'#0f0b14');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<30;i++){const x=(i*97)%W,y=(i*53)%H;ctx.fillRect(x,y,3,3)}
 /* tunnel floor trapezoid */
 const g2=ctx.createLinearGradient(0,TOP,0,BOT);g2.addColorStop(0,'#2a2338');g2.addColorStop(1,'#4b3f55');ctx.fillStyle=g2;
 const hw0=LW*2.2*psc(0),hw1=LW*2.2*psc(1.1);ctx.beginPath();ctx.moveTo(CX-hw0,pv(0));ctx.lineTo(CX+hw0,pv(0));ctx.lineTo(CX+hw1,pv(1.1));ctx.lineTo(CX-hw1,pv(1.1));ctx.fill();
 const vg=ctx.createRadialGradient(CX,TOP,5,CX,TOP,H*.5);vg.addColorStop(0,'rgba(255,200,120,.18)');vg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawTracks(){
 ctx.lineCap='round';
 for(let k=0;k<26;k++){const v=k/25,y=pv(v),s=psc(v),w=LW*3.3*s;ctx.fillStyle='rgba(90,60,40,.8)';ctx.fillRect(CX-w/2,y,w,Math.max(1.5,3*s))}
 for(let c=0;c<4;c++){ctx.strokeStyle='#9aa0b0';ctx.lineWidth=3;for(const o of[-.12,.12]){ctx.beginPath();ctx.moveTo(px(c+o,0),pv(0));for(let k=1;k<=12;k++){const v=k/12*1.05;ctx.lineTo(px(c+o,v),pv(v))}ctx.stroke()}}
 for(let i=0;i<JD.length;i++){const J=JD[i],on=sw[i];
  ctx.strokeStyle=on?'#ffd27a':'rgba(160,160,180,.28)';ctx.lineWidth=on?4:2;
  for(const dir of[0,1]){const a=dir?J.a+1:J.a,b=dir?J.a:J.a+1;ctx.beginPath();ctx.moveTo(px(a,J.v-.02),pv(J.v-.02));ctx.lineTo(px(b,J.v+.08),pv(J.v+.08));ctx.stroke()}
  const x=px(J.a+.5,J.v),y=pv(J.v),r=Math.max(15,LW*.3*psc(J.v));
  ctx.fillStyle=on?'#ffb42e':'#3b3550';ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.strokeStyle=on?'#fff0b0':'#7d7599';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=on?'#2a1a00':'#b9b2d4';ctx.lineWidth=3;ctx.beginPath();if(on){ctx.moveTo(x-r*.5,y-r*.4);ctx.lineTo(x+r*.5,y+r*.4);ctx.moveTo(x+r*.5,y-r*.4);ctx.lineTo(x-r*.5,y+r*.4)}else{ctx.moveTo(x,y-r*.5);ctx.lineTo(x,y+r*.5)}ctx.stroke();
 }
}
function drawDepots(){
 for(let c=0;c<4;c++){const x=px(c,1.08),y=pv(1.08),w=LW*.9,h=LW*.6,lock=t<32&&c===3||t<14&&c===2;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+h*.55,w*.6,h*.2,0,0,6.28);ctx.fill();
  const g=ctx.createLinearGradient(x,y-h/2,x,y+h/2);g.addColorStop(0,lock?'#4a4558':COLS[c]);g.addColorStop(1,lock?'#2a2636':'rgba(0,0,0,.6)');ctx.fillStyle=g;rr(x-w/2,y-h/2,w,h,10);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.stroke();
  txt(NAMES[c],x,y,Math.min(13,LW*.2),lock?'#8a849c':'#1a1020','center','800');
 }
}
function drawCar(c){
 const x=px(c.col,c.v),y=pv(c.v),s=psc(c.v),w=LW*.62*s,h=LW*.45*s,b=Math.sin(time*14+c.ph)*.8*s;
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+h*.55,w*.6,h*.2,0,0,6.28);ctx.fill();
 ctx.fillStyle='#262232';ctx.beginPath();ctx.arc(x-w*.3,y+h*.45,h*.17,0,6.28);ctx.arc(x+w*.3,y+h*.45,h*.17,0,6.28);ctx.fill();
 const col=c.gold?'#ffd23f':COLS[c.color],g=ctx.createLinearGradient(x,y-h,x,y+h*.4);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,.65)');
 ctx.fillStyle='#5a5668';rr(x-w/2,y-h*.7+b,w,h*1.05,h*.15);ctx.fill();
 ctx.fillStyle=g;rr(x-w/2+2,y-h*.65+b,w-4,h*.35,h*.1);ctx.fill();
 ctx.fillStyle=col;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x-w*.22+i*w*.22,y-h*.75+b,h*.2,Math.PI,0);ctx.fill()}
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(x-w*.1,y-h*.85+b,h*.07,0,6.28);ctx.fill();
 ctx.fillStyle=col;rr(x-w*.18,y-h*.2+b,w*.36,h*.3,3);ctx.fill();
 if(c.gold)txt('x3',x,y-h*1.3,Math.max(10,h*.5),'#ffd23f');
}
function drawHUD(){
 const y=safe+10,pw=Math.min(W*.36,150),ph=46;
 ctx.fillStyle='rgba(16,10,24,.75)';rr(10,y,pw,ph,12);ctx.fill();txt('SCORE',20,y+13,Math.min(11,W/32),'#a89cc4','left');txt(String(score),20,y+31,Math.min(22,W/16),'#ffe4a8','left');
 ctx.fillStyle='rgba(16,10,24,.75)';rr(W-10-pw,y,pw,ph,12);ctx.fill();txt('LIVES',W-10-pw+10,y+13,Math.min(11,W/32),'#a89cc4','left');
 for(let i=0;i<3;i++){const x=W-10-pw+22+i*Math.min(30,pw/3.4);ctx.fillStyle=i<lives?'#ffb42e':'#352f45';ctx.beginPath();ctx.arc(x,y+31,8,0,6.28);ctx.fill()}
 if(combo>1){const sc=1+.08*Math.sin(time*8);ctx.save();ctx.translate(W/2,y+ph/2);ctx.scale(sc,sc);txt('x'+combo,0,0,Math.min(26,W/12),'#ff9f43');ctx.restore()}else txt('BEST '+(save.scores[0]||0),W/2,y+ph/2,Math.min(13,W/28),'#a89cc4');
}
function drawStart(){
 ctx.fillStyle='rgba(10,6,18,.6)';ctx.fillRect(0,0,W,H);const ty=safe+H*.13,u=Math.min(52,W/6.5);
 txt('SWITCH',W/2,ty,u,'#ffe4a8','center','800');txt('YARD',W/2,ty+u*.95,u,'#ffb42e','center','800');
 txt('Flip switches. Send each cart to its depot.',W/2,ty+u*2,Math.min(15,W/24),'#e8e0f6','center','500');
 txt('Wrong depot or a crash costs a life.',W/2,ty+u*2+22,Math.min(13,W/27),'#a89cc4','center','500');
 ctx.globalAlpha=.55+.45*Math.sin(time*4);txt('TAP TO PLAY',W/2,H-Math.max(70,H*.12),Math.min(26,W/13),'#ffe4a8');ctx.globalAlpha=1;
 txt('Best '+(save.scores[0]||0)+'   Best combo x'+save.bestCombo,W/2,H-Math.max(40,H*.07),Math.min(13,W/27),'#a89cc4','center','500');
}
function drawOver(){
 const pw=Math.min(W-28,350),ph=Math.min(H-20,350),x=W/2-pw/2,y=Math.max(safe+6,H/2-ph/2);
 ctx.fillStyle='rgba(10,6,18,.92)';rr(x,y,pw,ph,18);ctx.fill();ctx.strokeStyle='rgba(255,180,46,.4)';ctx.lineWidth=2;ctx.stroke();
 txt('YARD SHUT DOWN',W/2,y+26,Math.min(22,pw/13),'#ffe4a8');
 ctx.font=F(Math.min(13,pw/26),'500');let cs=cause;while(cs.length>8&&ctx.measureText(cs).width>pw-30)cs=cs.slice(0,-2);txt(cs,W/2,y+50,Math.min(13,pw/26),'#ff8f8f','center','500');
 txt(String(score),W/2,y+92,Math.min(44,pw/7),'#fff');
 if(rank===0)txt('NEW HIGH SCORE!',W/2,y+126,Math.min(17,pw/18),'#ff9f43');else txt(deliv+' delivered  -  best combo x'+bestCombo,W/2,y+126,Math.min(13,pw/26),'#a89cc4','center','500');
 for(let i=0;i<5;i++){const yy=y+160+i*24,s=save.scores[i],hl=i===rank;if(hl){ctx.fillStyle='rgba(255,159,67,.2)';rr(x+16,yy-11,pw-32,22,6);ctx.fill()}
  txt((i+1)+'.',x+28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#7d7599','left');txt(s!=null?String(s):'-',x+pw-28,yy,Math.min(14,pw/24),hl?'#ffb36b':'#e8e0f6','right')}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(time*5);txt('TAP TO REOPEN',W/2,y+ph-24,Math.min(18,pw/17),'#ffe4a8');ctx.globalAlpha=1}
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
 const sx=shake>0?rnd(-shake,shake)*.5:0,sy=shake>0?rnd(-shake,shake)*.5:0;
 ctx.save();ctx.translate(sx,sy);drawBG();drawTracks();
 const cs=cars.slice().sort((a,b)=>a.v-b.v);for(const c of cs)drawCar(c);
 drawDepots();
 for(const q of parts){ctx.globalAlpha=clamp(q.l/q.ml,0,1);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 for(const q of pops){ctx.globalAlpha=clamp(q.l,0,1);txt(q.s,q.x,q.y,Math.min(17,W/22),q.c)}ctx.globalAlpha=1;
 ctx.restore();
 if(state!==ST.START)drawHUD();
 if(hintA>.01&&state===ST.PLAY){ctx.globalAlpha=hintA;const bw=Math.min(W-30,330),by=pv(.12);ctx.fillStyle='rgba(16,10,24,.85)';rr(W/2-bw/2,by-24,bw,48,14);ctx.fill();txt('TAP a switch to reroute carts',W/2,by-7,Math.min(16,W/22),'#ffe4a8');txt('Match cart color to depot color',W/2,by+13,Math.min(12,W/29),'#a89cc4','center','400');ctx.globalAlpha=1}
 if(state===ST.START)drawStart();if(state===ST.OVER)drawOver();
 if(paused&&state===ST.PLAY){ctx.fillStyle='rgba(10,6,18,.75)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2-12,Math.min(36,W/9),'#ffe4a8');txt('Tap to resume',W/2,H/2+22,16,'#a89cc4','center','500')}
}
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:0;last=ts;if(!(dt>0))dt=0;dt=Math.min(.04,dt);time+=dt;try{if(!paused)update(dt);draw()}catch(e){console.error(e)}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}last=0}
function startLoop(){stopLoop();raf=requestAnimationFrame(frame)}
function startGame(){reset();state=ST.PLAY;paused=false;sfx.start();startLoop()}
function press(){au();if(state===ST.START){startGame();return false}if(state===ST.OVER){if(overT>.8)startGame();return false}if(paused){paused=false;last=0;return false}return true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(!press())return;
 const x=e.clientX,y=e.clientY;let bi=-1,bd=1e9;
 for(let i=0;i<JD.length;i++){const J=JD[i],d=Math.hypot(px(J.a+.5,J.v)-x,pv(J.v)-y);if(d<bd){bd=d;bi=i}}
 if(bd<Math.max(50,LW*.9))toggle(bi)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;
 if(k===' '||k==='Enter'){e.preventDefault();press()}
 else if(k>='1'&&k<='5'){if(state===ST.PLAY&&!paused)toggle(+k-1)}
 else if(k==='p'||k==='P'||k==='Escape'){if(state===ST.PLAY){paused=!paused;last=0}}});
