<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Lanes</title>
<style>
:root{--bg:#0b0620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0620}}
:root[data-theme="dark"]{--bg:#0b0620}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const STATES = { START: 0, SELECT: 1, PLAYING: 2, RESULT: 3 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), probe = document.getElementById('probe');

const SONGS = [

  { n: 'AFTERGLOW', bpm: 128, seed: 37, dens: 0.6, d16: 0.13, hold: 0.14, sub: 'HARD' }, { n: 'OVERDRIVE', bpm: 140, seed: 41, dens: 0.68, d16: 0.22, hold: 0.14, sub: 'EXPERT' }, { n: 'HYPERLOOP', bpm: 154, seed: 53, dens: 0.76, d16: 0.3, hold: 0.16, sub: 'INSANE' }
];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let SV = { best: [0, 0, 0, 0, 0], grade: ['', '', '', '', ''], unlocked: 1 };
(function () { try { const o = JSON.parse(store.get('pulselanes.save') || 'null'); if (o && Array.isArray(o.best) && o.best.length === 5) SV = { best: o.best.map(n => Math.max(0, +n || 0)), grade: o.grade.map(g => ['S', 'A', 'B', 'C', 'D'].includes(g) ? g : ''), unlocked: clamp(Math.floor(+o.unlocked) || 1, 1, 5) }; } catch (e) {} })();

const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- canvas ---------- */
let W, H, dpr, laneW, hitY, vpY, safeTop = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; safeTop = probe.offsetHeight || 0;

addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- audio engine ---------- */

}
const clock = () => AC ? AC.currentTime : performance.now() / 1000;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);

const drum = {
  kick(t) { osc('sine', 150, t, 0.16, 0.9, 42); osc('triangle', 80, t, 0.06, 0.25, 40); },
  snare(t) { noise(t, 0.16, 0.35, 'bandpass', 1800); osc('triangle', 190, t, 0.1, 0.3, 120); },
  hat(t, o) { noise(t, o ? 0.16 : 0.04, o ? 0.12 : 0.1, 'highpass', 7000); },
  bass(t, m, dur) { const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = mf(m); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + dur); env(g, t, 0.006, 0.3, dur); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); },

};
function lead(m, t, sustain) {
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(); o1.type = 'triangle'; o2.type = 'square'; o1.frequency.value = mf(m); o2.frequency.value = mf(m) * 1.004; f.type = 'lowpass'; f.frequency.value = 3200;

}
function sfxMiss() { if (AC) osc('sawtooth', 150, AC.currentTime, 0.15, 0.1, 70); }
function sfxUI() { if (AC) osc('triangle', 600, AC.currentTime, 0.1, 0.1, 900); }

/* ---------- song generation ---------- */
function genSong(i) {

    const p = strong ? Math.min(0.95, sp.dens * 1.55) : eighth ? sp.dens * 0.78 : sp.d16; if (rnd() > p) continue;

    const w = free.map(l => { const d = Math.abs(l - lane); return d === 0 ? 0.25 : d === 1 ? 1 : d === 2 ? 0.7 : 0.45; }); let tot = w.reduce((a, b) => a + b, 0), r = rnd() * tot, pick = free[0]; for (let k = 0; k < free.length; k++) { r -= w[k]; if (r <= 0) { pick = free[k]; break; } }

/* ---------- state ---------- */

const down = [0, 0, 0, 0], ptrLane = new Map(), stars = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4 }));
const fresh = () => ({ phase: 'idle', notes: [], parts: [], pops: [], pad: [0, 0, 0, 0], holds: [null, null, null, null], paused: false });
G = Object.assign(fresh(), { song: 0 });

function startSong(i) {

function stopSched() { if (sched) { clearInterval(sched); sched = 0; } }
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function startLoop() { stopLoop(); last = performance.now(); raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === STATES.PLAYING && G.phase === 'play' && !G.paused) { G.paused = true; if (AC) AC.suspend(); } stopLoop(); } else startLoop(); });
const songT = () => clock() - G.t0;

/* ---------- gameplay ---------- */

}
function miss(n, lane, msg) { const g = G; if (n) n.done = true; g.cnt.m++; g.combo = 0; g.health -= 8; pop(msg || 'MISS', '#ff6a8a', lane); g.judge = msg || 'MISS'; g.judgeC = '#ff6a8a'; g.judgeT = 0.6; g.shake = 0.35; sfxMiss(); }

/* ---------- input ---------- */
const laneOf = x => clamp(Math.floor((x - (W / 2 - 2 * laneW)) / laneW), 0, 3);

/* ---------- drawing ---------- */
