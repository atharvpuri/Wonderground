function hud(){var pad=Math.max(10,W*0.03),top=safeTop+pad,fs=Math.min(26,W/13),px=Math.max(pad,ox+pad*0.5);
ctx.fillStyle='rgba(15,10,40,0.6)';rr(px,top,Math.min(170,PW*0.46),fs*2.1,12);ctx.fill();
txt('SCORE',px+10,top+fs*0.6,fs*0.4,'#c8d0ff','left','700');txt(String(Math.floor(score)),px+10,top+fs*1.4,fs,'#fff','left');
var hw=Math.min(120,PW*0.32),hx=ox+PW-Math.max(pad,0)-hw;ctx.fillStyle='rgba(15,10,40,0.6)';rr(hx,top,hw,fs*2.1,12);ctx.fill();
txt('HEIGHT',hx+hw/2,top+fs*0.6,fs*0.4,'#c8d0ff','center','700');txt(Math.floor(peak)+' m',hx+hw/2,top+fs*1.4,fs*0.85,'#fff','center');
if(streak>=2)txt('PERFECT x'+mult()+' \u2022 '+streak,W/2,top+fs*2.9,Math.min(20,PW/16),'#ffe066');
if(pl.on&&!pl.air&&(holding||hint)){var x=ox+pl.x,y=pl.y-camY-90*s,bw=64*s;ctx.fillStyle='rgba(15,10,40,0.7)';rr(x-bw/2-3,y-3,bw+6,12,6);ctx.fill();var pp=holding?pl.p:0;ctx.fillStyle=pp>0.85?'#ff8a8a':'#7aff9a';rr(x-bw/2,y,Math.max(6,bw*pp),6,3);ctx.fill();
if(landings<6){var rp=reqP();if(rp>=0&&rp<=1.02){ctx.fillStyle='#ffe066';ctx.fillRect(x-bw/2+bw*Math.min(1,rp)-1.5,y-5,3,16)}}
var n=nextPlat();if(n){txt(n.x>=pl.x?'\u25B6':'\u25C0',x+(n.x>=pl.x?1:-1)*(bw/2+14*s),y+3,12*s,'#fff')}}}
function draw(){ctx.save();var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake}ctx.translate(sx,sy);
bgDraw();
ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(ox,0,PW,H);
for(var i=0;i<plats.length;i++)drawPlat(plats[i]);
for(i=0;i<gems.length;i++)drawGem(gems[i]);
if(state!==ST.OVER||true)drawPlayer();
drawLava();
for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(ox+q.x,q.y-camY,q.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;
for(i=0;i<pops.length;i++){var o=pops[i];ctx.globalAlpha=Math.max(0,Math.min(1,o.l*1.5));txt(o.s,Math.max(80,Math.min(W-80,ox+o.x)),o.y-camY,Math.min(18,PW/18),o.c)}ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle='rgba(255,100,40,'+(flash*0.35)+')';ctx.fillRect(-20,-20,W+40,H+40)}
ctx.restore();
if(state===ST.PLAY){hud();if(hintAlpha>0){ctx.globalAlpha=hintAlpha;ctx.fillStyle='rgba(15,10,40,0.78)';var hw=Math.min(W-24,340),hy=H*0.2+safeTop*0.3;rr(W/2-hw/2,hy,hw,56,14);ctx.fill();txt('HOLD to charge \u2022 RELEASE to jump',W/2,hy+19,Math.min(17,W/20),'#fff');txt('Gold mark = ideal power. Land in the center!',W/2,hy+40,Math.min(12,W/28),'#c8d0ff','center','600');ctx.globalAlpha=1}}
if(state===ST.START)drawStart();
if(state===ST.OVER)drawOver()}
function drawStart(){ctx.fillStyle='rgba(15,10,40,0.5)';ctx.fillRect(0,0,W,H);var y=H*0.2+safeTop*0.5;
txt('POGO',W/2,y,Math.min(70,W/5.2),'#ff9ac8');txt('PEAK',W/2,y+Math.min(62,W/6),Math.min(70,W/5.2),'#8af0c0');
txt('Charge. Hop. Climb. Outrun the lava.',W/2,y+Math.min(130,W/3),Math.min(15,W/23),'#e0e4ff','center','600');
var p=0.5+0.5*Math.sin(performance.now()/300);txt('TAP TO PLAY',W/2,H*0.6,Math.min(30,W/11)*(1+p*0.06),'#fff');
txt('BEST '+(best.scores[0]||0)+'   \u2022   HIGHEST '+best.height+' m',W/2,H*0.6+34,Math.min(15,W/24),'#c8d0ff','center','700')}
function drawOver(){ctx.fillStyle='rgba(15,10,40,0.72)';ctx.fillRect(0,0,W,H);var pw=Math.min(W-24,360),ph=Math.min(H-40-safeTop,430),px=W/2-pw/2,py=Math.max(safeTop+10,(H-ph)/2);
ctx.fillStyle='#231a4a';rr(px,py,pw,ph,20);ctx.fill();ctx.strokeStyle='#ff9ac8';ctx.lineWidth=3;ctx.stroke();
var u=ph/430,cy=py+34*u;txt(reason||'Game over',W/2,cy,Math.min(22,pw/14),'#ffa08a');
txt(String(Math.floor(score)),W/2,cy+48*u,Math.min(54,pw/6),'#fff');
if(rank===0)txt('NEW HIGH SCORE!',W/2,cy+88*u,Math.min(20,pw/16),'#ffd84a');
txt(Math.floor(peak)+' m \u2022 '+perfects+' perfect \u2022 best streak '+bestStreak,W/2,cy+114*u,Math.min(13,pw/24),'#c8d0ff','center','700');
txt('TOP 5',W/2,cy+142*u,Math.min(14,pw/24),'#e0e4ff','center','700');
for(var i=0;i<5;i++){var ry=cy+168*u+i*26*u,me=i===rank;if(me){ctx.fillStyle='rgba(255,216,74,0.2)';rr(px+16,ry-12*u,pw-32,24*u,8);ctx.fill()}
var fs=Math.min(15,pw/22);txt((i+1)+'.',px+30,ry,fs,me?'#ffd84a':'#fff','left','700');txt(best.scores[i]!==undefined?String(best.scores[i]):'-',px+pw-30,ry,fs,me?'#ffd84a':'#fff','right','700')}
if(overT>0.8){var p=0.5+0.5*Math.sin(performance.now()/250);ctx.fillStyle='rgba(255,154,200,'+(0.7+p*0.3)+')';rr(W/2-100,py+ph-62*u,200,44*u,14);ctx.fill();txt('TAP TO RETRY',W/2,py+ph-40*u,Math.min(20,pw/16),'#231a4a')}}
function frame(ts){raf=requestAnimationFrame(frame);var dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0)||!isFinite(dt))dt=0.016;dt=Math.min(0.04,dt);try{update(dt);draw()}catch(e){console.error(e)}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();
if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else if(holdId===null){holdId=e.pointerId;pressDown()}});
function up(e){try{cv.releasePointerCapture(e.pointerId)}catch(_){}if(holdId===e.pointerId){holdId=null;pressUp()}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){var k=e.key;if(k===' '||k==='Enter'||k.indexOf('Arrow')===0)e.preventDefault();if(e.repeat)return;
if(k===' '||k==='Enter'||k==='ArrowUp'||k==='ArrowDown'){initAudio();if(state===ST.START)startGame();else if(state===ST.OVER){if(overT>0.8)startGame()}else if(!keyHold){keyHold=true;pressDown()}}});
window.addEventListener('keyup',function(e){var k=e.key;if(k===' '||k==='Enter'||k==='ArrowUp'||k==='ArrowDown'){if(keyHold){keyHold=false;pressUp()}}});
function relAll(){holdId=null;keyHold=false;holding=false;chargeStop()}
window.addEventListener('blur',function(){relAll();stopLoop()});
window.addEventListener('focus',function(){startLoop()});
document.addEventListener('visibilitychange',function(){relAll();if(document.hidden)stopLoop();else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100)});
resize();reset();state=ST.START;startLoop();
})();
</script>
</body>
