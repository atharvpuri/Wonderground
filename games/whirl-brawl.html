<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a1f">
<title>Whirl Brawl</title>
<style>
:root{--bg:#120a1f;--fg:#fff4e0;--muted:#c9b6d9;--accent:#ffb347}
@media (prefers-color-scheme:dark){:root{--bg:#0b0615}}
:root[data-theme="ember"]{--bg:#1a0a12;--accent:#ff9a3c}
:root[data-theme="frost"]{--bg:#081426;--accent:#7fd8ff}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#safeT,#safeB{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;width:1px}
#safeT{padding-top:env(safe-area-inset-top,0px)}
#safeB{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body data-x="">
<div id="safeT"></div><div id="safeB"></div>
<canvas id="c"></canvas>
<script>
(()=>{'use strict';
document.documentElement.setAttribute('data-theme','ember');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const STATES={START:0,PLAYING:1,GAMEOVER:2};
let state=STATES.START,paused=false,animT=0;
let W=0,H=0,dpr=1,safeTop=0,safeBot=0,TILT=0.6;
const cam={cx:0,cy:0,s:1};
const R0=270,THICK=36,ZK=0.95,K0=1.9,VMAX=1000,REST=0.9,DROP_T=0.5,DROP_H=380;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function norm(x,y){const l=Math.hypot(x,y);return l<1e-6?[0,0]:[x/l,y/l];}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const css=getComputedStyle(document.documentElement);
const ACC=(css.getPropertyValue('--accent')||'#ffb347').trim()||'#ffb347';

/* ---------- save ---------- */
const KEY='whirl-brawl-v1';
let save={scores:[],bestWave:0,bestCombo:0};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');
 if(o&&Array.isArray(o.scores)){save.scores=o.scores.filter(x=>x&&Number.isFinite(x.s)&&x.s>=0).map(x=>({s:Math.floor(x.s),w:clamp(Math.floor(+x.w||0),0,999),k:clamp(Math.floor(+x.k||0),0,9999)})).sort((a,b)=>b.s-a.s).slice(0,5);
 save.bestWave=clamp(Math.floor(+o.bestWave||0),0,999);save.bestCombo=clamp(Math.floor(+o.bestCombo||0),0,999);}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const bestScore=()=>save.scores.length?save.scores[0].s:0;

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null;const lastSfx={};
function ensureAudio(){try{if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
 const n=AC.sampleRate*1;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 if(AC.state==='suspended')AC.resume().catch(()=>{});}catch(e){AC=null;}}
function can(n,gap){const t=performance.now();if(t-(lastSfx[n]||0)<gap)return false;lastSfx[n]=t;return true;}
function tone(f,d,type,v,f2,at){if(!AC)return;try{const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v),t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,f0,f1,type,at){if(!AC||!noiseBuf)return;try{const t=AC.currentTime+(at||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;fl.type=type||'bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1||f0),t+d);g.gain.setValueAtTime(Math.max(0.0002,v),t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.03);}catch(e){}}
const SFX={
 ui(){tone(620,.09,'triangle',.25,900);},
 dash(){if(!can('dash',60))return;noise(.2,.3,600,2600);tone(220,.18,'sawtooth',.1,520);},
 edash(){if(!can('edash',110))return;noise(.15,.1,400,1400);},
 hit(v){if(!can('hit',45))return;tone(140,.14,'square',.12*v+.04,60);noise(.08,.22*v+.04,1800,300,'lowpass');},
 ko(c){tone(520*Math.pow(1.0595,Math.min(c,12)*2),.16,'triangle',.28,900);tone(300,.35,'sawtooth',.12,70,.02);},
 pick(){[660,880,1180].forEach((f,i)=>tone(f,.12,'triangle',.22,0,i*.07));},
 fall(){tone(500,.7,'sine',.25,60);noise(.5,.15,1500,200,'lowpass');},
 pulse(){if(!can('pulse',150))return;tone(90,.4,'sine',.4,40);noise(.3,.2,900,150,'lowpass');},
 land(){if(!can('land',80))return;tone(110,.12,'square',.1,50);},
 wave(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.25,0,i*.09));},
 empty(){if(!can('empty',120))return;tone(160,.08,'square',.1,120);},
 over(){[440,370,311,220].forEach((f,i)=>tone(f,.3,'sawtooth',.18,f*.9,i*.16));}
};

/* ---------- types ---------- */
const TYPES={
 player:{r:24,m:1.4,c1:'#8ff7ff',c2:'#1fa7d8',c3:'#06425f'},
 grunt:{r:22,m:1,c1:'#ff9a7a',c2:'#e0372f',c3:'#6e1118',spikes:6,spk:.28,dash:520,cd:[1.7,2.8],tele:.62,pts:100},
 dasher:{r:18,m:.75,c1:'#ffe27a',c2:'#f2a900',c3:'#7a4a00',spikes:4,spk:.6,dash:790,cd:[1.4,2.3],tele:.4,pts:140},
 heavy:{r:31,m:2.8,c1:'#cfa8ff',c2:'#7b3fe4',c3:'#2e1470',spikes:8,spk:.15,dash:430,cd:[2.3,3.4],tele:.8,pts:200},
 pulser:{r:24,m:1.2,c1:'#ffa8d6',c2:'#e0409a',c3:'#6b1049',ring:true,dash:400,cd:[2,3],tele:.7,pts:170,pulse:{r:150,f:560,every:3.4}},
 boss:{r:46,m:6,c1:'#ff8080',c2:'#b3121b',c3:'#3a0508',spikes:10,spk:.3,dash:380,cd:[2.4,3.2],tele:.9,pts:1500,pulse:{r:230,f:760,every:4.2}}
};
function mkTop(type,x,y){const T=TYPES[type];return{type,T,x,y,z:0,vx:0,vy:0,vz:0,r:T.r,m:T.m,mode:'live',spin:rand(0,6),sq:0,flash:0,lastHitter:null,lastHitT:-99,aiState:'idle',aiT:rand(.8,1.6),dirX:0,dirY:1,pulseT:T.pulse?rand(1.5,T.pulse.every):0,delay:0,dropT:0,burned:false,invuln:0};}

/* ---------- state ---------- */
let G=null;
const aim={active:false,id:-1,ax:0,ay:0,x:0,y:0};
let lastInputKind='touch';
const embers=[];for(let i=0;i<60;i++)embers.push({x:Math.random(),y:Math.random(),s:rand(1,2.6),v:rand(.02,.08),ph:rand(0,6)});
const cracks=[];{const r=mulberry32(7);for(let i=0;i<16;i++)cracks.push([r()*6.28,.2+r()*.6,.1+r()*.2,r()*.6-.3]);}

function newGame(){
 G={rng:mulberry32((Math.random()*4294967296)>>>0),score:0,lives:3,wave:0,phase:'fight',phaseT:0,t:0,ts:1,hitstop:0,bigT:0,shake:0,
 combo:0,comboT:0,comboWin:5,bestCombo:0,kos:0,enemies:[],parts:[],pops:[],rings:[],pickups:[],pickupT:6,
 R:R0,Rtarget:R0,diff:0,fell:false,banner:null,hint:1,dashed:false,maxCh:3,ch:3,rechargeT:1.5,shield:false,surgeT:0,shock:0,slick:0,
 respawnT:0,deadT:0,saved:false,goT:0,rank:-1,newBest:false,cards:null,noChT:0,entry:null,demo:false};
 G.player=mkTop('player',0,0);G.player.invuln=1.2;aim.active=false;aim.id=-1;
 startWave(1);
}
function initDemo(){
 newGame();G.demo=true;G.phase='demo';G.enemies=[];
 ['grunt','dasher','heavy'].forEach(t=>{const e=mkTop(t,0,0);e.ph=rand(0,6);G.enemies.push(e);});
}
function wavePlan(n){
 const list=[],rg=G.rng;
 if(n%5===0){list.push('boss');const ex=Math.min(3,Math.floor(n/5));for(let i=0;i<ex;i++)list.push(rg()<.5?'grunt':'dasher');return list;}
 const total=Math.min(8,2+Math.floor(n*.8));const pool=['grunt'];if(n>=3)pool.push('dasher');if(n>=4)pool.push('heavy');if(n>=6)pool.push('pulser');
 for(let i=0;i<total;i++){let t=pool[Math.floor(rg()*pool.length)];if(i===0&&n>=4)t='heavy';list.push(t);}
 return list;
}
function startWave(n){
 G.wave=n;G.phase='fight';G.phaseT=0;G.fell=false;G.diff=1-Math.exp(-(n-1)/6);
 G.Rtarget=R0*(0.62+0.38*Math.exp(-(n-1)/7));if(n===1)G.R=G.Rtarget;
 G.enemies=[];const P=G.player,placed=[];
 wavePlan(n).forEach((type,i)=>{
  const e=mkTop(type,0,0);let ok=false;
  for(let tr=0;tr<40&&!ok;tr++){
   const a=G.rng()*6.2832,rr=lerp(.25,.72,G.rng())*G.Rtarget;e.x=Math.cos(a)*rr;e.y=Math.sin(a)*rr;
   const px0=P.mode==='live'?P.x:0,py0=P.mode==='live'?P.y:0;
   ok=Math.hypot(e.x-px0,e.y-py0)>(tr<30?110:70)&&placed.every(o=>Math.hypot(o.x-e.x,o.y-e.y)>o.r+e.r+14);
  }
  e.mode='wait';e.delay=.3+i*.22;placed.push(e);G.enemies.push(e);
 });
 const boss=n%5===0;
 G.banner={text:boss?'BOSS WAVE':'WAVE '+n,sub:boss?'Knock the giant off the rim':(n===1?'Knock them off the rim':''),t:0,dur:1.9,color:boss?'#ff6a5a':'#fff4e0'};
}
function friction(){return K0*Math.pow(0.9,G.slick);}

/* ---------- fx ---------- */
function addPart(p){if(G.parts.length<360)G.parts.push(p);}
function spark(x,y,z,n,col,spd,life){for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(.3,1)*spd;const l=rand(.25,.6)*(life||1);addPart({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7,vz:rand(60,260),life:l,max:l,size:rand(1.6,3.4),color:col,g:700,drag:1.5});}}
function dust(x,y,n,col){for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(20,90);const l=rand(.4,.8);addPart({x,y,z:2,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7,vz:rand(10,50),life:l,max:l,size:rand(3,6),color:col||'rgba(255,220,180,1)',g:-20,drag:3,dust:true});}}
function ring(x,y,r0,r1,dur,color,w){G.rings.push({x,y,r0,r1,t:0,dur,color,w:w||3});}
function pop(x,y,z,text,color,size){G.pops.push({x,y,z,t:0,dur:1.0,text,color,size:size||18});}
function updateFx(dt){
 let n=0;for(let i=0;i<G.parts.length;i++){const p=G.parts[i];p.life-=dt;if(p.life<=0)continue;p.vz-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  if(p.z<0&&!p.fall){p.z=0;p.vz*=-.3;p.vx*=.7;p.vy*=.7;}if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f;}G.parts[n++]=p;}G.parts.length=n;
 n=0;for(let i=0;i<G.rings.length;i++){const r=G.rings[i];r.t+=dt;if(r.t<r.dur)G.rings[n++]=r;}G.rings.length=n;
 n=0;for(let i=0;i<G.pops.length;i++){const p=G.pops[i];p.t+=dt;if(p.t<p.dur)G.pops[n++]=p;}G.pops.length=n;
}
function pulse(x,y,rad,force,src,owner){
 const P=G.player;ring(x,y,rad*.15,rad,.45,owner==='p'?'rgba(120,240,255,.9)':'rgba(255,120,170,.9)',4);SFX.pulse();G.shake=Math.max(G.shake,owner==='p'?3:7);
 [P].concat(G.enemies).forEach(o=>{if(o===src||o.mode!=='live')return;if(owner==='p'&&o===P)return;
  const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy);if(d>=rad)return;const n=norm(dx,dy);if(!n[0]&&!n[1]){n[0]=1;}
  const dv=force*(1-d/rad)/Math.pow(o.m,.6);o.vx+=n[0]*dv;o.vy+=n[1]*dv;o.sq=.6;
  if(o!==P){o.lastHitter=owner==='p'?'p':src;o.lastHitT=G.t;}});
}

/* ---------- gameplay ---------- */
function doDash(dx,dy,power){
 const P=G.player;if(!G||state!==STATES.PLAYING||P.mode!=='live')return false;if(G.phase!=='fight'&&G.phase!=='clear')return false;
 const n=norm(dx,dy);if(!n[0]&&!n[1])return false;
 if(G.surgeT<=0){if(G.ch<1){G.noChT=.4;SFX.empty();return false;}G.ch-=1;}
 const add=250+520*clamp(power,0,1);P.vx+=n[0]*add;P.vy+=n[1]*add;
 const sp=Math.hypot(P.vx,P.vy);if(sp>VMAX){P.vx*=VMAX/sp;P.vy*=VMAX/sp;}
 P.sq=.7;G.dashed=true;SFX.dash();spark(P.x,P.y,8,8,'#9ff6ff',200,.8);dust(P.x,P.y,4);
 if(G.shock>0)pulse(P.x,P.y,70+30*G.shock,180+80*G.shock,P,'p');
 return true;
}
function startFall(e){
 e.mode='fall';e.vz=-60;e.burned=false;const P=G.player;
 if(e===P){
  G.lives--;G.combo=0;G.comboT=0;G.fell=true;G.shake=12;SFX.fall();pop(e.x,e.y,30,'-1 LIFE','#ff6a5a',22);
  if(G.lives<=0){G.phase='dead';G.deadT=0;}else G.respawnT=1.0;
  return;
 }
 let kind=null;
 if(e.lastHitter==='p'&&G.t-e.lastHitT<3.2)kind='direct';
 else if(e.lastHitter&&e.lastHitter!=='p'&&G.t-e.lastHitT<3&&e.lastHitter.lastHitter==='p'&&G.t-e.lastHitter.lastHitT<4)kind='chain';
 G.kos++;SFX.fall();
 if(kind){
  G.combo++;G.comboT=G.comboWin;G.bestCombo=Math.max(G.bestCombo,G.combo);
  const mult=Math.min(8,1+.5*(G.combo-1));const pts=Math.round(e.T.pts*mult*(kind==='chain'?1.5:1));G.score+=pts;
  pop(e.x,e.y,50,'+'+pts,kind==='chain'?'#7ff0ff':'#ffd23f',22);
  if(kind==='chain')pop(e.x,e.y,30,'CHAIN!','#7ff0ff',16);
  if(G.combo>=2)pop(e.x,e.y,12,'x'+mult.toFixed(1)+' COMBO','#ffb347',14);
  SFX.ko(G.combo);G.shake=Math.max(G.shake,8);
  if(e.type==='boss'){G.bigT=.9;spark(e.x,e.y,30,40,'#ffd23f',420,1.4);}else if(G.combo>=5)G.bigT=.35;
 }else pop(e.x,e.y,40,'SELF-OUT','#b9a8c9',14);
}
function respawnPlayer(){
 const P=G.player;let x=0,y=0;
 for(let tr=0;tr<30;tr++){const a=tr*2.4,rr=tr*8;x=Math.cos(a)*rr;y=Math.sin(a)*rr;
  if(Math.hypot(x,y)<G.R*.6&&G.enemies.every(e=>e.mode!=='live'||Math.hypot(e.x-x,e.y-y)>e.r+P.r+30))break;}
 P.x=x;P.y=y;P.vx=P.vy=0;P.z=DROP_H*.7;P.mode='drop';P.dropT=0;P.lastHitter=null;P.invuln=2.4;
}
function landFx(e){
 e.sq=.8;dust(e.x,e.y,8);G.shake=Math.max(G.shake,e.type==='boss'?10:3);SFX.land();ring(e.x,e.y,e.r,e.r*2.6,.35,'rgba(255,220,180,.7)',3);
 [G.player].concat(G.enemies).forEach(o=>{if(o===e||o.mode!=='live')return;const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy);if(d<e.r*2.6+o.r){const n=norm(dx,dy);o.vx+=n[0]*220;o.vy+=n[1]*220;}});
}
function aimAt(e,t,d){const lead=.25*d;const n=norm(t.x+t.vx*lead-e.x,t.y+t.vy*lead-e.y);if(n[0]||n[1]){e.dirX=n[0];e.dirY=n[1];}}
function enemyDash(e){
 const T=e.T,d=G.diff,K=friction();let p=T.dash*(1+.4*d)*rand(.92,1.08);
 if(G.rng()<.3+.65*d){for(let i=0;i<4;i++){const sx=e.x+e.dirX*p/K,sy=e.y+e.dirY*p/K;if(Math.hypot(sx,sy)>G.R*.9)p*=.7;else break;}}
 e.vx+=e.dirX*p;e.vy+=e.dirY*p;const sp=Math.hypot(e.vx,e.vy);if(sp>VMAX){e.vx*=VMAX/sp;e.vy*=VMAX/sp;}
 e.sq=.5;spark(e.x,e.y,8,5,T.c1,160,.6);SFX.edash();
}
function aiUpdate(e,dt){
 const P=G.player,T=e.T,d=G.diff,tgt=P.mode==='live'?P:null,dist0=Math.hypot(e.x,e.y);
 if(T.pulse){e.pulseT-=dt;if(e.pulseT<=0){pulse(e.x,e.y,T.pulse.r,T.pulse.f*(1+.25*d),e,'e');e.pulseT=T.pulse.every*(1-.25*d)*rand(.9,1.1);}}
 if(e.aiState==='idle'){
  e.aiT-=dt;
  if(dist0>G.R*.78&&d>.15){e.vx-=e.x/dist0*90*d*dt;e.vy-=e.y/dist0*90*d*dt;}
  if(e.aiT<=0){if(tgt){e.aiState='tele';e.aiT=Math.max(.22,T.tele*(1-.3*d));aimAt(e,tgt,d);}else e.aiT=.5;}
 }else{
  e.aiT-=dt;if(tgt&&e.aiT>.18)aimAt(e,tgt,d*.8+.1);
  if(e.aiT<=0){enemyDash(e);e.aiState='idle';e.aiT=Math.max(.55,rand(T.cd[0],T.cd[1])*(1-.4*d));}
 }
}
function collide(a,b){
 const P=G.player,dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return;
 let d=Math.sqrt(d2),nx=1,ny=0;if(d>1e-4){nx=dx/d;ny=dy/d;}else d=0;
 const ia=1/a.m,ib=1/b.m,sum=ia+ib,ov=rr-d;
 a.x-=nx*ov*ia/sum;a.y-=ny*ov*ia/sum;b.x+=nx*ov*ib/sum;b.y+=ny*ov*ib/sum;
 const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel<=0)return;
 const j=(1+REST)*rel/sum;let jb=j;
 if(a===P&&G.surgeT>0)jb*=1.7;
 if(b===P&&G.surgeT>0){a.vx-=nx*j*1.7*ia;a.vy-=ny*j*1.7*ia;}else{a.vx-=nx*j*ia;a.vy-=ny*j*ia;}
 b.vx+=nx*jb*ib;b.vy+=ny*jb*ib;
 if(rel>60){
  if(a===P)b.lastHitter='p',b.lastHitT=G.t;else if(b===P)a.lastHitter='p',a.lastHitT=G.t;else{a.lastHitter=b;a.lastHitT=G.t;b.lastHitter=a;b.lastHitT=G.t;}
 }
 if(rel>140){
  const cx=a.x+nx*a.r,cy=a.y+ny*a.r;spark(cx,cy,10,Math.min(14,Math.round(rel/40)),'#ffe9a8',Math.min(420,rel),1);
  G.shake=Math.max(G.shake,Math.min(10,rel/55));a.sq=b.sq=.8;a.flash=b.flash=1;SFX.hit(Math.min(1,rel/600));
  if(rel>480&&(a===P||b===P))G.hitstop=.06;
  if(rel>300)ring(cx,cy,4,26,.25,'rgba(255,240,200,.8)',2);
 }
}
function simulate(dt){
 const P=G.player,tops=[P].concat(G.enemies);let ms=0;
 tops.forEach(e=>{if(e.mode==='live')ms=Math.max(ms,Math.hypot(e.vx,e.vy));});
 const n=clamp(Math.ceil(ms*dt/8),1,8),h=dt/n,K=friction();
 for(let i=0;i<n;i++){
  for(const e of tops){
   if(e.mode==='live'){

/* ---------- update ---------- */
function updateDemo(dt){
 const P=G.player;P.x=0;P.y=0;P.spin+=dt*14;
 G.enemies.forEach((e,i)=>{e.ph+=dt*(.7+i*.2)*(i%2?-1:1);const nx=Math.cos(e.ph)*G.R*(.45+i*.1),ny=Math.sin(e.ph)*G.R*(.45+i*.1);e.vx=(nx-e.x)/Math.max(dt,.001);e.vy=(ny-e.y)/Math.max(dt,.001);e.x=nx;e.y=ny;e.spin+=dt*12;e.sq*=.9;});
}
function update(dtReal){
 animT+=dtReal;
 embers.forEach(m=>{m.y-=m.v*dtReal;if(m.y<-.05){m.y=1.05;m.x=Math.random();}});
 if(paused)return;
 if(state===STATES.START){updateDemo(dtReal);updateFx(dtReal);return;}
 if(state===STATES.GAMEOVER){G.goT+=dtReal;updateFx(dtReal*.5);return;}
 const P=G.player;
 const target=(aim.active&&G.phase==='fight')?.38:1;G.ts+=(target-G.ts)*Math.min(1,dtReal*12);
 let ts=G.ts;if(G.hitstop>0){G.hitstop-=dtReal;ts=Math.min(ts,.12);}if(G.bigT>0){G.bigT-=dtReal;ts=Math.min(ts,.3);}if(G.phase==='dead')ts=Math.min(ts,.5);
 const sim=G.phase!=='cards',dt=sim?dtReal*ts:0;
 G.t+=dt;G.phaseT+=dtReal;
 if(Math.abs(G.R-G.Rtarget)>.3)G.R+=(G.Rtarget-G.R)*(1-Math.exp(-3*dtReal));else G.R=G.Rtarget;
 G.shake*=Math.exp(-9*dtReal);if(G.shake<.1)G.shake=0;
 if(G.noChT>0)G.noChT-=dtReal;if(G.dashed)G.hint=Math.max(0,G.hint-dtReal*2);
 if(G.banner){G.banner.t+=dtReal;if(G.banner.t>G.banner.dur)G.banner=null;}
 if(sim){
  const all=[P].concat(G.enemies);
  for(const e of all){
   e.sq=Math.max(0,e.sq-dt*4);e.flash=Math.max(0,e.flash-dt*5);
   if(e.invuln>0)e.invuln-=dt;
   if(e.mode==='wait'){e.delay-=dt;if(e.delay<=0){e.mode='drop';e.dropT=0;e.z=DROP_H;}continue;}
   if(e.mode==='drop'){e.dropT+=dt;const k=clamp(e.dropT/DROP_T,0,1);e.z=DROP_H*(1-k)*(1-k);if(k>=1){e.mode='live';e.z=0;landFx(e);}continue;}
   if(e.mode==='live'){e.spin+=dt*(14+Math.hypot(e.vx,e.vy)*.02)*(e===P?1:-1);if(e!==P&&G.phase==='fight')aiUpdate(e,dt);}
  }
  if(P.mode==='live'||P.mode==='drop'){
   if(G.surgeT>0){G.surgeT-=dt;G.ch=G.maxCh;}else if(G.ch<G.maxCh)G.ch=Math.min(G.maxCh,G.ch+dt/G.rechargeT);
  }
  simulate(dt);
  if(P.mode==='gone'&&G.phase!=='dead'){G.respawnT-=dt;if(G.respawnT<=0)respawnPlayer();}
  if(G.phase==='fight'){
   G.pickupT-=dt;if(G.pickupT<=0&&G.pickups.length<2){spawnPickup();G.pickupT=rand(8,12);}
   if(G.combo>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  }
  for(let i=G.pickups.length-1;i>=0;i--){const k=G.pickups[i];k.t+=dt;if(k.t>k.life){G.pickups.splice(i,1);continue;}
   if(P.mode==='live'&&Math.hypot(P.x-k.x,P.y-k.y)<P.r+18){G.pickups.splice(i,1);G.score+=50;SFX.pick();
    if(k.type==='shield'){G.shield=true;pop(k.x,k.y,40,'SHIELD','#8fe8ff',18);}else{G.surgeT=6.5;G.ch=G.maxCh;pop(k.x,k.y,40,'SURGE!','#ffd23f',18);}
    spark(k.x,k.y,10,12,'#fff',240,1);}}
 }
 updateFx(dt>0?dt:dtReal*.2);
 if(G.phase==='fight'){
  const alive=G.enemies.some(e=>e.mode==='wait'||e.mode==='drop'||e.mode==='live');
  if(!alive&&(P.mode==='live'||P.mode==='drop'))clearWave();
 }else if(G.phase==='clear'){
  if(G.phaseT>2.1){if(G.wave%2===0||G.wave%5===0)openCards();else startWave(G.wave+1);}
 }else if(G.phase==='dead'){G.deadT+=dtReal;if(G.deadT>1.4)endRun();}
}

/* ---------- loop ---------- */
let raf=0,lastT=0;
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function startLoop(){stopLoop();lastT=0;raf=requestAnimationFrame(frame);}
function frame(ts){
 raf=requestAnimationFrame(frame);
 let dt=lastT?(ts-lastT)/1000:.016;lastT=ts;if(!(dt>0)||!isFinite(dt))dt=.016;dt=Math.min(.05,dt);
 try{update(dt);draw();}catch(err){console.error(err);}
}

/* ---------- input ---------- */
function startRun(){newGame();state=STATES.PLAYING;SFX.ui();}
function pauseGame(){if(paused||state!==STATES.PLAYING)return;paused=true;aim.active=false;aim.id=-1;stopLoop();try{draw();}catch(e){}}
function resumeGame(){if(!paused)return;paused=false;SFX.ui();startLoop();}
function onDown(id,x,y){
 if(paused){resumeGame();return;}
 if(state===STATES.START){startRun();return;}
 if(state===STATES.GAMEOVER){if(G.goT>.85)startRun();return;}
 if(G.phase==='cards'){if(G.phaseT>.35){const i=cardAt(x,y);if(i>=0)pickCard(i);}return;}
 if(G.phase==='dead'||aim.active)return;
 aim.active=true;aim.id=id;aim.ax=aim.x=x;aim.ay=aim.y=y;
}
function onUp(id,fire){
 if(!aim.active||aim.id!==id)return;aim.active=false;aim.id=-1;
 if(!fire||state!==STATES.PLAYING)return;
 const dx=-(aim.x-aim.ax),dy=-(aim.y-aim.ay),len=Math.hypot(dx,dy);if(len<16)return;
 doDash(dx,dy/TILT,clamp((len-14)/(aimMax()-14),0,1));
}

cv.addEventListener('pointermove',e=>{if(aim.active&&aim.id===e.pointerId){aim.x=e.clientX;aim.y=e.clientY;}},{passive:true});
cv.addEventListener('pointerup',e=>{aim.x=e.clientX;aim.y=e.clientY;onUp(e.pointerId,true);});
cv.addEventListener('pointercancel',e=>onUp(e.pointerId,false));
cv.addEventListener('contextmenu',e=>e.preventDefault());

 if(e.code==='KeyP'||e.code==='Escape'){pauseGame();return;}
 if(G.phase==='cards'){const i=({Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2})[e.code];if(i!==undefined&&G.phaseT>.35)pickCard(i);return;}
 if(DIRK[e.code]){held.add(e.code);let dx=0,dy=0;held.forEach(k=>{dx+=DIRK[k][0];dy+=DIRK[k][1];});if(!dx&&!dy){dx=DIRK[e.code][0];dy=DIRK[e.code][1];}doDash(dx,dy,.85);}
 else if(e.code==='Space'){let best=null,bd=1e9;const P=G.player;G.enemies.forEach(o=>{if(o.mode!=='live')return;const d=Math.hypot(o.x-P.x,o.y-P.y);if(d<bd){bd=d;best=o;}});
  if(best)doDash(best.x-P.x,best.y-P.y,clamp(bd/(R0*.9),.35,1));else doDash(-P.x,-P.y,.5);}
});
window.addEventListener('keyup',e=>{held.delete(e.code);});
function releaseAll(){aim.active=false;aim.id=-1;held.clear();}
window.addEventListener('blur',()=>{releaseAll();pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();pauseGame();stopLoop();}else{lastT=0;if(!paused)startLoop();else{startLoop();}}});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));

resize();initDemo();startLoop();
})();
</script>
