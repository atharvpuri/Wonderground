<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mole Mallet</title>
<style>
:root{--bg:#1c3a1a;--fg:#fff8e0;--acc:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#10260f;--fg:#fffbe8;--acc:#ffd84f}}
[data-theme=garden]{--acc:#ffd23f}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
</style></head>
<body data-theme="garden"><div id="probe"></div><canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=3,ROWS=4,KEY='mole-mallet-v1',FONT='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
const RS=[.82,.9,.98,1.06],KEYS=['KeyQ','KeyW','KeyE','KeyA','KeyS','KeyD','KeyZ','KeyX','KeyC','KeyR','KeyF','KeyV'];
const STATES={START:0,PLAYING:1,GAMEOVER:2};
let W=0,H=0,dpr=1,safeTop=0,fx0=0,fw=0,fy0=0,fh=0;
let st=STATES.START,paused=false,raf=0,last=0,gt=0;
let holes,lives,score,streak,bestStreak,hits,whiffs,t,spawnT,shake,flash,overT,saved,rank,newBest,reason,pops,parts,hams,hintSeen,hintA;
let save={scores:[],bestStreak:0,hint:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dF=()=>1-Math.exp(-(t||0)/60);
const mult=()=>1+Math.min(4,Math.floor(streak/5));

function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object'){
 if(Array.isArray(d.scores))save.scores=d.scores.filter(n=>typeof n==='number'&&isFinite(n)&&n>=0).sort((a,b)=>b-a).slice(0,5);
 save.bestStreak=clamp(+d.bestStreak||0,0,9999);save.hint=!!d.hint}}catch(e){}
 hintSeen=save.hint;hintA=hintSeen?0:1}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* audio */
let AC=null,master=null,nbuf=null;const sfxT={};
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type,v,slide,delay){if(!AC)return;try{const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.03)}catch(e){}}
function hiss(d,v,fq,type){if(!AC||!nbuf)return;try{const t0=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+d)}catch(e){}}
function sfx(n,a){const now=performance.now();if(sfxT[n]&&now-sfxT[n]<40)return;sfxT[n]=now;
 switch(n){
 case'ui':tone(520,.1,'square',.1,300);tone(780,.1,'square',.08,0,.06);break;
 case'pop':tone(400+Math.random()*100,.08,'triangle',.06,300);break;
 case'whack':tone(120,.15,'sine',.35,-70);hiss(.08,.3,1500);tone(500*Math.pow(1.0595,Math.min(a||0,14)),.1,'triangle',.1,200);break;
 case'clang':tone(900,.25,'square',.08,-200);tone(1350,.2,'triangle',.08,-300);hiss(.05,.2,5000,'highpass');break;
 case'gold':[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.12,0,i*.07));break;
 case'bomb':hiss(.7,.6,700);tone(80,.6,'sawtooth',.2,-40);break;
 case'miss':tone(200,.25,'sawtooth',.1,-100);break;
 case'whiff':tone(260,.08,'sine',.05,-100);break;
 case'over':tone(300,.9,'sawtooth',.14,-240);hiss(.5,.25,700);break;
 case'best':[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,0,i*.1));break}}

/* game */
function layout(){
 const top=safeTop+78,bot=H-26;fh=bot-top;fw=Math.min(W-16,fh*.95,520);fx0=(W-fw)/2;fy0=top}
function buildHoles(){holes=[];
 const rowH=fh/ROWS;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const sc=RS[r],cw=fw/COLS*sc*.9;
  holes.push({r,c,x:W/2+(c-1)*cw,y:fy0+(r+.62)*rowH,sc,rx:fw/COLS*.31*sc,ry:fw/COLS*.31*sc*.34,m:null})}}
function startGame(){
 layout();buildHoles();lives=3;score=0;streak=0;bestStreak=0;hits=0;whiffs=0;t=0;spawnT=.5;shake=0;flash=0;overT=0;saved=false;rank=-1;newBest=false;reason='';pops=[];parts=[];hams=[];paused=false;
 st=STATES.PLAYING;startLoop()}
function pop(x,y,txt,col,big){if(pops.length<14)pops.push({x,y,txt,col,life:1,big})}
function burst(x,y,n,col,sp){for(let i=0;i<n&&parts.length<250;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.6,col,size:2+Math.random()*3})}}
function spawnMole(){
 const d=dF(),free=holes.filter(h=>!h.m),cap=1+Math.floor(3*d);
 if(!free.length||holes.length-free.length>=cap)return;
 const h=free[Math.floor(Math.random()*free.length)],r=Math.random();
 const pb=.08+.14*d,pg=.05,ph=t>20?.18+.1*d:0;let type='normal';
 if(r<pb)type='bomb';else if(r<pb+pg)type='gold';else if(r<pb+pg+ph)type='helmet';
 const dur=(1.15-.65*d)*(type==='gold'?.7:type==='bomb'?1.2:1);
 h.m={type,t:0,dur,hp:type==='helmet'?2:1,state:'up',hitT:0,jolt:0};sfx('pop')}
function lose(why,x,y){lives--;streak=0;shake=10;flash=.3;pop(x,y,why,'#ff6a5a');if(lives<=0)die(why==='BOOM!'?'You whacked a bomb':'Too many moles escaped')}
function die(r){if(st===STATES.GAMEOVER)return;st=STATES.GAMEOVER;reason=r;overT=0;sfx('over');
 if(!saved){saved=true;let i=save.scores.findIndex(v=>score>v);if(i<0)i=save.scores.length;
  if(score>0){save.scores.splice(i,0,score);save.scores=save.scores.slice(0,5);rank=i<5?i:-1}
  newBest=rank===0;save.bestStreak=Math.max(save.bestStreak,bestStreak);persist();if(newBest)setTimeout(()=>sfx('best'),500)}}
function moleH(m){return m.state==='up'?clamp(m.t/.16,0,1)*(m.t>m.dur-.18?clamp((m.dur-m.t)/.18,0,1):1):0}
function tapAt(px,py){
 if(st!==STATES.PLAYING||paused)return;
 let best=null,bd=1e9;
 for(const h of holes){const dx=px-h.x,dy=py-(h.y-h.rx*.9);const d=Math.hypot(dx/(h.rx*1.35),dy/(h.rx*1.7));if(d<1&&d<bd){bd=d;best=h}}
 hams.push({x:px,y:py,t:0});
 if(!best||!best.m||best.m.state!=='up'||moleH(best.m)<.3){streak=0;whiffs++;sfx('whiff');return}
 const h=best,m=h.m,mx=h.x,my=h.y-h.rx*.9;
 if(!hintSeen){hintSeen=true;save.hint=true;persist()}
 if(m.type==='bomb'){m.state='boom';m.hitT=0;burst(mx,my,30,'#ff9a3a',260);sfx('bomb');lose('BOOM!',mx,my);return}
 m.hp--;
 if(m.hp>0){m.jolt=.25;sfx('clang');pop(mx,my-30,'CLANG','#cfd8e8');burst(mx,my-20,6,'#fff',160);shake=Math.max(shake,3);return}
 m.state='hit';m.hitT=0;streak++;hits++;if(streak>bestStreak)bestStreak=streak;
 const base=m.type==='gold'?50:m.type==='helmet'?25:10,pts=base*mult();score+=pts;sfx('whack',streak);shake=Math.max(shake,4+Math.min(streak,10)*.4);
 pop(mx,my-34,'+'+pts,m.type==='gold'?'#ffd23f':'#fff');burst(mx,my,10,m.type==='gold'?'#ffd23f':'#d8a070',180);
 if(m.type==='gold'){sfx('gold');if(lives<3){lives++;pop(mx,my-60,'+1 LIFE','#ff7a8a',true)}flash=.25}
 if(streak>0&&streak%5===0)pop(W/2,fy0+fh*.12,'x'+mult()+' COMBO!','#8fe',true)}

function update(dt){
 gt+=dt;if(paused||st===STATES.START)return;
 if(st===STATES.PLAYING){
  t+=dt;const d=dF();
  spawnT-=dt;if(spawnT<=0){spawnMole();spawnT=(.95-.65*d)*(.7+Math.random()*.6)}
  for(const h of holes){const m=h.m;if(!m)continue;
   if(m.state==='up'){m.t+=dt;if(m.jolt>0)m.jolt-=dt;
    if(m.t>=m.dur){h.m=null;if(m.type==='normal'||m.type==='helmet'){if(st===STATES.PLAYING)lose('ESCAPED',h.x,h.y-h.rx)}}}
   else{m.hitT+=dt;if(m.hitT>.4)h.m=null}}
  if(hintSeen&&hintA>0)hintA=Math.max(0,hintA-dt*1.5);
 }else overT+=dt;
 for(let i=hams.length-1;i>=0;i--){hams[i].t+=dt;if(hams[i].t>.3)hams.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}q.vy+=500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.life-=dt*(q.big?.8:1.2);q.y-=30*dt;if(q.life<=0)pops.splice(i,1)}
 shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*1.5)}

/* drawing */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,al,wt,out){ctx.font=(wt||800)+' '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';
 if(out){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='rgba(30,16,8,.85)';ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function panel(x,y,w,h,a){rr(x,y,w,h,14);ctx.fillStyle='rgba(40,24,10,'+(a||.8)+')';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,210,100,.45)';ctx.stroke()}

function drawField(){
 let g=ctx.createLinearGradient(0,0,0,H*.3);g.addColorStop(0,'#7ec8f0');g.addColorStop(1,'#d8f0ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const gy=fy0-26;ctx.fillStyle='#6fb85a';ctx.beginPath();ctx.moveTo(0,gy+10);for(let x=0;x<=W;x+=20)ctx.lineTo(x,gy-8+Math.sin(x*.02)*10);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 g=ctx.createLinearGradient(0,gy,0,H);g.addColorStop(0,'#5fae4a');g.addColorStop(1,'#2f7a2c');ctx.fillStyle=g;ctx.fillRect(0,gy+4,W,H-gy);
 ctx.fillStyle='#c9894a';for(let x=-10;x<W+20;x+=26){ctx.fillRect(x,gy-14,16,26);ctx.fillStyle=(x/26|0)%2?'#c9894a':'#b87a3e'}
 ctx.fillStyle='#e0a460';ctx.fillRect(0,gy-4,W,5);
 ctx.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<60;i++){const x=(i*97)%W,y=gy+20+((i*53)%(H-gy-20));ctx.fillRect(x,y,2,6)}}

function drawMole(h){
 const m=h.m;if(!m)return;const x=h.x,rx=h.rx,sc=h.sc;let ht=m.state==='up'?moleH(m):m.state==='hit'?1:0;
 const cw=rx*1.55,mh=rx*2.1;let by=h.y+h.ry*.3-ht*mh;
 if(m.state==='hit'){ht=1;by=h.y+h.ry*.3-mh*(1-clamp(m.hitT/.2,0,1)*.7)}
 if(m.state==='boom'){by=h.y-mh*.8;}
 ctx.save();ctx.beginPath();ctx.rect(x-rx*2,h.y-mh*1.6,rx*4,mh*1.6+h.ry*.55);ctx.clip();
 const jx=m.jolt>0?Math.sin(gt*80)*3:0;ctx.translate(x+jx,by+mh*.55);
 const sqy=m.state==='hit'?1-.55*clamp(m.hitT/.1,0,1):1,sqx=m.state==='hit'?1+.4*clamp(m.hitT/.1,0,1):1;ctx.scale(sqx,sqy);
 if(m.type==='bomb'){const g=ctx.createRadialGradient(-cw*.2,-cw*.2,2,0,0,cw*.8);g.addColorStop(0,'#6a6a7a');g.addColorStop(1,'#14141c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,cw*.62,0,6.283);ctx.fill();
  ctx.fillStyle='#444';ctx.fillRect(-cw*.14,-cw*.78,cw*.28,cw*.2);ctx.strokeStyle='#c9a060';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-cw*.78);ctx.quadraticCurveTo(cw*.2,-cw*.95,cw*.3,-cw*.85);ctx.stroke();
  ctx.fillStyle='#ffb02a';ctx.beginPath();ctx.arc(cw*.3+Math.random()*2,-cw*.85,4+Math.random()*3,0,6.283);ctx.fill();
  ctx.fillStyle='#ff4a3a';ctx.font='900 '+cw*.5+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,cw*.04)}
 else{const gold=m.type==='gold',body=gold?['#fff2a0','#e0a820','#8a5a10']:['#b98a62','#7a5236','#3a2412'];
  const g=ctx.createRadialGradient(-cw*.25,-cw*.35,2,0,0,cw*.85);g.addColorStop(0,body[0]);g.addColorStop(.5,body[1]);g.addColorStop(1,body[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,cw*.2,cw*.62,cw*.85,0,0,6.283);ctx.fill();
  ctx.fillStyle=gold?'#fff0b0':'#f0b8a0';ctx.beginPath();ctx.ellipse(0,cw*.02,cw*.3,cw*.22,0,0,6.283);ctx.fill();
  ctx.fillStyle='#e0587a';ctx.beginPath();ctx.ellipse(0,-cw*.06,cw*.1,cw*.07,0,0,6.283);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-cw*.07,cw*.07,cw*.06,cw*.12);ctx.fillRect(cw*.01,cw*.07,cw*.06,cw*.12);
  const dead=m.state==='hit';
  if(dead){ctx.strokeStyle='#2a1810';ctx.lineWidth=2.5;ctx.beginPath();for(const s of[-1,1]){ctx.moveTo(s*cw*.3-5,-cw*.34-5);ctx.lineTo(s*cw*.3+5,-cw*.34+5);ctx.moveTo(s*cw*.3+5,-cw*.34-5);ctx.lineTo(s*cw*.3-5,-cw*.34+5)}ctx.stroke()}
  else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-cw*.27,-cw*.32,cw*.12,0,6.283);ctx.arc(cw*.27,-cw*.32,cw*.12,0,6.283);ctx.fill();ctx.fillStyle='#1a1008';ctx.beginPath();ctx.arc(-cw*.27,-cw*.3,cw*.06,0,6.283);ctx.arc(cw*.27,-cw*.3,cw*.06,0,6.283);ctx.fill()}
  if(m.type==='helmet'&&m.hp>0){ctx.fillStyle='#ffc22a';ctx.beginPath();ctx.ellipse(0,-cw*.52,cw*.55,cw*.36,0,Math.PI,0);ctx.fill();ctx.fillRect(-cw*.62,-cw*.55,cw*1.24,cw*.12);ctx.fillStyle='#fff6c0';ctx.fillRect(-cw*.1,-cw*.88,cw*.2,cw*.3)}
  if(gold){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,230,120,'+(.3+.2*Math.sin(gt*12))+')';ctx.beginPath();ctx.arc(0,0,cw*.9,0,6.283);ctx.fill()}}
 ctx.restore();
 if(m.state==='hit'){for(let i=0;i<3;i++){const a=gt*8+i*2.1;ctx.fillStyle='#ffe55a';ctx.font='900 '+rx*.4+'px '+FONT;ctx.textAlign='center';ctx.fillText('★',x+Math.cos(a)*rx*.6,h.y-mh*.9+Math.sin(a)*rx*.2)}}}

function drawHole(h,front){
 const {x,y,rx,ry}=h;
 if(!front){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+ry*.5,rx*1.35,ry*1.5,0,0,6.283);ctx.fill();
  const g=ctx.createRadialGradient(x,y-ry*.6,2,x,y,rx*1.3);g.addColorStop(0,'#a26a3a');g.addColorStop(1,'#6a4020');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx*1.25,ry*1.35,0,0,6.283);ctx.fill();
  ctx.fillStyle='#1a0e06';ctx.beginPath();ctx.ellipse(x,y,rx*.95,ry*.95,0,0,6.283);ctx.fill()}
 else{ctx.fillStyle='#8a5a30';ctx.beginPath();ctx.ellipse(x,y+ry*.45,rx*1.25,ry*.8,0,0,Math.PI);ctx.fill();
  ctx.strokeStyle='rgba(255,220,160,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y+ry*.45,rx*1.15,ry*.7,0,.2,Math.PI-.2);ctx.stroke()}}

function drawHammer(q){const k=q.t/.3,a=k<.35?(-1.1+k/.35*1.3):.2-(k-.35)*.6;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(a);ctx.globalAlpha=clamp(1-(k-.5)*2,0,1);
 ctx.fillStyle='#b07a3a';ctx.fillRect(-4,-70,8,70);ctx.fillStyle='#d8d8e0';rr(-24,-92,48,28,6);ctx.fill();ctx.fillStyle='#8a8a98';ctx.fillRect(-24,-80,48,5);ctx.restore();
 if(k>.3&&k<.6){ctx.strokeStyle='rgba(255,255,255,'+(1-(k-.3)/.3)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,10+(k-.3)*160,0,6.283);ctx.stroke()}ctx.globalAlpha=1}

function drawWorld(){
 drawField();
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 if(holes){for(const h of holes)drawHole(h,false);
  for(const h of holes){drawMole(h);drawHole(h,true)}}
 for(const q of parts){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,6.283);ctx.fill()}ctx.globalAlpha=1;
 if(hams)for(const q of hams)drawHammer(q);
 for(const q of pops){ctx.globalAlpha=clamp(q.life*1.5,0,1);txt(q.txt,q.x,q.y,q.big?Math.min(30,W/12):Math.min(20,W/17),q.col,'center',900,true)}ctx.globalAlpha=1;
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,240,200,'+flash*.35+')';ctx.fillRect(0,0,W,H)}}

function drawHUD(){
 const y0=safeTop+10,fs=Math.min(34,W/11);
 txt(String(score),W/2,y0+fs*.6,fs,'#fff','center',900,true);
 txt('BEST '+Math.max(save.scores[0]||0,score),W/2,y0+fs*1.25+6,Math.min(12,W/28),'#fff0b0','center',800,true);
 panel(12,y0,84,30,.78);for(let i=0;i<3;i++){ctx.fillStyle=i<lives?'#ff5a6a':'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(12+21+i*21,y0+15,8,0,6.283);ctx.fill()}
 const m=mult();panel(W-12-66,y0,66,30,.78);txt('x'+m,W-12-33,y0+16,16,m>1?'#8fe':'#fff0b0','center',900);
 if(hintA>0&&st===STATES.PLAYING){ctx.globalAlpha=hintA;const hf=Math.min(16,W/22);txt('TAP the moles!  Not the bombs',W/2,H-18-hf,hf,'#fff','center',800,true);ctx.globalAlpha=1}}

function drawStart(){
 ctx.fillStyle='rgba(20,40,20,.5)';ctx.fillRect(0,0,W,H);
 const fs=Math.min(58,W/7.2);
 txt('MOLE',W/2,H*.2,fs,'#ffd23f','center',900,true);txt('MALLET',W/2,H*.2+fs*.95,fs,'#ff7a4a','center',900,true);
 txt('Whack fast. Dodge bombs. Chain combos.',W/2,H*.2+fs*1.9,Math.min(17,W/21),'#fff8e0','center',700,true);
 txt('BEST  '+(save.scores[0]||0),W/2,H*.7,Math.min(22,W/16),'#8fe','center',900,true);
 ctx.globalAlpha=.6+.4*Math.sin(gt*5);txt('TAP TO PLAY',W/2,H*.8,Math.min(30,W/11),'#fff','center',900,true);ctx.globalAlpha=1}

function drawOver(){
 ctx.fillStyle='rgba(20,30,10,.6)';ctx.fillRect(0,0,W,H);
 const pw=Math.min(W-24,360),ph=Math.min(H-safeTop-20,400),x=(W-pw)/2,y=Math.max(safeTop+10,(H-ph)/2),cx=W/2,u=ph/400;
 panel(x,y,pw,ph,.92);
 txt(newBest?'NEW HIGH SCORE!':'GAME OVER',cx,y+34*u,Math.min(28,pw/11),newBest?'#8fe':'#ffd23f','center',900);
 txt(reason,cx,y+62*u,Math.min(15,pw/22),'#ffe0a0','center',700);
 txt(String(score),cx,y+110*u,Math.min(54,pw/6.5),'#fff','center',900);
 txt('Whacks '+hits+'   Whiffs '+whiffs+'   Streak '+bestStreak,cx,y+152*u,Math.min(14,pw/25),'#fff8e0','center',700);
 txt('TOP 5',cx,y+182*u,13,'#ff9a5a','center',800);
 for(let i=0;i<5;i++){const v=save.scores[i],ry=y+208*u+i*24*u;
  if(i===rank){rr(x+24,ry-11*u,pw-48,22*u,8);ctx.fillStyle='rgba(120,255,220,.2)';ctx.fill()}
  txt((i+1)+'.',x+40,ry,14,i===rank?'#8fe':'#ffe0a0','left',800);txt(v===undefined?'-':String(v),x+pw-40,ry,14,i===rank?'#8fe':'#ffe0a0','right',800)}
 if(overT>.8){ctx.globalAlpha=.6+.4*Math.sin(gt*6);txt('TAP TO RETRY',cx,y+ph-34*u,Math.min(24,pw/13),'#fff','center',900);ctx.globalAlpha=1}}

function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 drawWorld();
 if(st===STATES.START)drawStart();
 else{drawHUD();if(st===STATES.GAMEOVER)drawOver();
  if(paused){ctx.fillStyle='rgba(20,30,10,.75)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H*.45,40,'#fff','center',900);txt('TAP TO RESUME',W/2,H*.45+44,20,'#ffe0a0','center',800)}}}

/* loop & input */
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){stopLoop();last=0;raf=requestAnimationFrame(frame)}
function frame(ts){raf=requestAnimationFrame(frame);let dt=last?(ts-last)/1000:.016;last=ts;if(!isFinite(dt)||dt<0)dt=.016;dt=Math.min(.04,dt);
 try{update(dt);draw()}catch(e){console.error(e)}}
function resize(){dpr=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 safeTop=document.getElementById('probe').offsetHeight||0;layout();if(holes){const old=holes.map(h=>h.m);buildHoles();holes.forEach((h,i)=>h.m=old[i])}}
function tapAction(){audio();
 if(st===STATES.START){sfx('ui');startGame();return true}
 if(st===STATES.GAMEOVER){if(overT>.8){sfx('ui');startGame()}return true}
 if(paused){paused=false;last=0;return true}
 return false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(tapAction())return;tapAt(e.clientX,e.clientY)});
window.addEventListener('keydown',e=>{
 if(e.repeat)return;
 const k=KEYS.indexOf(e.code);
 if(k>=0&&st===STATES.PLAYING&&!paused){e.preventDefault();const h=holes[k];tapAt(h.x,h.y-h.rx*.9);return}
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tapAction()}});
function pauseNow(){if(st===STATES.PLAYING)paused=true}
window.addEventListener('blur',pauseNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseNow();stopLoop()}else startLoop()});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,100));
document.addEventListener('contextmenu',e=>e.preventDefault());

load();resize();buildHoles();pops=[];parts=[];hams=[];lives=3;score=0;streak=0;t=0;shake=0;flash=0;
startLoop();
</script></body></html>
